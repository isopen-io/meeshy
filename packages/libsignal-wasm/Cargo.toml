# Le pont navigateur de libsignal (#14592). Le tag est celui de
# packages/LibSignalClient/LIBSIGNAL_VERSION : iOS et web parlent la même version.
[package]
name = "meeshy-libsignal-wasm"
version = "0.105.4"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.4" }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false }
rand = "0.9"
uuid = "1"
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
