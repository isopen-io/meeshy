# Le compilateur Kotlin de `:core:model` ne tient pas dans le tas par défaut du daemon : la compilation
# rend « java.lang.OutOfMemoryError: Java heap space », et le conseil qu'elle imprime
# (« Try to increase it via gradle.properties ») désigne CE fichier. Il ne se passe pas en propriété
# SYSTÈME (`-D…` est ignoré) — d'où la valeur ici plutôt qu'un drapeau de ligne de commande que chaque
# session doit retrouver : trois cycles (157, 158, 178) l'ont redécouvert à leurs frais, parce que la
# mesure vivait dans un journal daté et pas à côté de l'outil.
kotlin.daemon.jvmargs=-Xmx5g
