apply plugin: 'com.android.application'

// Clé de release (#8085) : lue HORS du dépôt, jamais écrite ici. Ordre :
//   1. MEESHY_ANDROID_KEYSTORE_PROPERTIES — chemin d'un fichier .properties ;
//   2. android/keystore.properties — fichier local, ignoré par git ;
//   3. MEESHY_ANDROID_STORE_FILE + MEESHY_ANDROID_STORE_PASSWORD +
//      MEESHY_ANDROID_KEY_ALIAS + MEESHY_ANDROID_KEY_PASSWORD (CI).
// Sans aucune source, la release se construit NON signée, comme avant.
def meeshyReleaseSigningProperties() {
    def props = new Properties()
    def explicit = System.getenv('MEESHY_ANDROID_KEYSTORE_PROPERTIES')
    def candidate = explicit ? file(explicit) : rootProject.file('keystore.properties')
    if (candidate.exists()) {
        candidate.withInputStream { props.load(it) }
        return props
    }
    if (System.getenv('MEESHY_ANDROID_STORE_FILE')) {
        props['storeFile'] = System.getenv('MEESHY_ANDROID_STORE_FILE')
        props['storeType'] = System.getenv('MEESHY_ANDROID_STORE_TYPE') ?: 'pkcs12'
        props['storePassword'] = System.getenv('MEESHY_ANDROID_STORE_PASSWORD')
        props['keyAlias'] = System.getenv('MEESHY_ANDROID_KEY_ALIAS')
        props['keyPassword'] = System.getenv('MEESHY_ANDROID_KEY_PASSWORD')
        return props
    }
    return null
}

android {
    namespace = "me.meeshy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.meeshy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Numéro de build LU à la construction (D-45) : `-PmeeshyBuildNumber=<n>`,
        // posé par scripts/build-shells.mjs. Sans lui, 1 — la marque d'un build
        // fait HORS du site unique.
        versionCode = (project.findProperty('meeshyBuildNumber') ?: '1').toString().toInteger()
        versionName "2.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def props = meeshyReleaseSigningProperties()
            if (props != null) {
                storeFile file(props['storeFile'])
                storeType props['storeType'] ?: 'pkcs12'
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (meeshyReleaseSigningProperties() != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
