# La configuration du serveur de la v3.1 — un serveur STATIQUE, et rien d'autre.
#
# L'application est un bundle Vite plus cinq documents préchauffés : aucun
# rendu à l'exécution, aucune session, aucun appel serveur. Un runtime Node
# n'aurait rien à faire ici — nginx sert des fichiers, ce qui est exactement le
# besoin, pour ~5 Mo d'image au lieu de ~150.

# LE STAGING NE S'INDEXE PAS (#10123). Staging et production servent la MÊME
# image : seul l'hôte demandé les distingue. Sur `staging.…`, `robots.txt`
# ferme tout et chaque réponse porte `X-Robots-Tag: noindex` ; ailleurs la
# valeur est vide, et nginx n'émet pas un en-tête vide.
map $host $meeshy_staging {
    default 0;
    ~^staging\. 1;
}
map $meeshy_staging $meeshy_robots_tag {
    default "";
    1 "noindex, nofollow";
}

# LA POLITIQUE DE SÉCURITÉ DU CONTENU (#18986) — l'origine qui tiendra les clés
# E2EE du navigateur n'exécute que SON code. `script-src` : l'origine, le
# WebAssembly du pont libsignal (`'wasm-unsafe-eval'` : sans lui, mesuré dans
# Chromium, `WebAssembly.instantiateStreaming` est refusé) et les condensats des
# scripts en ligne de chaque document construit — ni `'unsafe-eval'`, ni
# `'unsafe-inline'`, ni hôte tiers : une injection de balisage ne s'exécute plus.
# `style-src 'unsafe-inline'` reste (attributs `style` de Preact) : sans effet
# sur l'exécution de code. Les ACTIFS (`/assets/`) n'en portent pas : un Worker
# reçoit la politique de SA réponse, et le seul code tiers de l'application, le
# moteur de traduction sur l'appareil, ne vit qu'en Worker — et jamais dans un
# navigateur qui tient un coffre (#18989). Lue par `scripts/lib/csp.mjs`, qui
# la sert TELLE QUELLE à Chromium (`scripts/check-csp.mjs`).
#
# DÉBUT condensats-csp — écrit par `node scripts/check-csp-hashes.mjs --write` sur `dist/` ; ne pas éditer à la main.
map "" $meeshy_csp_script_hashes {
    default "'sha256-2R1XwyxzbaH7SHAWV2JsXKlj3TgTBPeWYf/uxkIemCs=' 'sha256-3wCUe9+yl/xHdQcaRDtDEYq9GtW9HScD8ZUBJKEGlZ8=' 'sha256-A/KB2nUN0tzZ/tY/VPRiW/QH5WPvzbekfI8OB9ZHZq8=' 'sha256-NaFXwIVj0F5NfFZwh9/p8qWEJ0K7p+L1k+hQF22ILqs=' 'sha256-ODV8VGlC2+jR1NC+HoKsAmjcBs42nvGQamLnjWp9y4Y=' 'sha256-VCuWHki+RYMh7c5bFR4hUM7ofLDXik22Lk9GR4+RbQM=' 'sha256-pmUgg8elFY+ACnY1yzKWSf1IVkyyx8F4L3RGPQ7X0DE=' 'sha256-qC9tI5w9EZmTvJbxhAokIGhQOkIOblJ4sb4AE6AbdHU=' 'sha256-rc2kbJrlt0/UfEaLu+t2mAlX4cQ2svE4vFjFfI4DsK8=' 'sha256-u4gaoXgGpnCmE2OYF8Typw+evtuhQ0L5nyBhSsPn1Fs=' 'sha256-xJrqmH96wTebXYd3+8lQ6tqo83Py/mKVKm0oHH6J72A='";
}
# FIN condensats-csp
# Derrière TLS (Traefik pose `X-Forwarded-Proto: https`), aucune connexion en
# clair ; un site installé sans proxy TLS garde sa passerelle en `http:`/`ws:`
# (`docker/runtime-config.sh` accepte `http://10.0.0.5:3000`).
map $http_x_forwarded_proto $meeshy_csp_cleartext {
    default " http: ws:";
    https "";
}
map "" $meeshy_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' $meeshy_csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:$meeshy_csp_cleartext; media-src 'self' data: blob: https:$meeshy_csp_cleartext; font-src 'self' data: blob: https:; connect-src 'self' https: wss: blob: data:$meeshy_csp_cleartext; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
}

# LES ADRESSES DE L'APPLICATION (#10123) — le premier segment de chaque route
# de `src/routes/route-table.tsx`, et rien d'autre. Une adresse hors de cette
# table n'est pas une page de l'application : elle répond 404 (avec la
# coquille, qui dit « introuvable » à un humain), jamais 200 avec une page vide
# « trouvée » par un robot. `src/routes/nginx-app-routes.test.ts` confronte
# cette liste à la table des routes : une route ajoutée sans elle fait rougir.
map $uri $meeshy_app_route {
    default 0;
    ~^/(account|adm|admin|auth|c|call|calls|chat|chats|communities|conversations|discover|download|feed|feeds|forgot-password|hashtag|l|links|login|me|mood|notifications|onboarding|positions|post|posts|reel|reels|reset-password|settings|share|signup|status|stories|story|u|welcome|world)(/|$) 1;
}

# L'APERÇU D'UNE ADRESSE DE L'APPLICATION (#10192, D-199). Un robot de
# messagerie n'exécute pas de JavaScript : il lit le `<head>` du document
# servi. La construction écrit une copie de la coquille par FAMILLE d'adresse
# et par LANGUE (`scripts/prerender-share-previews.ts`), identique à
# `index.html` hormis son titre, sa description et ses balises Open Graph et
# Twitter — écrite au build, elle ne peut rien dire d'une conversation, d'un
# lien ou d'un membre. Ces deux tables sont des MIROIRS de
# `src/share-preview/share-preview.ts`, confrontés par son témoin.
map $uri $meeshy_og_family {
    default app;
    ~^/world/?$ world;
    ~^/login(/|$) login;
    ~^/signup(/|$) signup;
    ~^/c/ conversation;
    ~^/chat/ invitation;
    ~^/l/ link;
}
# Les ROBOTS D'APERÇU — la liste des routeurs Traefik `*-unfurl`, qui ne nomme
# que des agents qui ne sont pas des navigateurs. Eux seuls reçoivent la copie :
# un navigateur reçoit `index.html`, octet pour octet celle d'avant (#10192).
map $http_user_agent $meeshy_preview_bot {
    default 0;
    ~*(facebookexternalhit|facebot|whatsapp|twitterbot|slackbot|telegrambot|discordbot|linkedinbot|skypeuripreview|embedly|iframely|redditbot|pinterestbot|vkshare|mastodon|bluesky|cardyb|google-pagerenderer|kakaotalk-scrap|bitlybot|mattermost|synapse) 1;
}
map $meeshy_preview_bot $meeshy_app_document {
    default /index.html;
    1 /shell-og/$meeshy_og_family/$meeshy_og_lang.html;
}
# La langue : `X-Facebook-Locale` d'abord (Facebook l'envoie quand la page
# déclare ses `og:locale:alternate`), puis la PREMIÈRE langue de
# `Accept-Language`, puis le français de la racine.
map "$http_x_facebook_locale|$http_accept_language" $meeshy_og_lang {
    default fr;
    ~*^fr_ fr;
    ~*^en_ en;
    ~*^es_ es;
    ~*^pt_ pt;
    ~*^de_ de;
    ~*^it_ it;
    ~*^ar_ ar;
    ~*^[^|]*[|]en(?![a-z]) en;
    ~*^[^|]*[|]es(?![a-z]) es;
    ~*^[^|]*[|]pt(?![a-z]) pt;
    ~*^[^|]*[|]de(?![a-z]) de;
    ~*^[^|]*[|]it(?![a-z]) it;
    ~*^[^|]*[|]ar(?![a-z]) ar;
}

server {
    listen 3400;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # UNE REDIRECTION RESTE RELATIVE (#6713). Par défaut, nginx compose un
    # `Location` ABSOLU avec son propre schéma et son port d'écoute : derrière
    # Traefik, qui termine le TLS, `/join/x` serait renvoyé vers
    # `http://meeshy.me:3400/chat/x` — un port fermé, en clair. Relative, la
    # cible se résout contre l'adresse que le navigateur a réellement ouverte.
    absolute_redirect off;

    # Hérité par toute location qui ne pose aucun `add_header` ; celles qui en
    # posent un le REPOSENT (nginx n'hérite pas des en-têtes d'un niveau dès
    # qu'une location en déclare un). `nginx-app-routes.test.ts` le garde.
    add_header X-Robots-Tag $meeshy_robots_tag always;
    add_header Content-Security-Policy $meeshy_csp always;

    # LE LEGACY EST DÉCOMMISSIONNÉ (#6702). Ce qu'il servait et que des
    # artefacts EXTÉRIEURS visent — apps, e-mails, liens déjà partagés, moteurs —
    # se sert ou se redirige ICI ; `scripts/check-nginx-public.sh` le prouve sur
    # l'image construite (#6713).
    #
    # Les liens universels : iOS (`applinks:meeshy.me`) et Android (App Links
    # vérifiés) lisent ces deux fichiers pour ouvrir l'app depuis un lien. L'AASA
    # n'a pas d'extension : sans type déclaré, nginx le servirait en
    # `application/octet-stream`, qu'Apple ignore.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # Le manifeste de la PWA : `.webmanifest` manque à la table de types de nginx
    # (mesuré sur staging le 2026-09-15 : `application/octet-stream`).
    # `/manifest.json` est l'adresse que le legacy donnait aux installations.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # Les médias téléversés par le legacy vivent dans le volume
    # `frontend_uploads`, monté en LECTURE SEULE sous `/srv/legacy-uploads/u`
    # par le compose de production : avatars et bannières dont l'adresse
    # `https://meeshy.me/u/…` est gravée en base. Sans le volume (staging,
    # local), la requête retombe sur l'application, qui dit « introuvable ».
    location /u/ {
        root /srv/legacy-uploads;
        try_files $uri /index.html;
    }

    # Les anciens formats d'adresse (`apps/web/next.config.ts`), en 308 —
    # permanent, méthode préservée — vers leur forme de la v2.
    location ~ ^/join/(.+)$ {
        return 308 /chat/$1$is_args$args;
    }
    location = /join {
        return 302 /;
    }
    location = /policy {
        return 308 /terms;
    }
    location ~ ^/conversations/(?!new/?$)([^/]+)/?$ {
        return 308 /c/$1$is_args$args;
    }
    location ~ ^/conversation/([^/]+)/?$ {
        return 308 /c/$1$is_args$args;
    }
    location ~ ^/p/(.+)$ {
        return 308 /feeds/post/$1$is_args$args;
    }
    location ~ ^/s/(.+)$ {
        return 308 /story/$1$is_args$args;
    }
    location ~ ^/users/(.+)$ {
        return 308 /u/$1$is_args$args;
    }

    # `/?affiliate=<jeton>` : l'entrée de parrainage du legacy
    # (`apps/web/middleware.ts`). Sans cette redirection, le jeton se perdrait
    # sur la landing.
    #
    # LA RACINE EST LA LANDING (#10002) — le document PRÉRENDU
    # (`scripts/prerender-landing.tsx`), pour tous, jamais la coquille de
    # l'application, qui vit désormais sur `/chats` et ses voisines. Le repli
    # sur `index.html` ne sert qu'une construction sans prérendu (la coquille
    # y rend la même landing, `routes/home.tsx`).
    location = / {
        if ($arg_affiliate) {
            return 308 /signup/affiliate/$arg_affiliate;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
        try_files /landing.html /index.html =404;
    }

    # LA RÉSOLUTION D'ADRESSE, et son ordre porte deux décisions.
    #
    # `$uri.html` AVANT `$uri/index.html` : les cinq pages institutionnelles
    # sont écrites dans les deux formes, et la forme CANONIQUE — celle que leur
    # `<link rel="canonical">` déclare et que le service worker précache — est
    # `about.html`. La servir en premier aligne ce que voit un robot sur ce que
    # voit un visiteur qui revient.
    #
    # `/index.html` en DERNIER recours : c'est le repli de l'application à page
    # unique. Il ne peut pas masquer une page institutionnelle, puisque celle-ci
    # est trouvée deux crans plus tôt — c'est la même garantie que
    # `navigateFallbackDenylist` donne du côté du service worker, à l'autre bout
    # de la chaîne.
    location / {
        try_files $uri $uri.html $uri/index.html @app;
    }

    # Le repli de l'application : la coquille en 200 pour une adresse de la
    # table — habillée de l'aperçu de sa famille pour un robot d'aperçu
    # (#10192) —, la coquille nue en 404 pour toute autre (#10123). `error_page`
    # sans `=` garde le statut ; les deux redirections internes gardent leur
    # `no-cache`.
    location @app {
        error_page 404 /index.html;
        if ($meeshy_app_route = 0) {
            return 404;
        }
        rewrite ^ $meeshy_app_document last;
    }

    # LA COQUILLE HABILLÉE DE SON APERÇU (#10192) — la même que `index.html`,
    # titre et balises de la famille d'adresse en plus, servie aux seuls robots
    # d'aperçu. Interne : elle n'a pas
    # d'adresse publique, aucune page ne s'y duplique. Une construction sans
    # copies (la coque, un build local) retombe sur la coquille nue.
    location /shell-og/ {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
        add_header Vary "User-Agent, Accept-Language, X-Facebook-Locale" always;
        try_files $uri /index.html;
    }

    # `robots.txt` du staging : tout fermé (#10123). La production sert le
    # fichier du dépôt (`public/robots.txt`).
    location = /robots.txt {
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
        default_type text/plain;
        if ($meeshy_staging) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
    }

    # Les actifs portent leur empreinte dans leur nom : leur contenu ne peut pas
    # changer sans que l'adresse change. `immutable` dit au navigateur de ne
    # même pas revalider — c'est la seule catégorie qui mérite un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
    }

    # L'IMAGE D'APERÇU DES LIENS PARTAGÉS (#9712) — l'`og:image` que la page
    # des robots (passerelle, `GET /api/v1/links/:id/og`) pointe ici. Son nom
    # porte sa version (`invitation-v1.png`) : la changer, c'est changer
    # d'adresse, puisque les messageries la gardent en cache par adresse. Un an,
    # comme les actifs empreintés. Une image absente répond 404, jamais la
    # coquille de l'application qu'un robot prendrait pour une image cassée.
    location /og/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        try_files $uri =404;
    }

    # LE SERVICE WORKER NE SE MET JAMAIS EN CACHE HTTP. C'est lui qui porte la
    # révision de tout le reste : mis en cache une heure, il servirait une heure
    # de plus l'ancien précache — y compris après un déploiement correctif.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
    }
    # `/registerSW.js` n'est plus émis (#6936) : l'application inscrit son
    # worker elle-même, comme le legacy le faisait, pour pouvoir DÉTECTER la
    # version en attente et l'annoncer (`vite.config.ts` § `injectRegister`).
    # Aucun en-tête à poser pour un fichier qui n'existe plus.
    # LA CONFIGURATION DU DÉPLOIEMENT (#10208), UNE DONNÉE (#18988) — réécrite
    # au démarrage du conteneur (`docker/runtime-config.sh`), lue par `fetch`
    # avant le premier rendu (`src/lib/api/runtime-config.ts`). Aucun seau du
    # service worker ne la garde (un script de l'origine pourrait le
    # réécrire) : c'est CE cache HTTP, qu'aucun script n'écrit, qui la rend
    # instantanée — fraîche cinq minutes, puis servie périmée pendant sa
    # revalidation, une semaine durant. Une origine changée au redémarrage
    # s'applique au lancement qui suit sa revalidation.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "max-age=300, stale-while-revalidate=604800" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
    }
    # `config.js` — l'ancienne forme, un SCRIPT, que seuls les bundles d'avant
    # #18988 chargent encore (#9223) ; revalidée à chaque lecture.
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
    }
    location = /workbox-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
    }

    # LES SEPT PAGES INSTITUTIONNELLES — « elles ne changent que très rarement »
    # (directive porteur 2026-09-07). Ce qui les rend ENTIÈREMENT disponibles,
    # c'est le précache du service worker : zéro requête réseau, hors ligne
    # compris, et une invalidation par empreinte de contenu à chaque
    # déploiement. Cet en-tête-ci ne sert donc que les clients SANS service
    # worker — la toute première visite, et les robots.
    #
    # Une heure de fraîcheur puis un jour de « sers le périmé pendant que tu
    # revalides » : la rareté des changements est honorée sans le piège d'un
    # `max-age` long, qui retiendrait une mise à jour légale chez des visiteurs
    # que rien ne pourrait plus joindre.
    location ~ ^/(about|child-safety|contact|faq|help|partners|privacy|terms)(\.html|/)?$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # La coquille porte les références aux actifs empreintés : la mettre en
    # cache figerait la version de l'application servie.
    # LES LANDINGS DE LANGUE (#10002) — `/en`, `/es`, `/pt`, `/de`, `/it`,
    # `/ar` : documents prérendus, revalidés à chaque visite comme la racine.
    # La liste est un MIROIR de `LANDING_LANGUAGES` (`src/landing/landing-languages.ts`),
    # confronté par `src/landing/landing-static.test.ts`.
    location ~ ^/(en|es|pt|de|it|ar)(\.html|/)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
    }

    # La révision gravée au build (#6551) — lue par
    # `revision-drift-check.yml` à chaque heure. Un intermédiaire qui la
    # mettrait en cache ferait dire au gate qu'un déploiement fraîchement
    # recréé sert encore l'ancienne image.
    location = /build-info.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Robots-Tag $meeshy_robots_tag always;
        add_header Content-Security-Policy $meeshy_csp always;
        return 200 "ok\n";
    }
}
