<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` expose les encoches a env(safe-area-inset-*) : sans
         lui, la coque Capacitor rend l'en-tete SOUS l'encoche. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f3f9" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Messagerie multilingue temps reel" />
    <!-- `favicon-48.png` est une PROJECTION de l'icone iOS (scripts/generate-icons.py,
         TARGETS) — l'ancien favicon.svg (revue de #5606) etait redessine a la
         main, une SECONDE source de marque qu'aucun gate ne reliait a iOS. -->
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Meeshy</title>
    <!--
      LE SEUL SCRIPT BLOQUANT DU DOCUMENT, et il tient en huit lignes.
      Sans lui, le premier rendu se fait dans le schema du HTML (`dark`) puis
      bascule quand l'application demarre : un eclair blanc sur chaque
      demarrage a froid, c'est-a-dire exactement le cas de la 3G rurale, ou
      l'application met plusieurs secondes a arriver. Il est INLINE parce
      qu'une requete de plus le rendrait inutile.

      Son texte n'est PAS ici : le greffon `meeshy-inline-scheme-bootstrap`
      (vite.config.ts) remplace le marqueur ci-dessous par
      `INLINE_SCHEME_BOOTSTRAP` (src/lib/inline-scheme-bootstrap.js), la MÊME
      constante que lit scripts/prerender-institutional.tsx et qu'importe
      src/lib/scheme.ts — une seule définition, trois lecteurs (#5588).
    -->
    <script>/*@INLINE_SCHEME_BOOTSTRAP@*/</script>
    <!--
      MÊME PATRON, pour la langue d'INTERFACE (#6206) — distincte du Prisme de
      CONTENU (résolution par message, cf. CLAUDE.md racine). Le `lang="fr"`
      ci-dessus n'est que le repli STATIQUE avant que ce script ne s'exécute :
      il pose `document.documentElement.lang` depuis un choix stocké, sinon
      `navigator.languages`, avant la première peinture — comme le schéma,
      inline pour qu'une requête de plus ne soit pas nécessaire.

      Son texte est injecté par le greffon `meeshy-inline-interface-language-bootstrap`
      (vite.config.ts) depuis `src/lib/inline-interface-language-bootstrap.js`,
      la MÊME constante qu'importe `src/lib/interface-language.ts`.
    -->
    <script>/*@INLINE_INTERFACE_LANGUAGE_BOOTSTRAP@*/</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
