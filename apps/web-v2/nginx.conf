# La configuration du serveur de la v3.1 — un serveur STATIQUE, et rien d'autre.
#
# L'application est un bundle Vite plus cinq documents préchauffés : aucun
# rendu à l'exécution, aucune session, aucun appel serveur. Un runtime Node
# n'aurait rien à faire ici — nginx sert des fichiers, ce qui est exactement le
# besoin, pour ~5 Mo d'image au lieu de ~150.

server {
    listen 3400;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # UNE REDIRECTION RESTE RELATIVE (#6713). Par défaut, nginx compose un
    # `Location` ABSOLU avec son propre schéma et son port d'écoute : derrière
    # Traefik, qui termine le TLS, `/join/x` serait renvoyé vers
    # `http://meeshy.me:3400/chat/x` — un port fermé, en clair. Relative, la
    # cible se résout contre l'adresse que le navigateur a réellement ouverte.
    absolute_redirect off;

    # LE LEGACY EST DÉCOMMISSIONNÉ (#6702). Ce qu'il servait et que des
    # artefacts EXTÉRIEURS visent — apps, e-mails, liens déjà partagés, moteurs —
    # se sert ou se redirige ICI ; `scripts/check-nginx-public.sh` le prouve sur
    # l'image construite (#6713).
    #
    # Les liens universels : iOS (`applinks:meeshy.me`) et Android (App Links
    # vérifiés) lisent ces deux fichiers pour ouvrir l'app depuis un lien. L'AASA
    # n'a pas d'extension : sans type déclaré, nginx le servirait en
    # `application/octet-stream`, qu'Apple ignore.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # Le manifeste de la PWA : `.webmanifest` manque à la table de types de nginx
    # (mesuré sur staging le 2026-09-15 : `application/octet-stream`).
    # `/manifest.json` est l'adresse que le legacy donnait aux installations.
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    # Les médias téléversés par le legacy vivent dans le volume
    # `frontend_uploads`, monté en LECTURE SEULE sous `/srv/legacy-uploads/u`
    # par le compose de production : avatars et bannières dont l'adresse
    # `https://meeshy.me/u/…` est gravée en base. Sans le volume (staging,
    # local), la requête retombe sur l'application, qui dit « introuvable ».
    location /u/ {
        root /srv/legacy-uploads;
        try_files $uri /index.html;
    }

    # Les anciens formats d'adresse (`apps/web/next.config.ts`), en 308 —
    # permanent, méthode préservée — vers leur forme de la v2.
    location ~ ^/join/(.+)$ {
        return 308 /chat/$1$is_args$args;
    }
    location = /join {
        return 302 /;
    }
    location = /policy {
        return 308 /terms;
    }
    location ~ ^/conversations/(?!new/?$)([^/]+)/?$ {
        return 308 /c/$1$is_args$args;
    }
    location ~ ^/conversation/([^/]+)/?$ {
        return 308 /c/$1$is_args$args;
    }
    location ~ ^/p/(.+)$ {
        return 308 /feeds/post/$1$is_args$args;
    }
    location ~ ^/s/(.+)$ {
        return 308 /story/$1$is_args$args;
    }
    location ~ ^/users/(.+)$ {
        return 308 /u/$1$is_args$args;
    }

    # `/?affiliate=<jeton>` : l'entrée de parrainage du legacy
    # (`apps/web/middleware.ts`). La racine est privée dans la v2 : sans cette
    # redirection, le jeton se perdait derrière la garde de session.
    location = / {
        if ($arg_affiliate) {
            return 308 /signup/affiliate/$arg_affiliate;
        }
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # LA RÉSOLUTION D'ADRESSE, et son ordre porte deux décisions.
    #
    # `$uri.html` AVANT `$uri/index.html` : les cinq pages institutionnelles
    # sont écrites dans les deux formes, et la forme CANONIQUE — celle que leur
    # `<link rel="canonical">` déclare et que le service worker précache — est
    # `about.html`. La servir en premier aligne ce que voit un robot sur ce que
    # voit un visiteur qui revient.
    #
    # `/index.html` en DERNIER recours : c'est le repli de l'application à page
    # unique. Il ne peut pas masquer une page institutionnelle, puisque celle-ci
    # est trouvée deux crans plus tôt — c'est la même garantie que
    # `navigateFallbackDenylist` donne du côté du service worker, à l'autre bout
    # de la chaîne.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Les actifs portent leur empreinte dans leur nom : leur contenu ne peut pas
    # changer sans que l'adresse change. `immutable` dit au navigateur de ne
    # même pas revalider — c'est la seule catégorie qui mérite un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # LE SERVICE WORKER NE SE MET JAMAIS EN CACHE HTTP. C'est lui qui porte la
    # révision de tout le reste : mis en cache une heure, il servirait une heure
    # de plus l'ancien précache — y compris après un déploiement correctif.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    # `/registerSW.js` n'est plus émis (#6936) : l'application inscrit son
    # worker elle-même, comme le legacy le faisait, pour pouvoir DÉTECTER la
    # version en attente et l'annoncer (`vite.config.ts` § `injectRegister`).
    # Aucun en-tête à poser pour un fichier qui n'existe plus.
    location = /workbox-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # LES SEPT PAGES INSTITUTIONNELLES — « elles ne changent que très rarement »
    # (directive porteur 2026-09-07). Ce qui les rend ENTIÈREMENT disponibles,
    # c'est le précache du service worker : zéro requête réseau, hors ligne
    # compris, et une invalidation par empreinte de contenu à chaque
    # déploiement. Cet en-tête-ci ne sert donc que les clients SANS service
    # worker — la toute première visite, et les robots.
    #
    # Une heure de fraîcheur puis un jour de « sers le périmé pendant que tu
    # revalides » : la rareté des changements est honorée sans le piège d'un
    # `max-age` long, qui retiendrait une mise à jour légale chez des visiteurs
    # que rien ne pourrait plus joindre.
    location ~ ^/(about|contact|faq|help|partners|privacy|terms)(\.html|/)?$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # La coquille porte les références aux actifs empreintés : la mettre en
    # cache figerait la version de l'application servie.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # La révision gravée au build (#6551) — lue par
    # `revision-drift-check.yml` à chaque heure. Un intermédiaire qui la
    # mettrait en cache ferait dire au gate qu'un déploiement fraîchement
    # recréé sert encore l'ancienne image.
    location = /build-info.json {
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }
}
