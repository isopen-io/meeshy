name: Meeshy
options:
  bundleIdPrefix: me.meeshy
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  # NOTE: PRODUCT_NAME is intentionally NOT set globally. As a project-wide
  # setting it propagates to every target, so MeeshyWidgets and
  # MeeshyNotificationExtension would both build as "Meeshy.appex" and Xcode
  # fails with "Multiple commands produce …/Meeshy.appex". Each target's
  # PRODUCT_NAME defaults to $(TARGET_NAME), which is correct
  # (Meeshy.app, MeeshyWidgets.appex, MeeshyNotificationExtension.appex).
  TARGETED_DEVICE_FAMILY: "1,2"
  # Swift 6.2 Approachable Concurrency (WWDC25).
  # - SWIFT_APPROACHABLE_CONCURRENCY umbrella flag (includes Sendable
  #   inference from captures, global-actor usability, etc.)
  # - SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor (SE-0466): UI-centric code
  #   is main-actor by default, background work must be explicit with
  #   @concurrent / nonisolated. This shifts data races from runtime
  #   crashes (background/foreground transitions) to compile errors.
  # - NonisolatedNonsendingByDefault (SE-0461): async functions inherit
  #   the caller's actor unless annotated @concurrent.
  SWIFT_APPROACHABLE_CONCURRENCY: "YES"
  SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: "YES"

  # SWIFT_OPTIMIZATION_LEVEL n'est volontairement PAS fixé ici : le défaut
  # Xcode (-Onone en Debug, -O + wholemodule en Release) est le bon.
  #
  # Le commit 2a32f6462 (2026-04-08) avait imposé `-Onone` à TOUS les builds de
  # release pour contourner un « LLVM ERROR in swift-frontend with -O ... on
  # arm64 Release », en le notant « temporary workaround ». Personne ne l'a
  # retesté pendant quatre mois — la production a donc tourné sur des binaires
  # NON optimisés tout ce temps.
  #
  # Retesté le 2026-07-31, sur runners CI identiques (workflow
  # ios-wmo-probe.yml, run 30658055261), le contournement est OBSOLÈTE :
  #   -O + wholemodule : BUILD SUCCEEDED en 20 min 07 s, 0 LLVM ERROR
  #   -O + incremental : BUILD SUCCEEDED en 13 min 52 s
  # `wholemodule` est conservé (défaut Release) : il produit les optimisations
  # inter-fichiers — spécialisation de génériques, inlining cross-fichier,
  # dévirtualisation — qu'`incremental` ne peut pas générer. On compile
  # rarement, les utilisateurs exécutent en permanence : les 6 minutes de plus
  # sont un bon échange.
  #
  # ⚠️ Piège de mesure : en local, `wholemodule` a semblé ne pas terminer
  # (>1 h 02 sur un cœur). C'était un artefact de contention — machine chargée
  # par une autre session et intermédiaires recyclés d'une archive interrompue.
  # Ne JAMAIS conclure sur les temps de compilation depuis une machine de dev
  # occupée ; refaire la mesure via ios-wmo-probe.yml.

  # Apple-generic versioning — REQUIS par fastlane (get_build_number /
  # increment_build_number / increment_version_number, qui appellent agvtool).
  # Le projet n'avait AUCUN système de versioning configuré dans le pbxproj →
  # `agvtool what-version -terse` sortait en code 6 ("setup your project
  # properly") au lancement de la lane `beta`/`release`. Elles miroitaient
  # Configuration/*.xcconfig, supprimés le 2026-07-28 (jamais câblés au
  # projet : aucune clé `configFiles`, donc sans effet).
  #
  # CETTE VALEUR N'EST PAS UN PLACEHOLDER. Elle doit refléter le dernier build
  # présent sur App Store Connect, pour deux raisons :
  #   1. `xcodegen generate` la recopie telle quelle dans le pbxproj. Laisser
  #      "1" ici a suffi, le 2026-07-25, à faire retomber le projet de 1255 à 1
  #      (commit 85bb7e8d6) — et toute app posée par `meeshy.sh device` a porté
  #      le build 1 pendant cinq jours, sans que la CI de release le voie
  #      (`ios-release.yml` calcule son numéro via `andp build-number` et le
  #      passe en build setting, sans lire le dépôt).
  #   2. Les lanes fastlane prennent `max(dépôt, dernier TestFlight) + 1` : une
  #      valeur juste ici rend le prochain build prévisible (+1), une valeur
  #      fausse le rend seulement non-régressif.
  #
  # Maintenue par `./meeshy.sh build-number` (et automatiquement avant chaque
  # `./meeshy.sh device`), qui lit `source.latest_asc` d'`andp build-number
  # --strategy max-build` et écrit ICI **et** dans le pbxproj — les deux, sinon
  # la prochaine régénération réécrase le correctif.
  VERSIONING_SYSTEM: apple-generic
  # 1743 = dernier build présent sur App Store Connect, VALID (run Xcode Cloud
  # 1743 du 2026-08-04, vérifié via `andp status me.meeshy.app 1743`). Xcode
  # Cloud numérote avec son propre compteur (CI_BUILD_NUMBER), très au-dessus de
  # la série locale : une valeur restée à 1271 ici ne bloquerait pas les lanes
  # fastlane — elles prennent max(dépôt, dernier TestFlight) + 1 — mais rendrait
  # le prochain numéro imprévisible, ce que le bloc ci-dessus proscrit.
  CURRENT_PROJECT_VERSION: "1799"
  # Alignée sur la version App Store Connect. Passée à 1.0.1 le 2026-07-31 :
  # la 1.0.0 avait été rejetée (déclaration Age Rating `ageAssurance` à true
  # sans mécanisme de vérification d'âge dans l'app), et l'enregistrement ASC a
  # été renommé plutôt que recréé — description et captures sont conservées.
  # Laisser 1.0.0 ici ferait produire par tout build local un CFBundleShortVersionString
  # en désaccord avec la version qui attend le binaire.
  #
  # 1.0.4 le 2026-08-04 : la 1.0.3 (build 1269) a été rejetée sur deux points
  # Guideline 2.5.4 — VoIP et audio déclarés dans UIBackgroundModes sans que le
  # reviewer ait pu localiser les fonctionnalités correspondantes. Les deux
  # existent (PushKit/CallKit dans VoIPPushManager, MPNowPlayingInfoCenter dans
  # ConversationAudioCoordinator+NowPlaying) : la correction est côté notes de
  # review et captures vidéo, PAS côté code — voir DEMO_REVIEW_NOTES dans
  # fastlane/Fastfile.
  #
  # RAPPEL : `ci_post_clone.sh` ne lance PAS xcodegen, donc Xcode Cloud build le
  # pbxproj COMMITTÉ. Toute modification de MARKETING_VERSION ici doit être
  # répercutée dans les deux `MARKETING_VERSION` du pbxproj, sinon le binaire
  # livré garde l'ancienne version pendant que ce fichier annonce la nouvelle.
  # (Ne vaut QUE pour la version commerciale : le build number, lui, est imposé
  # par le compteur CI_BUILD_NUMBER de Xcode Cloud — cf. le bloc
  # CURRENT_PROJECT_VERSION ci-dessus.)
  MARKETING_VERSION: "1.0.6"

  # Équipe de signature (Automatic). Indispensable pour `meeshy.sh device`
  # (déploiement sur appareil réel) : sans DEVELOPMENT_TEAM, la signature
  # automatique ne peut pas résoudre le profil → BUILD/sign FAILED. La valeur
  # ne vivait QUE dans le pbxproj committé (résidu d'un réglage Xcode local) →
  # perdue à chaque `xcodegen generate`. Désormais source de vérité ici.
  # Sans impact CI (build simulateur = pas de signature device requise).
  # Team ID figée à D72UK7R5RE depuis le 2026-07-28 : voir le bloc d'en-tête de
  # apps/ios/fastlane/Appfile pour la liste complète des sites porteurs.
  DEVELOPMENT_TEAM: D72UK7R5RE

# Swift package graph. Only two packages are referenced directly by the
# Xcode project: Firebase (remote) and the local MeeshySDK. GRDB, Socket.IO
# and WebRTC are transitive dependencies of MeeshySDK
# (declared in packages/MeeshySDK/Package.swift) and are imported through it,
# so they must NOT be listed here. Mirrors the package refs that were in the
# committed pbxproj before XcodeGen owned generation.
# On-device speech recognition uses Apple's Speech framework (no third-party
# dep) — WhisperKit was linked but never imported, removed 2026-07-10.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.12.1
  MeeshySDK:
    path: ../../packages/MeeshySDK

targets:
  # G7 (2026-07-20) — FirebaseMessaging was removed from the Meeshy target's
  # linked package products (pbxproj): push is pure APNs (the gateway routes to
  # api.push.apple.com itself), no code ever imported FirebaseMessaging. Do NOT
  # re-link it when migrating package dependencies into this file.
  Meeshy:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Meeshy
        excludes:
          - "**/*.md"
    settings:
      INFOPLIST_FILE: Meeshy/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.meeshy.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Meeshy/Meeshy.entitlements
    dependencies:
      - target: MeeshyWidgets
      - target: MeeshyNotificationExtension
      # Ré-embarquée 2026-07-28. Le blocage historique de l'archive de
      # distribution ("No profiles for 'me.meeshy.app.share-extension' were
      # found") est levé : l'App ID `me.meeshy.app.share-extension` existe au
      # portail Apple (QA8KGP7U96, seed D72UK7R5RE) avec la capability
      # APP_GROUPS activée. Le provisioning profile absent est créé à la volée
      # par le signing automatique via `-allowProvisioningUpdates` (Gymfile).
      - target: MeeshyShareExtension
      - package: MeeshySDK
        product: MeeshySDK
      - package: MeeshySDK
        product: MeeshyUI
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebasePerformance
    # Correctif ITMS-90035 à la SOURCE — voir ci_scripts/fix_codeless_framework_identifiers.sh.
    #
    # Xcode injecte un binaire « stub » dans les frameworks sans code
    # (FirebaseAnalytics, GoogleAdsOnDeviceConversion, GoogleAppMeasurement,
    # GoogleAppMeasurementIdentitySupport) et le signe ad hoc sous l'identifier
    # du fichier temporaire qui le porte : « arm64-apple ». Xcode Distribution
    # lit cet identifier pour bâtir le designated requirement qu'il impose à
    # l'export, pendant que le bundle est signé sous son vrai identifier — le
    # code ne satisfait donc pas son propre requirement, et App Store Connect
    # rejette (ITMS-90035). C'est ce qui a fait échouer le build Xcode Cloud 1742.
    #
    # C'est une BUILD PHASE, pas un hook post-archive, et c'est essentiel :
    # `ci_post_xcodebuild.sh` s'exécute APRÈS les exports sur Xcode Cloud, donc
    # trop tard. Ici, la correction a lieu pendant le build, avant tout export —
    # c'est ce qui rend la distribution App Store depuis Xcode Cloud possible.
    # `script:` et non `path:` — ce dernier RECOPIE le contenu du fichier dans le
    # pbxproj (4 273 caractères inlinés, vérifié), si bien qu'éditer le script
    # sans régénérer laisserait Xcode exécuter l'ancienne version. Ici le pbxproj
    # ne porte qu'un appel : le fichier reste la source unique.
    postBuildScripts:
      - name: Fix codeless framework signature identifiers (ITMS-90035)
        script: '"${SRCROOT}/ci_scripts/fix_codeless_framework_identifiers.sh"'
        basedOnDependencyAnalysis: false

    # Le scheme partagé "Meeshy" est déclaré dans la section `schemes:` en bas de
    # ce fichier, PAS ici. La clé `scheme:` d'un target (TargetScheme) n'expose
    # que le câblage des cibles de test — elle n'a pas de sous-clé `archive`, et
    # une `archive.postActions` posée dessous est SILENCIEUSEMENT IGNORÉE
    # (vérifié sur XcodeGen 2.44.1 : le scheme régénéré sortait avec un
    # `<ArchiveAction>` vide). Or la post-action d'archive est le garde-fou
    # ITMS-90035 — la perdre casse la distribution sans casser le build.

  MeeshyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MeeshyWidgets
    settings:
      INFOPLIST_FILE: MeeshyWidgets/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.meeshy.app.widgets
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MeeshyWidgets/MeeshyWidgets.entitlements

  MeeshyNotificationExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MeeshyNotificationExtension
    settings:
      INFOPLIST_FILE: MeeshyNotificationExtension/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.meeshy.app.notification-service
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MeeshyNotificationExtension/MeeshyNotificationExtension.entitlements
    dependencies:
      # NotificationService.swift imports MeeshySDK (and GRDB transitively).
      - package: MeeshySDK
        product: MeeshySDK

  # Share Extension — "Share to Meeshy" depuis d'autres apps. ShareViewController
  # est auto-contenu (frameworks système + container App Group group.me.meeshy.apps) ;
  # aucune dépendance SDK. Recâblé 2026-06-24 (présent sur disque mais absent de
  # project.yml → jamais compilé). Info.plist : NSExtensionPrincipalClass
  # (ShareViewController programmatique, pas de storyboard).
  #
  # SIGNING OK depuis 2026-07-28 — ce target est de nouveau embarqué dans l'app
  # (`- target: MeeshyShareExtension` dans les `dependencies` de Meeshy). L'App ID
  # `me.meeshy.app.share-extension` est enregistré au portail Apple (QA8KGP7U96)
  # avec la capability APP_GROUPS, et le bundle id figure dans `app_identifier`
  # (fastlane/Fastfile lanes `sync_certificates`/`force_sync` + fastlane/Matchfile).
  # Aucun profil match n'existe encore pour ce bundle id : le signing automatique
  # le crée à la volée (`-allowProvisioningUpdates`). Pour basculer sur un profil
  # match versionné : `bundle exec fastlane sync_certificates` sans MATCH_READONLY.
  MeeshyShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MeeshyShareExtension
      # PRÉCÉDENT NOUVEAU : un fichier de l'APP compilé dans une app-extension.
      # `project.yml` ne connaissait que l'inverse (helpers d'extension compilés
      # dans MeeshyTests). L'écran de partage a besoin de la MÊME machine à
      # états que le sélecteur de transfert — la réécrire produirait deux
      # sémantiques de sélection divergentes pour un même geste.
      # Le fichier n'importe QUE Foundation ; garde :
      # `ForwardPickerModelPortabilityGuardTests`.
      - path: Meeshy/Features/Main/Components/ForwardPickerModel.swift
    settings:
      INFOPLIST_FILE: MeeshyShareExtension/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.meeshy.app.share-extension
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: MeeshyShareExtension/MeeshyShareExtension.entitlements

  # P4.3 step 1 — MeeshyTests is the unit-test bundle that previously was
  # only declared inside Meeshy.xcodeproj/project.pbxproj (via 20+ Ruby
  # `add_*.rb` scripts maintaining explicit file references). Declaring
  # it here lets `xcodegen generate` produce a canonical pbxproj — the
  # next step is to delete the Ruby scripts once the regenerated project
  # builds on macOS.
  #
  # `dependencies: [target: Meeshy]` makes the test bundle link against
  # the host app, which is required for `@testable import Meeshy` and for
  # the `TEST_HOST` setting that xctest needs at runtime. XcodeGen wires
  # the host-app build setting automatically when the dependency target
  # is of type `application`.
  MeeshyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MeeshyTests
        excludes:
          - "**/*.md"
          # XCUITest — instantiates XCUIApplication() and drives the running
          # app. It cannot live in this hosted unit-test bundle: there is no
          # UI-testing target (the project deliberately ships UI-flavoured
          # coverage as integration XCTests, cf. StoryNotificationFlowTests),
          # so `xcodebuild test -only-testing:MeeshyTests` aborts the whole
          # suite at construction ("No target application path specified" →
          # NSInternalInconsistencyException from -[XCUIApplication init]).
          - "UI/BubbleExpandableTextUITests.swift"
      # NSE pure helpers compiled INTO the test bundle (they are unreachable
      # through `@testable import Meeshy` — they live in the app-extension
      # target). Foundation/CryptoKit-only files, no UNNotification runtime.
      # This is what makes NotificationPayloadHelpersTests + NSEDecryptorTests
      # buildable (the former was deleted 0c550facc for being unreachable —
      # resurrected now that the sources are shared).
      - path: MeeshyNotificationExtension/NotificationPayloadHelpers.swift
      - path: MeeshyNotificationExtension/NSEDecryptor.swift
      # NSEPreferencesGate importe MeeshySDK (modèle UserNotificationPreferences,
      # déjà lié au bundle de tests) + UserNotifications (data-only en test).
      - path: MeeshyNotificationExtension/NSEPreferencesGate.swift
      # Helpers purs de l'extension de partage, compilés DANS le bundle de tests
      # pour la même raison que les helpers NSE ci-dessus : ils vivent dans une
      # cible app-extension, donc `@testable import Meeshy` ne les atteint pas.
      # Foundation/Security uniquement — ShareViewController (UIKit + SwiftUI)
      # reste HORS du bundle : toute sa logique décidable en a été extraite.
      #
      # Compiler ShareSender ici est aussi ce qui rend possible
      # SharePendingSendContractTests : c'est le seul endroit du dépôt où le
      # miroir extension (SharePendingSend) et le miroir app
      # (SharePendingSendConsumer.PendingSend) coexistent, donc le seul où leur
      # dérive peut être attrapée mécaniquement.
      - path: MeeshyShareExtension/ShareSession.swift
      - path: MeeshyShareExtension/ShareConversationStore.swift
      - path: MeeshyShareExtension/ShareSender.swift
      # Lot B-1 : plafonds et copie streamée. `ShareMediaStaging` importe
      # UniformTypeIdentifiers (framework système, disponible au bundle de
      # tests) et n'a aucune dépendance UIKit — comme les trois helpers
      # au-dessus, il vit dans une cible app-extension que
      # `@testable import Meeshy` n'atteint pas.
      - path: MeeshyShareExtension/ShareLimits.swift
      - path: MeeshyShareExtension/ShareMediaStaging.swift
      - path: MeeshyShareExtension/SharePendingShare.swift
      # Lot B-2 : client TUS de l'extension. LISTÉ ICI EXPRÈS — « le dépôt a
      # déjà vécu des suites vertes par omission » (spec, § Tests et gates).
      - path: MeeshyShareExtension/ShareTusClient.swift
      # Round 2 de revue (Critical) : ShareCancelPolicy/ShareCompletionGate,
      # les deux verrous purs du cycle de vie de l'écran de partage
      # (`ShareLifecycleGatesTests`). Même raison que les fichiers ci-dessus.
      - path: MeeshyShareExtension/ShareLifecycleGates.swift
      # Vecteurs partagés Lentille/Focal (contrat LWS-5, workshop
      # tasks/lentille-focal-workshop.md §2.3) : le même JSON que les suites
      # Jest (packages/shared/__tests__/vectors/) et JUnit (Android, phase 2),
      # copié comme ressource de bundle de test. `type: folder` crée une
      # folder reference qui préserve l'arborescence (reading-modes/,
      # conformance/, …) dans le bundle ; `buildPhase: resources` la place
      # dans la phase Copy Bundle Resources. ATTENTION : ces entrées vivent
      # sous `sources:` — les targets XcodeGen n'ont PAS de clé `resources:`
      # (une telle clé est ignorée SILENCIEUSEMENT, vécu run 31886323298 :
      # bundle sans fixtures/ ni design/, 60+ tests Lentille rouges).
      - path: ../../packages/shared/fixtures
        type: folder
        buildPhase: resources
      # Domicile des cotes Lentille (contrat LWS-5, §0/§4.3) : le JSON vit
      # sous packages/shared/design/, PAS sous fixtures/ — un dossier distinct
      # au même titre, câblé par la même mécanique pour que
      # LentilleMetricsTests le retrouve dans le bundle de tests sous
      # `design/lentille-tokens.json`. Propriété de ce fichier, ligne unique
      # additionnelle : LWS-5 (M-045).
      - path: ../../packages/shared/design
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: me.meeshy.app.tests
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
      # The project-wide SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor (SE-0466)
      # targets UI-centric production code. Applied to an XCTest bundle it makes
      # every `XCTestCase` subclass main-actor-isolated, so the synthesised
      # init()/init(invocation:)/init(selector:) conflict with XCTestCase's own
      # `nonisolated` initialisers and the compiler rejects every test class.
      # The SDK's Package.swift does the same: its test targets use
      # `coreSwiftSettings` (no `.defaultIsolation(MainActor)`) precisely because
      # `uiSwiftSettings` "breaks every XCTestCase subclass". Test classes opt
      # into `@MainActor` explicitly when they exercise main-actor code.
      SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      # Host the tests inside the Meeshy.app process so they can hit
      # UIKit-bound APIs (UIApplication, UNUserNotificationCenter, etc.).
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meeshy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Meeshy"
    dependencies:
      - target: Meeshy

# Scheme partagé "Meeshy" — reproduit à l'identique ce que la clé `scheme:` du
# target générait (build de Meeshy pour toutes les actions, TestAction câblée sur
# MeeshyTests, Debug pour run/test/analyze, Release pour profile/archive), PLUS
# la post-action d'archive que TargetScheme ne sait pas porter.
#
# CI invoque ce scheme via `xcodebuild -scheme Meeshy -only-testing:MeeshyTests`.
schemes:
  Meeshy:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Meeshy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeeshyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
      # Garde-fou ITMS-90035 (« Invalid Signature — Code failed to satisfy
      # specified code requirement(s) ») sur les XCFrameworks binaires
      # Google/Firebase embarqués : FirebaseAnalytics, GoogleAppMeasurement,
      # GoogleAppMeasurementIdentitySupport, GoogleAdsOnDeviceConversion.
      #
      # À l'action `archive`, la signature automatique signe les frameworks
      # embarqués avec « Apple Development » (vérifié dans le log gym :
      # `codesign --force --sign <Apple Development> --preserve-metadata=…` →
      # « replacing existing signature »), puis `-exportArchive` les re-signe en
      # Distribution. Ce remplacement laisse des métadonnées résiduelles que
      # l'analyseur d'App Store Connect refuse. Le script retire les signatures
      # ENTRE archive et export, pour que la re-signature soit une opération
      # fraîche sur un bundle nu.
      #
      # CETTE DÉCLARATION N'EST PAS DÉCORATIVE. Elle a existé dans le scheme
      # committé (commit eb3c47309, 2026-05-18) puis a disparu quand la migration
      # XcodeGen a régénéré le scheme sans que project.yml — devenu source de
      # vérité — ne la porte. Tout archivage depuis Xcode GUI a produit des
      # binaires rejetés à partir de là, sans qu'aucun signal local ne le dise
      # (le build, lui, réussissait). Garde : ArchiveSignatureStripGuardTests.
      postActions:
        - name: Strip embedded framework signatures (ITMS-90035)
          settingsTarget: Meeshy
          script: |
            export CI_XCODEBUILD_ACTION=archive
            export CI_ARCHIVE_PATH="${ARCHIVE_PATH}"
            "${PROJECT_DIR}/ci_scripts/ci_post_xcodebuild.sh"
