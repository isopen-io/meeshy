<style>
[[kit]]
.pcard{position:relative;overflow:hidden;animation:cpFloat 7s ease-in-out infinite}
.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(108deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.18) 50%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:120% 0;animation:cpSheen 5.5s ease-in-out infinite}
.qr{position:relative;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);width:220px;height:220px}
.qr>i{display:block}
.qr>i.o{background:#1B1140;border-radius:36%;transform:scale(.86)}
.eye{position:absolute;width:33.34%;height:33.34%;border:10.5px solid #6D28D9;border-radius:24px;display:flex;align-items:center;justify-content:center}
.eye>b{display:block;width:60%;height:60%;border-radius:10px;background:#1B1140}
.nfc{position:relative;display:flex;align-items:center;justify-content:center;width:112px;height:112px;flex:none;color:var(--accent-ink)}
.nfc>i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid var(--accent-ink);animation:mxPing 3s ease-out infinite}
.nfc .ic{width:64px;height:64px;position:relative}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.act>span:last-child{font-size:11px;font-weight:600;line-height:1.25;text-align:center;color:var(--ink);text-wrap:balance}
@keyframes cpFloat{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1.8deg) translateY(-9px)}}
@keyframes cpSheen{0%,35%{background-position:120% 0}85%,100%{background-position:-40% 0}}
</style>
</helmet>

<div class="orb" style="width: 220px; height: 220px; right: -80px; top: 380px; background: #6366F1; opacity: .5; animation-delay: -4s"></div>

<span class="ring"><span class="av" style="width: 72px; height: 72px; font-size: 26px">AN</span></span>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span class="d" style="font-size: 25px">Aïssa Ndiaye</span>
<span class="mono" style="font-size: 14px; color: var(--accent-ink)">@aissa</span>

[[ic:link s]]<span class="mono" style="font-size: 14px">meeshy.me/@aissa</span>
</div>

<p style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink2)">[[ic:device-mobile s]]<span>Incline ton téléphone : la carte suit</span></p>

<div role="tablist" aria-label="Faces de la carte" style="display: flex; align-items: center; gap: 6px">
<button role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; font-size: 13px; font-weight: 700; color: var(--ink)"><span style="width: 22px; height: 8px; border-radius: 999px; background: var(--ink)"></span><span>QR</span></button>
<button role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--ink2)"><span style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.34)"></span><span>Sans contact</span></button>
</div>

<span class="nfc"><i></i><i style="animation-delay: -1s"></i><i style="animation-delay: -2s"></i>[[ic:contactless-payment]]</span>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0">

<span class="d" style="font-size: 19px; text-wrap: balance">Approche ton téléphone du sien</span>
<span style="font-size: 13px; color: var(--ink2); text-wrap: pretty">Vous choisissez chacun ce que vous donnez</span>
</span>

<button class="act"><span class="ib g" style="width: 56px; height: 56px">[[ic:copy]]</span><span>Copier le lien</span></button>
<button class="act"><span class="ib g" style="width: 56px; height: 56px">[[ic:paper-plane-tilt]]</span><span>Envoyer dans une conversation</span></button>
<button class="act"><span class="ib g" style="width: 56px; height: 56px">[[ic:plus-circle]]</span><span>Mettre en story</span></button>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; align-self: stretch">
<button class="chip glass" aria-haspopup="listbox" aria-expanded="true" style="min-height: 44px; padding: 0 16px; color: var(--ink)">[[ic:globe s]]<span>Vitrine publique</span>[[ic:caret-down s]]</button>
</div>
<div class="glass" role="listbox" aria-label="Ce que montre le QR" style="align-self: stretch; border-radius: 22px; padding: 6px; display: flex; flex-direction: column">
<button role="option" aria-selected="true" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,.10)">
<span style="color: var(--accent-ink); display: inline-flex">[[ic:globe]]</span>
<span style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-weight: 700; font-size: 14.5px">Vitrine publique</span><span style="font-size: 12.5px; color: var(--ink2)">Ce que tout le monde voit de toi</span></span>
<span style="color: var(--ok); display: inline-flex">[[ic:check]]</span>
</button>
<button role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 16px">
<span style="color: var(--ink2); display: inline-flex">[[ic:user-plus]]</span>
<span style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-weight: 700; font-size: 14.5px">Invitation à me rejoindre</span><span style="font-size: 12.5px; color: var(--ink2)">Scanner envoie une demande d'amis</span></span>
</button>
</div>
