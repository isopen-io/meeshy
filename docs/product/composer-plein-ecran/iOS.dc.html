<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composer plein écran — iOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#fff}
button{font-family:inherit;color:inherit}
.m1{background:radial-gradient(circle at 50% 57%,#fef3c7 0 6%,rgba(254,243,199,0) 7%),linear-gradient(180deg,#312e81 0%,#7c3aed 28%,#f97316 54%,#fbbf24 59%,#0e7490 60%,#083344 100%)}
.lg{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);color:#fff}
.circ{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0}
.rail{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:30px}
.rb{width:46px;height:46px;border-radius:23px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.um{width:250px;border-radius:14px;overflow:hidden;background:rgba(40,40,46,.78);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ui{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 14px;border:0;background:transparent;color:#fff;font-size:16px;text-align:left;border-top:.5px solid rgba(255,255,255,.14)}
.ui .ck{width:16px;flex-shrink:0}
.ui .tx{display:flex;flex-direction:column;gap:1px;flex-grow:1}
.ui .sb{font-size:12.5px;color:rgba(235,235,245,.6)}
.ui.dis{color:rgba(235,235,245,.35)}
.ui.dis .sb{color:rgba(235,235,245,.3)}
.ui.hl{background:rgba(255,255,255,.12)}
</style>
</helmet>
<div style="position: relative; width: 393px; height: 852px; overflow: hidden; background: #000;">
  <div class="m1" style="position: absolute; inset: -40px; filter: blur(26px) brightness(.62) saturate(1.2);"></div>
  <div class="m1" style="position: absolute; left: 0; top: 279px; width: 393px; height: 295px; box-shadow: 0 18px 50px rgba(0,0,0,.35);"></div>
  <div style="position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%) rotate(-4deg);">
    <span style="display: block; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 50px; line-height: 1.05; text-shadow: 0 2px 14px rgba(0,0,0,.35); white-space: pre;">Terrasse, 6 h</span>
  </div>
  <div style="position: absolute; left: 30%; top: 72%; transform: translate(-50%, -50%);">
    <span style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 14px; background: #4f46e5; font-weight: 800; font-size: 17px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      Lisbonne
    </span>
  </div>

  <!-- haut -->
  <div style="position: absolute; top: 58px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px;">
    <button class="circ lg" aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex-grow: 1;"></div>
    <button class="lg" style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      Aube claire
    </button>
    <button class="circ lg" aria-label="Animé" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
    </button>
  </div>

  <!-- couloirs -->
  <div class="rail lg" style="position: absolute; left: 12px; top: 200px;">
    <button class="rb" aria-label="Texte"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"></path></svg></button>
    <button class="rb" aria-label="Sticker"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-9-9h9z"></path><path d="M21 3l-9 9"></path></svg></button>
    <button class="rb" aria-label="Dessin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 4-2 4-4a3 3 0 116 0"></path><path d="M20 3L10 13"></path></svg></button>
    <button class="rb" aria-label="Média"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg></button>
    <button class="rb" aria-label="Son"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></button>
  </div>
  <div class="rail lg" style="position: absolute; right: 12px; top: 200px;">
    <button class="rb" aria-label="Annuler"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg></button>
    <button class="rb" aria-label="Rétablir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 000 12h3"></path></svg></button>
    <button class="rb" aria-label="Nouvelle slide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M12 9v6M9 12h6"></path></svg></button>
  </div>

  <!-- voile du menu -->
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.28);"></div>

  <!-- UIMenu « Publier comme », ouvert depuis la flèche -->
  <div style="position: absolute; right: 16px; bottom: 100px; width: 250px; height: 420px;">
    <div class="um" role="menu" style="position: absolute; right: 26px; top: 0; width: 240px; z-index: 2; box-shadow: 0 24px 60px rgba(0,0,0,.55);">
      <div style="padding: 10px 14px 8px; font-size: 13px; color: rgba(235,235,245,.6);">Disposition du post</div>
      <button class="ui" role="menuitem"><span class="ck"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span class="tx">Image par image</span></button>
      <button class="ui" role="menuitem"><span class="ck"></span><span class="tx">Défilement continu</span></button>
      <button class="ui" role="menuitem"><span class="ck"></span><span class="tx">Une grande, les autres à côté</span></button>
      <button class="ui" role="menuitem"><span class="ck"></span><span class="tx">En vague</span></button>
      <button class="ui" role="menuitem"><span class="ck"></span><span class="tx">En zigzag</span></button>
    </div>
    <div class="um" role="menu" style="position: absolute; right: 0; bottom: 0; opacity: .72; transform: scale(.97); transform-origin: bottom right;">
      <div style="padding: 10px 14px 8px; font-size: 13px; color: rgba(235,235,245,.6);">Publier comme</div>
      <button class="ui" role="menuitem"><span class="ck"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span class="tx">Story<span class="sb">Visible 24 h · Contacts</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3 2.2"></circle></svg></button>
      <button class="ui hl" role="menuitem" aria-expanded="true"><span class="ck"></span><span class="tx">Post<span class="sb">Dans le fil · 2 médias</span></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button class="ui dis" role="menuitem" aria-disabled="true"><span class="ck"></span><span class="tx">Réel<span class="sb">Demande une vidéo ou un son de 3 s, ou deux images</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg></button>
    </div>
  </div>

  <!-- socle : légende, audience, capsule [Publier | ⌃] -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; align-items: center; gap: 8px;">
    <button class="lg" style="height: 50px; padding: 0 14px; border-radius: 25px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"></path></svg>
      Contacts
    </button>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: stretch; height: 50px; border-radius: 25px; background: #6366f1; overflow: hidden;">
      <button style="border: 0; background: transparent; padding: 0 14px 0 20px; font-size: 16px; font-weight: 700;">Publier 2 stories</button>
      <span style="width: 1px; margin: 12px 0; background: rgba(255,255,255,.45);"></span>
      <button aria-label="Publier comme" aria-expanded="true" style="border: 0; background: #4f46e5; padding: 0 14px; display: flex; align-items: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
