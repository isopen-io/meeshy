<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composer plein écran — iPad et Mac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#fff}
button{font-family:inherit;color:inherit}
.m4{background:radial-gradient(ellipse 26% 18% at 50% 36%,#f2c6a0 0 97%,rgba(0,0,0,0) 100%),radial-gradient(ellipse 46% 30% at 50% 90%,#4f46e5 0 97%,rgba(0,0,0,0) 100%),linear-gradient(180deg,#fde68a,#fb923c)}
.m1{background:radial-gradient(circle at 50% 57%,#fef3c7 0 6%,rgba(254,243,199,0) 7%),linear-gradient(180deg,#312e81 0%,#7c3aed 28%,#f97316 54%,#fbbf24 59%,#0e7490 60%,#083344 100%)}
.lg{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);color:#fff}
.dk{background:rgba(24,24,30,.62);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.16);color:#fff}
.circ{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0}
.rail{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:30px}
.rb{width:60px;min-height:56px;border-radius:20px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;padding:0}
.rb.on{background:#6366f1}
.tok{height:34px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);white-space:nowrap;color:#fff}
.tok.on{background:#fff;color:#111}
.sw{width:14px;height:14px;border-radius:7px;border:1px solid rgba(255,255,255,.4)}
.lab{font-size:11px;font-weight:700;color:rgba(235,235,245,.6);text-transform:uppercase;letter-spacing:.06em}
</style>
</helmet>
<div style="position: relative; width: 1180px; height: 820px; overflow: hidden; background: #000;">

  <!-- la scène occupe toute la hauteur ; son fond, flouté, prolonge le cadre jusqu'aux bords -->
  <div style="position: absolute; inset: -60px; background: #fde68a; filter: brightness(.55);"></div>
  <div style="position: absolute; left: 50%; top: 0; width: 461px; height: 820px; margin-left: -230px; overflow: hidden; background: #fde68a; box-shadow: 0 0 80px rgba(0,0,0,.35);">
    <div class="m4" style="position: absolute; left: 0; top: 102px; width: 461px; height: 615px; box-shadow: 0 18px 50px rgba(0,0,0,.3);"></div>
    <div style="position: absolute; left: 50%; top: 8%; transform: translate(-50%, -50%);">
      <span style="display: block; font-weight: 800; font-size: 40px; color: #1c1917; letter-spacing: -.01em;">Dimanche</span>
    </div>
    <div style="position: absolute; left: 80%; top: 17%; transform: translate(-50%, -50%) rotate(12deg); outline: 2px dashed rgba(28,25,23,.8); outline-offset: 8px; border-radius: 8px;">
      <svg viewBox="0 0 24 24" width="70" height="70"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z" fill="#fbbf24" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </div>
    <div style="position: absolute; left: 50%; top: 93%; transform: translate(-50%, -50%);">
      <span style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 14px; background: rgba(0,0,0,.65); font-weight: 800; font-size: 17px;">@lea</span>
    </div>
  </div>

  <!-- haut -->
  <div style="position: absolute; top: 24px; left: 24px;">
    <button class="circ lg" aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
  <div style="position: absolute; top: 24px; right: 24px; display: flex; align-items: center; gap: 10px;">
    <button class="lg" style="height: 38px; padding: 0 14px; border-radius: 19px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      Aube claire
    </button>
    <button class="lg" style="height: 38px; padding: 0 14px; border-radius: 19px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
      Animé
    </button>
  </div>

  <!-- couloir gauche, avec l'infobulle du pointeur (trackpad, souris, Mac) -->
  <div class="rail lg" style="position: absolute; left: 24px; top: 190px;">
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"></path></svg>Texte</button>
    <button class="rb" style="background: rgba(255,255,255,.16);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-9-9h9z"></path><path d="M21 3l-9 9"></path></svg>Sticker</button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 4-2 4-4a3 3 0 116 0"></path><path d="M20 3L10 13"></path></svg>Dessin</button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>Média</button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Son</button>
  </div>
  <div class="dk" style="position: absolute; left: 104px; top: 262px; padding: 6px 10px; border-radius: 8px; font-size: 12px; display: flex; gap: 10px;">Poser un sticker <span style="color: rgba(235,235,245,.6);">S</span></div>

  <!-- couloir droit : Cadre actif -->
  <div class="rail lg" style="position: absolute; right: 24px; top: 190px;">
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>Annuler</button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 000 12h3"></path></svg>Rétablir</button>
    <button class="rb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16h16"></path><path d="M2 6h16v16"></path></svg>Cadre</button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M12 9v6M9 12h6"></path></svg>Slide</button>
  </div>

  <!-- panneau Cadre, à côté du couloir -->
  <div class="dk" style="position: absolute; right: 108px; top: 190px; width: 250px; padding: 14px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 14px; font-weight: 700;">Portrait 3:4</div>
    <div style="font-size: 12.5px; color: rgba(235,235,245,.7); line-height: 1.35;">Entière, posée dans le cadre 9:16. Rien n'est rogné.</div>
    <div class="lab">Le média</div>
    <div style="display: flex; gap: 6px;">
      <button class="tok on">Ajuster</button>
      <button class="tok">Remplir</button>
    </div>
    <div class="lab">Autour du média</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <button class="tok"><span class="sw" style="background: linear-gradient(135deg,#fb923c,#4f46e5);"></span>Flou</button>
      <button class="tok"><span class="sw" style="background: #000;"></span>Noir</button>
      <button class="tok"><span class="sw" style="background: #f5f5f4;"></span>Blanc</button>
      <button class="tok"><span class="sw" style="background: #312e81;"></span>Indigo</button>
      <button class="tok on"><span class="sw" style="background: #fde68a;"></span>Sable</button>
    </div>
  </div>

  <!-- bas : slides · légende · audience · capsule -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 10px;">
    <div class="lg" style="display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 16px;">
      <span style="position: relative; width: 30px; height: 52px; border-radius: 8px; overflow: hidden; outline: 2px solid #fff; background: #fde68a;"><span class="m4" style="position: absolute; left: 0; top: 7px; width: 30px; height: 38px;"></span></span>
      <span style="position: relative; width: 30px; height: 52px; border-radius: 8px; overflow: hidden; background: #111;"><span class="m1" style="position: absolute; left: 0; top: 15px; width: 30px; height: 22px;"></span></span>
      <button aria-label="Ajouter une slide" style="width: 30px; height: 52px; border-radius: 8px; border: 1.5px dashed rgba(255,255,255,.5); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <div style="flex-grow: 1;"></div>
    <div class="lg" style="width: 280px; height: 50px; border-radius: 25px; display: flex; align-items: center; padding: 0 18px; font-size: 15px; color: rgba(255,255,255,.7);">Texte de la story…</div>
    <button class="lg" style="height: 50px; padding: 0 14px; border-radius: 25px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"></path></svg>
      Contacts
    </button>
    <div style="display: flex; align-items: stretch; height: 50px; border-radius: 25px; background: #6366f1; overflow: hidden;">
      <button style="border: 0; background: transparent; padding: 0 14px 0 20px; font-size: 16px; font-weight: 700;">Publier 2 stories</button>
      <span style="width: 1px; margin: 12px 0; background: rgba(255,255,255,.45);"></span>
      <button aria-label="Publier comme" style="border: 0; background: transparent; padding: 0 14px; display: flex; align-items: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
