<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composer plein écran — web bureau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:Figtree,system-ui,sans-serif;color:#fff}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
.m1{background:radial-gradient(circle at 50% 57%,#fef3c7 0 6%,rgba(254,243,199,0) 7%),linear-gradient(180deg,#312e81 0%,#7c3aed 28%,#f97316 54%,#fbbf24 59%,#0e7490 60%,#083344 100%)}
.m4{background:radial-gradient(ellipse 26% 18% at 50% 36%,#f2c6a0 0 97%,rgba(0,0,0,0) 100%),radial-gradient(ellipse 46% 30% at 50% 90%,#4f46e5 0 97%,rgba(0,0,0,0) 100%),linear-gradient(180deg,#fde68a,#fb923c)}
.m5{background:linear-gradient(180deg,#7dd3fc 0%,#bae6fd 38%,#06b6d4 40%,#0891b2 58%,#fcd34d 60%,#fde68a 100%)}
.glass{background:rgba(12,12,18,.5);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.14);color:#fff}
.ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chip{height:40px;padding:0 14px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.primary{background:#4f46e5;border:0;color:#fff}
.rail{display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:28px}
.rb{width:64px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;background:transparent;border:0;border-radius:18px;cursor:pointer;color:#fff;padding:0}
.rb.on{background:#4f46e5}
.kbd{font-size:10px;color:#a1a1aa;font-weight:700}
.tok{height:36px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);cursor:pointer;white-space:nowrap;color:#fff}
.tok.on{background:#fff;color:#111}
.dot{width:26px;height:26px;border-radius:13px;border:2px solid rgba(255,255,255,.5);padding:0}
.track{position:relative;height:22px;border-radius:6px;background:rgba(255,255,255,.07);flex-grow:1}
.bar{position:absolute;top:3px;bottom:3px;border-radius:5px;background:rgba(165,180,252,.55)}
.bar.on{background:#818cf8;box-shadow:0 0 0 2px #fff}
.slidethumb{position:relative;width:40px;height:70px;border-radius:9px;border:2px solid rgba(255,255,255,.35);overflow:hidden;padding:0}
.pm{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;background:transparent;color:#fff;text-align:left;padding:6px 8px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600}
.pm.lay{min-height:36px;padding-left:56px;font-size:13px;color:#e0e7ff}
.pl{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.pc{display:flex;flex-direction:column;gap:2px;flex-grow:1}
.pt{font-size:15px;font-weight:700}
.ps{font-size:12px;color:#a1a1aa;font-weight:500}
.slidethumb.on{border-color:#fff;box-shadow:0 0 0 2px #4f46e5}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #050507;">

  <!-- la scène s'étend au viewport : son propre fond, flouté, prolonge la carte 9:16 -->
  <div class="m1" style="position: absolute; inset: -60px; filter: blur(48px) brightness(.55); transform: scale(1.1);"></div>

  <div style="position: absolute; left: 50%; top: 20px; width: 427px; height: 760px; margin-left: -213px; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); background: #312e81;">
    <div class="m1" style="position: absolute; left: 0; top: 220px; width: 427px; height: 320px; box-shadow: 0 18px 50px rgba(0,0,0,.35);"></div>
    <div style="position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) rotate(-4deg); outline: 2px dashed rgba(255,255,255,.95); outline-offset: 8px; border-radius: 8px;">
      <span style="display: block; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 54px; line-height: 1.05; text-shadow: 0 2px 14px rgba(0,0,0,.35); white-space: pre;">Terrasse, 6 h</span>
    </div>
    <div style="position: absolute; left: 72%; top: 70%; transform: translate(-50%, -50%) rotate(8deg);">
      <span style="display: block; width: 130px; height: 172px; border-radius: 14px; border: 4px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4);" class="m4"></span>
    </div>
    <div style="position: absolute; left: 26%; top: 82%; transform: translate(-50%, -50%);">
      <span style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 14px; background: #4f46e5; font-weight: 800; font-size: 18px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        Lisbonne
      </span>
    </div>
  </div>

  <!-- haut -->
  <div style="position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 10px;">
    <button class="ib glass" aria-label="Fermer le composer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div class="glass" style="display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 16px;">
      <button class="slidethumb on" aria-label="Slide 1"><span class="m1" style="position: absolute; inset: 0;"></span></button>
      <button class="slidethumb" aria-label="Slide 2"><span class="m5" style="position: absolute; inset: 0;"></span></button>
      <button class="slidethumb" aria-label="Ajouter une slide" style="background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; border-style: dashed;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>
  <div style="position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px;">
    <button class="chip glass" style="height: 36px; font-size: 13px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      Aube claire · [artiste]
    </button>
    <button class="chip glass primary" aria-pressed="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
      Animé
    </button>
  </div>

  <!-- couloirs -->
  <div class="rail glass" style="position: absolute; left: 24px; top: 190px;">
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"></path></svg>Texte<span class="kbd">T</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-9-9h9z"></path><path d="M21 3l-9 9"></path></svg>Sticker<span class="kbd">S</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 4-2 4-4a3 3 0 116 0"></path><path d="M20 3L10 13"></path></svg>Dessin<span class="kbd">D</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>Média<span class="kbd">glisser</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Son</button>
  </div>
  <div class="rail glass" style="position: absolute; right: 24px; top: 190px;">
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>Annuler<span class="kbd">⌘Z</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 000 12h3"></path></svg>Rétablir<span class="kbd">⇧⌘Z</span></button>
    <button class="rb on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M4 12h16M4 17h7"></path><path d="M17 4v6"></path></svg>Temps<span class="kbd" style="color: #e0e7ff;">Espace</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16h16"></path><path d="M2 6h16v16"></path></svg>Cadre<span class="kbd">4:3 · ajusté</span></button>
    <button class="rb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M12 9v6M9 12h6"></path></svg>Slide</button>
  </div>

  <!-- inspecteur de l'objet sélectionné : flotte à côté de la carte -->
  <div class="glass" style="position: absolute; left: 116px; top: 150px; width: 280px; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 12px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: .06em;">Texte sélectionné</div>
    <label for="wtext" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Texte de l'objet</label>
    <input id="wtext" value="Terrasse, 6 h" style="height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: #fff; padding: 0 12px; font-size: 15px; font-weight: 600; outline: none;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
      <button class="tok">Classique</button>
      <button class="tok">Néon</button>
      <button class="tok">Cartouche</button>
      <button class="tok on">Serif</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="dot" aria-label="Blanc" style="background: #fff; border: 3px solid #fff; box-shadow: 0 0 0 2px #4f46e5;"></button>
      <button class="dot" aria-label="Ambre" style="background: #fbbf24;"></button>
      <button class="dot" aria-label="Indigo" style="background: #a5b4fc;"></button>
      <button class="dot" aria-label="Rose" style="background: #f472b6;"></button>
      <button class="dot" aria-label="Noir" style="background: #111;"></button>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button class="tok">Monter</button>
      <button class="tok">Reculer</button>
      <button class="tok" style="color: #fca5a5;">Retirer</button>
    </div>
    <div style="font-size: 12px; color: #a1a1aa; line-height: 1.4;">Clic droit sur un objet : ses actions, comme l'appui long sur mobile.</div>
  </div>

  <!-- bas : plan temps + ce qui part -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 20px; display: flex; align-items: flex-end; gap: 16px;">
    <div class="glass" style="flex-grow: 1; max-width: 560px; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="ib" aria-label="Lire" style="width: 34px; height: 34px; background: #fff; border: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="#111"><path d="M7 4l13 8-13 8z"></path></svg></button>
        <div style="font-size: 12px; font-weight: 700; flex-grow: 1;">2,4 s / 6 s</div>
        <button class="tok" style="height: 30px; font-size: 12px;">Entre ici</button>
        <button class="tok" style="height: 30px; font-size: 12px;">Sort ici</button>
      </div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 88px; font-size: 11px; color: #d4d4d8;">Terrasse, 6 h</div><div class="track"><span class="bar on" style="left: 0%; width: 70%;"></span></div></div>
        <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 88px; font-size: 11px; color: #d4d4d8;">Média</div><div class="track"><span class="bar" style="left: 30%; width: 70%;"></span></div></div>
        <div style="display: flex; align-items: center; gap: 8px;"><div style="width: 88px; font-size: 11px; color: #d4d4d8;">Lisbonne</div><div class="track"><span class="bar" style="left: 55%; width: 45%;"></span></div></div>
        <div style="position: absolute; top: -2px; bottom: -2px; left: calc(96px + (100% - 96px) * .4); width: 2px; background: #fbbf24; border-radius: 1px;"></div>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <label for="wcap" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Texte de la story</label>
      <input id="wcap" class="glass" placeholder="Texte de la story…" style="width: 280px; height: 46px; border-radius: 23px; padding: 0 18px; font-size: 15px; outline: none;">
      <button class="chip glass" style="height: 46px; border-radius: 23px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"></path></svg>
        Contacts
      </button>
      <div style="position: relative; display: flex; align-items: stretch; height: 50px; border-radius: 25px; background: #4f46e5; box-shadow: 0 8px 24px rgba(79,70,229,.45);">
        <button class="chip primary" style="height: 50px; border-radius: 25px 0 0 25px; padding: 0 14px 0 22px; font-size: 15px;">Publier 2 stories</button>
        <span style="width: 1px; margin: 12px 0; background: rgba(255,255,255,.4);"></span>
        <button class="chip primary" aria-label="Publier comme" aria-haspopup="menu" aria-expanded="true" style="height: 50px; border-radius: 0 25px 25px 0; padding: 0 14px; background: #4338ca;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
        <div class="glass" role="menu" style="position: absolute; right: 0; bottom: 60px; width: 300px; border-radius: 18px; background: rgba(20,20,28,.92); padding: 6px; display: flex; flex-direction: column;">
          <div style="padding: 10px 12px 6px; font-size: 12px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: .06em;">Ce qui part</div>
          <button class="pm" role="menuitem" style="background: rgba(99,102,241,.25);"><span class="pl" style="background: #db2777;">S</span><span class="pc"><span class="pt">Story</span><span class="ps">Visible 24 h · Contacts</span></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></button>
          <button class="pm" role="menuitem" aria-expanded="true"><span class="pl" style="background: #0891b2;">P</span><span class="pc"><span class="pt">Post</span><span class="ps">Dans le fil · 2 médias · Contacts</span></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(90deg);"><path d="M9 6l6 6-6 6"></path></svg></button>
          <button class="pm lay" role="menuitem">Image par image</button>
          <button class="pm lay" role="menuitem">Défilement continu</button>
          <button class="pm lay" role="menuitem">Une grande, les autres à côté</button>
          <button class="pm lay" role="menuitem">En vague</button>
          <button class="pm lay" role="menuitem">En zigzag</button>
          <button class="pm" role="menuitem"><span class="pl" style="background: #ea580c;">R</span><span class="pc"><span class="pt">Réel</span><span class="ps">Plein écran · Contacts</span></span></button>
          <div style="padding: 6px 12px 8px; font-size: 11.5px; color: #a1a1aa;">↑↓ puis Entrée choisit ce qui part · seul Publier envoie</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
