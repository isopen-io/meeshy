# coturn de STAGING (#11278) — gabarit versionné, jamais monté tel quel :
# __TURN_SECRET__ et __TURN_EXTERNAL_IP__ y sont substitués au démarrage
# (docker-compose.staging.yml, service coturn-staging).
#
# Même hôte physique que la production (#9232), qui tient en réseau HÔTE
# 3478, 3479, 5349 et TOUTE la plage 49152-65535 : le staging tourne en
# réseau bridge, publie 3480 (UDP/TCP) et la plage de relais 40000-40099, et
# n'ouvre AUCUN écouteur TLS. Le TLS est terminé par Traefik sur 443
# (routeur TCP HostSNI turn.staging.<domaine>), qui relaie du TURN-sur-TCP
# en clair vers listening-port : coturn n'a ni certificat ni clé à lire.
listening-port=3478
no-tls
no-dtls
listening-ip=0.0.0.0
external-ip=__TURN_EXTERNAL_IP__
min-port=40000
max-port=40099
realm=staging.meeshy.me
server-name=turn.staging.meeshy.me
use-auth-secret
static-auth-secret=__TURN_SECRET__
no-multicast-peers
no-loopback-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
total-quota=100
stale-nonce=600
fingerprint
log-file=stdout
