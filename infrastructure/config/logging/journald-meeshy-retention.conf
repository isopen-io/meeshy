# #10855 — installé en /etc/systemd/journald.conf.d/meeshy-retention.conf.
# Les conteneurs applicatifs (passerelle, translator, webapp, agent ; production
# et staging) journalisent dans journald : 30 jours au plus, 4 Go au plus.
# Mesuré le 2026-10-16 : ~1 Go pour 46 jours de journal système.
[Journal]
Storage=persistent
SystemMaxUse=4G
SystemKeepFree=20G
MaxRetentionSec=30day
