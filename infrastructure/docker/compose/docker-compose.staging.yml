# =============================================================================
# MEESHY - Docker Compose STAGING (*.staging.meeshy.me)
# =============================================================================
# Deployment: /opt/meeshy/staging/
# Isolation: Volumes, domaines et réseau interne séparés de production
# Routing: Traefik PROD route le trafic via le réseau partagé meeshy-network
# Prérequis: Le compose prod doit tourner (Traefik sur ports 80/443)
# =============================================================================

services:
  # ===========================================================================
  # DATABASE STAGING - MongoDB Replica Set
  # ===========================================================================
  database-staging:
    image: ${DATABASE_IMAGE:-mongo:8.0}
    container_name: meeshy-database-staging
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --noauth
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-meeshy}
    ports:
      - "27018:27017"  # Exposition externe pour debug/migration
    volumes:
      - database_staging_data:/data/db
      - database_staging_config:/data/configdb
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Replica Set Init (one-shot)
  mongo-init-staging:
    image: ${DATABASE_IMAGE:-mongo:8.0}
    container_name: meeshy-mongo-init-staging
    depends_on:
      database-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
    entrypoint: >
      mongosh --host database-staging:27017 --eval '
        try {
          const status = rs.status();
          print("Replica set already initialized, state: " + status.myState);
        } catch (e) {
          print("Initializing replica set...");
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "database-staging:27017" }]
          });
          print("Replica set initialized!");
        }
      '
    restart: "no"

  # ===========================================================================
  # NOSQLCLIENT STAGING - MongoDB Web UI
  # ===========================================================================
  nosqlclient-staging:
    image: mongoclient/mongoclient:latest
    container_name: meeshy-nosqlclient-staging
    restart: unless-stopped
    environment:
      MONGOCLIENT_DEFAULT_CONNECTION_URL: "mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true"
      ROOT_URL: "https://mongo.staging.${DOMAIN:-meeshy.me}"
      PORT: 3000
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.nosqlclient-staging.rule=Host(`mongo.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.nosqlclient-staging.entrypoints=websecure"
      - "traefik.http.routers.nosqlclient-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.nosqlclient-staging.loadbalancer.server.port=3000"
      - "traefik.http.routers.nosqlclient-staging.middlewares=nosqlclient-staging-auth"
      - "traefik.http.middlewares.nosqlclient-staging-auth.basicauth.users=${MONGO_USERS:-}"

  # ===========================================================================
  # REDIS STAGING
  # ===========================================================================
  redis-staging:
    image: redis:8-alpine
    container_name: meeshy-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"  # Port alternatif pour debug
    volumes:
      - redis_staging_data:/data
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # P3X REDIS UI STAGING
  # ===========================================================================
  p3x-redis-ui-staging:
    image: patrikx3/p3x-redis-ui:latest
    container_name: meeshy-p3x-redis-ui-staging
    restart: unless-stopped
    environment:
      - P3X_REDIS_UI_SETTINGS={"hostname":"redis-staging","port":6379,"password":"","database":0}
      - P3X_REDIS_UI_HTTP_PORT=7843
      - P3XRS_SETTINGS_PATH=/settings
    volumes:
      - redis_staging_ui_data:/settings
    depends_on:
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep :7843 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.p3x-redis-staging.rule=Host(`redis.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.p3x-redis-staging.entrypoints=websecure"
      - "traefik.http.routers.p3x-redis-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.p3x-redis-staging.loadbalancer.server.port=7843"
      - "traefik.http.routers.p3x-redis-staging.middlewares=p3x-redis-staging-auth"
      - "traefik.http.middlewares.p3x-redis-staging-auth.basicauth.users=${REDIS_USERS:-}"

  # ===========================================================================
  # TRANSLATOR STAGING - ML Service
  # ===========================================================================
  translator-staging:
    image: ${TRANSLATOR_IMAGE:-isopen/meeshy-translator:staging}
    container_name: meeshy-translator-staging
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-MONGODB}
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - PRISMA_SCHEMA_PATH=/workspace/shared/prisma/schema.prisma
      - PYTHONPATH=/workspace:/workspace/generated
      - PYTHONUNBUFFERED=1
      - NODE_ENV=production
      - HF_HOME=/workspace/models/huggingface
      - TRANSFORMERS_CACHE=/workspace/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - PYANNOTE_CACHE=/workspace/models/pyannote
      - HF_TOKEN=${HF_TOKEN:-}
      - MAX_MESSAGE_LENGTH=10000
      - MAX_TEXT_LENGTH=100000
      - MAX_TRANSLATION_LENGTH=100000
      - MAX_TEXT_ATTACHMENT_THRESHOLD=100000
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-true}
    volumes:
      - models_staging_data:/workspace/models
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      # /live = liveness instantané (cf. prod) — évite le flapping unhealthy sous charge ML.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.translator-staging.rule=Host(`ml.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.translator-staging.entrypoints=websecure"
      - "traefik.http.routers.translator-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.translator-staging.loadbalancer.server.port=8000"
      # unhealthy déclenche un restart (#5610) — voir le service `autoheal`.
      - "autoheal=true"

  # Autoheal — restaure un conteneur `unhealthy` (#5610).
  autoheal-staging:
    image: willfarrell/autoheal:latest
    container_name: meeshy-autoheal-staging
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ===========================================================================
  # GATEWAY STAGING - API Service
  # ===========================================================================
  gateway-staging:
    image: ${GATEWAY_IMAGE:-isopen/meeshy-gateway:staging}
    container_name: meeshy-gateway-staging
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-MONGODB}
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - TRANSLATOR_URL=http://translator-staging:8000
      - ZMQ_PUSH_URL=tcp://translator-staging:5555
      - ZMQ_SUB_URL=tcp://translator-staging:5558
      - ZMQ_TRANSLATOR_HOST=translator-staging
      - ZMQ_TRANSLATOR_PUSH_PORT=5555
      - ZMQ_TRANSLATOR_SUB_PORT=5558
      - NODE_ENV=production
      - DOMAIN=staging.${DOMAIN:-meeshy.me}
      - CORS_ORIGINS=https://staging.${DOMAIN:-meeshy.me},https://gate.staging.${DOMAIN:-meeshy.me}
      - ALLOWED_ORIGINS=https://staging.${DOMAIN:-meeshy.me},https://gate.staging.${DOMAIN:-meeshy.me}
      - FRONTEND_URL=https://staging.${DOMAIN:-meeshy.me}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET absente sur l hote. Vide, la passerelle signerait avec un secret publie dans le depot}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - UPLOAD_PATH=/app/uploads
      # Volume DÉDIÉ à la bibliothèque de sons — même règle qu'en prod :
      # surtout PAS sous UPLOAD_PATH (servi sans authentification par nginx).
      # Sans UPLOAD_DIR ni volume, l'image écrirait les sons dans un
      # /app/sounds éphémère et les perdrait à chaque recréation du conteneur.
      - UPLOAD_DIR=/app/sounds
      - SOUND_LIBRARY_ENABLED=true
      - PUBLIC_URL=https://gate.staging.${DOMAIN:-meeshy.me}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_SERVERS=${TURN_SERVERS:-}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-86400}
      - MAX_TRANSLATION_LENGTH=10000
      # Variables d'initialisation
      - FORCE_DB_RESET=${FORCE_DB_RESET:-false}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD absente sur l hote. Vide, le compte ADMIN naitrait avec le mot de passe public admin123}
      - MEESHY_PASSWORD=${MEESHY_PASSWORD:?MEESHY_PASSWORD absente sur l hote. Vide, le compte BIGBOSS naitrait avec le mot de passe public bigboss123}
      - ATABETH_PASSWORD=${ATABETH_PASSWORD:?ATABETH_PASSWORD absente sur l hote. Vide, le compte naitrait avec le mot de passe public admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MEESHY_EMAIL=${MEESHY_EMAIL}
      - ATABETH_EMAIL=${ATABETH_EMAIL}
      - ADMIN_SYSTEM_LANGUAGE=${ADMIN_SYSTEM_LANGUAGE}
      - ADMIN_REGIONAL_LANGUAGE=${ADMIN_REGIONAL_LANGUAGE}
      - ADMIN_CUSTOM_DESTINATION_LANGUAGE=${ADMIN_CUSTOM_DESTINATION_LANGUAGE}
      - MEESHY_SYSTEM_LANGUAGE=${MEESHY_SYSTEM_LANGUAGE}
      - MEESHY_REGIONAL_LANGUAGE=${MEESHY_REGIONAL_LANGUAGE}
      - MEESHY_CUSTOM_DESTINATION_LANGUAGE=${MEESHY_CUSTOM_DESTINATION_LANGUAGE}
      - ATABETH_USERNAME=${ATABETH_USERNAME}
      - ATABETH_FIRST_NAME=${ATABETH_FIRST_NAME}
      - ATABETH_LAST_NAME=${ATABETH_LAST_NAME}
      - ATABETH_ROLE=${ATABETH_ROLE}
      - ATABETH_SYSTEM_LANGUAGE=${ATABETH_SYSTEM_LANGUAGE}
      - ATABETH_REGIONAL_LANGUAGE=${ATABETH_REGIONAL_LANGUAGE}
      - ATABETH_CUSTOM_DESTINATION_LANGUAGE=${ATABETH_CUSTOM_DESTINATION_LANGUAGE}
      - FIREBASE_ADMIN_CREDENTIALS_PATH=/app/secrets/firebase-admin-sdk.json
      - ATTACHMENT_MASTER_KEY=${ATTACHMENT_MASTER_KEY}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
    volumes:
      - gateway_staging_uploads:/app/uploads
      - gateway_staging_sounds:/app/sounds
      - ./secrets/firebase-admin-sdk.json:/app/secrets/firebase-admin-sdk.json:ro
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.gateway-staging.rule=Host(`gate.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.gateway-staging.middlewares=rate-limit@file,compress@file"
      - "traefik.http.routers.gateway-staging.entrypoints=websecure"
      - "traefik.http.routers.gateway-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway-staging.loadbalancer.server.port=3000"

  # ===========================================================================
  # STATIC FILES STAGING - Nginx
  # ===========================================================================
  static-files-staging:
    image: nginx:alpine
    container_name: meeshy-static-files-staging
    restart: unless-stopped
    volumes:
      - frontend_staging_uploads:/usr/share/nginx/html/u:ro
      - gateway_staging_uploads:/usr/share/nginx/html/uploads:ro
      - ./config/nginx/static-files.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.static-staging.rule=Host(`static.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.static-staging.middlewares=compress@file"
      - "traefik.http.routers.static-staging.entrypoints=websecure"
      - "traefik.http.routers.static-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.static-staging.loadbalancer.server.port=80"

  # ===========================================================================
  # FRONTEND STAGING - la v3.1, servie en STATIQUE (nginx)
  # ===========================================================================
  # **UN SEUL frontend sur staging, et c'est la v3.1** (directive porteur
  # 2026-09-07). Deux conteneurs y vivaient : `meeshy-frontend-staging`
  # (`isopen/meeshy-web:staging`, le legacy) et `meeshy-frontend-v3-staging`
  # (`isopen/meeshy-web-v3:staging`, l'ancienne refonte). Cette dernière est
  # ANNULÉE et ne reçoit plus rien (§ GEL DE LA V3 du CLAUDE.md racine) : la
  # garder déployée occupait un port, une règle Traefik de vingt chemins et une
  # place dans chaque diagnostic, pour servir du code que personne ne modifie
  # plus.
  #
  # La v3.1 (`apps/web-v3`) est le SEUL chantier web. `docker.yml` construit
  # déjà son image (`meeshy-web-v31`) et la tague `staging` sur `dev` : il ne
  # manquait que ce raccordement pour qu'elle soit SERVIE. Une image construite
  # et déployée nulle part est un build qui ne prouve rien.
  #
  # **Ce que la bascule coûte, et il faut le dire** : `staging.meeshy.me` ne
  # sert plus le legacy. Les 80 routes d'`apps/web` n'y sont plus éprouvables —
  # elles restent servies en PRODUCTION (`meeshy-frontend`), qui garde son
  # image `isopen/meeshy-web:latest`. Un correctif d'incident sur le legacy se
  # valide donc en local (`docker-compose.local.yml`), plus sur staging.
  #
  # Aucune variable d'environnement : cette image est un bundle Vite servi par
  # nginx, sans rendu à l'exécution et — à ce jour — sans client d'API. Les
  # `NEXT_PUBLIC_*` du legacy y seraient INERTES, et une variable inerte se lit
  # comme une configuration active.
  frontend-staging:
    image: ${FRONTEND_IMAGE:-isopen/meeshy-web-v31:staging}
    container_name: meeshy-frontend-staging
    restart: unless-stopped
    # PAS de `depends_on: gateway-staging`. Le legacy en avait besoin : son
    # rendu serveur appelait la passerelle au démarrage. nginx sert des
    # fichiers — l'y attacher rendrait l'interface indisponible chaque fois que
    # la passerelle est malade, c'est-à-dire précisément quand on veut ouvrir
    # staging pour regarder.
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3400/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.frontend-staging.rule=Host(`staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.frontend-staging.middlewares=compress@file"
      - "traefik.http.routers.frontend-staging.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-staging.loadbalancer.server.port=3400"
      # Plus aucun routeur ne partage la zone : la priorité explicite qui
      # arbitrait avec `frontend-v3-staging` n'a plus d'arbitrage à rendre. Un
      # `priority` laissé là déclarerait une concurrence qui n'existe plus.

  # ===========================================================================
  # AGENT STAGING - Conversation Agent Service
  # ===========================================================================
  agent-staging:
    image: ${AGENT_IMAGE:-isopen/meeshy-agent:staging}
    container_name: meeshy-agent-staging
    restart: unless-stopped
    environment:
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20240620}
      - ZMQ_HOST=0.0.0.0
      - ZMQ_PULL_PORT=5560
      - ZMQ_PUB_PORT=5561
      - NODE_ENV=production
      - PORT=3200
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.agent-staging.rule=Host(`agent.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.agent-staging.entrypoints=websecure"
      - "traefik.http.routers.agent-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.agent-staging.loadbalancer.server.port=3200"

# =============================================================================
# VOLUMES - Tous préfixés "staging" pour isolation
# =============================================================================
volumes:
  database_staging_data:
    name: meeshy-staging-database-data
  database_staging_config:
    name: meeshy-staging-database-config
  redis_staging_data:
    name: meeshy-staging-redis-data
  redis_staging_ui_data:
    name: meeshy-staging-redis-ui-data
  models_staging_data:
    name: meeshy-staging-models-data
  gateway_staging_uploads:
    name: meeshy-staging-gateway-uploads
  gateway_staging_sounds:
    name: meeshy-staging-gateway-sounds
  # Le magasin d'avatars servi en lecture seule par `static-files-staging`.
  # Depuis que le frontend de staging est la v3.1 (nginx statique), il n'a plus
  # d'ÉCRIVAIN : le legacy y déposait `/app/public/u`. Le volume reste déclaré
  # — le retirer détacherait les fichiers déjà là de leur seul lecteur.
  frontend_staging_uploads:
    name: meeshy-staging-web-uploads

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  meeshy-staging-network:
    driver: bridge
    name: meeshy-staging-network
  meeshy-network:
    external: true
    name: meeshy_meeshy-network
