# =============================================================================
# MEESHY - Docker Compose STAGING (*.staging.meeshy.me)
# =============================================================================
# Deployment: /opt/meeshy/staging/
# Isolation: Volumes, domaines et réseau interne séparés de production
# Routing: Traefik PROD route le trafic via le réseau partagé meeshy-network
# Prérequis: Le compose prod doit tourner (Traefik sur ports 80/443)
# =============================================================================
# #10855 — journaux applicatifs dans journald : ils survivent à la recréation
# du conteneur (chaque promotion recrée la passerelle, et json-file part avec
# elle). Durée bornée par /etc/systemd/journald.conf.d/meeshy-retention.conf.
# Lecture : journalctl CONTAINER_NAME=<conteneur> --since "7 days ago"
x-journald-logging: &journald-logging
  driver: journald
  options:
    tag: "{{.Name}}"


services:
  # ===========================================================================
  # DATABASE STAGING - MongoDB Replica Set
  # ===========================================================================
  database-staging:
    image: ${DATABASE_IMAGE:-mongo:8.0}
    container_name: meeshy-database-staging
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --noauth
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-meeshy}
    ports:
      # Debug/migration — lié à 127.0.0.1 uniquement, tunnel SSH/VPN pour
      # atteindre le port depuis l'extérieur (#6255). Publier ce port sans
      # préfixe de loopback exposait MongoDB lui-même (sans authentification,
      # `--noauth` ci-dessus) sur l'internet public si le pare-feu de l'hôte
      # n'était pas explicitement restrictif.
      - "127.0.0.1:27018:27017"
    volumes:
      - database_staging_data:/data/db
      - database_staging_config:/data/configdb
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Replica Set Init (one-shot)
  mongo-init-staging:
    image: ${DATABASE_IMAGE:-mongo:8.0}
    container_name: meeshy-mongo-init-staging
    depends_on:
      database-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
    entrypoint: >
      mongosh --host database-staging:27017 --eval '
        try {
          const status = rs.status();
          print("Replica set already initialized, state: " + status.myState);
        } catch (e) {
          print("Initializing replica set...");
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "database-staging:27017" }]
          });
          print("Replica set initialized!");
        }
      '
    restart: "no"

  # ===========================================================================
  # NOSQLCLIENT STAGING - MongoDB Web UI, accès SSH tunnel/VPN uniquement (#6254)
  # ===========================================================================
  # Même traitement qu'en production (#3640) : jamais routée par Traefik — un
  # opérateur atteint le port loopback via
  # `ssh -L ${MONGO_UI_PORT_STAGING:-8091}:127.0.0.1:${MONGO_UI_PORT_STAGING:-8091} root@meeshy.me`.
  # Défauts décalés de ceux de la production (8081/8082, docker-compose.prod.yml) :
  # les deux composes tournent sur le MÊME hôte (`root@meeshy.me`), et des
  # défauts identiques feraient échouer la publication du second port au démarrage.
  nosqlclient-staging:
    image: mongoclient/mongoclient:latest
    container_name: meeshy-nosqlclient-staging
    restart: unless-stopped
    environment:
      MONGOCLIENT_DEFAULT_CONNECTION_URL: "mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true"
      ROOT_URL: "http://localhost:${MONGO_UI_PORT_STAGING:-8091}"
      PORT: 3000
    ports:
      - "127.0.0.1:${MONGO_UI_PORT_STAGING:-8091}:3000"
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # REDIS STAGING
  # ===========================================================================
  redis-staging:
    image: redis:8-alpine
    container_name: meeshy-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Debug — lié à 127.0.0.1 uniquement, tunnel SSH/VPN pour atteindre le
      # port depuis l'extérieur (#6255). Publier ce port sans préfixe de
      # loopback exposait Redis lui-même sur l'internet public si le
      # pare-feu de l'hôte n'était pas explicitement restrictif.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # P3X REDIS UI STAGING - accès SSH tunnel/VPN uniquement (#6254)
  # ===========================================================================
  # Même traitement qu'en production (#3640) : jamais routée par Traefik — un
  # opérateur atteint le port loopback via
  # `ssh -L ${REDIS_UI_PORT_STAGING:-8092}:127.0.0.1:${REDIS_UI_PORT_STAGING:-8092} root@meeshy.me`.
  # Défaut décalé de celui de la production (8082, docker-compose.prod.yml) :
  # les deux composes tournent sur le MÊME hôte (`root@meeshy.me`).
  p3x-redis-ui-staging:
    image: patrikx3/p3x-redis-ui:latest
    container_name: meeshy-p3x-redis-ui-staging
    restart: unless-stopped
    environment:
      - P3X_REDIS_UI_SETTINGS={"hostname":"redis-staging","port":6379,"password":"","database":0}
      - P3X_REDIS_UI_HTTP_PORT=7843
      - P3XRS_SETTINGS_PATH=/settings
    ports:
      - "127.0.0.1:${REDIS_UI_PORT_STAGING:-8092}:7843"
    volumes:
      - redis_staging_ui_data:/settings
    depends_on:
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
    healthcheck:
      # `netstat` n'est pas dans l'image (#10425) : `node` y est, il ouvre le port.
      test: ["CMD", "node", "-e", "require('net').connect(7843, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # TRANSLATOR STAGING - ML Service
  # ===========================================================================
  translator-staging:
    image: ${TRANSLATOR_IMAGE:-isopen/meeshy-translator:staging}
    container_name: meeshy-translator-staging
    restart: unless-stopped
    logging: *journald-logging
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-MONGODB}
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - PRISMA_SCHEMA_PATH=/workspace/shared/prisma/schema.prisma
      - PYTHONPATH=/workspace:/workspace/generated
      - PYTHONUNBUFFERED=1
      - NODE_ENV=production
      - HF_HOME=/workspace/models/huggingface
      - TRANSFORMERS_CACHE=/workspace/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - PYANNOTE_CACHE=/workspace/models/pyannote
      - HF_TOKEN=${HF_TOKEN:-}
      - MAX_MESSAGE_LENGTH=10000
      - MAX_TEXT_LENGTH=100000
      - MAX_TRANSLATION_LENGTH=100000
      - MAX_TEXT_ATTACHMENT_THRESHOLD=100000
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-true}
      - DIARIZATION_MODE=${DIARIZATION_MODE:-auto}
      - AUDIO_PROCESS_CONCURRENCY=${AUDIO_PROCESS_CONCURRENCY:-2}
    volumes:
      - models_staging_data:/workspace/models
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      # /live = liveness instantané (cf. prod) — évite le flapping unhealthy sous charge ML.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # L'API ML n'a AUCUN routage public (#9662, incident du 2026-10-08) : 44
    # routes sans authentification, dont /api/v1/admin/*, /debug/clear-cache et
    # la bascule de modèle TTS. Aucun client ne l'appelle par ml.staging : la
    # passerelle la joint par `translator-staging:8000` et ZMQ, sur le réseau
    # interne. Sonde : `docker exec meeshy-translator-staging … /health`.
    labels:
      - "traefik.enable=false"
      # unhealthy déclenche un restart (#5610) — voir le service `autoheal-staging`.
      # Étiquette PROPRE au staging (#10425) : l'autoheal de production lit `autoheal`.
      - "autoheal-staging=true"

  # Autoheal — restaure un conteneur `unhealthy` (#5610). Le démon Docker est
  # PARTAGÉ avec la production (#9232) : il ne lit que l'étiquette du staging,
  # jamais `autoheal`, celle de la production (#10425).
  autoheal-staging:
    image: willfarrell/autoheal:latest
    container_name: meeshy-autoheal-staging
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal-staging
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ===========================================================================
  # GATEWAY STAGING - API Service
  # ===========================================================================
  # ===========================================================================
  # COTURN STAGING — relais TURN/STUN, joignable sur 443 (#11278)
  # ===========================================================================
  # La production le tient en réseau HÔTE sur 3478, 3479, 5349 et toute la
  # plage 49152-65535 du même serveur physique (#9232) : le staging tourne en
  # bridge et publie ses propres ports — 3480 (UDP/TCP) et le relais
  # 40000-40099/udp —, avec SON secret (`TURN_SECRET` du .env de staging, celui
  # que signe gateway-staging).
  #
  # Le 443 : un routeur TCP du Traefik partagé, `HostSNI(turn.staging.<domaine>)`
  # sur `websecure`, TERMINE le TLS (certificat Let's Encrypt de Traefik) et
  # relaie du TURN-sur-TCP en clair vers le 3478 du conteneur. coturn n'a donc
  # ni certificat ni clé : aucun secret de la production ne lui est monté. Le
  # client voit un relais `relayProtocol=tls` sur 443, ce que laisse passer un
  # pare-feu qui n'ouvre que le web. Les autres routeurs de `websecure` ne sont
  # pas touchés : un routeur TCP ne capte que SON nom SNI, et Traefik répond
  # lui-même au défi ACME TLS-ALPN avant tout routage TCP.
  #
  # Démarrage à la main, une fois (le déploiement de la CI ne relance que les
  # services applicatifs) : DNS `turn.staging.<domaine>` → l'hôte, pare-feu de
  # l'hôte ouvert sur 3480/udp, 3480/tcp et 40000-40099/udp,
  # `TURN_EXTERNAL_IP` posée dans le .env de staging, puis
  # `docker compose up -d coturn-staging gateway-staging`.
  coturn-staging:
    image: coturn/coturn:4.6
    container_name: meeshy-coturn-staging
    restart: unless-stopped
    logging: *journald-logging
    volumes:
      - ../../config/turnserver.staging.conf:/etc/turnserver.template.conf:ro
    environment:
      - TURN_SECRET=${TURN_SECRET}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -z "$$TURN_SECRET" ] || [ "$$TURN_SECRET" = "__TURN_SECRET__" ] || [ "$$TURN_SECRET" = "meeshy-turn-secret-CHANGE-IN-PRODUCTION" ]; then
          echo "[FATAL] TURN_SECRET must be set to the staging gateway's strong, non-default secret before starting coturn." >&2
          exit 1
        fi
        if [ -z "$$TURN_EXTERNAL_IP" ]; then
          echo "[FATAL] TURN_EXTERNAL_IP must carry the host's public IP: in bridge mode coturn would otherwise announce its container address as relay." >&2
          exit 1
        fi
        sed -e "s|__TURN_SECRET__|$$TURN_SECRET|g" -e "s|__TURN_EXTERNAL_IP__|$$TURN_EXTERNAL_IP|g" /etc/turnserver.template.conf > /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf
    ports:
      - "3480:3478/udp"
      - "3480:3478/tcp"
      - "40000-40099:40000-40099/udp"
    networks:
      - meeshy-network
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.tcp.routers.turn-staging.rule=HostSNI(`turn.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.tcp.routers.turn-staging.entrypoints=websecure"
      - "traefik.tcp.routers.turn-staging.tls=true"
      - "traefik.tcp.routers.turn-staging.tls.certresolver=letsencrypt"
      - "traefik.tcp.routers.turn-staging.service=turn-staging"
      - "traefik.tcp.services.turn-staging.loadbalancer.server.port=3478"

  gateway-staging:
    image: ${GATEWAY_IMAGE:-isopen/meeshy-gateway:staging}
    container_name: meeshy-gateway-staging
    restart: unless-stopped
    logging: *journald-logging
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-MONGODB}
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - TRANSLATOR_URL=http://translator-staging:8000
      - ZMQ_PUSH_URL=tcp://translator-staging:5555
      - ZMQ_SUB_URL=tcp://translator-staging:5558
      - ZMQ_TRANSLATOR_HOST=translator-staging
      - ZMQ_TRANSLATOR_PUSH_PORT=5555
      - ZMQ_TRANSLATOR_SUB_PORT=5558
      - NODE_ENV=production
      - DOMAIN=staging.${DOMAIN:-meeshy.me}
      # #11261 — rendu H.264 de compatibilité d'une vidéo HEVC (HDR mappé en SDR
      # BT.709), l'original intact. Staging seulement : la production attend la
      # mesure CPU de S2 (#9232, serveur partagé).
      - VIDEO_COMPAT_RENDITION=true
      # Les deux origines VIRTUELLES des coques Capacitor de web-v2 (#5815) — iOS
      # `capacitor://localhost` (`CAPInstanceDescriptor.m`), Android `https://localhost`
      # (`CapConfig.java`, `androidScheme: https`). Gardées par `cors-origins.test.ts`.
      # Jamais dans `DEFAULT_ALLOWED_ORIGINS`.
      - CORS_ORIGINS=https://staging.${DOMAIN:-meeshy.me},https://gate.staging.${DOMAIN:-meeshy.me},capacitor://localhost,https://localhost
      - ALLOWED_ORIGINS=https://staging.${DOMAIN:-meeshy.me},https://gate.staging.${DOMAIN:-meeshy.me},capacitor://localhost,https://localhost
      - FRONTEND_URL=https://staging.${DOMAIN:-meeshy.me}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET absente sur l hote. Vide, la passerelle signerait avec un secret publie dans le depot}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - UPLOAD_PATH=/app/uploads
      # Volume DÉDIÉ à la bibliothèque de sons — même règle qu'en prod :
      # surtout PAS sous UPLOAD_PATH (servi sans authentification par nginx
      # jusqu'à #11256 : rester hors de cet arbre garde d'un remontage futur).
      # Sans UPLOAD_DIR ni volume, l'image écrirait les sons dans un
      # /app/sounds éphémère et les perdrait à chaque recréation du conteneur.
      - UPLOAD_DIR=/app/sounds
      - SOUND_LIBRARY_ENABLED=true
      - PUBLIC_URL=https://gate.staging.${DOMAIN:-meeshy.me}
      - TURN_SECRET=${TURN_SECRET}
      # #11278 — le relais de coturn-staging : TURN en clair sur 3480, TLS sur
      # 443 par le routeur TCP de Traefik ; aucun 5349 au staging.
      - TURN_SERVERS=${TURN_SERVERS:-turn.staging.${DOMAIN:-meeshy.me}:3480}
      - TURN_TLS_SERVERS=${TURN_TLS_SERVERS:-turn.staging.${DOMAIN:-meeshy.me}:443}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-0}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-86400}
      - MAX_TRANSLATION_LENGTH=10000
      # Lecture exacte (#7356) : un message créé après cette date n'est servi
      # « lu » que si le lecteur l'a AFFICHÉ (readAt gelé). Forme `-` et non
      # `:-` : l'hôte désarme sans nouvelle image en posant la variable VIDE,
      # ou déplace la bascule en posant une autre date ISO 8601.
      - EXACT_READ_TRACKING_SINCE=${EXACT_READ_TRACKING_SINCE-2026-09-22T00:00:00.000Z}
      # Liste des vues enrichie (#9727) : un post ou un réel ne montre à son
      # auteur que les vues et les partages par lien postérieurs à cette date
      # (les stories gardent tout leur historique). La fixer à la date de
      # PROMOTION EN PRODUCTION. Illisible => rien du passé n'est montré.
      - VIEWER_ACTIVITY_DISCLOSED_SINCE=${VIEWER_ACTIVITY_DISCLOSED_SINCE:-2026-10-10T00:00:00.000Z}
      # Conservation du brut de lecture (PostImpression, PostEngagement), en
      # jours — décision porteur #10510 : 25 mois par défaut. Illisible => défaut.
      - RAW_READING_RETENTION_DAYS=${RAW_READING_RETENTION_DAYS:-760}
      # Variables d'initialisation
      - FORCE_DB_RESET=${FORCE_DB_RESET:-false}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD absente sur l hote. Vide, le compte ADMIN naitrait avec le mot de passe public admin123}
      - MEESHY_PASSWORD=${MEESHY_PASSWORD:?MEESHY_PASSWORD absente sur l hote. Vide, le compte BIGBOSS naitrait avec le mot de passe public bigboss123}
      - ATABETH_PASSWORD=${ATABETH_PASSWORD:?ATABETH_PASSWORD absente sur l hote. Vide, le compte naitrait avec le mot de passe public admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MEESHY_EMAIL=${MEESHY_EMAIL}
      - ATABETH_EMAIL=${ATABETH_EMAIL}
      # World Wide (#10000) : le staging seme le salon public ; WORLD_ADMIN_EMAILS designe ses administrateurs par adresse verifiee.
      - WORLD_SEED_ENABLED=${WORLD_SEED_ENABLED:-true}
      - WORLD_ADMIN_EMAILS=${WORLD_ADMIN_EMAILS:-}
      # Packs d'EXEMPLE (#10157, demande porteur 2026-10-11) : le registre
      # packages/shared/design/packs/samples/ n'est lu QUE sous la valeur exacte 1.
      # Staging seulement — JAMAIS en production (rien de fictif devant les utilisateurs).
      - PACK_SAMPLES=1
      - ADMIN_SYSTEM_LANGUAGE=${ADMIN_SYSTEM_LANGUAGE}
      - ADMIN_REGIONAL_LANGUAGE=${ADMIN_REGIONAL_LANGUAGE}
      - ADMIN_CUSTOM_DESTINATION_LANGUAGE=${ADMIN_CUSTOM_DESTINATION_LANGUAGE}
      - MEESHY_SYSTEM_LANGUAGE=${MEESHY_SYSTEM_LANGUAGE}
      - MEESHY_REGIONAL_LANGUAGE=${MEESHY_REGIONAL_LANGUAGE}
      - MEESHY_CUSTOM_DESTINATION_LANGUAGE=${MEESHY_CUSTOM_DESTINATION_LANGUAGE}
      - ATABETH_USERNAME=${ATABETH_USERNAME}
      - ATABETH_FIRST_NAME=${ATABETH_FIRST_NAME}
      - ATABETH_LAST_NAME=${ATABETH_LAST_NAME}
      - ATABETH_ROLE=${ATABETH_ROLE}
      - ATABETH_SYSTEM_LANGUAGE=${ATABETH_SYSTEM_LANGUAGE}
      - ATABETH_REGIONAL_LANGUAGE=${ATABETH_REGIONAL_LANGUAGE}
      - ATABETH_CUSTOM_DESTINATION_LANGUAGE=${ATABETH_CUSTOM_DESTINATION_LANGUAGE}
      - FIREBASE_ADMIN_CREDENTIALS_PATH=/app/secrets/firebase-admin-sdk.json
      - ATTACHMENT_MASTER_KEY=${ATTACHMENT_MASTER_KEY}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
      # Chiffrement au repos des secrets de configuration (clé d'API LLM de
      # l'agent) — 32 octets base64. Absente : l'écriture d'une clé est refusée.
      - SECRETS_AT_REST_KEY=${SECRETS_AT_REST_KEY}
      # #9600 — adresses de fichier signées par lecteur. Clé HMAC de 32 octets
      # base64, PROPRE à cet environnement ; absente : rien n'est signé (l'adresse
      # d'avant reste servie). La précédente ne sert qu'à vérifier pendant une
      # rotation. La bascule de refus ne se pose qu'à zéro usage mesuré.
      - ATTACHMENT_URL_SIGNING_KEY=${ATTACHMENT_URL_SIGNING_KEY:-}
      - ATTACHMENT_URL_SIGNING_KEY_PREVIOUS=${ATTACHMENT_URL_SIGNING_KEY_PREVIOUS:-}
      - ATTACHMENT_URL_SIGNATURE_ENFORCE=${ATTACHMENT_URL_SIGNATURE_ENFORCE:-false}
      # #10483 — clé HMAC des lecteurs SANS compte (vues et impressions anonymes) :
      # seule l'empreinte du jeton est stockée. PROPRE à cet environnement ; sans
      # elle la passerelle refuse de démarrer (fail-closed). La changer recompte
      # chaque lecteur anonyme : ne pas la faire tourner.
      - READER_KEY_HMAC_SECRET=${READER_KEY_HMAC_SECRET:?READER_KEY_HMAC_SECRET absente sur l hote. Generer avec openssl rand -hex 32}
      # #10499 — clé des EMPREINTES de recherche (searchId scellé AES-256-GCM, clés
      # dérivées par HKDF). PROPRE à cet environnement. Absente : la passerelle
      # démarre, la recherche répond, mais aucune empreinte n'est calculée — d'où
      # `:-` et non `:?`, pour ne pas bloquer un déploiement avant qu'elle soit
      # posée sur l'hôte. La faire tourner rend les anciennes empreintes muettes.
      - SEARCH_FINGERPRINT_SECRET=${SEARCH_FINGERPRINT_SECRET:-}
      # L'AGENT de staging (#10269) — `server.ts` n'initialise son client que si
      # `AGENT_HOST` est posée : sans elle, `agent-staging` tourne pour personne
      # (« AGENT_HOST not set — agent service disabled »), sans rien rougir.
      - AGENT_HOST=agent-staging
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:-}
      # E-mails de staging (#8036) — de VRAIS envois, marqués « [STAGING] » au
      # sujet et d'un bandeau dans le corps (`services/email/staging-marker.ts`).
      # Sans BREVO_API_KEY sur l'hôte, rien ne part (la passerelle le journalise).
      - MEESHY_ENV=staging
      # #9614, #9642 — la purge de conservation (sessions closes 90 j, journaux
      # 12 mois, adresses d'inscription et de connexion 12 mois). ARMÉE par la
      # seule valeur exacte true ; sinon elle compte et journalise sans écrire.
      # Réarmée en staging après le correctif de l'audit A2-1 (ban lu par
      # unsetOrNull('liftedAt'), témoin sur documents Mongo vert). Production :
      # toujours désarmée, feu vert du porteur et sauvegarde vérifiée d'abord.
      - RETENTION_PURGE_ENABLED=${RETENTION_PURGE_ENABLED:-true}
      # #10175 (L19) — le push d'une étape du jeu franchie app fermée : détection, ligne de
      # base et UNE notification groupée par jour au plus. ARMÉ par la seule valeur exacte on ;
      # toute autre valeur, absence comprise, le laisse éteint (relu à chaque passage du job).
      # Staging : allumé pour la recette.
      - GAME_PHOTO_PUSH=${GAME_PHOTO_PUSH:-on}
      # #9668 — le verdict de la sauvegarde nocturne (etat.json), lu par la carte
      # « Sauvegardes » de la supervision et contrôlé chaque jour à 5 h, heure de Paris :
      # un échec, une sauvegarde de plus de 26 h ou un verdict absent notifient les
      # ADMIN et BIGBOSS et écrivent au BIGBOSS. Seule la valeur exacte true arme le contrôle.
      # Staging : la sauvegarde tourne chaque nuit à 2 h 30 (meeshy-staging-backup.timer,
      # #10385) et sur demande d'un BIGBOSS ; le contrôle s'arme par
      # BACKUP_STATUS_ALERTS_ENABLED=true dans le .env de l'hôte.
      - BACKUP_STATUS_FILE=/backup-status/etat.json
      - BACKUP_STATUS_ALERTS_ENABLED=${BACKUP_STATUS_ALERTS_ENABLED:-false}
      # #10460 — l'heure du timer de staging : la carte « Sauvegardes » annonce la
      # prochaine sauvegarde à 2 h 30, pas à minuit (l'heure de la production).
      - BACKUP_RUN_TIME=02:30
      # #10384–#10386 — les opérations serveur de l'administration : métriques de l'hôte
      # (/proc et statfs sur HOST_DISK_PROBE_PATH), et demandes de sauvegarde / purge des
      # images DÉPOSÉES dans OPS_REQUESTS_DIR pour le runner de l'hôte
      # (infrastructure/scripts/ops-runner/, installé par son install.sh), qui publie son
      # état dans OPS_STATE_DIR, monté en lecture seule. La passerelle n'a ni socket Docker
      # ni systemd. Hôte partagé avec la production : OPS_SHARED_HOST=true.
      - OPS_ENVIRONMENT=staging
      - OPS_SHARED_HOST=true
      - OPS_REQUESTS_DIR=/ops-requests
      - OPS_STATE_DIR=/ops-state
      - HOST_DISK_PROBE_PATH=/
      - EMAIL_FROM=${EMAIL_FROM:-noreply@meeshy.me}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Meeshy Staging}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
    volumes:
      - gateway_staging_uploads:/app/uploads
      - gateway_staging_sounds:/app/sounds
      - ./secrets/firebase-admin-sdk.json:/app/secrets/firebase-admin-sdk.json:ro
      # #9609 — base de géolocalisation LOCALE (DB-IP Lite), tenue à jour sur l'hôte
      # par infrastructure/scripts/geoip-update-dbip.sh ; lecture seule, jamais dans l'image.
      - ${GEOIP_HOST_DIR:-/opt/meeshy/geoip}:/app/geoip:ro
      # #9668 — le SEUL dossier du verdict de sauvegarde, en lecture seule : la passerelle
      # ne voit jamais les sauvegardes elles-mêmes (/opt/meeshy/backups/nightly).
      - ${BACKUP_STATUS_HOST_DIR:-/opt/meeshy/staging/backup-status}:/backup-status:ro
      # #10385, #10386 — les demandes d'opérations (écrites par la passerelle, uid 1001)
      # et l'état publié par le runner de l'hôte (lecture seule).
      - /opt/meeshy/staging/ops/requests:/ops-requests
      - /opt/meeshy/staging/ops/state:/ops-state:ro
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.gateway-staging.rule=Host(`gate.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.gateway-staging.middlewares=rate-limit@file,compress@file"
      - "traefik.http.routers.gateway-staging.entrypoints=websecure"
      - "traefik.http.routers.gateway-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gateway-staging.service=gateway-staging"
      # #9600 — l'adresse signée d'un fichier protégé porte dans son CHEMIN un
      # jeton qui suffit à lire les octets : son routeur propre (plus spécifique,
      # donc prioritaire) ne l'écrit pas au journal d'accès du Traefik partagé.
      - "traefik.http.routers.gateway-staging-signed-files.rule=Host(`gate.staging.${DOMAIN:-meeshy.me}`) && PathPrefix(`/api/v1/attachments/signed/`)"
      - "traefik.http.routers.gateway-staging-signed-files.middlewares=rate-limit@file,compress@file"
      - "traefik.http.routers.gateway-staging-signed-files.entrypoints=websecure"
      - "traefik.http.routers.gateway-staging-signed-files.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gateway-staging-signed-files.service=gateway-staging"
      - "traefik.http.routers.gateway-staging-signed-files.observability.accessLogs=false"
      # #9712 — les ROBOTS d'aperçu (WhatsApp, iMessage, Telegram, Messenger, Slack,
      # X…) qui déplient /chat/<lien> reçoivent la page d'aperçu de la passerelle
      # (GET /api/v1/links/<lien>/og) : la coquille de l'application ne porte aucune
      # balise Open Graph et un robot n'exécute pas de JavaScript. Les humains, dont
      # aucun navigateur ne s'annonce ainsi, restent sur le routeur de l'application ;
      # `open=1` (le lien du corps de la page) en sort qui s'y serait trouvé pris.
      # `$$` : un dollar littéral pour Compose (les regex et `$$1`).
      - "traefik.http.routers.frontend-staging-unfurl.rule=Host(`staging.${DOMAIN:-meeshy.me}`) && PathRegexp(`^/chat/[A-Za-z0-9_.-]{1,100}/?$$`) && !Query(`open`, `1`) && HeaderRegexp(`User-Agent`, `(?i)(facebookexternalhit|facebot|whatsapp|twitterbot|slackbot|telegrambot|discordbot|linkedinbot|skypeuripreview|embedly|iframely|redditbot|pinterestbot|vkshare|mastodon|bluesky|cardyb|google-pagerenderer|kakaotalk-scrap|bitlybot|mattermost|synapse)`)"
      - "traefik.http.routers.frontend-staging-unfurl.priority=100"
      - "traefik.http.routers.frontend-staging-unfurl.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging-unfurl.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-staging-unfurl.middlewares=chat-unfurl-staging-path,rate-limit@file,compress@file"
      - "traefik.http.routers.frontend-staging-unfurl.service=gateway-staging"
      - "traefik.http.middlewares.chat-unfurl-staging-path.replacepathregex.regex=^/chat/([A-Za-z0-9_.-]{1,100})/?$$"
      - "traefik.http.middlewares.chat-unfurl-staging-path.replacepathregex.replacement=/api/v1/links/$$1/og"
      # #10192 — les mêmes robots qui déplient un lien SUIVI /l/<jeton> reçoivent
      # l'aperçu de sa cible publique (GET /api/v1/tracking-links/<jeton>/og) : une
      # adresse web extérieure d'un lien actif les y renvoie, une invitation ouverte
      # se déplie, tout le reste rend l'aperçu générique. Sans ce routeur, nginx sert
      # l'aperçu générique de la famille `link` (apps/web/nginx.conf, D-199).
      - "traefik.http.routers.frontend-staging-track-unfurl.rule=Host(`staging.${DOMAIN:-meeshy.me}`) && PathRegexp(`^/l/[A-Za-z0-9_-]{2,50}/?$$`) && !Query(`open`, `1`) && HeaderRegexp(`User-Agent`, `(?i)(facebookexternalhit|facebot|whatsapp|twitterbot|slackbot|telegrambot|discordbot|linkedinbot|skypeuripreview|embedly|iframely|redditbot|pinterestbot|vkshare|mastodon|bluesky|cardyb|google-pagerenderer|kakaotalk-scrap|bitlybot|mattermost|synapse)`)"
      - "traefik.http.routers.frontend-staging-track-unfurl.priority=100"
      - "traefik.http.routers.frontend-staging-track-unfurl.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging-track-unfurl.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-staging-track-unfurl.middlewares=track-unfurl-staging-path,rate-limit@file,compress@file"
      - "traefik.http.routers.frontend-staging-track-unfurl.service=gateway-staging"
      - "traefik.http.middlewares.track-unfurl-staging-path.replacepathregex.regex=^/l/([A-Za-z0-9_-]{2,50})/?$$"
      - "traefik.http.middlewares.track-unfurl-staging-path.replacepathregex.replacement=/api/v1/tracking-links/$$1/og"
      # #10559 — les mêmes robots qui déplient un lien d'AFFILIATION /signup/affiliate/<jeton>
      # reçoivent l'aperçu de celui qui invite (GET /api/v1/affiliate/<jeton>/og) : son nom,
      # son pseudo, sa bannière sinon son avatar ; un jeton fermé rend l'aperçu générique.
      - "traefik.http.routers.frontend-staging-affiliate-unfurl.rule=Host(`staging.${DOMAIN:-meeshy.me}`) && PathRegexp(`^/signup/affiliate/[A-Za-z0-9_-]{2,100}/?$$`) && !Query(`open`, `1`) && HeaderRegexp(`User-Agent`, `(?i)(facebookexternalhit|facebot|whatsapp|twitterbot|slackbot|telegrambot|discordbot|linkedinbot|skypeuripreview|embedly|iframely|redditbot|pinterestbot|vkshare|mastodon|bluesky|cardyb|google-pagerenderer|kakaotalk-scrap|bitlybot|mattermost|synapse)`)"
      - "traefik.http.routers.frontend-staging-affiliate-unfurl.priority=100"
      - "traefik.http.routers.frontend-staging-affiliate-unfurl.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging-affiliate-unfurl.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-staging-affiliate-unfurl.middlewares=affiliate-unfurl-staging-path,rate-limit@file,compress@file"
      - "traefik.http.routers.frontend-staging-affiliate-unfurl.service=gateway-staging"
      - "traefik.http.middlewares.affiliate-unfurl-staging-path.replacepathregex.regex=^/signup/affiliate/([A-Za-z0-9_-]{2,100})/?$$"
      - "traefik.http.middlewares.affiliate-unfurl-staging-path.replacepathregex.replacement=/api/v1/affiliate/$$1/og"
      - "traefik.http.services.gateway-staging.loadbalancer.server.port=3000"

  # ===========================================================================
  # STATIC FILES STAGING - Nginx
  # ===========================================================================
  static-files-staging:
    image: nginx:alpine
    container_name: meeshy-static-files-staging
    restart: unless-stopped
    volumes:
      # Les uploads de la passerelle ne sont PLUS montés ici (#11256) : seule
      # la passerelle les sert. Garde : media-uploads-never-public.test.ts.
      - frontend_staging_uploads:/usr/share/nginx/html/u:ro
      - ./config/nginx/static-files.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.static-staging.rule=Host(`static.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.static-staging.middlewares=compress@file"
      - "traefik.http.routers.static-staging.entrypoints=websecure"
      - "traefik.http.routers.static-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.static-staging.loadbalancer.server.port=80"

  # ===========================================================================
  # FRONTEND STAGING - la v3.1, servie en STATIQUE (nginx)
  # ===========================================================================
  # **UN SEUL frontend sur staging, et c'est la v3.1** (directive porteur
  # 2026-09-07). Deux conteneurs y vivaient : `meeshy-frontend-staging`
  # (`isopen/meeshy-web:staging`, le legacy) et celui de l'ancienne refonte v3,
  # annulée puis retirée du dépôt (#5994). La garder déployée occupait un port,
  # une règle Traefik de vingt chemins et une place dans chaque diagnostic,
  # pour servir du code que personne ne modifiait plus.
  #
  # La v3.1 (`apps/web-v2`) est le SEUL chantier web. `docker.yml` construit
  # déjà son image (`meeshy-webapp`, ex `meeshy-web-v31`) et la tague `staging` sur `dev` : il ne
  # manquait que ce raccordement pour qu'elle soit SERVIE. Une image construite
  # et déployée nulle part est un build qui ne prouve rien.
  #
  # **Ce que la bascule coûte, et il faut le dire** : `staging.meeshy.me` ne
  # sert plus le legacy. Les 80 routes d'`apps/web` n'y sont plus éprouvables —
  # elles restent servies en PRODUCTION (`meeshy-frontend`), qui garde son
  # image `isopen/meeshy-web:latest`. Un correctif d'incident sur le legacy se
  # valide donc en local (`docker-compose.local.yml`), plus sur staging.
  #
  # Aucune variable d'environnement : cette image est un bundle Vite servi par
  # nginx, sans rendu à l'exécution et — à ce jour — sans client d'API. Les
  # `NEXT_PUBLIC_*` du legacy y seraient INERTES, et une variable inerte se lit
  # comme une configuration active.
  frontend-staging:
    image: ${FRONTEND_IMAGE:-isopen/meeshy-webapp:staging}
    container_name: meeshy-frontend-staging
    restart: unless-stopped
    logging: *journald-logging
    # PAS de `depends_on: gateway-staging`. Le legacy en avait besoin : son
    # rendu serveur appelait la passerelle au démarrage. nginx sert des
    # fichiers — l'y attacher rendrait l'interface indisponible chaque fois que
    # la passerelle est malade, c'est-à-dire précisément quand on veut ouvrir
    # staging pour regarder.
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3400/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.frontend-staging.rule=Host(`staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.frontend-staging.middlewares=compress@file"
      - "traefik.http.routers.frontend-staging.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-staging.loadbalancer.server.port=3400"
      # Plus aucun routeur ne partage la zone : la priorité explicite qui
      # arbitrait avec le conteneur de l'ancienne refonte v3 n'a plus d'arbitrage à rendre. Un
      # `priority` laissé là déclarerait une concurrence qui n'existe plus.

  # ===========================================================================
  # AGENT STAGING - Conversation Agent Service
  # ===========================================================================
  agent-staging:
    image: ${AGENT_IMAGE:-isopen/meeshy-agent:staging}
    container_name: meeshy-agent-staging
    restart: unless-stopped
    logging: *journald-logging
    environment:
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20240620}
      - ZMQ_HOST=0.0.0.0
      - ZMQ_PULL_PORT=5560
      - ZMQ_PUB_PORT=5561
      - NODE_ENV=production
      - PORT=3200
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:-}
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    # Réseau PRIVÉ seulement (#10242) : la passerelle joint l'agent par son nom de
    # service (`agent-staging`, ZMQ 5560/5561 et HTTP 3200) sur
    # meeshy-staging-network. meeshy-network ne servait qu'à Traefik.
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Jamais publié sur Internet, comme en production (#10242) : ses routes
    # /api/agent/* lisent des résumés de conversations, arrêtent un agent et
    # déclenchent des appels LLM payants.
    labels:
      - "traefik.enable=false"

# =============================================================================
# VOLUMES - Tous préfixés "staging" pour isolation
# =============================================================================
volumes:
  database_staging_data:
    name: meeshy-staging-database-data
  database_staging_config:
    name: meeshy-staging-database-config
  redis_staging_data:
    name: meeshy-staging-redis-data
  redis_staging_ui_data:
    name: meeshy-staging-redis-ui-data
  models_staging_data:
    name: meeshy-staging-models-data
  gateway_staging_uploads:
    name: meeshy-staging-gateway-uploads
  gateway_staging_sounds:
    name: meeshy-staging-gateway-sounds
  # Le magasin d'avatars servi en lecture seule par `static-files-staging`.
  # Depuis que le frontend de staging est la v3.1 (nginx statique), il n'a plus
  # d'ÉCRIVAIN : le legacy y déposait `/app/public/u`. Le volume reste déclaré
  # — le retirer détacherait les fichiers déjà là de leur seul lecteur.
  frontend_staging_uploads:
    name: meeshy-staging-web-uploads

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  meeshy-staging-network:
    driver: bridge
    name: meeshy-staging-network
  meeshy-network:
    external: true
    name: meeshy_meeshy-network
