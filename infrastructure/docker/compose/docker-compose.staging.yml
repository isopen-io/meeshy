# =============================================================================
# MEESHY - Docker Compose STAGING (*.staging.meeshy.me)
# =============================================================================
# Deployment: /opt/meeshy/staging/
# Isolation: Volumes, domaines et réseau interne séparés de production
# Routing: Traefik PROD route le trafic via le réseau partagé meeshy-network
# Prérequis: Le compose prod doit tourner (Traefik sur ports 80/443)
# =============================================================================

services:
  # ===========================================================================
  # DATABASE STAGING - MongoDB Replica Set
  # ===========================================================================
  database-staging:
    image: ${DATABASE_IMAGE:-mongo:8.0}
    container_name: meeshy-database-staging
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all --noauth
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-meeshy}
    ports:
      - "27018:27017"  # Exposition externe pour debug/migration
    volumes:
      - database_staging_data:/data/db
      - database_staging_config:/data/configdb
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Replica Set Init (one-shot)
  mongo-init-staging:
    image: ${DATABASE_IMAGE:-mongo:8.0}
    container_name: meeshy-mongo-init-staging
    depends_on:
      database-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
    entrypoint: >
      mongosh --host database-staging:27017 --eval '
        try {
          const status = rs.status();
          print("Replica set already initialized, state: " + status.myState);
        } catch (e) {
          print("Initializing replica set...");
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "database-staging:27017" }]
          });
          print("Replica set initialized!");
        }
      '
    restart: "no"

  # ===========================================================================
  # NOSQLCLIENT STAGING - MongoDB Web UI
  # ===========================================================================
  nosqlclient-staging:
    image: mongoclient/mongoclient:latest
    container_name: meeshy-nosqlclient-staging
    restart: unless-stopped
    environment:
      MONGOCLIENT_DEFAULT_CONNECTION_URL: "mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true"
      ROOT_URL: "https://mongo.staging.${DOMAIN:-meeshy.me}"
      PORT: 3000
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.nosqlclient-staging.rule=Host(`mongo.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.nosqlclient-staging.entrypoints=websecure"
      - "traefik.http.routers.nosqlclient-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.nosqlclient-staging.loadbalancer.server.port=3000"
      - "traefik.http.routers.nosqlclient-staging.middlewares=nosqlclient-staging-auth"
      - "traefik.http.middlewares.nosqlclient-staging-auth.basicauth.users=${MONGO_USERS:-}"

  # ===========================================================================
  # REDIS STAGING
  # ===========================================================================
  redis-staging:
    image: redis:8-alpine
    container_name: meeshy-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"  # Port alternatif pour debug
    volumes:
      - redis_staging_data:/data
    networks:
      - meeshy-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # P3X REDIS UI STAGING
  # ===========================================================================
  p3x-redis-ui-staging:
    image: patrikx3/p3x-redis-ui:latest
    container_name: meeshy-p3x-redis-ui-staging
    restart: unless-stopped
    environment:
      - P3X_REDIS_UI_SETTINGS={"hostname":"redis-staging","port":6379,"password":"","database":0}
      - P3X_REDIS_UI_HTTP_PORT=7843
      - P3XRS_SETTINGS_PATH=/settings
    volumes:
      - redis_staging_ui_data:/settings
    depends_on:
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep :7843 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.p3x-redis-staging.rule=Host(`redis.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.p3x-redis-staging.entrypoints=websecure"
      - "traefik.http.routers.p3x-redis-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.p3x-redis-staging.loadbalancer.server.port=7843"
      - "traefik.http.routers.p3x-redis-staging.middlewares=p3x-redis-staging-auth"
      - "traefik.http.middlewares.p3x-redis-staging-auth.basicauth.users=${REDIS_USERS:-}"

  # ===========================================================================
  # TRANSLATOR STAGING - ML Service
  # ===========================================================================
  translator-staging:
    image: ${TRANSLATOR_IMAGE:-isopen/meeshy-translator:staging}
    container_name: meeshy-translator-staging
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-MONGODB}
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - PRISMA_SCHEMA_PATH=/workspace/shared/prisma/schema.prisma
      - PYTHONPATH=/workspace:/workspace/generated
      - PYTHONUNBUFFERED=1
      - NODE_ENV=production
      - HF_HOME=/workspace/models/huggingface
      - TRANSFORMERS_CACHE=/workspace/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/workspace/models/huggingface
      - TORCH_HOME=/workspace/models/torch
      - PYANNOTE_CACHE=/workspace/models/pyannote
      - HF_TOKEN=${HF_TOKEN:-}
      - MAX_MESSAGE_LENGTH=10000
      - MAX_TEXT_LENGTH=100000
      - MAX_TRANSLATION_LENGTH=100000
      - MAX_TEXT_ATTACHMENT_THRESHOLD=100000
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-true}
    volumes:
      - models_staging_data:/workspace/models
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      # /live = liveness instantané (cf. prod) — évite le flapping unhealthy sous charge ML.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.translator-staging.rule=Host(`ml.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.translator-staging.entrypoints=websecure"
      - "traefik.http.routers.translator-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.translator-staging.loadbalancer.server.port=8000"

  # ===========================================================================
  # GATEWAY STAGING - API Service
  # ===========================================================================
  gateway-staging:
    image: ${GATEWAY_IMAGE:-isopen/meeshy-gateway:staging}
    container_name: meeshy-gateway-staging
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-MONGODB}
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - TRANSLATOR_URL=http://translator-staging:8000
      - ZMQ_PUSH_URL=tcp://translator-staging:5555
      - ZMQ_SUB_URL=tcp://translator-staging:5558
      - ZMQ_TRANSLATOR_HOST=translator-staging
      - ZMQ_TRANSLATOR_PUSH_PORT=5555
      - ZMQ_TRANSLATOR_SUB_PORT=5558
      - NODE_ENV=production
      - DOMAIN=staging.${DOMAIN:-meeshy.me}
      - CORS_ORIGINS=https://staging.${DOMAIN:-meeshy.me},https://gate.staging.${DOMAIN:-meeshy.me}
      - ALLOWED_ORIGINS=https://staging.${DOMAIN:-meeshy.me},https://gate.staging.${DOMAIN:-meeshy.me}
      - FRONTEND_URL=https://staging.${DOMAIN:-meeshy.me}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET absente sur l hote. Vide, la passerelle signerait avec un secret publie dans le depot}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - UPLOAD_PATH=/app/uploads
      # Volume DÉDIÉ à la bibliothèque de sons — même règle qu'en prod :
      # surtout PAS sous UPLOAD_PATH (servi sans authentification par nginx).
      # Sans UPLOAD_DIR ni volume, l'image écrirait les sons dans un
      # /app/sounds éphémère et les perdrait à chaque recréation du conteneur.
      - UPLOAD_DIR=/app/sounds
      - SOUND_LIBRARY_ENABLED=true
      - PUBLIC_URL=https://gate.staging.${DOMAIN:-meeshy.me}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_SERVERS=${TURN_SERVERS:-}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-86400}
      - MAX_TRANSLATION_LENGTH=10000
      # Variables d'initialisation
      - FORCE_DB_RESET=${FORCE_DB_RESET:-false}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD absente sur l hote. Vide, le compte ADMIN naitrait avec le mot de passe public admin123}
      - MEESHY_PASSWORD=${MEESHY_PASSWORD:?MEESHY_PASSWORD absente sur l hote. Vide, le compte BIGBOSS naitrait avec le mot de passe public bigboss123}
      - ATABETH_PASSWORD=${ATABETH_PASSWORD:?ATABETH_PASSWORD absente sur l hote. Vide, le compte naitrait avec le mot de passe public admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MEESHY_EMAIL=${MEESHY_EMAIL}
      - ATABETH_EMAIL=${ATABETH_EMAIL}
      - ADMIN_SYSTEM_LANGUAGE=${ADMIN_SYSTEM_LANGUAGE}
      - ADMIN_REGIONAL_LANGUAGE=${ADMIN_REGIONAL_LANGUAGE}
      - ADMIN_CUSTOM_DESTINATION_LANGUAGE=${ADMIN_CUSTOM_DESTINATION_LANGUAGE}
      - MEESHY_SYSTEM_LANGUAGE=${MEESHY_SYSTEM_LANGUAGE}
      - MEESHY_REGIONAL_LANGUAGE=${MEESHY_REGIONAL_LANGUAGE}
      - MEESHY_CUSTOM_DESTINATION_LANGUAGE=${MEESHY_CUSTOM_DESTINATION_LANGUAGE}
      - ATABETH_USERNAME=${ATABETH_USERNAME}
      - ATABETH_FIRST_NAME=${ATABETH_FIRST_NAME}
      - ATABETH_LAST_NAME=${ATABETH_LAST_NAME}
      - ATABETH_ROLE=${ATABETH_ROLE}
      - ATABETH_SYSTEM_LANGUAGE=${ATABETH_SYSTEM_LANGUAGE}
      - ATABETH_REGIONAL_LANGUAGE=${ATABETH_REGIONAL_LANGUAGE}
      - ATABETH_CUSTOM_DESTINATION_LANGUAGE=${ATABETH_CUSTOM_DESTINATION_LANGUAGE}
      - FIREBASE_ADMIN_CREDENTIALS_PATH=/app/secrets/firebase-admin-sdk.json
      - ATTACHMENT_MASTER_KEY=${ATTACHMENT_MASTER_KEY}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
    volumes:
      - gateway_staging_uploads:/app/uploads
      - gateway_staging_sounds:/app/sounds
      - ./secrets/firebase-admin-sdk.json:/app/secrets/firebase-admin-sdk.json:ro
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.gateway-staging.rule=Host(`gate.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.gateway-staging.middlewares=compress@file"
      - "traefik.http.routers.gateway-staging.entrypoints=websecure"
      - "traefik.http.routers.gateway-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway-staging.loadbalancer.server.port=3000"

  # ===========================================================================
  # STATIC FILES STAGING - Nginx
  # ===========================================================================
  static-files-staging:
    image: nginx:alpine
    container_name: meeshy-static-files-staging
    restart: unless-stopped
    volumes:
      - frontend_staging_uploads:/usr/share/nginx/html/u:ro
      - gateway_staging_uploads:/usr/share/nginx/html/uploads:ro
      - ./config/nginx/static-files.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.static-staging.rule=Host(`static.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.static-staging.middlewares=compress@file"
      - "traefik.http.routers.static-staging.entrypoints=websecure"
      - "traefik.http.routers.static-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.static-staging.loadbalancer.server.port=80"

  # ===========================================================================
  # FRONTEND STAGING - Next.js
  # ===========================================================================
  frontend-staging:
    image: ${FRONTEND_IMAGE:-isopen/meeshy-web:staging}
    container_name: meeshy-frontend-staging
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://gate.staging.${DOMAIN:-meeshy.me}
      - NEXT_PUBLIC_WS_URL=wss://gate.staging.${DOMAIN:-meeshy.me}
      - NEXT_PUBLIC_TRANSLATION_URL=https://ml.staging.${DOMAIN:-meeshy.me}/translate
      - NEXT_PUBLIC_BACKEND_URL=https://gate.staging.${DOMAIN:-meeshy.me}
      - NEXT_PUBLIC_FRONTEND_URL=https://staging.${DOMAIN:-meeshy.me}
      - NEXT_PUBLIC_STATIC_URL=https://static.staging.${DOMAIN:-meeshy.me}
      - NEXT_PUBLIC_DISABLE_CLIENT_TRANSLATION=${NEXT_PUBLIC_DISABLE_CLIENT_TRANSLATION:-true}
      - NEXT_PUBLIC_USE_API_TRANSLATION_ONLY=${NEXT_PUBLIC_USE_API_TRANSLATION_ONLY:-true}
      - NEXT_PUBLIC_DEBUG_LOGS=${NEXT_PUBLIC_DEBUG_LOGS:-true}
      - NODE_ENV=production
      # Firebase
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-meeshy-me.firebaseapp.com}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-meeshy-me}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-meeshy-me.firebasestorage.app}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
      - NEXT_PUBLIC_FIREBASE_VAPID_KEY=${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
    volumes:
      - frontend_staging_uploads:/app/public/u
    depends_on:
      gateway-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://0.0.0.0:3100"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.frontend-staging.rule=Host(`staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.frontend-staging.middlewares=compress@file"
      - "traefik.http.routers.frontend-staging.entrypoints=websecure"
      - "traefik.http.routers.frontend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-staging.loadbalancer.server.port=3100"
      # Plancher attrape-tout, explicite plutôt que déduit de la longueur de
      # règle : le routeur v3 ci-dessous PREND `/__v3/_next` au legacy, et
      # laisser Traefik arbitrer sur la longueur ferait dépendre le partage de
      # la zone d'un détail de syntaxe. Miroir de docker-compose.prod.yml.
      - "traefik.http.routers.frontend-staging.priority=1"

  # ===========================================================================
  # FRONTEND V3 STAGING - la zone v3, servie À CÔTÉ du legacy
  # ===========================================================================
  # La v3 n'était déployée sur AUCUN staging (#4630) : elle vivait dans
  # docker-compose.prod.yml et nulle part ailleurs, si bien qu'aucune de ses
  # issues ne pouvait satisfaire la règle « on ne ferme que si staging est
  # concluant ». `scripts/check-v3-pipeline.mjs` ne l'avait pas vu parce que sa
  # surface déclarée s'arrêtait à ci.yml, docker.yml et docker-compose.prod.yml
  # — elle couvre désormais ce fichier.
  #
  # La règle ne réclame que `/__v3/_next`, et c'est un INVARIANT, pas une étape
  # provisoire : `assetPrefix: '/__v3'` préfixe les URL que Next FABRIQUE pour
  # ses bundles, et rien d'autre. `next build` n'émettant aujourd'hui aucune
  # PAGE d'App Router, tout autre chemin réclamé serait pris au legacy pour y
  # répondre le 404 ANGLAIS du routeur Pages — sans <html lang>, sans le script
  # anti-flash de thème. Un chemin ne se réclame qu'une fois qu'il est servi.
  frontend-v3-staging:
    image: ${FRONTEND_V3_IMAGE:-isopen/meeshy-web-v3:staging}
    container_name: meeshy-frontend-v3-staging
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # DEUX adresses de la passerelle, jamais interchangeables :
      # MEESHY_GATEWAY_URL est l'adresse INTERNE du réseau (appels serveur à
      # serveur, qui n'ont pas à ressortir par Traefik) ; NEXT_PUBLIC_API_URL
      # est l'adresse PUBLIQUE, celle que le NAVIGATEUR atteint — le module de
      # participation (conception § 12.4) y ouvre le socket et y relit /sync.
      - MEESHY_GATEWAY_URL=http://gateway-staging:3000
      - NEXT_PUBLIC_API_URL=https://gate.staging.${DOMAIN:-meeshy.me}
      # L'URL PUBLIQUE, celle que les plateformes mettent en cache pour og:url.
      # Absente, elle retomberait sur l'en-tête Host — l'hôte INTERNE derrière
      # Traefik — et la carte d'aperçu serait cachée sous deux origines.
      - NEXT_PUBLIC_FRONTEND_URL=https://staging.${DOMAIN:-meeshy.me}
    depends_on:
      gateway-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://0.0.0.0:3300/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      # LE PÉRIMÈTRE DE LA ZONE v3 SUR STAGING — § 4.9 de la conception.
      #
      # `Path` plutôt que `PathPrefix` pour les six chemins humains : `Path` est
      # une ÉGALITÉ, donc `/about` est pris au legacy sans lui prendre
      # `/about/quoi-que-ce-soit`, que la v3 ne sert pas et qui répondrait 404.
      # `PathPrefix` reste la forme juste pour `/__v3/_next` (les bundles) et
      # `/l/` (le jeton est un sous-chemin).
      #
      # LA BARRE FINALE DE `/l/` N'EST PAS UNE COQUETTERIE. `PathPrefix` de
      # Traefik est un préfixe de CHAÎNE, pas de SEGMENTS : `PathPrefix(`/l`)`
      # emportait `/login`, `/links` et `/lien` — trois routes que le legacy sert
      # — et le visiteur y recevait le 404 du routeur Pages de la v3. Mesuré sur
      # staging le 2026-09-01 ; `/login` est l'appel à l'action de la vitrine, et
      # il était mort depuis la bascule de l'étape 2. Gardé par l'invariant
      # « aucun PathPrefix ne vole une route voisine du legacy ».
      #
      # ORDRE, dans UN sens seulement (§ 4.4 bis) : un chemin entre d'abord dans
      # `V3_ZONE_PREFIXES` de `apps/web/public/sw.js`, dont l'image est DÉPLOYÉE,
      # avant d'être ajouté ici. Sans quoi le worker legacy — enregistré sur
      # `scope: '/'` — continue de servir son shell depuis le cache aux visiteurs
      # REVENANTS, et le retour arrière du § 4.3 est inerte chez eux. Gardé par
      # l'invariant « le worker legacy s'efface devant ce que la règle réclame »
      # de `scripts/check-v3-pipeline.mjs`, posé une fois par déploiement.
      #
      # `/chat/` — l'étape 4 du § 4.9, réécrite au § 12.3 : la porte de l'INVITÉ
      # (`/chat/:lien`, les états CHOIX, INVITÉ et le bandeau des droits), AVEC sa
      # barre finale — `PathPrefix(`/chat`)` emporterait `/chats`, que l'invariant
      # « aucun PathPrefix ne vole une route voisine » refuse. Pas de `Path(`/chat`)` :
      # la zone ne sert pas `/chat` nu, et la règle ne réclame que des chemins servis.
      # Son commit ANTÉRIEUR a mis `/chat` dans `V3_ZONE_PREFIXES` (§ 4.4 bis).
      #
      # LES SIX ÉCRANS CONNECTÉS (#5075) — `/feed`, `/links`, `/search`,
      # `/notifications`, `/contacts` et `/settings` avec ses sous-écrans. Ils
      # sont SERVIS par `apps/web-v3/app` et déjà connus du worker DÉPLOYÉ
      # (mesuré sur `https://staging.meeshy.me/sw.js` : les dix préfixes y
      # sont), donc l'ordre « servi ⇒ connu du worker ⇒ réclamé » est tenu et
      # il ne restait que la réclamation. Sans elle, aucun de ces écrans
      # n'était éprouvé sur un déploiement : leur condition d'arrêt — « les
      # tests sur staging sont concluants » — ne pouvait pas être satisfaite.
      #
      # `/settings` en `Path` ET `PathPrefix(`/settings/`)`, jamais
      # `PathPrefix(`/settings`)` nu : ce dernier volerait une route voisine
      # commençant par le même mot, ce que l'invariant refuse.
      #
      # `/post`, `/stories`, `/reels` et `/moods` RESTENT au legacy. Ils sont
      # dans le worker, et la v3 les sert — mais ce sont des pages de partage
      # PUBLIC : les réclamer change ce qu'un visiteur extérieur voit d'un lien
      # reçu, et cela se décide à part. La production, elle, reste en ACTIFS
      # SEULEMENT (« non, pas encore », porteur, 2026-09-03).
      - "traefik.http.routers.frontend-v3-staging.rule=Host(`staging.${DOMAIN:-meeshy.me}`) && (PathPrefix(`/__v3/_next`) || PathPrefix(`/__v3/rt/`) || PathPrefix(`/l/`) || Path(`/`) || Path(`/about`) || Path(`/contact`) || Path(`/partners`) || Path(`/terms`) || Path(`/privacy`) || Path(`/login`) || Path(`/signup`) || Path(`/chats`) || PathPrefix(`/chats/`) || PathPrefix(`/chat/`) || Path(`/feed`) || Path(`/links`) || Path(`/search`) || Path(`/notifications`) || Path(`/contacts`) || Path(`/settings`) || PathPrefix(`/settings/`))"
      - "traefik.http.routers.frontend-v3-staging.entrypoints=websecure"
      - "traefik.http.routers.frontend-v3-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-v3-staging.middlewares=compress@file"
      - "traefik.http.services.frontend-v3-staging.loadbalancer.server.port=3300"
      - "traefik.http.routers.frontend-v3-staging.priority=100"

  # ===========================================================================
  # AGENT STAGING - Conversation Agent Service
  # ===========================================================================
  agent-staging:
    image: ${AGENT_IMAGE:-isopen/meeshy-agent:staging}
    container_name: meeshy-agent-staging
    restart: unless-stopped
    environment:
      - DATABASE_URL=mongodb://database-staging:27017/${MONGODB_DATABASE:-meeshy}?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis-staging:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20240620}
      - ZMQ_HOST=0.0.0.0
      - ZMQ_PULL_PORT=5560
      - ZMQ_PUB_PORT=5561
      - NODE_ENV=production
      - PORT=3200
    depends_on:
      mongo-init-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    networks:
      - meeshy-staging-network
      - meeshy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=meeshy_meeshy-network"
      - "traefik.http.routers.agent-staging.rule=Host(`agent.staging.${DOMAIN:-meeshy.me}`)"
      - "traefik.http.routers.agent-staging.entrypoints=websecure"
      - "traefik.http.routers.agent-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.agent-staging.loadbalancer.server.port=3200"

# =============================================================================
# VOLUMES - Tous préfixés "staging" pour isolation
# =============================================================================
volumes:
  database_staging_data:
    name: meeshy-staging-database-data
  database_staging_config:
    name: meeshy-staging-database-config
  redis_staging_data:
    name: meeshy-staging-redis-data
  redis_staging_ui_data:
    name: meeshy-staging-redis-ui-data
  models_staging_data:
    name: meeshy-staging-models-data
  gateway_staging_uploads:
    name: meeshy-staging-gateway-uploads
  gateway_staging_sounds:
    name: meeshy-staging-gateway-sounds
  frontend_staging_uploads:
    name: meeshy-staging-web-uploads

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  meeshy-staging-network:
    driver: bridge
    name: meeshy-staging-network
  meeshy-network:
    external: true
    name: meeshy_meeshy-network
