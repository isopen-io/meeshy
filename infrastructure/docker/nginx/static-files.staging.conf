# Config nginx du domaine statique de STAGING (#11419, #9232).
# Installée par infrastructure/scripts/deploy-staging.sh à la place que monte
# docker-compose.staging.yml (./config/nginx/static-files.conf). Jamais copiée
# depuis la production : chaque environnement porte la sienne.
server {
    listen 80;
    listen [::]:80;
    server_name static.staging.meeshy.me;
    
    # Désactiver les logs d'accès pour les performances
    access_log off;
    error_log /var/log/nginx/static-error.log warn;
    
    # Map pour CORS dynamique (origines autorisées)
    set $cors_origin "";
    if ($http_origin = "https://staging.meeshy.me") {
        set $cors_origin $http_origin;
    }

    # Racine du seul magasin servi (/u/)
    root /usr/share/nginx/html;

    # Le magasin LEGACY (avatars, bannières téléversés du temps du legacy web),
    # monté en lecture seule sous /u/. C'est le SEUL dossier servi ici.
    location /u/ {
        try_files $uri =404;

        # Headers de cache pour les images
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "Nginx-Static";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Vary "Origin";

        # Types MIME
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/svg+xml svg;
        }

        # Pas de listing des répertoires
        autoindex off;
    }

    # Tout le reste est fermé (#11256). Les octets d'un média de message ne
    # sont joignables que par la passerelle (/api/v1/attachments/file/…), qui
    # applique vue unique, éphémère et lecteur-gate. Ce domaine, public et en
    # cache immutable, les contournait : AUCUN dossier de la passerelle n'est
    # monté ici, et `/` ne sert rien même si quelqu'un en remontait un.
    location / {
        return 404;
    }

    # Healthcheck
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
