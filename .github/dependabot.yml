# =============================================================================
# DEPENDABOT CONFIGURATION - Mises à jour automatiques des dépendances
# =============================================================================
# Documentation: https://docs.github.com/en/code-security/dependabot
#
# Dependabot crée automatiquement des PRs pour :
# - Mises à jour de sécurité (vulnérabilités)
# - Mises à jour de versions (selon schedule)
#
# Configuration adaptée au monorepo Meeshy avec pnpm
# =============================================================================

version: 2

updates:
  # ===========================================================================
  # NPM/PNPM - Applications et Services
  # ===========================================================================

  # Application Web (Next.js)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"
      - "security"
    commit-message:
      prefix: "chore(deps-web)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"
    assignees:
      - "isopen-io/meeshy-maintainers"
    # Grouper les mises à jour mineures/patch ensemble
    groups:
      next-ecosystem:
        patterns:
          - "next*"
          - "@next/*"
          - "react*"
          - "react-dom"
      testing:
        patterns:
          - "jest*"
          - "@testing-library/*"
          - "@types/jest"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Priorité aux mises à jour de sécurité
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    versioning-strategy: increase
    # next 16 casse Turbopack contre @meeshy/shared transpilé (cf. PR #1542, #1676) —
    # bloquer les majeures tant que la migration n'est pas vetée manuellement
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # CI tourne sous Node 22 : les majeures de @types/node doivent suivre
      # manuellement la version Node de CI (cf. PR #2493 recréée malgré ignore)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (compilateur natif) n'expose pas l'API compilateur JS
      # requise par ts-jest → toutes les suites Jest échouent au chargement
      # (#2524 reverté). Rester sur 6.x tant que ts-jest ne supporte pas TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 retire `context.getFilename()`. `eslint-plugin-react` — dépendance
      # DURE de `eslint-config-next` — l'appelle encore et plafonne son peer à
      # `eslint ^9.7` (7.37.5 est la dernière version publiée). Sous ESLint 10, tout
      # `eslint`/`next lint` meurt AVANT de lire une ligne de code, sur tout le dépôt.
      # Rester en 9.x tant que eslint-plugin-react n'annonce pas ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Service Gateway (Node.js/gRPC)
  - package-ecosystem: "npm"
    directory: "/services/gateway"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gateway"
      - "security"
    commit-message:
      prefix: "chore(deps-gateway)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"
    groups:
      grpc-ecosystem:
        patterns:
          - "*grpc*"
          - "@grpc/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    versioning-strategy: increase
    ignore:
      # Prisma v7 désactivé jusqu'à la prise en compte de MongoDB
      # (Prisma 7 retire `datasource url` du schema → P1012 ; migration vers prisma.config.ts + adapter requise)
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # CI tourne sous Node 22 : les majeures de @types/node doivent suivre
      # manuellement la version Node de CI (cf. PR #2493 recréée malgré ignore)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (compilateur natif) n'expose pas l'API compilateur JS
      # requise par ts-jest → toutes les suites Jest échouent au chargement
      # (#2524 reverté). Rester sur 6.x tant que ts-jest ne supporte pas TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 retire `context.getFilename()`. `eslint-plugin-react` — dépendance
      # DURE de `eslint-config-next` — l'appelle encore et plafonne son peer à
      # `eslint ^9.7` (7.37.5 est la dernière version publiée). Sous ESLint 10, tout
      # `eslint`/`next lint` meurt AVANT de lire une ligne de code, sur tout le dépôt.
      # Rester en 9.x tant que eslint-plugin-react n'annonce pas ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Service Translator (Python/AI)
  - package-ecosystem: "pip"
    directory: "/services/translator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "translator"
      - "security"
    commit-message:
      prefix: "chore(deps-translator)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"
    groups:
      torch-ecosystem:
        patterns:
          - "torch*"
          - "torchaudio"
      transformers:
        patterns:
          - "transformers"
          - "accelerate"
          - "safetensors"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # espnet 202509+/202511 exigent numpy>=2.0, incompatible avec le pin
      # numpy<1.24.0 (ESPnet 202412 + chatterbox-tts). Un bump casse le build
      # Docker translator (cf. #1539 → CI Docker #2074). Rester sur 202412.
      - dependency-name: "espnet"
      - dependency-name: "espnet-model-zoo"
      # grpcio-tools/grpcio-reflection 1.76.0 (pin documenté dans requirements.txt)
      # plafonnent protobuf <7.0.0 ; un bump 7.x casse l'install du translator
      - dependency-name: "protobuf"
        versions: [">=7.0.0"]
      # pyannote-audio>=4.0 → pyannote-core>=6.0.1 → numpy>=2.0 + torch>=2.8.0,
      # incompatibles avec numpy<1.24.0 et torch==2.6.0 (Dockerfile). Le bump
      # Dependabot #1674 (3.4.0→4.0.7) a cassé le build Docker translator
      # ("requirements are unsatisfiable"). Rester sur 3.4.0.
      - dependency-name: "pyannote-audio"

  # Package Shared (Prisma/Types)
  - package-ecosystem: "npm"
    directory: "/packages/shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "shared"
      - "security"
    commit-message:
      prefix: "chore(deps-shared)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      types:
        patterns:
          - "@types/*"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    versioning-strategy: increase
    ignore:
      # Prisma v7 désactivé jusqu'à la prise en compte de MongoDB
      # (Prisma 7 retire `datasource url` du schema → P1012 ; migration vers prisma.config.ts + adapter requise)
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # CI tourne sous Node 22 : les majeures de @types/node doivent suivre
      # manuellement la version Node de CI (cf. PR #2493 recréée malgré ignore)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Racine du monorepo (turbo, outils globaux)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "monorepo"
      - "security"
    commit-message:
      prefix: "chore(deps-root)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"
    groups:
      build-tools:
        patterns:
          - "turbo*"
          - "typescript"
          - "eslint*"
          - "prettier"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    versioning-strategy: increase
    ignore:
      # CI tourne sous Node 22 : les majeures de @types/node doivent suivre
      # manuellement la version Node de CI (cf. PR #2493 recréée malgré ignore)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (compilateur natif) n'expose pas l'API compilateur JS
      # requise par ts-jest → toutes les suites Jest échouent au chargement
      # (#2524 reverté, le groupe build-tools l'avait embarqué). Rester sur 6.x
      # tant que ts-jest ne supporte pas TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # bun.lock — resynchronisation SEULE, sans toucher aux manifestes (#6230).
  # Les cinq entrées npm ci-dessus bougent `package.json` et `pnpm-lock.yaml` ;
  # aucune ne connaît `bun.lock`, le lock que CI et développement local
  # installent réellement (CLAUDE.md § Build System — bun est le défaut,
  # parité CI). Une PR npm/pnpm fusionnée sans régénération de `bun.lock`
  # laisse donc un retard qui n'est visible qu'au prochain `bun install`
  # manuel (#6230 : @signalapp/libsignal-client, zod, @tus/server, sharp
  # avaient chacun dérivé de la sorte).
  # `versioning-strategy: lockfile-only` ne rouvre AUCUNE portée de
  # `package.json` : cette entrée se contente de réaligner `bun.lock` sur ce
  # que les manifestes acceptent déjà. Une entrée `package-ecosystem: bun`
  # sans cette restriction dupliquerait les PR de montée de version des
  # entrées npm ci-dessus sur les mêmes paquets — deux branches Dependabot
  # éditant le même `package.json`, en conflit l'une avec l'autre.
  # Le gate CI qui referme la boucle : `scripts/check-lockfile-alignment.mjs`
  # (job `quality`, étape « Lockfile alignment guard ») fait déjà rougir
  # toute PR — Dependabot ou humaine — dont `bun.lock` diverge des
  # manifestes ; cette entrée réduit la fréquence à laquelle ça arrive, le
  # gate reste la garantie. Passer `bun install` en `--frozen-lockfile` dans
  # `ci.yml` a été considéré et écarté : le gate ci-dessus détecte déjà tout
  # désalignement, avec un message qui nomme le paquet et le site en cause —
  # `--frozen-lockfile` échouerait sur le même désalignement avec un message
  # bun générique, sans rien garantir de plus.
  - package-ecosystem: "bun"
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "monorepo"
    commit-message:
      prefix: "chore(deps-bun-lock)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"

  # ===========================================================================
  # GITHUB ACTIONS - Workflows CI/CD
  # ===========================================================================

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci-cd"
      - "security"
    commit-message:
      prefix: "chore(deps-ci)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      testing-actions:
        patterns:
          - "*test*"
          - "*coverage*"

  # ===========================================================================
  # DOCKER - Images de base
  # ===========================================================================

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(deps-docker-web)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"

  - package-ecosystem: "docker"
    directory: "/services/gateway"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(deps-docker-gateway)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"

  - package-ecosystem: "docker"
    directory: "/services/translator"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(deps-docker-translator)"
      include: "scope"
    reviewers:
      - "isopen-io/meeshy-maintainers"

# =============================================================================
# CONFIGURATION NOTES
# =============================================================================
#
# - Mises à jour de sécurité : automatiques et immédiates
# - Mises à jour de versions : hebdomadaires (lundi 09:00 CET)
# - Groupement : dépendances liées regroupées dans une seule PR
# - Limite de PRs ouvertes : 3-5 par écosystème pour éviter le spam
# - Labels automatiques : facilite le triage et l'automatisation
# - Reviewers : assignés automatiquement à l'équipe maintainers
#
# Pour désactiver temporairement :
# - Ajouter un label "dependencies-ignore" à une PR
# - Ou modifier schedule.interval à "monthly" pour ralentir
#
# Pour les mises à jour manuelles urgentes :
# - Utiliser `pnpm update <package>@latest`
# - Ou attendre la PR Dependabot hebdomadaire
# =============================================================================
