# =============================================================================
# MEESHY — PUBLICATION PLAY DE L'APP ANDROID NATIVE (#14174)
# =============================================================================
# ADR-028 (#13619) : l'app native (`apps/android`, applicationId me.meeshy.app,
# version 3.x) est l'application de la fiche Play `me.meeshy.app`. Ce workflow
# la construit signée et l'envoie sur la piste choisie.
#
#   1. Numéro de build = `git rev-list --count HEAD` sur un historique complet,
#      la règle de la coque (D-45) : monotone, et déjà au-dessus de 34085, le
#      dernier code que la coque a envoyé sur la fiche.
#   2. La clé d'envoi et google-services.json viennent des secrets de la fiche
#      (les mêmes que la coque) ; sans clé, le job REFUSE avant de construire —
#      jamais un .aab non signé.
#   3. L'.aab et le mapping R8 partent en artefact (30 jours), puis sur la piste.
# =============================================================================

name: Android natif · publication Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Piste du Play Store'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'État de la release sur la piste'
        type: choice
        options: [completed, inProgress, draft]
        default: completed
      user_fraction:
        description: 'Déploiement progressif (0 < f < 1), seulement avec status=inProgress'
        type: string
        default: ''

concurrency:
  group: android-native-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Android natif — ${{ inputs.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout (historique complet, pour le numéro de build)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuser sans clé d'envoi
        env:
          KEYSTORE_BASE64: ${{ secrets.MEESHY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MEESHY_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEESHY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEESHY_ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.MEESHY_PLAY_SERVICE_ACCOUNT_JSON }}
          USER_FRACTION: ${{ inputs.user_fraction }}
          RELEASE_STATUS: ${{ inputs.status }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing MEESHY_ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing MEESHY_ANDROID_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing MEESHY_ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing MEESHY_ANDROID_KEY_PASSWORD"
          [ -n "$PLAY_JSON" ] || missing="$missing MEESHY_PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::secrets absents :$missing — la publication est refusée (aucun .aab non signé ne part)."
            exit 1
          fi
          if [ -n "$USER_FRACTION" ] && [ "$RELEASE_STATUS" != "inProgress" ]; then
            echo "::error::user_fraction n'a de sens qu'avec status=inProgress."
            exit 1
          fi

      - name: Numéro de build (D-45)
        run: |
          count="$(git rev-list --count HEAD)"
          if [ "$count" -le 34085 ]; then
            echo "::error::numéro de build $count ≤ 34085 (dernier code de la coque sur la fiche) : Play le refuserait."
            exit 1
          fi
          echo "MEESHY_BUILD_NUMBER=$count" >> "$GITHUB_ENV"
          echo "Numéro de build : $count" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Poser la clé et google-services.json depuis les secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MEESHY_ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.MEESHY_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meeshy-upload.keystore"
          echo "MEESHY_ANDROID_STORE_FILE=$RUNNER_TEMP/meeshy-upload.keystore" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Construire l'App Bundle signé (bundleRelease)
        env:
          MEESHY_ANDROID_STORE_TYPE: ${{ vars.MEESHY_ANDROID_STORE_TYPE || 'pkcs12' }}
          MEESHY_ANDROID_STORE_PASSWORD: ${{ secrets.MEESHY_ANDROID_STORE_PASSWORD }}
          MEESHY_ANDROID_KEY_ALIAS: ${{ secrets.MEESHY_ANDROID_KEY_ALIAS }}
          MEESHY_ANDROID_KEY_PASSWORD: ${{ secrets.MEESHY_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease -PmeeshyBuildNumber="$MEESHY_BUILD_NUMBER" --stacktrace

      - name: L'App Bundle est signé par la clé d'envoi
        env:
          MEESHY_ANDROID_STORE_PASSWORD: ${{ secrets.MEESHY_ANDROID_STORE_PASSWORD }}
          MEESHY_ANDROID_KEY_ALIAS: ${{ secrets.MEESHY_ANDROID_KEY_ALIAS }}
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$aab"
          "$JAVA_HOME/bin/jarsigner" -verify "$aab" | tail -1
          "$JAVA_HOME/bin/jarsigner" -verify "$aab" | grep -q "jar verified"
          "$JAVA_HOME/bin/keytool" -list -v -keystore "$MEESHY_ANDROID_STORE_FILE" \
            -storepass "$MEESHY_ANDROID_STORE_PASSWORD" -alias "$MEESHY_ANDROID_KEY_ALIAS" \
            | grep 'SHA256' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Publier l'aab et le mapping
        uses: actions/upload-artifact@v7
        with:
          name: meeshy-android-native-${{ env.MEESHY_BUILD_NUMBER }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: Envoyer au Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.MEESHY_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.meeshy.app
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          userFraction: ${{ inputs.user_fraction }}

      - name: Nettoyer la clé et google-services.json
        if: always()
        run: rm -f "$RUNNER_TEMP/meeshy-upload.keystore" app/google-services.json
