name: SDK Tests

# Split out of ios-tests.yml (2026-06-07): the MeeshySDK package suite is gated
# ONLY on packages/MeeshySDK/** so an app-only PR (apps/ios changes) is no longer
# blocked by it. The app's own MeeshyTests still run via ios-tests.yml, which is
# triggered on both apps/ios/** and packages/MeeshySDK/** (the app depends on the
# SDK), giving app-level coverage of SDK changes without coupling the two suites.
#
# Toolchain rationale (same as ios-tests.yml): COMPILE with Xcode 26.1.1
# (Swift 6.2, required by the package) but RUN on an iOS 18.2 simulator — iOS 18.5+
# and 26.x hit a Swift runtime isolated-deinit crash at xctest teardown, and the
# Timeline snapshot baselines were recorded on 18.2.
on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'packages/MeeshySDK/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'packages/MeeshySDK/**'
  # Intentionally NOT triggered by changes to this workflow file itself: an
  # app-only PR that merely touches CI config must not be gated by the SDK suite.
  # Use workflow_dispatch (Actions tab) to exercise CI changes on demand.
  workflow_dispatch:

# A hung xctest must never sit for GitHub's 6h default. A new push on the same
# ref cancels stale in-progress runs so we never accumulate multi-hour zombies.
concurrency:
  group: sdk-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    runs-on: macos-15
    # Hard cap, re-measured 2026-07-30. The old 25-min cap was calibrated on a
    # suite that no longer exists: the last green run (#30161575001, 2026-07-25)
    # took 12m32 total — 4m07 runtime provisioning + 8m09 build+test. Since then
    # the package gained ~9.5k lines of tests over 77 new files (timeline pass)
    # plus five video-export suites (StoryExportSinglePass, VideoFramePixel,
    # FrameRate, Watermark, Branding) that do real AVFoundation encoding.
    #
    # Measured on run #30546762282: 5m14 provisioning + 4m20 compile + >15m30 of
    # test execution, killed mid-suite by the cap. Run #30549812265 then went the
    # full distance at 42m25 — WITH two export tests killed early by the per-test
    # allowance, so the honest budget is higher still (see that allowance below).
    # Locally the same 6132 tests run in 6m43 on Apple Silicon; the 3-vCPU runner
    # is far slower on the encode-bound suites, which dominate the wall clock.
    #
    # 60 covers ~45 min of measured work plus the tail. It is NOT a healthy
    # target: this suite now burns the better part of an hour of macOS runner per
    # push. The structural fix is to move the AVFoundation export suites to their
    # own nightly workflow so per-push feedback stays minutes, not an hour —
    # until then this cap only exists so a hung job never sits for GitHub's 6h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.1.1 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer

      - name: Provision iOS 18.2 simulator
        id: sim
        run: |
          set -e
          # iOS 18.5/18.6 (the runner's pre-installed 18.x) AND iOS 26.x all hit a
          # Swift runtime isolated-deinit crash at xctest teardown
          # (swift_task_deinitOnExecutorMainActorBackDeploy → double-free). Only
          # iOS 18.0–18.2 are crash-free, and the Timeline snapshot baselines were
          # recorded on 18.2. Download 18.2 on demand if the runner lacks it
          # (≈5 min, first run only per runner).
          if ! xcrun simctl list runtimes | grep -q "iOS 18.2"; then
            echo "Downloading iOS 18.2 simulator runtime…"
            xcodebuild -downloadPlatform iOS -buildVersion 18.2
          fi
          SIM_ID=$(xcrun simctl create "iPhone16Pro-iOS182-CI" "iPhone 16 Pro" "com.apple.CoreSimulator.SimRuntime.iOS-18-2")
          echo "sim_id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Run SDK tests
        shell: bash
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          # Per-test allowance is 600, raised from 180 on 2026-07-30. Two export
          # tests were killed by the 180 s allowance on run #30549812265 —
          # ExportEquivalenceTests.test_export_frame_visually_resembles_live_render_at_t5s
          # and StoryExportSinglePassTests.test_singlePass_withIdentity_matchesWrappedOutput
          # — which take 20 s and 32 s locally. They are not hung: they encode real
          # video, and the runner has no usable hardware encoder, so the gap is ~9x
          # rather than the ~2.5x the rest of the suite shows. 180 s sat below the
          # floor for that work and turned slow into red. This allowance is still
          # the deadlock guard — it must stay well under timeout-minutes.
          #
          # SANS `-quiet` (#5466) : cinq runs sont morts en `rc=65` sans accuser
          # un seul test — ni la console (`-quiet` l'assourdit), ni le xcresult
          # (absent ou vide sur un crash précoce) ne portaient la moindre trace
          # de CE QUI tournait à l'instant du crash. `xcodebuild` verbeux écrit
          # une ligne « Test Case '-[Suite test]' started » par test ; on la
          # garde ENTIÈRE dans un fichier, envoyé à `/dev/null` en console pour
          # ne pas noyer un run VERT sous des dizaines de milliers de lignes —
          # l'étape suivante en imprime la QUEUE si le bundle manque, et
          # l'artefact ci-dessous en garde la totalité pour l'autopsie.
          xcodebuild test \
            -scheme MeeshySDK-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim_id }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 600 \
            2>&1 | tee xcodebuild-raw.log >/dev/null
        working-directory: packages/MeeshySDK

      - name: Surface test failures
        if: always()
        working-directory: packages/MeeshySDK
        run: |
          BUNDLE=TestResults.xcresult
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::Aucun bundle de résultat produit — signature du crash d'infrastructure #5466 (rc=65 sans test nommé)."
            if [ -f xcodebuild-raw.log ]; then
              echo "::group::Dernières lignes du journal brut — cherche le dernier « Test Case … started » : c'est lui qui tournait à l'instant du crash"
              tail -n 200 xcodebuild-raw.log
              echo "::endgroup::"
            fi
            exit 0
          fi
          echo "::group::Test failure summary"
          SUMMARY=$(xcrun xcresulttool get test-results summary --path "$BUNDLE" 2>/dev/null)
          if [ -z "$SUMMARY" ]; then
            xcrun xcresulttool get --legacy --format json --path "$BUNDLE" 2>/dev/null | head -c 60000 \
              || echo "xcresulttool could not read the bundle."
          else
            echo "$SUMMARY"
            TOTAL=$(echo "$SUMMARY" | grep -o '"totalTestCount" *: *[0-9]*' | grep -o '[0-9]*$')
            if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
              echo "::error::Bundle présent mais 0 test comptabilisé — signature du crash d'infrastructure #5466. Voir le journal brut en artefact ci-dessous."
            fi
          fi
          echo "::endgroup::"

      - name: Upload diagnostic artifacts on failure
        # #5466 : un rc=65 sans test nommé ne laisse aucune piste — le journal
        # brut et le bundle (quand il existe) sont la seule autopsie possible.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-tests-failure-diagnostics
          path: |
            packages/MeeshySDK/xcodebuild-raw.log
            packages/MeeshySDK/TestResults.xcresult
          retention-days: 7
          if-no-files-found: warn
