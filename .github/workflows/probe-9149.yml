name: probe-9149
on:
  push:
    branches: [ci/staging-probe-9149]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: curl -sS -i https://gate.staging.meeshy.me/api/v1/tracking-links/SBJt6l | head -30 || true
      - run: TARGET=https://staging.meeshy.me/l/SBJt6l node .github/probe/probe-9149.mjs
