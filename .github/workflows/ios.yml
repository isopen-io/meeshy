name: iOS

# Re-enabled 2026-06-07. Runs the app's MeeshyTests suite. The MeeshySDK package
# suite lives in a separate workflow (sdk-tests.yml) gated only on
# packages/MeeshySDK/**, so an app-only PR is not blocked by it. This workflow
# still triggers on packages/MeeshySDK/** because the app depends on the SDK and
# we want app-level coverage of SDK changes.
#
# Toolchain: COMPILE with Xcode 26.1.1 (Swift 6.2, required by the package).
# Until 2026-10-08 the tests RAN on a downloaded iOS 18.2 simulator, because the
# pre-installed 18.4+/26.x runtimes crashed at xctest teardown
# ("test runner crashed … at swift_task_deinitOnExecutorMainActorBackDeploy",
# double-free of a TaskLocal scope, Swift #85663). #9694 found the root: the
# ISOLATED deinits that SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor manufactures.
# They are gone from the binaries, `scripts/ci/check-ios-isolated-deinits.sh`
# keeps them out (build job), and MeeshyTests now runs on the PRE-INSTALLED 26.1
# (IOS_TEST_RUNTIME below). MeeshyTests carries no snapshot baseline; the SDK's
# 18.2 baselines keep sdk-tests.yml on 18.2 until #9701.
#
# TRIGGER SCOPE (2026-07-27, measured on runs #3728-#3741): the job itself takes
# 29-45 min, but a PR-triggered run took 56 min to 1h34 wall-clock. The extra
# 24-49 min is pure QUEUE time — the account's macOS concurrency ceiling was
# saturated by 5-6 simultaneous PR runs (plus sdk-tests.yml, also macos-15), so
# every new PR run just waited for a runner. Fanning this suite out over every
# open PR therefore made it slower for everyone, including dev/main.
# So: the FULL suite runs automatically on `dev` ONLY. main and ad-hoc checks
# run on demand from the Actions tab ("Run workflow" → pick any branch). No
# branch protection requires this check, so neither trigger can deadlock a merge.
#
# PR GATE RESTORED, COMPILE-ONLY (2026-08-12, measured over the 30 days to
# 2026-08-12 — 148 PRs touching apps/ios/**, 340 pushes after collapsing commits
# <5 min apart, each run capped by the cancel-in-progress group below):
#
#   >= 1 iOS run in flight   8.9% of wall clock   (64.2 h / 720)
#   >= 2 in flight           1.9%                 (13.4 h)
#   >= 5 in flight           0.2%                 ( 1.6 h)
#
# The July decision hinged on 5-6 SIMULTANEOUS runs being the norm. They are not:
# the window is idle 91% of the time, and the 5-6 figure is reached for 1.6 h a
# month, only inside batch-merge bursts (whose commit timestamps overstate real
# push times, so that tail is an upper bound). What saturated the ceiling was the
# 29-45 min FULL suite, not the trigger.
#
# So the PR run does the half that is cheap and catches what actually breaks —
# the compile, app AND test targets — and skips the two network/CPU posts that
# cost the most and gate the least at PR time: the 7-min iOS 18.2 runtime
# download and the 8-min test execution.
#
# MEASURED on the first run of this gate (#31564979638, job 94014846909, the PR
# that introduced it — cold SPM cache, cold DerivedData), against the 35-min dev
# baseline decomposed above:
#     0s     provision the iOS 18.2 runtime     ← skipped   (was 7m01)
#     2m02   resolve SPM (cache miss)                       (was 8m07)
#     6m33   build-for-testing                              (was 8m58)
#     32s    save DerivedData
#     0s     test-without-building              ← skipped   (was 8m20)
#   =10m02 total. The pre-wiring estimate was "~18 min cold, ~10 min warm"; the
# cold run came in at what was predicted for a WARM one. Note the compile is
# FASTER than the dev baseline's, not slower — which is the observable proof
# that the ARCHS=arm64 pin below is taking effect. Losing that pin would show up
# here as a compile roughly double this, not as a failure.
#
# The next run on the same branch (job 94017664432), warm on BOTH caches, is the
# steady state to budget against:
#     18s    restore SPM cache                  ← hit
#     14s    restore DerivedData                ← hit, seeded by the cold run
#     23s    resolve SPM (warm)                             (was 2m02 cold)
#     3m19   build-for-testing (incremental)                (was 6m33 cold)
#     17s    save DerivedData
#   =4m54 total. So a cold gate costs ~10 min and the steady state ~5 — budget
# ~5, not ~10. Cold recurs when the SPM key (`project.yml`) changes or the
# DerivedData lineage restarts, not per PR.
#
# That second run also settles half of an open question: DerivedData saved by a
# compile-only run IS reused by the next compile-only run (6m33 → 3m19). What is
# still unverified is the CROSS-mode case — whether a `generic/platform` build's
# products are reused by an `id=<sim>` build on dev, and the reverse. Both modes
# share one cache lineage deliberately (two multi-GB lineages would thrash the
# repo's cache limit and evict the SPM cache); if the cross-mode reuse turns out
# to be nil, the cost is a cold compile on dev, never a wrong result.
#
# TESTS SUR DEMANDE — SAUF SUR `main` (2026-08-15). Le défaut s'inverse sur les
# branches et les PR : la COMPILATION y tourne partout, l'EXÉCUTION des tests ne
# tourne que si on la demande. La demande s'écrit dans le SUJET du commit de
# tête : « smoke test », « run test » ou « to test », insensible à la casse.
#
# Trois portées, dans cet ordre de priorité :
#   1. `workflow_dispatch`        → suite complète (un lancement manuel est déjà explicite)
#   2. poussée sur `main`         → suite complète, SANS opt-in
#   3. tout le reste (PR, `dev`)  → compilation, sauf mot-clé au sujet du commit
#
# La règle 2 tient à ce que `main` n'est pas une branche de travail : c'est ce
# qui part en production, et rien n'y est jamais « sur demande ». Le reste du
# dépôt suit déjà cette logique — `ci.yml` bâtit gateway, web, shared, agent,
# translator, Prisma et l'image sur chaque poussée `main` sans condition. Le
# Swift était le seul arbre à ne pas y passer.
#
# Une PR VERS `main` reste sous le régime de l'opt-in : sur un event
# `pull_request`, `github.ref` vaut `refs/pull/N/merge` et jamais
# `refs/heads/main`, donc la règle 2 ne peut pas l'attraper par accident.
#
# Ce que ce réglage a immédiatement révélé (run 31874465536, PR #3010) : la
# suite complète portait 17 échecs hérités de `main` — appels, répertoire,
# catalogue de localisation — invisibles depuis des semaines parce que les PR
# étaient compile-seule et que la suite ne tournait que sur `dev`. C'est
# exactement le trou que la règle 2 ferme.
#
# Motif : la règle précédente liait la bascule à l'ÉVÉNEMENT (`COMPILE_ONLY =
# event == 'pull_request'`), donc chaque poussée sur `dev` payait les deux postes
# chers — 7 min de runtime iOS 18.2 + 8 min de suite — que la PR, elle, évitait
# soigneusement. Le coût était simplement déplacé, pas supprimé.
#
# Le job `scope` résout la portée sur ubuntu avant d'engager la moindre minute
# macOS : lire une ligne de `git log` n'a pas à consommer la ressource rare. Il
# lit le sujet sur `pull_request.head.sha`, jamais sur `github.sha` — sur un
# event `pull_request` ce dernier désigne le commit de merge synthétique, dont le
# sujet est « Merge … into … » et ne porterait jamais le mot-clé.
#
# Deux jobs, un seul jeu d'étapes macOS : `COMPILE_ONLY` gate les étapes 10 et 12
# (séparées depuis toujours), il n'y a donc pas de seconde copie de la chaîne
# d'outils qui puisse dériver. Gardé par
# `packages/shared/__tests__/ci/ios-pr-compile-gate.test.ts`, qui tourne sur
# chaque PR — le retrait du 2026-07-27 est passé inaperçu des semaines durant
# précisément parce que rien ne le surveillait. La garde couvre aussi les trois
# mots-clés : les perdre ne rendrait rien rouge, ça rendrait seulement les tests
# indemandables, et la CI resterait verte en ne vérifiant plus rien.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/ios/**'
      - 'packages/MeeshySDK/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
      - dev
    # `ready_for_review` is NOT in the default type set. Without it a PR opened
    # as a draft (skipped by the job-level `if` below) and later marked ready
    # would never emit another event, and the gate would be silently skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/ios/**'
      - 'packages/MeeshySDK/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    # Suites ciblées (noms de classes MeeshyTests séparés par des virgules) :
    # la suite complète dépasse la limite du job, et un lot doit pouvoir
    # prouver SES témoins. Vide = la suite complète, comme avant.
    inputs:
      only_testing:
        description: 'Suites MeeshyTests à exécuter seules (ex. ReelSceneRoutingTests,MediaSaveCoordinatorTests) — vide = tout'
        required: false
        default: ''

# A hung xctest must never sit for GitHub's 6h default. A new push on the same
# ref cancels stale in-progress runs so we never accumulate multi-hour zombies.
#
# PIÈGE, mesuré le 2026-08-15 sur la PR #3010. Sur un événement `pull_request`,
# le filtre `paths:` ci-dessus s'évalue sur le DIFF COMPLET de la PR (base → tête),
# pas sur les fichiers de la poussée. Une PR qui touche `apps/ios/**` déclenche
# donc ce workflow à CHAQUE synchronisation — y compris pour une poussée qui ne
# contient que de la documentation. Combiné au `cancel-in-progress` ci-dessous,
# cela veut dire qu'un commit de docs ANNULE la suite en cours.
#
# Conséquence pratique pour l'opt-in par mot-clé : le mot-clé doit se trouver
# dans le sujet du DERNIER commit poussé. Demander les tests puis pousser un
# commit de docs par-dessus annule le run demandé et le remplace par une simple
# compilation, silencieusement — le nouveau run est vert, il n'a juste rien testé.
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nombre de tranches parallèles de la suite MeeshyTests (#9692). Choisi sur
  # la mesure : voir l'en-tête du job `ios-test-shard`.
  IOS_TEST_SHARDS: 4
  # Le runtime simulateur des tranches, et s'il faut le TÉLÉCHARGER — la seule
  # bascule (scripts/ci/provision-ios-simulator.sh). 26.1 PRÉINSTALLÉ depuis
  # #9694 : le plantage au démontage des runtimes 18.4+/26
  # (`swift_task_deinitOnExecutorMainActorBackDeploy`, Swift #85663) venait
  # des deinit ISOLÉES que l'isolation MainActor par défaut fabrique ; elles
  # ont disparu du binaire et la garde `check-ios-isolated-deinits.sh` (job
  # de build) empêche leur retour. Suite complète verte sur 18.6 et 26.1
  # préinstallés (run 37789283366, 16 621 tests). Le téléchargement de 18.2
  # (7-14 min PAR tranche) disparaît.
  IOS_TEST_RUNTIME: '26.1'
  IOS_TEST_RUNTIME_DOWNLOAD: 'false'

jobs:
  # Résout la PORTÉE du run avant d'engager la moindre minute macOS.
  #
  # La compilation est le défaut : elle attrape ce qui casse vraiment (types,
  # signatures, fichiers absents du projet) pour ~10 min. L'exécution des tests,
  # elle, coûte le téléchargement du runtime iOS 18.2 (7 min) plus la suite
  # elle-même (8 min) — un prix qu'on ne paie que sur demande explicite.
  #
  # La demande s'écrit dans le SUJET DU COMMIT : « smoke test », « run test » ou
  # « to test », insensible à la casse. Le sujet est lu sur le commit de TÊTE de
  # la branche (jamais sur le commit de merge synthétique que GitHub fabrique
  # pour un event `pull_request`, dont le sujet est toujours « Merge … into … »
  # et ne contiendrait donc jamais le mot-clé).
  #
  # `workflow_dispatch` force les tests : lancer la suite à la main depuis
  # l'onglet Actions est déjà un acte explicite, exiger en plus un mot-clé dans
  # un commit déjà poussé n'aurait aucun sens.
  #
  # Ce job tourne sur ubuntu — le pool macOS est la ressource rare, on ne
  # l'engage pas pour lire une ligne de log git.
  scope:
    name: Portée du run
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.resolve.outputs.run_tests }}
      subject: ${{ steps.resolve.outputs.subject }}
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - id: resolve
        name: Lire le sujet du commit de tête
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          echo "subject=${subject}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Suite complète — déclenchement manuel."
            exit 0
          fi

          # `main` n'est pas une branche de travail : c'est ce qui part en
          # production. Rien n'y est jamais « sur demande ». L'opt-in par
          # mot-clé gouverne les branches et les PR ; la ligne principale
          # exécute tout, systématiquement.
          #
          # Une PR VERS main garde le régime de l'opt-in : sur un event
          # `pull_request`, `github.ref` vaut `refs/pull/N/merge`, jamais
          # `refs/heads/main` — la condition ci-dessous ne s'applique donc
          # qu'à une poussée réelle sur la ligne principale.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Suite complète — poussée sur main, aucun opt-in requis."
            exit 0
          fi

          # `grep -i -E` sur le sujet seul : un mot-clé enfoui dans le CORPS du
          # message ne compte pas. Le corps sert à expliquer, le sujet à décider.
          if printf '%s' "$subject" | grep -qiE 'smoke test|run test|to test'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Suite complète — mot-clé trouvé dans le sujet du commit."
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Compilation seule. Pour exécuter la suite, mettre « smoke test », « run test » ou « to test » dans le SUJET du commit."
          fi

      # Les TRANCHES de la suite (#9692) se décident ici, sur ubuntu : lire des
      # sources Swift n'a pas à attendre le pool macOS, et une entrée
      # `only_testing` mal formée échoue avant d'engager la moindre minute macOS.
      # Le script est déterministe : chaque tranche le rejoue pour SA part et
      # obtient la même répartition (cf. scripts/ci/ios-test-shards.mjs).
      - id: shards
        name: Répartir MeeshyTests en tranches
        if: steps.resolve.outputs.run_tests == 'true'
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          set -euo pipefail
          node scripts/ci/ios-test-shards.mjs --suite ios --plan --shards "$IOS_TEST_SHARDS" --only "$ONLY_TESTING"
          echo "matrix=$(node scripts/ci/ios-test-shards.mjs --suite ios --matrix --shards "$IOS_TEST_SHARDS" --only "$ONLY_TESTING")" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # GARDES DE L'OUTILLAGE iOS — #6852
  # ===========================================================================
  # Les scripts de `apps/ios/scripts/check_*.sh` gardent l'outillage que TOUTE
  # session iOS emprunte : l'élection du simulateur (#6838) et l'inscription
  # des témoins au `project.pbxproj` committé (#6839). Ils étaient verts en
  # local et exécutés par aucun workflow — une garde qui ne tourne nulle part
  # reproduit exactement le défaut qu'elle corrige (leçon 619).
  #
  # Ici plutôt que sur le runner macOS : ces gardes lisent du TEXTE (un JSON de
  # fixture, un `pbxproj` committé) et rendent leur verdict en une seconde. Les
  # faire attendre le pool macOS — la ressource rare, cf. le job `scope` —
  # retarderait de plusieurs dizaines de minutes une preuve qui n'en a pas
  # besoin, et qui dit précisément si la suite d'en face va jouer ce qu'on croit.
  #
  # Pas d'exclusion des brouillons : un job ubuntu de deux secondes ne pèse sur
  # aucun pool, et c'est sur un brouillon qu'un témoin non inscrit se corrige le
  # moins cher. `ios-tests` garde la sienne, qui protège le pool macOS.
  #
  # Aucun `continue-on-error` : une étape qui tourne sans juger est une étape
  # qui n'est pas inscrite. La parité de ce job avec le contenu du répertoire
  # est gardée par `packages/shared/__tests__/ci/ios-gates-ci-parity.test.ts`,
  # qui ÉNUMÈRE `apps/ios/scripts/` plutôt que d'en recopier la liste — une
  # garde neuve fait donc rougir le jour où elle est écrite.
  gardes-outillage:
    name: Gardes de l'outillage iOS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      # La FAMILLE d'appareil décide, jamais le NOM : le simulateur du projet
      # s'appelle `Meeshy-iOS26`, et un `grep iPhone` sur les noms ne le voyait
      # pas. Le script porte sa propre fixture — il juge sans simulateur.
      - name: Élection de simulateur — la famille décide, pas le nom
        run: bash apps/ios/scripts/check_simulator_election.sh

      # Un build local porte le numéro de la dernière livraison App Store
      # Connect en build setting, sans réécrire project.yml ni le pbxproj.
      # Le script remplace `andp` par un double — il juge sans réseau.
      - name: Numéro de build local — la dernière livraison, sans réécrire le dépôt
        run: bash apps/ios/scripts/check_build_number_resolution.sh

      # Un `.swift` de test présent sur disque mais absent du `pbxproj` COMMITTÉ
      # n'entre dans aucune compilation : son rouge n'a jamais lieu, et l'issue
      # se ferme sur une absence. Mesuré deux fois le 2026-09-16.
      - name: Inscription des témoins au project.pbxproj committé
        run: bash apps/ios/scripts/check_test_registration.sh

      # Une valeur non quotée hors de l'alphabet nu (`path = A+B.swift;`) rend le
      # pbxproj COMMITTÉ illisible pour Xcode, et `meeshy.sh device` échoue ; la
      # compilation CI régénère le projet et ne le voit pas (2026-09-29).
      - name: Le project.pbxproj committé reste lisible par Xcode
        run: bash apps/ios/scripts/check_pbxproj_quoting.sh

  # File d'attente des suites complètes (#9751). L'org a 5 jobs macOS
  # simultanés, et une suite complète les prend tous (build + 4 tranches) : deux
  # suites lancées ensemble entrelaçaient leurs tranches et finissaient en 60 à
  # 90 min pour 30 min de travail. Ce job, sur ubuntu, attend qu'aucune suite
  # plus ancienne ne tourne ni n'attende — premier arrivé, premier servi. Un
  # groupe `concurrency` commun annulerait les runs en attente des autres
  # sessions. Le NOM du job est lu par la file des autres runs : une
  # compilation seule porte un autre nom et ne bloque personne.
  file-mac:
    needs: scope
    name: ${{ needs.scope.outputs.run_tests == 'true' && 'File d''attente Mac' || 'File d''attente Mac (compilation seule)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_tests == 'true'
        with:
          sparse-checkout: scripts/ci
          fetch-depth: 1
      - name: Attendre que les suites plus anciennes libèrent les Mac
        if: needs.scope.outputs.run_tests == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ios-mac-queue.mjs --poll-seconds 90 --max-minutes 150

  ios-build:
    needs: [scope, file-mac]
    # Le nom du check DIT ce qui a tourné. C'est la seule chose qui distingue,
    # dans l'interface de la PR, un vert qui a bâti l'app d'un vert qui a bâti
    # ET tout exécuté — et sans cette distinction, « iOS Tests : vert » se lit
    # comme « les tests passent » alors que la plupart des runs n'en exécutent
    # aucun.
    #
    # BÂTIR UNE FOIS, EXÉCUTER EN TRANCHES (#9692, 2026-10-08). Bâtir et
    # exécuter tenaient dans un seul job, au motif qu'il aurait fallu faire
    # transiter les produits entre jobs. La suite a fini par dépasser 75 min
    # (run 37760716985 : 7 + 3-8 + 9-22 + 8-32 min en série). Ce job ne fait
    # plus que la compilation — TOUJOURS sur `generic/platform=iOS Simulator`
    # + ARCHS=arm64, qui produit un `.xctestrun` exécutable sur n'importe quel
    # simulateur arm64 — et publie `Build/Products` en artefact ; les tranches
    # `ios-test-shard` l'exécutent en parallèle, `ios-tests` rend le verdict
    # sous le nom historique « Build app + tests unitaires ». Effet de bord
    # voulu : les deux modes bâtissent désormais la MÊME destination, la
    # lignée DerivedData sert donc indifféremment PR et `dev`.
    name: ${{ needs.scope.outputs.run_tests == 'true' && 'Build app (produits de test)' || 'Build app (app + cibles de test)' }}
    # `actions: write` : le remplacement de l'entrée DerivedData de la lignée
    # (voir « Retire the previous DerivedData entry »).
    permissions:
      contents: read
      actions: write
    # A draft PR is work in progress; its compile is the author's business, not
    # the shared macOS pool's. `ready_for_review` above brings the gate back.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    env:
      # Compilation seule par défaut — cf. le job `scope` ci-dessus. Les tests
      # ne s'exécutent que sur demande explicite (mot-clé au sujet du commit,
      # ou lancement manuel).
      COMPILE_ONLY: ${{ needs.scope.outputs.run_tests != 'true' }}
    # STOPGAP cap, sized to the measured worst case — NOT a healthy target.
    # This suite on the standard 3 vCPU / 7 GB runner is dominated by
    # high-variance steps no cache removes: iOS 18.2 runtime download 8-14 min
    # (network), SPM resolve 3-6.6 min (network), compile 8-9 min (DerivedData
    # incremental reuse is unreliable across ephemeral runners — one 4.5-min
    # build was a fluke), + 14-16 min serial tests. Observed range ≈ 38-44 min;
    # 30/35/40 caps all timed out. 50 covers the tail with margin so CI stops
    # flapping. The RIGHT fix is macos-15-xlarge (faster compile/tests + enough
    # RAM for real parallel testing, impossible on this runner). Hard cap kept
    # so a real deadlock fails.
    #
    # WHAT xlarge WOULD ACTUALLY BUY (measured step-by-step on run #31488415343,
    # a green 35-min run on dev, 2026-08-11 — the "reliably under ~30 min" above
    # was an estimate, this is the meter):
    #   38s   checkout + Xcode select + cache restore + XcodeGen
    #   7m01  provision the iOS 18.2 runtime      ← NETWORK-bound
    #   8m07  resolve SPM (cache miss)            ← NETWORK-bound
    #   36s   save SPM cache
    #   8m58  build-for-testing                   ← CPU-bound
    #   40s   save DerivedData
    #   8m20  test-without-building               ← CPU-bound
    #   26s   failure summary + job teardown
    # 15 of the 35 minutes are network, and no runner size shortens them. xlarge
    # attacks the 17 CPU-bound minutes (plausibly → 6-8), so the honest estimate
    # is ~24 min, not "under 30 by a wide margin", at 2-4x the per-minute rate.
    #
    # And it does NOT re-open the pull_request trigger. That was dropped for
    # QUEUE saturation (see TRIGGER SCOPE above), not for job duration: a
    # shorter job does not create a runner. What a PR-time gate actually needs
    # is far cheaper — the compile alone. Steps 10 and 12 are already separate;
    # a build-only job can drop the simulator provisioning entirely by targeting
    # `generic/platform=iOS Simulator`, which removes BOTH the 7-min runtime
    # download and the 8-min test run: ~18 min cold, ~10 min on a warm SPM
    # cache, on this same standard runner. Measure how many PRs touch
    # apps/ios/** concurrently before wiring it — that number, not the duration,
    # is what closed the door in July. That measurement now exists — see
    # "PR GATE RESTORED" in the header — and it is what wired the gate below.
    #
    # 30 stays the PR cap. The first measured gate run took 10m02 end to end
    # (see the header), so 30 is ~3x the observed cost — deliberately loose,
    # because the two variable posts it keeps (SPM resolve, compile) are network-
    # and contention-sensitive. A compile that overruns 30 min is hung, not slow.
    #
    # THE FULL SUITE'S CAP WAS 50, AND IT HAD NEVER BEEN MEASURED (#5996). The
    # 10m02 above is the PR gate's cost; 50 was extrapolated from it. Run
    # 34475852519 gave the real figure — 50m49 — so the cap cut a job that had
    # already finished its work: build green, 26 red tests found, every one of
    # them annotated by the last declared step, which reports success at 13:34:57.
    # The axe fell at 13:35:22, inside the post-actions.
    #
    # What that costs is not a lost run, it is a LIE ABOUT ITS NATURE. This
    # workflow declares `cancel-in-progress: true` (see `concurrency` above), so
    # `cancelled` is the label of a run SUPERSEDED by a newer one — nothing to
    # read. A run carrying a complete verdict wore that label, and a session
    # spent several exchanges hunting the concurrent push that never existed. A
    # monitor filtering on `success|failure` renders, faced with it, exactly the
    # silence of a run still in progress.
    #
    # 75 is the measured cost plus ~48%. The margin is not decoration: the two
    # heaviest posts vary with the runner — compile (22m40) and the on-demand
    # download of the iOS 18.2 runtime (7m49, paid on EVERY run since hosted
    # runners are ephemeral, whatever the step's comment says about "first run
    # only"). A suite that overruns 75 min is hung, not slow — and it will then
    # say so under its own name.
    #
    # Depuis #9692 ce job ne porte plus ni runtime ni tests : 30 min en
    # compilation seule comme avant, 40 en mode tests (la même compilation
    # plus l'archivage et le téléversement des produits).
    timeout-minutes: ${{ needs.scope.outputs.run_tests == 'true' && 40 || 30 }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.1.1 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer

      # SPM checkouts + binary-target zips (Firebase/gRPC from dl.google.com,
      # ~6 min cold and flaky). RESTORE-ONLY here; the matching save runs right
      # after resolve — see the "Save SPM cache" step for why the split matters.
      # Kept in its own tree (`$RUNNER_TEMP/spm`, via -clonedSourcePackagesDirPath)
      # so it caches independently of the compiled build products below.
      #
      # Keyed on the committed Package.resolved (present at checkout, before
      # XcodeGen runs), not project.yml: project.yml changes for reasons that
      # have nothing to do with the resolved package graph (targets, sources,
      # entitlements, build settings — 43 changes in the 30 days before this
      # fix, vs. Package.resolved only moving when a `packages:` version bump
      # actually changes what SPM resolves), so keying on it invalidated a
      # perfectly good SPM cache on every unrelated project.yml edit. The
      # restore-keys prefix falls back to the most recent cache on an actual
      # miss (a real dependency bump) instead of a full ~6 min cold resolve.
      - name: Restore SPM cache
        id: spm-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/spm
          key: ios-spm-${{ hashFiles('apps/ios/Meeshy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ios-spm-

      # #5084 — the `xc26_1_1` prefix names the Xcode *marketing* version, not
      # the SDK build inside it. The runner image was republished without that
      # label changing, so every `.pcm` module precompiled against the OLD SDK
      # header mtimes got restored under an SDK that had moved on — a
      # deterministic "Clang dependency scanner failure: … mtime changed" on
      # EVERY run, on `dev` included, not a flake and not fixed by a re-run.
      # `ProductBuildVersion` is the one thing that must coincide for a `.pcm`
      # to stay valid; folding it into the key means a republished image starts
      # a fresh lineage instead of poisoning the rolling one.
      # **La lignée se compte en MTIME, pas seulement en VERSION (#5084, corrigé
      # ici).** `ProductBuildVersion` seule ne suffit pas : Clang invalide un
      # `.pcm` en comparant l'HORODATAGE des en-têtes qu'il a lus, et une image
      # de runner reconstruite change ces horodatages sans toucher la version du
      # SDK. La clé servait alors un ModuleCache périmé, et le build tombait sur
      #
      #     Clang dependency scanner failure: file '…/AvailabilityVersions.h' has
      #     been modified since the module file '…/_AvailabilityInternal-….pcm'
      #     was built: mtime changed (was 1787976491, now 1788754383)
      #
      # puis, en cascade, sur `could not build module '_DarwinFoundation1'` — un
      # message qui n'accuse RIEN de ce que la PR contient et qu'on a d'abord pris
      # pour une corruption aléatoire du runner.
      #
      # On ajoute donc à la lignée l'horodatage de l'en-tête que le scanner cite,
      # et celui de la racine du SDK, qui bouge à toute reconstruction d'image.
      # Deux `stat`, instantanés — et une clé qui discrimine enfin sur ce que
      # Clang regarde vraiment.
      - name: SDK build version (clé de lignée du ModuleCache, #5084)
        id: sdkver
        run: |
          SDK=$(xcodebuild -version -sdk iphonesimulator ProductBuildVersion)
          ROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          RACINE=$(stat -f %m "$ROOT" 2>/dev/null || echo 0)
          ENTETE=$(stat -f %m "$ROOT/usr/include/AvailabilityVersions.h" 2>/dev/null || echo 0)
          echo "v=${SDK}-${RACINE}-${ENTETE}" >> "$GITHUB_OUTPUT"
          echo "lignée du ModuleCache : ${SDK}-${RACINE}-${ENTETE}"

      # Compiled modules / build products. RESTORE-ONLY; the save is explicit,
      # after the compile step (see "Save DerivedData build cache"), because the
      # post-job save is skipped on a timeout-cancellation exactly like the SPM
      # one. The toolchain + manifest prefix starts a fresh lineage on a
      # dependency or Xcode bump.
      #
      # ONE ENTRY PER LINEAGE, NOT PER COMMIT (#9692, 2026-10-08). The key used
      # to end in `${{ github.sha }}`: every run saved a new ~1 GB entry, and
      # every branch (dev, each ci/*, each PR) kept its own. Measured that day:
      # 6 DerivedData entries of ~1 GB, the repo at 10.6 GB against a 10 GB
      # budget — the caches evicted each other, SPM included. Now the key is the
      # lineage itself, only `dev` and `main` save it (every other ref RESTORES
      # dev's, which GitHub allows from the default branch), and the save
      # replaces the previous entry of the same ref instead of adding one.
      - name: Restore DerivedData build cache
        id: dd-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ios-dd-macos15-sdk${{ steps.sdkver.outputs.v }}-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: |
            ios-dd-macos15-sdk${{ steps.sdkver.outputs.v }}-

      # XcodeGen owns project generation (see commit dropping hand-edited
      # pbxproj entries). The committed Meeshy.xcodeproj/project.pbxproj is a
      # generated artifact and can lag behind newly-added sources; regenerate
      # it from project.yml so every file on disk is compiled (otherwise a new
      # file like a Bubble subview fails with "cannot find … in scope").
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate

      # Pre-resolve the SPM graph with retries. Firebase/grpc ship binary-target
      # zips fetched from dl.google.com, which intermittently fail mid-download
      # on the runner ("The network connection was lost." → exit 74) and took the
      # whole job down before a single test compiled. Resolving up front — into
      # the same fixed trees the cache restores and the test step reuses — lets
      # us retry the transient network failure, and a warm cache makes it
      # near-instant; a real resolution error still fails after the attempts.
      #
      # A SECOND, DISTINCT failure mode lives on the runner's own SwiftPM
      # artifact cache, not the network: a stale entry under
      # `~/Library/Caches/org.swift.swiftpm/artifacts/` makes SwiftPM refuse to
      # write it again ("already exists in file system"), and every retry then
      # replays the same command against the same corrupted cache, forever
      # (#6545). The retry logic lives in its own script — rather than inline
      # here — so `check-ios-spm-resolve-retry.mjs` can exercise it (fake
      # `xcodebuild`/`sleep` on PATH) without a macOS runner.
      - name: Resolve SPM packages (retry on transient network)
        run: |
          scripts/ci/resolve-spm-packages.sh \
            apps/ios/Meeshy.xcodeproj Meeshy \
            "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/spm"

      # Seed the SPM cache the INSTANT it resolves — before the compile that may
      # blow the timeout. actions/cache's post-job save is skipped when the job
      # is cancelled, and a timeout IS a cancellation: the first cold run proved
      # a combined cache never seeds because the compile is killed before
      # post-job runs. This explicit save sits right after a resolve that
      # finishes well within budget, so run N banks the ~6-min SPM download even
      # if it later times out compiling — run N+1 then starts warm and is far
      # likelier to finish the build, which in turn seeds the DerivedData cache.
      - name: Save SPM cache
        if: always() && steps.spm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/spm
          key: ios-spm-${{ hashFiles('apps/ios/Meeshy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Compile separately from running so DerivedData can be banked the moment
      # the (expensive) build finishes — see "Save DerivedData build cache".
      - name: Build for testing
        run: |
          # CI-only compile trims (safe — no IDE, no archiving here):
          #   COMPILER_INDEX_STORE_ENABLE=NO  → skip the index-while-building
          #     store; it only feeds Xcode's IDE features, useless on CI.
          #   DEBUG_INFORMATION_FORMAT=dwarf  → emit DWARF in the binaries but
          #     skip the separate .dSYM bundle generation/linking; a test run
          #     symbolicates fine without it.
          #   ONLY_ACTIVE_ARCH=YES            → arm64 only (the single sim
          #     destination), never build the unused arch.
          #
          # ONE destination for both modes (#9692): `generic/platform=iOS
          # Simulator` needs no installed runtime, and its products run on any
          # arm64 simulator through `test-without-building -xctestrun` — the
          # shards below do exactly that. It has NO active architecture, so
          # ONLY_ACTIVE_ARCH has nothing to reduce to and xcodebuild would
          # compile arm64 AND x86_64: double the most expensive step in the job.
          # macos-15 runners are Apple Silicon, so pin arm64 explicitly instead.
          DESTINATION='generic/platform=iOS Simulator'
          ARCH_SETTINGS=(ARCHS=arm64)
          # Les erreurs du compilateur partent AUSSI en annotations : le log
          # brut exige un token, la page publique du run non (même remède que
          # le résumé XCTest — leçon 265, lecteur distant sans rien d'autre).
          # `set +e` obligatoire : le runner lance ce script avec `bash -e`,
          # et -e + pipefail tuent le script sur le pipeline en échec AVANT
          # d'atteindre le bloc d'annotations (constaté au run #79 — exit 65
          # nu, zéro annotation). On sort explicitement avec `exit "$rc"`.
          #
          # NE PAS passer `OTHER_SWIFT_FLAGS` ici. Essayé le 2026-08-16 pour
          # ajouter `-Xfrontend -continue-building-after-errors` (le frontend
          # Swift s'arrête sinon à la première erreur d'un module) : un
          # réglage de build en ligne de commande REMPLACE la valeur, il ne
          # s'y ajoute pas, et `$(inherited)` n'a rien à hériter à ce niveau.
          # Or SwiftPM compile les `swiftSettings` de `Package.swift` en
          # `OTHER_SWIFT_FLAGS` sur les cibles du package : l'override a effacé
          # `.enableUpcomingFeature("InferIsolatedConformances")` (SE-0470) et
          # `.enableUpcomingFeature("NonisolatedNonsendingByDefault")`
          # (SE-0461) de MeeshySDK, et 19 erreurs de concurrence stricte sont
          # apparues dans MeeshyUI — sur du code inchangé et vert par ailleurs
          # (run 31945994902). Le seul emplacement sûr pour un drapeau Swift
          # est `apps/ios/project.yml`, qui ne porte QUE les cibles du dépôt.
          #
          # Ce que le bloc d'annotations ci-dessous remonte reste complet pour
          # ce que le compilateur a effectivement émis : la compilation par
          # lots parallèles produit déjà plusieurs erreurs par run (19 sur
          # celui-là). Ce qu'on n'a pas, c'est l'exhaustivité DANS un fichier.
          # Pour la classe d'erreurs qui avait motivé la tentative, le garde
          # `scripts/check-swift-viewbuilder.sh` la donne en 1 s sur ubuntu,
          # avant même que ce runner ne démarre.
          set -o pipefail
          set +e
          xcodebuild build-for-testing \
            -project apps/ios/Meeshy.xcodeproj \
            -scheme Meeshy \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            "${ARCH_SETTINGS[@]}" \
            -quiet 2>&1 | tee /tmp/xcodebuild-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # `chemin:ligne:colonne: error: message` — le format des
            # diagnostics Swift/Clang. Le chemin est ABSOLU sur le runner ;
            # une annotation veut un chemin relatif au dépôt, sinon elle ne
            # s'ancre pas sur le diff de la PR et le lecteur doit encore
            # chercher où regarder.
            grep -E '^/.+:[0-9]+:[0-9]+: (error|fatal error): ' /tmp/xcodebuild-build.log \
              | sed "s|^${GITHUB_WORKSPACE}/||" | sort -u > /tmp/ios-errors-located.txt || true
            # Erreurs sans position : édition de liens, phase de build, xcodebuild.
            grep -E ': (error|fatal error): ' /tmp/xcodebuild-build.log \
              | grep -vE '^/.+:[0-9]+:[0-9]+: ' | sort -u > /tmp/ios-errors-global.txt || true
            LOCATED=$(wc -l < /tmp/ios-errors-located.txt | tr -d ' ')
            GLOBAL=$(wc -l < /tmp/ios-errors-global.txt | tr -d ' ')
            TOTAL=$((LOCATED + GLOBAL))
            {
              echo '## Erreurs de compilation iOS'
              echo ''
              echo "**${TOTAL} erreur(s) distincte(s)** — ${LOCATED} localisée(s), ${GLOBAL} sans position."
              echo ''
              echo '```'
              cat /tmp/ios-errors-global.txt /tmp/ios-errors-located.txt | head -n 200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Toutes les erreurs de compilation (${TOTAL})"
            cat /tmp/ios-errors-global.txt /tmp/ios-errors-located.txt
            echo "::endgroup::"
            # Plafond GitHub : 10 annotations par étape. Les localisées
            # passent en premier — ce sont les seules qui s'ancrent.
            head -n 9 /tmp/ios-errors-located.txt | while IFS= read -r line; do
              FILE=${line%%:*}; REST=${line#*:}
              LINE=${REST%%:*}; REST=${REST#*:}
              COL=${REST%%:*}
              echo "::error file=${FILE},line=${LINE},col=${COL},title=Compilation Swift::${line#*: error: }"
            done
            head -n 1 /tmp/ios-errors-global.txt | while IFS= read -r line; do
              echo "::error title=Compilation (sans position)::${line:0:220}"
            done
            echo "::notice title=Compilation::${TOTAL} erreur(s) distincte(s) — liste complète dans le résumé du run"
          fi
          exit "$rc"

      # #9694 — garde BINAIRE : aucune deinit isolée dans l'app ni dans
      # MeeshyTests. C'est elle qui autorise les tranches à tourner sur un
      # runtime préinstallé (18.4+/26) : une seule deinit isolée revenue y
      # tuerait le processus de test au démontage. Elle lit ce que le
      # compilateur a produit, en secondes, dans les deux modes.
      - name: Aucune deinit isolée dans les produits (#9694)
        run: |
          scripts/ci/check-ios-isolated-deinits.sh --self-test
          scripts/ci/check-ios-isolated-deinits.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator"

      # Seed DerivedData the instant the compile succeeds — BEFORE the test run,
      # which can itself be slow. Same rationale as "Save SPM cache": the
      # post-job save is skipped on a timeout-cancellation, so an explicit save
      # here banks the compiled build products even if the run phase later
      # overruns. `success()` guards against caching a broken build. Progressive:
      # once seeded, the next run restores compiled modules and the compile is
      # incremental (minutes, not the ~15+ min cold compile that was overrunning
      # the budget). Only `dev` and `main` save (see the restore step): a cache
      # key is immutable, so the previous entry of THIS ref is deleted first,
      # then the fresh products take the same key — one entry per lineage and
      # per ref, always the latest build.
      - name: Retire the previous DerivedData entry of this lineage
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ios-dd-macos15-sdk${{ steps.sdkver.outputs.v }}-${{ hashFiles('apps/ios/project.yml') }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=${KEY}&ref=${GITHUB_REF}" >/dev/null 2>&1 || echo "aucune entrée précédente pour ${KEY} sur ${GITHUB_REF}"

      - name: Save DerivedData build cache
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ios-dd-macos15-sdk${{ steps.sdkver.outputs.v }}-${{ hashFiles('apps/ios/project.yml') }}


      # Les produits de test partent vers les tranches. Archivés en tar AVANT
      # le téléversement : `upload-artifact` ne conserve ni les permissions ni
      # les liens symboliques, et un exécutable d'app sans son bit `x` ne se
      # lance pas sur le simulateur. Compression minimale : l'archive est
      # surtout du Mach-O déjà dense, et le temps compte plus que les octets.
      - name: Archive test products
        if: env.COMPILE_ONLY != 'true'
        run: |
          set -euo pipefail
          ls "$RUNNER_TEMP/DerivedData/Build/Products"/*.xctestrun
          tar -cf "$RUNNER_TEMP/ios-test-products.tar" -C "$RUNNER_TEMP/DerivedData/Build" Products
          du -h "$RUNNER_TEMP/ios-test-products.tar"

      - name: Upload test products
        if: env.COMPILE_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/ios-test-products.tar
          compression-level: 1
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # ===========================================================================
  # TRANCHES DE LA SUITE — #9692
  # ===========================================================================
  # Chaque tranche télécharge les produits du job `ios-build`, provisionne son
  # simulateur (IOS_TEST_RUNTIME) et exécute SA part des classes MeeshyTests, décidée par
  # `scripts/ci/ios-test-shards.mjs` (glouton sur la durée mesurée, déterministe,
  # la dernière tranche étant le RESTE : une classe que l'énumération manquerait
  # tourne quand même, une fois). `fail-fast: false` : une tranche rouge ne doit
  # pas annuler les autres, le verdict veut TOUS les échecs.
  #
  # Le runtime est PRÉINSTALLÉ (26.1, #9694) : plus aucun téléchargement par
  # tranche. Le cache du runtime 18.2 téléchargé avait été étudié et écarté
  # (budget de cache de 10 Go déjà plein — #9692).
  ios-test-shard:
    needs: [scope, ios-build]
    if: needs.scope.outputs.run_tests == 'true'
    name: Tests unitaires — tranche ${{ matrix.shard }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards || '[1]') }}
    steps:
      # Checkout COMPLET, au même chemin que le job de build : des témoins
      # relisent des sources du dépôt par `#filePath` (gardes de source).
      - uses: actions/checkout@v7

      - name: Select Xcode 26.1.1 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: ios-test-products
          path: ${{ runner.temp }}

      - name: Unpack test products
        id: products
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/ios-test-products.tar" -C "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ios-test-products.tar"
          COUNT=$(find "$RUNNER_TEMP/Products" -maxdepth 1 -name '*.xctestrun' | wc -l | tr -d ' ')
          [ "$COUNT" = "1" ] || { echo "::error::${COUNT} fichier(s) .xctestrun, 1 attendu"; exit 1; }
          echo "xctestrun=$(find "$RUNNER_TEMP/Products" -maxdepth 1 -name '*.xctestrun')" >> "$GITHUB_OUTPUT"

      # The runtime and the photos-add grant live in a script shared with
      # sdk-tests.yml (one bascule — IOS_TEST_RUNTIME* above). Since #9694 the
      # shards run on the runner's PRE-INSTALLED 26.1: no download, the
      # isolated-deinit crash at xctest teardown is fixed at the root and
      # guarded in the build job. (The SDK suite stays on a downloaded 18.2
      # until its snapshot baselines are re-recorded — #9701.)
      #
      # The photos-add grant lets CameraCaptureSaveRuntimeTests (the "film +
      # validate" SIGTRAP guard) exercise PhotoLibraryManager instead of
      # hitting its skipIfUnauthorized() XCTSkip when run locally/on demand.
      - name: Provision iOS simulator
        id: sim
        env:
          GRANT_BUNDLE_ID: me.meeshy.app
        run: scripts/ci/provision-ios-simulator.sh

      - name: Run iOS tests (without building)
        id: tests
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
          SHARD: ${{ matrix.shard }}
          XCTESTRUN: ${{ steps.products.outputs.xctestrun }}
          SIM_ID: ${{ steps.sim.outputs.sim_id }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          rm -rf TestResults.xcresult
          # La sélection de la tranche : une ligne = un argument xcodebuild.
          # Boucle `read` plutôt que `mapfile` : le bash du runner macOS est le
          # 3.2 système.
          node scripts/ci/ios-test-shards.mjs --suite ios --args --shard "$SHARD" \
            --shards "$IOS_TEST_SHARDS" --only "$ONLY_TESTING" > "$RUNNER_TEMP/selection.txt"
          SELECTION=()
          while IFS= read -r arg; do SELECTION+=("$arg"); done < "$RUNNER_TEMP/selection.txt"
          echo "tranche ${SHARD} : $(grep -c '^-only-testing' "$RUNNER_TEMP/selection.txt") -only-testing, $(grep -c '^-skip-testing' "$RUNNER_TEMP/selection.txt" || true) -skip-testing"
          # The 3 XCTMetric benchmark suites (MessageListPerformanceTests,
          # BubbleSimpleMessagePerfTests, SearchPerformanceTests) are
          # intentionally gated OUT of the regular run — see their file
          # headers and scripts/ios-perf-benchmark.sh, which is the only
          # invocation meant to exercise them (via -only-testing). Gating
          # is invocational, not env-var based (RUN_PERF_BENCHMARKS never
          # reaches the in-simulator test process under `xcodebuild test`),
          # so -skip-testing is the only thing that actually excludes them.
          # meeshy.sh mirrors the same exclusion locally (NON_PHASE_SUITES).
          # The shard script excludes the same four from its split
          # (ALWAYS_SKIPPED, kept equal to this list by its witness).
          # Each shard runs SERIALLY on its own runner — the parallelism is
          # across runners. Parallel testing within a runner was tried and
          # reverted: on the 3 vCPU / 7 GB standard runner it saved only ~2 min.
          #
          # CameraCaptureSaveRuntimeTests is skipped: it drives real
          # `PHPhotoLibrary.performChanges` writes, whose completion handler
          # never fires on the headless CI simulator (photolibraryd hangs) — both
          # tests hit the 3-min per-test allowance in SERIAL, so it is not a
          # parallel/TCC-clone artefact. They stay valuable as LOCAL/on-device
          # guards for the film+validate SIGTRAP (see the file header) but a CI
          # simulator cannot execute photo-library writes reliably.
          # `arch=arm64` pinned (see #5909): `id=<udid>` alone resolves to two
          # destinations, one per architecture, and xcodebuild's unspecified
          # tie-break can pick the one this Apple Silicon runner cannot run.
          set +e
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${SIM_ID},arch=arm64" \
            "${SELECTION[@]}" \
            -skip-testing:MeeshyTests/MessageListPerformanceTests \
            -skip-testing:MeeshyTests/BubbleSimpleMessagePerfTests \
            -skip-testing:MeeshyTests/SearchPerformanceTests \
            -skip-testing:MeeshyTests/CameraCaptureSaveRuntimeTests \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 \
            -quiet
          rc=$?
          echo "seconds=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Surface test failures
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          PROVISION_S: ${{ steps.sim.outputs.seconds || 0 }}
          TESTS_S: ${{ steps.tests.outputs.seconds || 0 }}
        run: |
          BUNDLE=TestResults.xcresult
          mkdir -p shard-summary
          if [ ! -d "$BUNDLE" ]; then
            echo "No result bundle produced."
            jq -n --argjson shard "$SHARD" --argjson provision "$PROVISION_S" --argjson tests "$TESTS_S" \
              '{shard: $shard, provision_s: $provision, tests_s: $tests, result: "absent", total: 0, passed: 0, failed: 0, skipped: 0}' \
              > "shard-summary/shard-${SHARD}.json"
            exit 0
          fi
          xcrun xcresulttool get test-results summary --path "$BUNDLE" > /tmp/xcresult-summary.json 2>/dev/null \
            || echo '{}' > /tmp/xcresult-summary.json
          jq --argjson shard "$SHARD" --argjson provision "$PROVISION_S" --argjson tests "$TESTS_S" \
            '{shard: $shard, provision_s: $provision, tests_s: $tests, result: (.result // "?"),
              total: (.totalTestCount // 0), passed: (.passedTests // 0), failed: (.failedTests // 0),
              skipped: (.skippedTests // 0)}' /tmp/xcresult-summary.json > "shard-summary/shard-${SHARD}.json"
          cat "shard-summary/shard-${SHARD}.json"
          # Durées par classe : elles alimentent scripts/ci/test-timings/ios.json,
          # qui équilibre les tranches sur le temps MESURÉ plutôt que sur le
          # nombre de tests (le verdict publie leur union en artefact).
          xcrun xcresulttool get test-results tests --path "$BUNDLE" > /tmp/xcresult-tests.json 2>/dev/null || echo '{}' > /tmp/xcresult-tests.json
          node scripts/ci/ios-test-shards.mjs --suite ios --timings /tmp/xcresult-tests.json > "shard-summary/timings-${SHARD}.json" || echo '{}' > "shard-summary/timings-${SHARD}.json"
          gzip -c /tmp/xcresult-tests.json > "shard-summary/xcresult-tests-${SHARD}.json.gz" || true
          echo "::group::Test failure summary"
          head -c 60000 /tmp/xcresult-summary.json
          echo "::endgroup::"
          # Le même résumé, publié dans le step summary : la page publique du run
          # l'affiche sans authentification — le log brut, lui, exige un token.
          # (Leçon 265 : écrire les messages d'échec pour le lecteur distant qui
          # n'a QUE la page du run.)
          {
            echo "## Résumé XCTest — tranche ${SHARD} (échecs)"
            echo ''
            echo '```json'
            head -c 24000 /tmp/xcresult-summary.json
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Les step summaries sont rendus par XHR : un lecteur sans token ne les
          # voit pas. Les ANNOTATIONS, elles, sont server-rendered sur la page du
          # run — chaque échec devient donc une annotation (plafond GitHub :
          # 10 par étape ; l'étape suivante prend le relais pour les suivants).
          jq -r '(.testFailures // [])[] | "\(.targetName // "?")/\(.testName // .testIdentifier // "?") — \((.failureText // "?") | .[0:180] | gsub("\n"; " "))"' \
            /tmp/xcresult-summary.json > /tmp/xctest-failures.txt || true
          TOTAL=$(wc -l < /tmp/xctest-failures.txt | tr -d ' ')
          echo "::notice title=Échecs XCTest (tranche ${SHARD})::${TOTAL} test(s) en échec (liste en annotations ci-dessous)"
          head -n 9 /tmp/xctest-failures.txt | while IFS= read -r line; do
            echo "::error title=XCTest échec::${line}"
          done

      - name: Annoter les échecs restants (10 à 27)
        if: always()
        run: |
          [ -f /tmp/xctest-failures.txt ] || exit 0
          sed -n '10,27p' /tmp/xctest-failures.txt | while IFS= read -r line; do
            echo "::error title=XCTest échec (suite)::${line}"
          done

      - name: Publish shard summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-shard-summary-${{ matrix.shard }}
          path: shard-summary/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

  # Le VERDICT de la suite, sous le nom de check historique : les veilles qui
  # cherchent « Build app + tests unitaires » le retrouvent, et il ne verdit
  # que si la compilation ET chaque tranche sont vertes — une tranche annulée
  # (délai, poussée concurrente) n'est jamais un vert. Il rougit aussi sur une
  # tranche qui n'a exécuté AUCUN test : une sélection vide est une faute de
  # répartition, pas un succès.
  ios-tests:
    needs: [scope, ios-build, ios-test-shard]
    if: always() && needs.scope.outputs.run_tests == 'true'
    # Nom STATIQUE : un job sauté (compilation seule) n'évalue pas son nom, et
    # l'expression brute s'affichait telle quelle dans la liste des checks
    # (run 37830972768). Sauté, « Build app + tests unitaires » dit juste.
    name: Build app + tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Download shard summaries
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: ios-shard-summary-*
          path: summaries
          merge-multiple: true

      - name: Verdict
        env:
          BUILD_RESULT: ${{ needs.ios-build.result }}
          SHARDS_RESULT: ${{ needs.ios-test-shard.result }}
          EXPECTED_SHARDS: ${{ needs.scope.outputs.shards }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/test-shards-verdict.sh "Suite iOS en tranches"

      # Les durées mesurées par classe, à recopier dans
      # scripts/ci/test-timings/ios.json quand l'équilibre des tranches dérive.
      - name: Publish measured timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-timings
          path: timings.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
