name: iOS

# Re-enabled 2026-06-07. Runs the app's MeeshyTests suite. The MeeshySDK package
# suite lives in a separate workflow (sdk-tests.yml) gated only on
# packages/MeeshySDK/**, so an app-only PR is not blocked by it. This workflow
# still triggers on packages/MeeshySDK/** because the app depends on the SDK and
# we want app-level coverage of SDK changes.
#
# Two environment facts drive the toolchain configuration below:
#   1. The "test runner crashed … at swift_task_deinitOnExecutorMainActorBackDeploy"
#      failure is a bug in the iOS 26.x SIMULATOR runtime's isolated-deinit path
#      (double-free of a TaskLocal scope at xctest teardown for @MainActor classes
#      with isolated deinits). It is ABSENT on the iOS 18.x runtime.
#   2. The Timeline snapshot baselines were recorded on iOS 18.2.
# So we COMPILE with Xcode 26.1.1 (Swift 6.2, required by the package) but RUN the
# tests on an iOS 18.x simulator: crash-free AND consistent with the baselines.
# Product code also received `nonisolated deinit` hardening for the affected
# classes.
#
# TRIGGER SCOPE (2026-07-27, measured on runs #3728-#3741): the job itself takes
# 29-45 min, but a PR-triggered run took 56 min to 1h34 wall-clock. The extra
# 24-49 min is pure QUEUE time — the account's macOS concurrency ceiling was
# saturated by 5-6 simultaneous PR runs (plus sdk-tests.yml, also macos-15), so
# every new PR run just waited for a runner. Fanning this suite out over every
# open PR therefore made it slower for everyone, including dev/main.
# So: the FULL suite runs automatically on `dev` ONLY. main and ad-hoc checks
# run on demand from the Actions tab ("Run workflow" → pick any branch). No
# branch protection requires this check, so neither trigger can deadlock a merge.
#
# PR GATE RESTORED, COMPILE-ONLY (2026-08-12, measured over the 30 days to
# 2026-08-12 — 148 PRs touching apps/ios/**, 340 pushes after collapsing commits
# <5 min apart, each run capped by the cancel-in-progress group below):
#
#   >= 1 iOS run in flight   8.9% of wall clock   (64.2 h / 720)
#   >= 2 in flight           1.9%                 (13.4 h)
#   >= 5 in flight           0.2%                 ( 1.6 h)
#
# The July decision hinged on 5-6 SIMULTANEOUS runs being the norm. They are not:
# the window is idle 91% of the time, and the 5-6 figure is reached for 1.6 h a
# month, only inside batch-merge bursts (whose commit timestamps overstate real
# push times, so that tail is an upper bound). What saturated the ceiling was the
# 29-45 min FULL suite, not the trigger.
#
# So the PR run does the half that is cheap and catches what actually breaks —
# the compile, app AND test targets — and skips the two network/CPU posts that
# cost the most and gate the least at PR time: the 7-min iOS 18.2 runtime
# download and the 8-min test execution.
#
# MEASURED on the first run of this gate (#31564979638, job 94014846909, the PR
# that introduced it — cold SPM cache, cold DerivedData), against the 35-min dev
# baseline decomposed above:
#     0s     provision the iOS 18.2 runtime     ← skipped   (was 7m01)
#     2m02   resolve SPM (cache miss)                       (was 8m07)
#     6m33   build-for-testing                              (was 8m58)
#     32s    save DerivedData
#     0s     test-without-building              ← skipped   (was 8m20)
#   =10m02 total. The pre-wiring estimate was "~18 min cold, ~10 min warm"; the
# cold run came in at what was predicted for a WARM one. Note the compile is
# FASTER than the dev baseline's, not slower — which is the observable proof
# that the ARCHS=arm64 pin below is taking effect. Losing that pin would show up
# here as a compile roughly double this, not as a failure.
#
# The next run on the same branch (job 94017664432), warm on BOTH caches, is the
# steady state to budget against:
#     18s    restore SPM cache                  ← hit
#     14s    restore DerivedData                ← hit, seeded by the cold run
#     23s    resolve SPM (warm)                             (was 2m02 cold)
#     3m19   build-for-testing (incremental)                (was 6m33 cold)
#     17s    save DerivedData
#   =4m54 total. So a cold gate costs ~10 min and the steady state ~5 — budget
# ~5, not ~10. Cold recurs when the SPM key (`project.yml`) changes or the
# DerivedData lineage restarts, not per PR.
#
# That second run also settles half of an open question: DerivedData saved by a
# compile-only run IS reused by the next compile-only run (6m33 → 3m19). What is
# still unverified is the CROSS-mode case — whether a `generic/platform` build's
# products are reused by an `id=<sim>` build on dev, and the reverse. Both modes
# share one cache lineage deliberately (two multi-GB lineages would thrash the
# repo's cache limit and evict the SPM cache); if the cross-mode reuse turns out
# to be nil, the cost is a cold compile on dev, never a wrong result.
#
# TESTS SUR DEMANDE — SAUF SUR `main` (2026-08-15). Le défaut s'inverse sur les
# branches et les PR : la COMPILATION y tourne partout, l'EXÉCUTION des tests ne
# tourne que si on la demande. La demande s'écrit dans le SUJET du commit de
# tête : « smoke test », « run test » ou « to test », insensible à la casse.
#
# Trois portées, dans cet ordre de priorité :
#   1. `workflow_dispatch`        → suite complète (un lancement manuel est déjà explicite)
#   2. poussée sur `main`         → suite complète, SANS opt-in
#   3. tout le reste (PR, `dev`)  → compilation, sauf mot-clé au sujet du commit
#
# La règle 2 tient à ce que `main` n'est pas une branche de travail : c'est ce
# qui part en production, et rien n'y est jamais « sur demande ». Le reste du
# dépôt suit déjà cette logique — `ci.yml` bâtit gateway, web, shared, agent,
# translator, Prisma et l'image sur chaque poussée `main` sans condition. Le
# Swift était le seul arbre à ne pas y passer.
#
# Une PR VERS `main` reste sous le régime de l'opt-in : sur un event
# `pull_request`, `github.ref` vaut `refs/pull/N/merge` et jamais
# `refs/heads/main`, donc la règle 2 ne peut pas l'attraper par accident.
#
# Ce que ce réglage a immédiatement révélé (run 31874465536, PR #3010) : la
# suite complète portait 17 échecs hérités de `main` — appels, répertoire,
# catalogue de localisation — invisibles depuis des semaines parce que les PR
# étaient compile-seule et que la suite ne tournait que sur `dev`. C'est
# exactement le trou que la règle 2 ferme.
#
# Motif : la règle précédente liait la bascule à l'ÉVÉNEMENT (`COMPILE_ONLY =
# event == 'pull_request'`), donc chaque poussée sur `dev` payait les deux postes
# chers — 7 min de runtime iOS 18.2 + 8 min de suite — que la PR, elle, évitait
# soigneusement. Le coût était simplement déplacé, pas supprimé.
#
# Le job `scope` résout la portée sur ubuntu avant d'engager la moindre minute
# macOS : lire une ligne de `git log` n'a pas à consommer la ressource rare. Il
# lit le sujet sur `pull_request.head.sha`, jamais sur `github.sha` — sur un
# event `pull_request` ce dernier désigne le commit de merge synthétique, dont le
# sujet est « Merge … into … » et ne porterait jamais le mot-clé.
#
# Deux jobs, un seul jeu d'étapes macOS : `COMPILE_ONLY` gate les étapes 10 et 12
# (séparées depuis toujours), il n'y a donc pas de seconde copie de la chaîne
# d'outils qui puisse dériver. Gardé par
# `packages/shared/__tests__/ci/ios-pr-compile-gate.test.ts`, qui tourne sur
# chaque PR — le retrait du 2026-07-27 est passé inaperçu des semaines durant
# précisément parce que rien ne le surveillait. La garde couvre aussi les trois
# mots-clés : les perdre ne rendrait rien rouge, ça rendrait seulement les tests
# indemandables, et la CI resterait verte en ne vérifiant plus rien.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/ios/**'
      - 'packages/MeeshySDK/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - main
      - dev
    # `ready_for_review` is NOT in the default type set. Without it a PR opened
    # as a draft (skipped by the job-level `if` below) and later marked ready
    # would never emit another event, and the gate would be silently skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/ios/**'
      - 'packages/MeeshySDK/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# A hung xctest must never sit for GitHub's 6h default. A new push on the same
# ref cancels stale in-progress runs so we never accumulate multi-hour zombies.
#
# PIÈGE, mesuré le 2026-08-15 sur la PR #3010. Sur un événement `pull_request`,
# le filtre `paths:` ci-dessus s'évalue sur le DIFF COMPLET de la PR (base → tête),
# pas sur les fichiers de la poussée. Une PR qui touche `apps/ios/**` déclenche
# donc ce workflow à CHAQUE synchronisation — y compris pour une poussée qui ne
# contient que de la documentation. Combiné au `cancel-in-progress` ci-dessous,
# cela veut dire qu'un commit de docs ANNULE la suite en cours.
#
# Conséquence pratique pour l'opt-in par mot-clé : le mot-clé doit se trouver
# dans le sujet du DERNIER commit poussé. Demander les tests puis pousser un
# commit de docs par-dessus annule le run demandé et le remplace par une simple
# compilation, silencieusement — le nouveau run est vert, il n'a juste rien testé.
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Résout la PORTÉE du run avant d'engager la moindre minute macOS.
  #
  # La compilation est le défaut : elle attrape ce qui casse vraiment (types,
  # signatures, fichiers absents du projet) pour ~10 min. L'exécution des tests,
  # elle, coûte le téléchargement du runtime iOS 18.2 (7 min) plus la suite
  # elle-même (8 min) — un prix qu'on ne paie que sur demande explicite.
  #
  # La demande s'écrit dans le SUJET DU COMMIT : « smoke test », « run test » ou
  # « to test », insensible à la casse. Le sujet est lu sur le commit de TÊTE de
  # la branche (jamais sur le commit de merge synthétique que GitHub fabrique
  # pour un event `pull_request`, dont le sujet est toujours « Merge … into … »
  # et ne contiendrait donc jamais le mot-clé).
  #
  # `workflow_dispatch` force les tests : lancer la suite à la main depuis
  # l'onglet Actions est déjà un acte explicite, exiger en plus un mot-clé dans
  # un commit déjà poussé n'aurait aucun sens.
  #
  # Ce job tourne sur ubuntu — le pool macOS est la ressource rare, on ne
  # l'engage pas pour lire une ligne de log git.
  scope:
    name: Portée du run
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.resolve.outputs.run_tests }}
      subject: ${{ steps.resolve.outputs.subject }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - id: resolve
        name: Lire le sujet du commit de tête
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          echo "subject=${subject}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Suite complète — déclenchement manuel."
            exit 0
          fi

          # `main` n'est pas une branche de travail : c'est ce qui part en
          # production. Rien n'y est jamais « sur demande ». L'opt-in par
          # mot-clé gouverne les branches et les PR ; la ligne principale
          # exécute tout, systématiquement.
          #
          # Une PR VERS main garde le régime de l'opt-in : sur un event
          # `pull_request`, `github.ref` vaut `refs/pull/N/merge`, jamais
          # `refs/heads/main` — la condition ci-dessous ne s'applique donc
          # qu'à une poussée réelle sur la ligne principale.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Suite complète — poussée sur main, aucun opt-in requis."
            exit 0
          fi

          # `grep -i -E` sur le sujet seul : un mot-clé enfoui dans le CORPS du
          # message ne compte pas. Le corps sert à expliquer, le sujet à décider.
          if printf '%s' "$subject" | grep -qiE 'smoke test|run test|to test'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Suite complète — mot-clé trouvé dans le sujet du commit."
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Portée::Compilation seule. Pour exécuter la suite, mettre « smoke test », « run test » ou « to test » dans le SUJET du commit."
          fi

  ios-tests:
    needs: scope
    # Le nom du check DIT ce qui a tourné. C'est la seule chose qui distingue,
    # dans l'interface de la PR, un vert qui a bâti l'app d'un vert qui a bâti
    # ET tout exécuté — et sans cette distinction, « iOS Tests : vert » se lit
    # comme « les tests passent » alors que la plupart des runs n'en exécutent
    # aucun. Les deux moitiés restent un seul job : `test-without-building`
    # consomme le produit de `build-for-testing` pour une destination donnée,
    # les séparer imposerait soit de reconstruire, soit de faire transiter
    # ~635 Mo de DerivedData entre deux jobs.
    name: ${{ needs.scope.outputs.run_tests == 'true' && 'Build app + tests unitaires' || 'Build app (app + cibles de test)' }}
    # A draft PR is work in progress; its compile is the author's business, not
    # the shared macOS pool's. `ready_for_review` above brings the gate back.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    env:
      # Compilation seule par défaut — cf. le job `scope` ci-dessus. Les tests
      # ne s'exécutent que sur demande explicite (mot-clé au sujet du commit,
      # ou lancement manuel).
      COMPILE_ONLY: ${{ needs.scope.outputs.run_tests != 'true' }}
    # STOPGAP cap, sized to the measured worst case — NOT a healthy target.
    # This suite on the standard 3 vCPU / 7 GB runner is dominated by
    # high-variance steps no cache removes: iOS 18.2 runtime download 8-14 min
    # (network), SPM resolve 3-6.6 min (network), compile 8-9 min (DerivedData
    # incremental reuse is unreliable across ephemeral runners — one 4.5-min
    # build was a fluke), + 14-16 min serial tests. Observed range ≈ 38-44 min;
    # 30/35/40 caps all timed out. 50 covers the tail with margin so CI stops
    # flapping. The RIGHT fix is macos-15-xlarge (faster compile/tests + enough
    # RAM for real parallel testing, impossible on this runner). Hard cap kept
    # so a real deadlock fails.
    #
    # WHAT xlarge WOULD ACTUALLY BUY (measured step-by-step on run #31488415343,
    # a green 35-min run on dev, 2026-08-11 — the "reliably under ~30 min" above
    # was an estimate, this is the meter):
    #   38s   checkout + Xcode select + cache restore + XcodeGen
    #   7m01  provision the iOS 18.2 runtime      ← NETWORK-bound
    #   8m07  resolve SPM (cache miss)            ← NETWORK-bound
    #   36s   save SPM cache
    #   8m58  build-for-testing                   ← CPU-bound
    #   40s   save DerivedData
    #   8m20  test-without-building               ← CPU-bound
    #   26s   failure summary + job teardown
    # 15 of the 35 minutes are network, and no runner size shortens them. xlarge
    # attacks the 17 CPU-bound minutes (plausibly → 6-8), so the honest estimate
    # is ~24 min, not "under 30 by a wide margin", at 2-4x the per-minute rate.
    #
    # And it does NOT re-open the pull_request trigger. That was dropped for
    # QUEUE saturation (see TRIGGER SCOPE above), not for job duration: a
    # shorter job does not create a runner. What a PR-time gate actually needs
    # is far cheaper — the compile alone. Steps 10 and 12 are already separate;
    # a build-only job can drop the simulator provisioning entirely by targeting
    # `generic/platform=iOS Simulator`, which removes BOTH the 7-min runtime
    # download and the 8-min test run: ~18 min cold, ~10 min on a warm SPM
    # cache, on this same standard runner. Measure how many PRs touch
    # apps/ios/** concurrently before wiring it — that number, not the duration,
    # is what closed the door in July. That measurement now exists — see
    # "PR GATE RESTORED" in the header — and it is what wired the gate below.
    #
    # 30 stays the PR cap; 50 stays the cap for the full suite. The first
    # measured gate run took 10m02 end to end (see the header), so 30 is ~3x the
    # observed cost — deliberately loose, because the two variable posts it
    # keeps (SPM resolve, compile) are network- and contention-sensitive. A
    # compile that overruns 30 min is hung, not slow.
    timeout-minutes: ${{ needs.scope.outputs.run_tests == 'true' && 50 || 30 }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.1.1 (Swift 6.2)
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer

      # SPM checkouts + binary-target zips (Firebase/gRPC from dl.google.com,
      # ~6 min cold and flaky). RESTORE-ONLY here; the matching save runs right
      # after resolve — see the "Save SPM cache" step for why the split matters.
      # Kept in its own tree (`$RUNNER_TEMP/spm`, via -clonedSourcePackagesDirPath)
      # so it caches independently of the compiled build products below.
      - name: Restore SPM cache
        id: spm-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/spm
          key: ios-spm-${{ hashFiles('apps/ios/project.yml') }}

      # **La lignée du cache est celle de l'IMAGE, pas celle du libellé d'Xcode**
      # (#5084). Le préfixe `xc26_1_1` encodait la version COMMERCIALE d'Xcode ;
      # le SDK bouge À L'INTÉRIEUR de ce libellé quand l'image du runner est
      # republiée, et un `.pcm` bâti sous une révision devient invalide sous
      # l'autre — sans qu'aucune erreur ne nomme un fichier du dépôt :
      #
      #   error: Clang dependency scanner failure: … 'AvailabilityVersions.h'
      #   has been modified since the module file '…_AvailabilityInternal-….pcm'
      #   was built: mtime changed (was 1787976491, now 1785128638)
      #
      # MESURE du 2026-09-04 — et c'est elle qui décide de la forme de la clé :
      # les DEUX SENS de cet écart apparaissent selon le run (« was A, now B »
      # le 03, « was B, now A » le 04, même `.pcm`). Il ne s'agit donc pas d'une
      # image mise à jour une fois, mais de **deux révisions qui alternent dans
      # le pool** — d'où un rouge un run sur deux sur `dev` (1024 ✓, 1025 ✗,
      # 1026 ✓, 1027 ✗, 1028 ✓), déterministe et jamais un flake.
      #
      # `ImageVersion` est donc le discriminant JUSTE : c'est la chose qui
      # change entre les deux runs qu'on a mesurés. `ProductBuildVersion` seul
      # ne suffirait pas — une republication d'image peut laisser le numéro de
      # build du SDK intact en changeant les mtimes, et c'est précisément le cas
      # observé. Il reste dans la clé comme second axe et pour la lisibilité.
      #
      # Le prix est assumé : une image republiée repart sur un ModuleCache froid
      # (~15 min, coût documenté aux lignes 50-74). Un cache manquant coûte des
      # minutes ; un cache périmé coûte le run entier, et un run sur deux.
      - name: Empreinte de l'image du runner (lignée du ModuleCache)
        id: sdkfp
        run: |
          SDKBUILD="$(xcodebuild -version -sdk iphonesimulator ProductBuildVersion 2>/dev/null || echo unknown)"
          LINEAGE="img${ImageVersion:-unknown}-sdk${SDKBUILD}"
          echo "v=${LINEAGE}" >> "$GITHUB_OUTPUT"
          echo "Lignée du cache DerivedData : ${LINEAGE}"

      # Compiled modules / build products. RESTORE-ONLY; the save is explicit,
      # after the compile step (see "Save DerivedData build cache"), because the
      # post-job save is skipped on a timeout-cancellation exactly like the SPM
      # one. Rolling key → incremental reuse from the most recent prior run; the
      # lineage prefix starts a fresh one on a dependency, an Xcode OR an image
      # bump.
      - name: Restore DerivedData build cache
        id: dd-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ios-dd-macos15-${{ steps.sdkfp.outputs.v }}-${{ hashFiles('apps/ios/project.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-macos15-${{ steps.sdkfp.outputs.v }}-${{ hashFiles('apps/ios/project.yml') }}-
            ios-dd-macos15-${{ steps.sdkfp.outputs.v }}-

      # XcodeGen owns project generation (see commit dropping hand-edited
      # pbxproj entries). The committed Meeshy.xcodeproj/project.pbxproj is a
      # generated artifact and can lag behind newly-added sources; regenerate
      # it from project.yml so every file on disk is compiled (otherwise a new
      # file like a Bubble subview fails with "cannot find … in scope").
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate

      # Skipped in compile-only mode: `generic/platform=iOS Simulator` compiles
      # against the simulator SDK without any runtime installed, which is the
      # single largest saving of the PR gate (~7 min, network-bound).
      - name: Provision iOS 18.2 simulator
        id: sim
        if: env.COMPILE_ONLY != 'true'
        run: |
          set -e
          # iOS 18.5/18.6 (the runner's pre-installed 18.x) AND iOS 26.x all hit a
          # Swift runtime isolated-deinit crash at xctest teardown
          # (swift_task_deinitOnExecutorMainActorBackDeploy → double-free). Only
          # iOS 18.0–18.2 are crash-free, and the Timeline snapshot baselines were
          # recorded on 18.2. Download 18.2 on demand if the runner lacks it
          # (≈5 min, first run only per runner).
          if ! xcrun simctl list runtimes | grep -q "iOS 18.2"; then
            echo "Downloading iOS 18.2 simulator runtime…"
            xcodebuild -downloadPlatform iOS -buildVersion 18.2
          fi
          SIM_ID=$(xcrun simctl create "iPhone16Pro-iOS182-CI" "iPhone 16 Pro" "com.apple.CoreSimulator.SimRuntime.iOS-18-2")
          echo "sim_id=$SIM_ID" >> "$GITHUB_OUTPUT"
          # Boot the simulator and pre-grant the photos-add TCC permission so
          # CameraCaptureSaveRuntimeTests (the "film + validate" SIGTRAP guard,
          # see apps/ios/MeeshyTests/Unit/Components/CameraCaptureSaveRuntimeTests.swift)
          # actually exercises PhotoLibraryManager.saveVideo/saveImage instead of
          # always hitting its skipIfUnauthorized() XCTSkip. A freshly `simctl
          # create`d device has no grants, so without this the guard silently
          # never runs in CI.
          xcrun simctl boot "$SIM_ID"
          xcrun simctl privacy "$SIM_ID" grant photos-add me.meeshy.app

      # Pre-resolve the SPM graph with retries. Firebase/grpc ship binary-target
      # zips fetched from dl.google.com, which intermittently fail mid-download
      # on the runner ("The network connection was lost." → exit 74) and took the
      # whole job down before a single test compiled. Resolving up front — into
      # the same fixed trees the cache restores and the test step reuses — lets
      # us retry the transient network failure, and a warm cache makes it
      # near-instant; a real resolution error still fails after the attempts.
      - name: Resolve SPM packages (retry on transient network)
        run: |
          for attempt in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies \
                 -project apps/ios/Meeshy.xcodeproj -scheme Meeshy \
                 -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                 -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"; then
              echo "SPM resolve OK (attempt $attempt)"
              exit 0
            fi
            echo "::warning::SPM resolve attempt $attempt failed (transient network?), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::SPM resolve failed after 4 attempts"
          exit 1

      # Seed the SPM cache the INSTANT it resolves — before the compile that may
      # blow the timeout. actions/cache's post-job save is skipped when the job
      # is cancelled, and a timeout IS a cancellation: the first cold run proved
      # a combined cache never seeds because the compile is killed before
      # post-job runs. This explicit save sits right after a resolve that
      # finishes well within budget, so run N banks the ~6-min SPM download even
      # if it later times out compiling — run N+1 then starts warm and is far
      # likelier to finish the build, which in turn seeds the DerivedData cache.
      - name: Save SPM cache
        if: always() && steps.spm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/spm
          key: ios-spm-${{ hashFiles('apps/ios/project.yml') }}

      # Compile separately from running so DerivedData can be banked the moment
      # the (expensive) build finishes — see "Save DerivedData build cache".
      - name: Build for testing
        run: |
          # CI-only compile trims (safe — no IDE, no archiving here):
          #   COMPILER_INDEX_STORE_ENABLE=NO  → skip the index-while-building
          #     store; it only feeds Xcode's IDE features, useless on CI.
          #   DEBUG_INFORMATION_FORMAT=dwarf  → emit DWARF in the binaries but
          #     skip the separate .dSYM bundle generation/linking; a test run
          #     symbolicates fine without it.
          #   ONLY_ACTIVE_ARCH=YES            → arm64 only (the single sim
          #     destination), never build the unused arch.
          #
          # Destination depends on the mode. `generic/platform=iOS Simulator`
          # needs no installed runtime — that is what lets the PR gate skip the
          # provisioning step — but it also has NO active architecture, so
          # ONLY_ACTIVE_ARCH has nothing to reduce to and xcodebuild would
          # compile arm64 AND x86_64: double the most expensive step in the job.
          # macos-15 runners are Apple Silicon, so pin arm64 explicitly instead.
          if [ "$COMPILE_ONLY" = "true" ]; then
            DESTINATION='generic/platform=iOS Simulator'
            ARCH_SETTINGS=(ARCHS=arm64)
          else
            DESTINATION='platform=iOS Simulator,id=${{ steps.sim.outputs.sim_id }}'
            ARCH_SETTINGS=(ONLY_ACTIVE_ARCH=YES)
          fi
          # Les erreurs du compilateur partent AUSSI en annotations : le log
          # brut exige un token, la page publique du run non (même remède que
          # le résumé XCTest — leçon 265, lecteur distant sans rien d'autre).
          # `set +e` obligatoire : le runner lance ce script avec `bash -e`,
          # et -e + pipefail tuent le script sur le pipeline en échec AVANT
          # d'atteindre le bloc d'annotations (constaté au run #79 — exit 65
          # nu, zéro annotation). On sort explicitement avec `exit "$rc"`.
          #
          # NE PAS passer `OTHER_SWIFT_FLAGS` ici. Essayé le 2026-08-16 pour
          # ajouter `-Xfrontend -continue-building-after-errors` (le frontend
          # Swift s'arrête sinon à la première erreur d'un module) : un
          # réglage de build en ligne de commande REMPLACE la valeur, il ne
          # s'y ajoute pas, et `$(inherited)` n'a rien à hériter à ce niveau.
          # Or SwiftPM compile les `swiftSettings` de `Package.swift` en
          # `OTHER_SWIFT_FLAGS` sur les cibles du package : l'override a effacé
          # `.enableUpcomingFeature("InferIsolatedConformances")` (SE-0470) et
          # `.enableUpcomingFeature("NonisolatedNonsendingByDefault")`
          # (SE-0461) de MeeshySDK, et 19 erreurs de concurrence stricte sont
          # apparues dans MeeshyUI — sur du code inchangé et vert par ailleurs
          # (run 31945994902). Le seul emplacement sûr pour un drapeau Swift
          # est `apps/ios/project.yml`, qui ne porte QUE les cibles du dépôt.
          #
          # Ce que le bloc d'annotations ci-dessous remonte reste complet pour
          # ce que le compilateur a effectivement émis : la compilation par
          # lots parallèles produit déjà plusieurs erreurs par run (19 sur
          # celui-là). Ce qu'on n'a pas, c'est l'exhaustivité DANS un fichier.
          # Pour la classe d'erreurs qui avait motivé la tentative, le garde
          # `scripts/check-swift-viewbuilder.sh` la donne en 1 s sur ubuntu,
          # avant même que ce runner ne démarre.
          set -o pipefail
          set +e
          xcodebuild build-for-testing \
            -project apps/ios/Meeshy.xcodeproj \
            -scheme Meeshy \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            "${ARCH_SETTINGS[@]}" \
            -quiet 2>&1 | tee /tmp/xcodebuild-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # `chemin:ligne:colonne: error: message` — le format des
            # diagnostics Swift/Clang. Le chemin est ABSOLU sur le runner ;
            # une annotation veut un chemin relatif au dépôt, sinon elle ne
            # s'ancre pas sur le diff de la PR et le lecteur doit encore
            # chercher où regarder.
            grep -E '^/.+:[0-9]+:[0-9]+: (error|fatal error): ' /tmp/xcodebuild-build.log \
              | sed "s|^${GITHUB_WORKSPACE}/||" | sort -u > /tmp/ios-errors-located.txt || true
            # Erreurs sans position : édition de liens, phase de build, xcodebuild.
            grep -E ': (error|fatal error): ' /tmp/xcodebuild-build.log \
              | grep -vE '^/.+:[0-9]+:[0-9]+: ' | sort -u > /tmp/ios-errors-global.txt || true
            LOCATED=$(wc -l < /tmp/ios-errors-located.txt | tr -d ' ')
            GLOBAL=$(wc -l < /tmp/ios-errors-global.txt | tr -d ' ')
            TOTAL=$((LOCATED + GLOBAL))
            {
              echo '## Erreurs de compilation iOS'
              echo ''
              echo "**${TOTAL} erreur(s) distincte(s)** — ${LOCATED} localisée(s), ${GLOBAL} sans position."
              echo ''
              echo '```'
              cat /tmp/ios-errors-global.txt /tmp/ios-errors-located.txt | head -n 200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Toutes les erreurs de compilation (${TOTAL})"
            cat /tmp/ios-errors-global.txt /tmp/ios-errors-located.txt
            echo "::endgroup::"
            # Plafond GitHub : 10 annotations par étape. Les localisées
            # passent en premier — ce sont les seules qui s'ancrent.
            head -n 9 /tmp/ios-errors-located.txt | while IFS= read -r line; do
              FILE=${line%%:*}; REST=${line#*:}
              LINE=${REST%%:*}; REST=${REST#*:}
              COL=${REST%%:*}
              echo "::error file=${FILE},line=${LINE},col=${COL},title=Compilation Swift::${line#*: error: }"
            done
            head -n 1 /tmp/ios-errors-global.txt | while IFS= read -r line; do
              echo "::error title=Compilation (sans position)::${line:0:220}"
            done
            echo "::notice title=Compilation::${TOTAL} erreur(s) distincte(s) — liste complète dans le résumé du run"
          fi
          exit "$rc"

      # Seed DerivedData the instant the compile succeeds — BEFORE the test run,
      # which can itself be slow. Same rationale as "Save SPM cache": the
      # post-job save is skipped on a timeout-cancellation, so an explicit save
      # here banks the compiled build products even if the run phase later
      # overruns. `success()` guards against caching a broken build. Progressive:
      # once seeded, the next run restores compiled modules and the compile is
      # incremental (minutes, not the ~15+ min cold compile that was overrunning
      # the budget). Skipped when the restore already hit the exact key.
      - name: Save DerivedData build cache
        if: success() && steps.dd-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ios-dd-macos15-${{ steps.sdkfp.outputs.v }}-${{ hashFiles('apps/ios/project.yml') }}-${{ github.sha }}

      # The other half the PR gate skips (~8 min). It is also the half that needs
      # the simulator provisioned above, so the two are gated together or not at
      # all — a `test-without-building` against a destination that was never
      # created fails on the destination, not on the code.
      - name: Run iOS tests (without building)
        if: env.COMPILE_ONLY != 'true'
        run: |
          rm -rf TestResults.xcresult
          # The 3 XCTMetric benchmark suites (MessageListPerformanceTests,
          # BubbleSimpleMessagePerfTests, SearchPerformanceTests) are
          # intentionally gated OUT of the regular run — see their file
          # headers and scripts/ios-perf-benchmark.sh, which is the only
          # invocation meant to exercise them (via -only-testing). Gating
          # is invocational, not env-var based (RUN_PERF_BENCHMARKS never
          # reaches the in-simulator test process under `xcodebuild test`),
          # so -skip-testing is the only thing that actually excludes them.
          # meeshy.sh mirrors the same exclusion locally (NON_PHASE_SUITES).
          # Run SERIALLY (single destination, no -parallel-testing-enabled).
          # Parallel testing was tried and reverted: on the 3 vCPU / 7 GB
          # standard runner it saved only ~2 min (2 clones saturate CPU+RAM). The
          # real time win came from the CI compile settings on the build step
          # above. Real parallelism would need a bigger runner (more cores+RAM).
          #
          # CameraCaptureSaveRuntimeTests is skipped: it drives real
          # `PHPhotoLibrary.performChanges` writes, whose completion handler
          # never fires on the headless CI simulator (photolibraryd hangs) — both
          # tests hit the 3-min per-test allowance in SERIAL, so it is not a
          # parallel/TCC-clone artefact. The photos-add grant added in e5f88a3de
          # (AFTER the last green run) "enabled" these guards to run for the
          # first time, and they have never once passed on a CI sim. They stay
          # valuable as LOCAL/on-device guards for the film+validate SIGTRAP
          # (see the file header) but a CI simulator cannot execute photo-library
          # writes reliably — same reason the XCTMetric perf suites are gated out.
          xcodebuild test-without-building \
            -project apps/ios/Meeshy.xcodeproj \
            -scheme Meeshy \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim_id }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -only-testing:MeeshyTests \
            -skip-testing:MeeshyTests/MessageListPerformanceTests \
            -skip-testing:MeeshyTests/BubbleSimpleMessagePerfTests \
            -skip-testing:MeeshyTests/SearchPerformanceTests \
            -skip-testing:MeeshyTests/CameraCaptureSaveRuntimeTests \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 \
            -quiet

      - name: Surface test failures
        if: always() && env.COMPILE_ONLY != 'true'
        run: |
          BUNDLE=TestResults.xcresult
          [ -d "$BUNDLE" ] || { echo "No result bundle produced."; exit 0; }
          echo "::group::Test failure summary"
          xcrun xcresulttool get test-results summary --path "$BUNDLE" 2>/dev/null \
            || xcrun xcresulttool get --legacy --format json --path "$BUNDLE" 2>/dev/null | head -c 60000 \
            || echo "xcresulttool could not read the bundle."
          echo "::endgroup::"
          # Le même résumé, publié dans le step summary : la page publique du run
          # l'affiche sans authentification — le log brut, lui, exige un token.
          # (Leçon 265 : écrire les messages d'échec pour le lecteur distant qui
          # n'a QUE la page du run.)
          {
            echo '## Résumé XCTest (échecs)'
            echo ''
            echo '```json'
            xcrun xcresulttool get test-results summary --path "$BUNDLE" 2>/dev/null | head -c 24000 \
              || echo 'xcresulttool could not read the bundle.'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Les step summaries sont rendus par XHR : un lecteur sans token ne les
          # voit pas. Les ANNOTATIONS, elles, sont server-rendered sur la page du
          # run — chaque échec devient donc une annotation (plafond GitHub :
          # 10 par étape ; l'étape suivante prend le relais pour les suivants).
          xcrun xcresulttool get test-results summary --path "$BUNDLE" 2>/dev/null \
            | jq -r '(.testFailures // [])[] | "\(.targetName // "?")/\(.testName // .testIdentifier // "?") — \((.failureText // "?") | .[0:180] | gsub("\n"; " "))"' \
            > /tmp/xctest-failures.txt || true
          TOTAL=$(wc -l < /tmp/xctest-failures.txt | tr -d ' ')
          echo "::notice title=Échecs XCTest::${TOTAL} test(s) en échec (liste en annotations ci-dessous)"
          head -n 9 /tmp/xctest-failures.txt | while IFS= read -r line; do
            echo "::error title=XCTest échec::${line}"
          done

      - name: Annoter les échecs restants (10 à 27)
        if: always() && env.COMPILE_ONLY != 'true'
        run: |
          [ -f /tmp/xctest-failures.txt ] || exit 0
          sed -n '10,27p' /tmp/xctest-failures.txt | while IFS= read -r line; do
            echo "::error title=XCTest échec (suite)::${line}"
          done
