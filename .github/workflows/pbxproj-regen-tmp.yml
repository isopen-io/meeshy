name: pbxproj regen (temporaire #9171)

on:
  push:
    branches:
      - ci/9171-visitor-link

permissions:
  contents: write

jobs:
  regen:
    if: ${{ !contains(github.event.head_commit.message, 'regen pbxproj') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Régénérer le projet
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate
      - name: Committer le pbxproj
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ios/Meeshy.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo "pbxproj inchangé"
            exit 0
          fi
          git commit -m "chore(ios): regen pbxproj (temporaire, à trier)"
          git push origin HEAD:${{ github.ref_name }}
