name: iOS (beta) → Xcode Cloud

# Déclenche le workflow Xcode Cloud « TestFlight beta test iOS » quand, et
# seulement quand, le message de commit contient un marqueur beta — sous
# n'importe laquelle de ces formes : (beta) [beta] {beta} "beta" 'beta'.
#
# Pourquoi passer par ici plutôt que par une condition Xcode Cloud ? Xcode Cloud
# ne sait pas filtrer sur le MESSAGE d'un commit — ses conditions de démarrage
# portent sur la branche, la pull request, les tags, l'horaire, et au mieux sur
# des chemins de fichiers. Sa condition actuelle (`main` + `apps/ios/**` +
# `packages/MeeshySDK/**` + tout `.swift`) part à presque chaque push iOS.
#
# L'alternative aurait été de laisser Xcode Cloud démarrer puis d'abandonner
# depuis `ci_post_clone.sh` : chaque push aurait alors consommé des minutes
# facturées pour produire un build marqué en échec. Ici rien ne démarre tant que
# le mot-clé est absent.
#
# PRÉREQUIS : le workflow Xcode Cloud doit être ACTIVÉ dans App Store Connect.
# Un workflow désactivé refuse les démarrages, y compris par API.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Pourquoi ce déclenchement manuel'
        type: string
        default: 'déclenchement manuel'

permissions:
  contents: read

concurrency:
  group: ios-beta-trigger-${{ github.ref }}
  cancel-in-progress: false      # deux (beta) successifs = deux builds voulus

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Identifiant du workflow Xcode Cloud « TestFlight beta test iOS »
      # (audience APP_STORE_ELIGIBLE — le seul des deux qui produise un
      # livrable ; « TestFlight iOS » est en INTERNAL_ONLY).
      XCODE_CLOUD_WORKFLOW_ID: FD799587-E62A-4D3D-BA8E-6FA25AC53F05

    steps:
      # Le message de commit est une donnée NON FIABLE : il ne doit jamais être
      # interpolé dans un `run:`. Il transite par l'environnement et n'est
      # comparé qu'en bash, jamais évalué.
      - name: Decide whether this commit asks for a beta
        id: decide
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "wanted=true" >> "$GITHUB_OUTPUT"
            echo "Déclenchement manuel demandé."
            exit 0
          fi
          # Marqueur beta accepté sous n'importe laquelle de ces formes.
          markers=("(beta)" "[beta]" "{beta}" "\"beta\"" "'beta'")
          wanted=false
          for marker in "${markers[@]}"; do
            case "$COMMIT_MESSAGE" in
              *"$marker"*) wanted=true ;;
            esac
          done
          if [ "$wanted" = true ]; then
            echo "wanted=true" >> "$GITHUB_OUTPUT"
            echo "Marqueur beta trouvé dans le message de commit."
          else
            echo "wanted=false" >> "$GITHUB_OUTPUT"
            echo "Aucun marqueur beta ((beta) [beta] {beta} \"beta\" 'beta') dans le message de commit — rien à faire."
          fi

      - uses: actions/checkout@v7
        if: steps.decide.outputs.wanted == 'true'

      - uses: actions/setup-python@v7
        if: steps.decide.outputs.wanted == 'true'
        with:
          python-version: '3.12'

      - name: Install ANDP
        if: steps.decide.outputs.wanted == 'true'
        run: python3 -m pip install --quiet "andp @ git+https://github.com/isopen-io/andp@v1"

      - name: Write ANDP credentials
        if: steps.decide.outputs.wanted == 'true'
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ANDP_KEY_ID: ${{ secrets.ASC_KEY_ID || '5542B6LVNL' }}
          ANDP_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '69a6de89-ae7a-47e3-e053-5b8c7c11a4d1' }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          umask 077
          mkdir -p .andp
          {
            echo "accounts:"; echo "  primary:"; echo "    asc_api:"
            echo "      key_id: \"$ANDP_KEY_ID\""
            echo "      issuer_id: \"$ANDP_ISSUER_ID\""
            echo "      key_content: |"
            sed 's/^/        /' "$RUNNER_TEMP/AuthKey.p8"
          } > .andp/secrets.yml

      # On réutilise le client ASC d'ANDP (auth JWT ES256, retry 429, parsing
      # d'erreurs) plutôt que de réécrire une signature de token à la main.
      - name: Start the Xcode Cloud build
        if: steps.decide.outputs.wanted == 'true'
        env:
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from andp.asc.client import ASCAPIError
          from andp.asc.config import load_account
          from andp.asc.managers import make_managers

          workflow_id = os.environ["XCODE_CLOUD_WORKFLOW_ID"]
          ref, sha = os.environ["GIT_REF"], os.environ["GIT_SHA"]
          client = make_managers(load_account("primary")).client

          payload = {"data": {
              "type": "ciBuildRuns",
              "attributes": {},
              "relationships": {
                  "workflow": {"data": {"type": "ciWorkflows", "id": workflow_id}},
              },
          }}

          try:
              run = client.post("/v1/ciBuildRuns", payload).get("data") or {}
          except ASCAPIError as err:
              print(f"::error::Xcode Cloud a refusé le démarrage (HTTP {err.status}).")
              print(json.dumps(err.errors, indent=2, ensure_ascii=False))
              # Cause la plus fréquente : le workflow est DÉSACTIVÉ dans App
              # Store Connect. Un workflow désactivé refuse aussi l'API.
              print("::error::Vérifier que « TestFlight beta test iOS » est activé "
                    "(App Store Connect → Xcode Cloud → Manage Workflows).")
              sys.exit(1)

          attrs = run.get("attributes", {})
          number = attrs.get("number")
          print(f"Build Xcode Cloud #{number} démarré pour {ref} ({sha[:8]}).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Xcode Cloud\n\nBuild **#{number}** démarré "
                       f"pour `{ref}` (`{sha[:8]}`).\n")
          PY

      - name: Nothing to do
        if: steps.decide.outputs.wanted != 'true'
        run: |
          echo "Aucun marqueur beta ((beta) [beta] {beta} \"beta\" 'beta') dans le message de commit : aucun build Xcode Cloud démarré." \
            >> "$GITHUB_STEP_SUMMARY"
