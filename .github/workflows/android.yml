# =============================================================================
# MEESHY - Android CI
# =============================================================================
# The Android parity rebuild (`apps/android`) had NO CI gate until this
# workflow. `apps/android/tasks/android-routine/ROUTINE.md` §"CI reality" stated
# it plainly: the monorepo `ci.yml` never compiles a line of Kotlin, so the only
# gate was `./apps/android/meeshy.sh check` run locally, and a slice was merged
# on the author's word that it had passed.
#
# That gate is unavailable to the containerised agents that drive the routine:
# `dl.google.com` (Android SDK command-line tools + platform packages) is denied
# by the egress policy of those containers, so `sdkmanager` cannot bootstrap and
# no Gradle task can run. Two verified defects have already been written up and
# left undelivered for exactly this reason (see the candidate deposited on
# 2026-08-12 at the head of `PROGRESS.md`).
#
# GitHub-hosted `ubuntu-latest` runners ship the Android SDK and reach
# `dl.google.com` normally, so this workflow is both the missing merge gate and
# the only Android toolchain those agents can reach.
#
# Scope: mirrors `./apps/android/meeshy.sh check` EXACTLY (`assembleDebug` +
# `testDebugUnitTest`) and nothing more. Lint and instrumented tests are
# deliberately excluded — a CI gate stricter than the documented local gate
# would block slices on pre-existing debt the routine never agreed to fix.
# =============================================================================

name: Android natif

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'scripts/check-verbosity-native.mjs'
      - 'scripts/verbosity-native-budgets.json'
      - 'apps/ios/Meeshy/Localizable.xcstrings'
      - 'apps/ios/Meeshy/InfoPlist.xcstrings'
      - 'packages/MeeshySDK/Sources/MeeshyUI/Resources/Localizable.xcstrings'
      - 'apps/ios/MeeshyWidgets/Localizable.xcstrings'
      - 'apps/ios/MeeshyNotificationExtension/Localizable.xcstrings'
      - 'apps/ios/MeeshyNotificationContentExtension/Localizable.xcstrings'
      - 'services/gateway/route-manifest.json'
      - 'packages/shared/api/**'
      - 'packages/shared/scripts/generate-android-endpoints.ts'
      # Les tests de parité Kotlin rejouent ces vecteurs (loi d'actions, traduction, lecture) :
      # un vecteur qui change sans que la CI Android tourne laisse le miroir diverger en silence (#12822).
      - 'packages/shared/fixtures/**'
      # Le miroir des cercles relit aussi la TABLE TypeScript (seuils, ensembles, échelle) : un seuil
      # assoupli sans que les cas communs bougent doit faire tourner la CI Android (#13927).
      - 'packages/shared/utils/relation-levels.ts'
      - 'packages/shared/utils/relation-access.ts'
      - 'packages/shared/types/external-interop-compliance.ts'
      - 'packages/shared/types/relation.ts'
      - 'packages/MeeshySDK/Sources/MeeshyUI/Theme/MeeshyColors.swift'
      - 'packages/MeeshySDK/Sources/MeeshyUI/Theme/DesignTokens.swift'
      - 'packages/design-tokens/**'
      # Le kit de la planche (K00, #17335) : KitRegistryGuardTest confronte le registre et la table S de la planche
      # au catalogue — l'un ou l'autre qui change doit rejouer la garde.
      - '.claude/workflows/meeshy-kit-planche.lots.json'
      - 'docs/product/composer-vue-finale/planche.html'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'apps/ios/Meeshy/Localizable.xcstrings'
      - 'apps/ios/Meeshy/InfoPlist.xcstrings'
      - 'packages/MeeshySDK/Sources/MeeshyUI/Resources/Localizable.xcstrings'
      - 'apps/ios/MeeshyWidgets/Localizable.xcstrings'
      - 'apps/ios/MeeshyNotificationExtension/Localizable.xcstrings'
      - 'apps/ios/MeeshyNotificationContentExtension/Localizable.xcstrings'
      - 'services/gateway/route-manifest.json'
      - 'packages/shared/api/**'
      - 'packages/shared/scripts/generate-android-endpoints.ts'
      # Les tests de parité Kotlin rejouent ces vecteurs (loi d'actions, traduction, lecture) :
      # un vecteur qui change sans que la CI Android tourne laisse le miroir diverger en silence (#12822).
      - 'packages/shared/fixtures/**'
      # Le miroir des cercles relit aussi la TABLE TypeScript (seuils, ensembles, échelle) : un seuil
      # assoupli sans que les cas communs bougent doit faire tourner la CI Android (#13927).
      - 'packages/shared/utils/relation-levels.ts'
      - 'packages/shared/utils/relation-access.ts'
      - 'packages/shared/types/external-interop-compliance.ts'
      - 'packages/shared/types/relation.ts'
      - 'packages/MeeshySDK/Sources/MeeshyUI/Theme/MeeshyColors.swift'
      - 'packages/MeeshySDK/Sources/MeeshyUI/Theme/DesignTokens.swift'
      - 'packages/design-tokens/**'
      # Le kit de la planche (K00, #17335) : KitRegistryGuardTest confronte le registre et la table S de la planche
      # au catalogue — l'un ou l'autre qui change doit rejouer la garde.
      - '.claude/workflows/meeshy-kit-planche.lots.json'
      - 'docs/product/composer-vue-finale/planche.html'
  workflow_dispatch:
    inputs:
      # Les références d'instantanés du kit (apps/android/feature/kit/src/test/snapshots) s'enregistrent ICI, par la
      # machine qui les juge, jamais sur un poste (fiche docs/product/kit/K00-Catalogue.md §8). Sur une branche de travail,
      # le job les commit lui-même (les sessions des conteneurs ne peuvent pas télécharger un artefact) ; sur dev et
      # main il les publie seulement en artefact.
      record_snapshots:
        description: "Enregistrer les références d'instantanés du kit (Roborazzi) et les publier"
        type: boolean
        required: false
        default: false

concurrency:
  group: android-${{ github.ref }}
  # Même règle que ci.yml (#4395) : sur `dev` et `main`, le run EN COURS va au bout et seul le
  # run en attente est remplacé. Sinon une rafale de poussées n'obtenait presque jamais de
  # conclusion (mesuré le 2026-10-23 sur 9 à 61 poussées de `dev` : 1 conclusion pour le SDK,
  # 11 pour Android, 5 pour iOS), donc aucun verdict de ces chaînes sur le commit promu.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

env:
  # Mandatory, not cosmetic: with LANG/LC_ALL unset the JVM boots with
  # sun.jnu.encoding=ASCII and `:sdk-core` test compilation dies with an
  # Internal compiler error (InvalidPathException) while writing a .class file
  # whose backtick test-method name contains a non-ASCII em-dash.
  # Documented in apps/android/tasks/android-routine/ROUTINE.md.
  LANG: C.utf8
  LC_ALL: C.utf8

jobs:
  # Chaînes : les catalogues iOS (.xcstrings) sont la source des chaînes Android adoptées
  # (apps/android/i18n/manifest). Le contrôle de génération échoue quand un strings_generated.xml
  # n'est plus celui que les catalogues produiraient. Bloquant pour une PR qui touche apps/android,
  # consultatif pour une PR iOS seule (qui ne peut pas connaître le manifeste Android).
  i18n:
    name: Chaînes Android générées à jour
    if: github.event_name != 'pull_request' || vars.PR_CI_GEL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android_touched: ${{ steps.scope.outputs.android_touched }}
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Does this change touch apps/android?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "android_touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate -q '.[].filename')"
          if printf '%s\n' "$files" | grep -qE '^(apps/android/|\.github/workflows/android\.yml$)'; then
            echo "android_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_touched=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR iOS seule : le contrôle des chaînes est consultatif"
          fi

      - name: i18n script tests
        continue-on-error: ${{ steps.scope.outputs.android_touched != 'true' }}
        run: python3 -m unittest discover -s scripts/i18n/tests

      - name: Generated strings are up to date (xcstrings_to_android.py --check)
        continue-on-error: ${{ steps.scope.outputs.android_touched != 'true' }}
        run: python3 apps/android/scripts/i18n/xcstrings_to_android.py --check
        working-directory: .

  # Routes : les constantes Kotlin de core/network/.../net/routes sont GÉNÉRÉES depuis
  # services/gateway/route-manifest.json (packages/shared/api/build-kotlin-endpoints.ts).
  # Le contrôle échoue quand un fichier a divergé du manifeste ou qu'un orphelin subsiste.
  routes:
    name: Routes Android générées à jour
    if: github.event_name != 'pull_request' || vars.PR_CI_GEL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generated Kotlin routes are up to date (generate-android-endpoints.ts --check)
        working-directory: packages/shared
        run: npx --yes tsx@4.20.6 scripts/generate-android-endpoints.ts --check

  # Jetons : MeeshyPaletteGenerated.kt (Android) et ios.css (web) sont GÉNÉRÉS depuis
  # MeeshyColors.swift par le même parseur strict. Une couleur modifiée côté Swift sans
  # régénération fait échouer ce contrôle.
  tokens:
    name: Jetons de design générés à jour
    if: github.event_name != 'pull_request' || vars.PR_CI_GEL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: ios.css is up to date (generate-from-ios.mjs --check)
        run: node packages/design-tokens/scripts/generate-from-ios.mjs --check

      - name: MeeshyPaletteGenerated.kt is up to date (generate-android-from-ios.mjs --check)
        run: node packages/design-tokens/scripts/generate-android-from-ios.mjs --check

  # Graphe des modules : les arêtes feature -> feature sont celles de l'ADR-033, rien d'autre, et sans cycle.
  # Pur shell, aucun SDK Android requis.
  modules:
    name: Graphe des modules Android
    if: github.event_name != 'pull_request' || vars.PR_CI_GEL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Témoins de la garde
        run: bash apps/android/scripts/check-feature-edges.test.sh

      - name: Arêtes feature vers feature conformes à l'ADR-033
        run: bash apps/android/scripts/check-feature-edges.sh

      # #17587 (épure #17584) — le texte que les écrans Android ont à dire,
      # module par module (values-fr/strings*.xml), sous le même cliquet que
      # les catalogues iOS. Pur Node, aucun SDK Android requis.
      - name: Cliquet du texte natif (épure)
        run: node --test scripts/__tests__/check-verbosity-native.test.mjs && node scripts/check-verbosity-native.mjs

  android:
    name: Android (assemble + unit tests)
    needs: i18n
    if: needs.i18n.outputs.android_touched == 'true' && !inputs.record_snapshots
    runs-on: ubuntu-latest
    # Measured on the first green runs (2026-08-12): ~8-10 min wall clock for
    # the whole job on a cold Gradle cache — of which assembleDebug is the bulk
    # and testDebugUnitTest is ~2m10 (665 actionable tasks).
    # Re-measured 2026-11-04 (run 41770508029): assembleDebug 13m14s
    # (807 actionable tasks), and testDebugUnitTest had covered ~15 of 22 test
    # modules after 16 min when the old 30 min ceiling cancelled the job — no
    # hang (the 900 s jstack showed every executor busy in a different test).
    # 60 min is a hang guard with ~2x headroom on that budget, not a target.
    # Raise it if the module graph grows, rather than letting a hung job sit.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android

    steps:
      # #15675 — l'image ubuntu-latest n'a qu'environ 14 Go libres, et le build
      # complet (assemble + tests de tous les modules) l'épuisait : le runner
      # mourait sur « No space left on device » avant de compiler. On retire ce
      # que le build Android n'utilise pas ; le SDK Android préinstallé reste.
      - name: Libérer le disque du runner
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      # JDK 21 matches the toolchain the routine documents; the modules
      # themselves target JVM 17 via compileOptions/jvmTarget.
      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # `packages` is pinned because the action's default list still asks for the
      # legacy `tools` package, which `cmdline-tools/20.0` no longer publishes.
      # The runner image picked that version up on 2026-09-15, and every run
      # then died here ("Failed to find package 'tools'", sdkmanager exit 1)
      # before any Gradle task. `platform-tools` is the only package this gate
      # needs up front: AGP resolves the platform and build-tools itself.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Derived from app/build.gradle.kts rather than hardcoded: a compileSdk
      # bump must not require editing this workflow in lockstep and silently
      # break the gate when it drifts.
      # Best effort ONLY — never fails the job. AGP resolves and downloads the
      # platform it actually wants (licences are accepted by setup-android
      # above), and it is the authority on which package a given compileSdk
      # maps to. This step exists to pre-warm the common case and to print what
      # is published, so a resolution failure in Gradle below can be read
      # against the real catalogue instead of guessed at.
      #
      # Why it cannot just install "platforms;android-$major": since the minor
      # SDK releases (36.1, 37.0, 37.1 …) an API level is no longer guaranteed
      # to be published under a bare `android-N` name. Run #1 of this workflow
      # failed on exactly that — "Failed to find package 'platforms;android-37'"
      # — while android-37.0 and android-37.1 both exist.
      - name: Provision compileSdk platform (best effort)
        continue-on-error: true
        run: |
          compile_sdk="$(grep -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          if [ -z "$compile_sdk" ]; then
            echo "::warning::could not read compileSdk from app/build.gradle.kts; leaving provisioning to AGP"
            exit 0
          fi
          echo "compileSdk = $compile_sdk"

          if sdkmanager --install "platforms;android-${compile_sdk}"; then
            echo "installed platforms;android-${compile_sdk}"
            exit 0
          fi

          # Highest published minor for that major, excluding previews
          # (-beta/-rc) and extension SDKs, across the preview channels too.
          candidate="$(sdkmanager --channel=3 --list 2>/dev/null \
            | grep -oE "platforms;android-${compile_sdk}\.[0-9]+" \
            | sort -uV | tail -1)"

          if [ -n "$candidate" ]; then
            echo "::notice::no bare platforms;android-${compile_sdk}; installing ${candidate}"
            sdkmanager --channel=3 --install "$candidate" || true
          else
            echo "::warning::no platform published for API ${compile_sdk}; AGP will have to resolve it"
          fi

          echo "Platforms published for API ${compile_sdk}:"
          sdkmanager --channel=3 --list 2>/dev/null \
            | grep -oE "platforms;android-${compile_sdk}[^ |]*" | sort -u

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Verrou de schéma Room : version, schéma JSON et migration doivent évoluer ensemble.
      - name: Room schema lock (scripts/check-room-schema.sh)
        run: ./scripts/check-room-schema.sh

      # Split from the test step on purpose: a failure here is a compile break,
      # a failure below is a behavioural regression, and the routine's run log
      # needs to tell them apart without reading the raw log.
      - name: Assemble debug (./apps/android/meeshy.sh build)
        run: ./gradlew assembleDebug --no-daemon

      - name: Room schema export matches the committed JSON
        run: ./scripts/check-room-schema.sh --built

      # Le kit de la planche (K00, #17335) : son verdict propre, AVANT la passe générale. Sans cette étape, un échec ailleurs
      # (Gradle arrête de planifier au premier test rouge) laisse le catalogue, ses gardes et ses instantanés sans verdict.
      # Les instantanés se COMPARENT ici (mode `verify`), ils ne s'enregistrent que par `record_snapshots`.
      - name: Kit du catalogue (modèle, gardes, instantanés)
        run: ./gradlew :sdk-ui:testDebugUnitTest --tests 'me.meeshy.ui.component.kit.*' :feature:kit:testDebugUnitTest --no-daemon

      # Un test FIGÉ ne laisse aucune trace : Gradle n'écrit le résultat d'une classe qu'à sa fin, et le délai du job
      # annule tout d'un « The operation was canceled » sans nom (vu le 2026-11-02, #14650, quand les tests de
      # :sdk-core ont recompilé). Passé 15 min — une passe normale en prend 10 à 12 —, le chien de garde vide deux
      # fois les piles des exécuteurs de test, à 2 min d'écart : le cadre qui ne bouge pas nomme le test figé.
      - name: Unit tests (./apps/android/meeshy.sh test)
        run: |
          (
            sleep 900
            for pass in 1 2; do
              for pid in $(pgrep -f 'Gradle Test Executor' || true); do
                echo "::group::Piles de l'exécuteur de test $pid (passe $pass)"
                "$JAVA_HOME/bin/jstack" "$pid" || true
                echo "::endgroup::"
              done
              sleep 120
            done
          ) &
          ./gradlew testDebugUnitTest --no-daemon

      # Gradle only says "There were failing tests. See the report at ..." and
      # points at an HTML file. The agents this gate exists for cannot download
      # the artifact, so the failures have to be IN the log or they may as well
      # not exist. --stacktrace is deliberately absent above for the same
      # reason: it buries this signal under 100+ lines of Gradle internals.
      - name: Summarise failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          total = 0
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if not bad:
                      continue
                  total += 1
                  first = ((bad[0].get('message') or bad[0].text or '').strip().splitlines() or [''])[0][:300]
                  print(f"::error title=Test KO::{case.get('classname')}.{case.get('name')} — {first}")
                  print(f"\n=== {case.get('classname')}.{case.get('name')}")
                  for c in bad:
                      msg = (c.get('message') or '').strip()
                      if msg:
                          print(f"  {msg[:2000]}")
                      body = (c.text or '').strip()
                      if body:
                          print('  ' + '\n  '.join(body.splitlines()[:20]))

          print(f"\n{total} failing test case(s)." if total
                else "\nNo failing test cases found — the failure was not a test assertion.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: apps/android/**/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # Enregistrement des références d'instantanés du kit (K00). Uniquement sur demande (workflow_dispatch).
  kit-snapshots-record:
    name: Enregistrer les instantanés du kit
    if: github.event_name == 'workflow_dispatch' && inputs.record_snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Libérer le disque du runner
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Le mode `record` réécrit les références ; le témoin reste vert. Seuls les témoins d'instantané tournent.
      - name: Record kit snapshots
        run: ./gradlew :feature:kit:testDebugUnitTest --tests '*SnapshotTest' -Pmeeshy.kit.snapshots=record --no-daemon

      - name: Publish recorded snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-kit-snapshots
          path: apps/android/feature/kit/src/test/snapshots/
          retention-days: 7
          overwrite: true
          if-no-files-found: warn

      - name: Commit recorded snapshots (branche de travail seulement)
        if: github.ref_name != 'dev' && github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feature/kit/src/test/snapshots
          if git diff --cached --quiet; then
            echo "::notice::aucune référence nouvelle ou modifiée"
            exit 0
          fi
          git commit -m "chore(kit): références d'instantanés Android enregistrées par la CI

          Refs #17335"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
