# =============================================================================
# MEESHY - Android CI
# =============================================================================
# The Android parity rebuild (`apps/android`) had NO CI gate until this
# workflow. `apps/android/tasks/android-routine/ROUTINE.md` §"CI reality" stated
# it plainly: the monorepo `ci.yml` never compiles a line of Kotlin, so the only
# gate was `./apps/android/meeshy.sh check` run locally, and a slice was merged
# on the author's word that it had passed.
#
# That gate is unavailable to the containerised agents that drive the routine:
# `dl.google.com` (Android SDK command-line tools + platform packages) is denied
# by the egress policy of those containers, so `sdkmanager` cannot bootstrap and
# no Gradle task can run. Two verified defects have already been written up and
# left undelivered for exactly this reason (see the candidate deposited on
# 2026-08-12 at the head of `PROGRESS.md`).
#
# GitHub-hosted `ubuntu-latest` runners ship the Android SDK and reach
# `dl.google.com` normally, so this workflow is both the missing merge gate and
# the only Android toolchain those agents can reach.
#
# Scope: mirrors `./apps/android/meeshy.sh check` EXACTLY (`assembleDebug` +
# `testDebugUnitTest`) and nothing more. Lint and instrumented tests are
# deliberately excluded — a CI gate stricter than the documented local gate
# would block slices on pre-existing debt the routine never agreed to fix.
# =============================================================================

name: Android

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mandatory, not cosmetic: with LANG/LC_ALL unset the JVM boots with
  # sun.jnu.encoding=ASCII and `:sdk-core` test compilation dies with an
  # Internal compiler error (InvalidPathException) while writing a .class file
  # whose backtick test-method name contains a non-ASCII em-dash.
  # Documented in apps/android/tasks/android-routine/ROUTINE.md.
  LANG: C.utf8
  LC_ALL: C.utf8

jobs:
  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest
    # No prior measurement exists — this workflow is the first time the module
    # graph is compiled in CI. 45 min is a hang guard against GitHub's 6h
    # default, not a target; retune once a few runs have been observed.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 21 matches the toolchain the routine documents; the modules
      # themselves target JVM 17 via compileOptions/jvmTarget.
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Derived from app/build.gradle.kts rather than hardcoded: a compileSdk
      # bump must not require editing this workflow in lockstep and silently
      # break the gate when it drifts.
      - name: Install compileSdk platform
        run: |
          compile_sdk="$(grep -oE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)"
          if [ -z "$compile_sdk" ]; then
            echo "::error::could not read compileSdk from apps/android/app/build.gradle.kts"
            exit 1
          fi
          echo "compileSdk = $compile_sdk"
          # A platform that is still in preview is absent from the default
          # (stable) channel, so a plain --install reports "Failed to find
          # package" for an API level that does exist. Retry on the canary
          # channel before concluding anything.
          if sdkmanager --install "platforms;android-${compile_sdk}"; then
            exit 0
          fi
          echo "::warning::platforms;android-${compile_sdk} not on the stable channel; retrying on canary"
          if sdkmanager --channel=3 --install "platforms;android-${compile_sdk}"; then
            exit 0
          fi
          echo "::error::no SDK platform published for compileSdk=${compile_sdk} on either channel"
          echo "Platforms actually available:"
          sdkmanager --list 2>/dev/null | grep -E '^\s+platforms;android-' | sort -u
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Split from the test step on purpose: a failure here is a compile break,
      # a failure below is a behavioural regression, and the routine's run log
      # needs to tell them apart without reading the raw log.
      - name: Assemble debug (./apps/android/meeshy.sh build)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests (./apps/android/meeshy.sh test)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: apps/android/**/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
