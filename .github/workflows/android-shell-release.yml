name: Android Release (coque apps/web)

# #8669 — la coque Android de `apps/web`, signée pour le Play Store.
#
#   1. `build-shells.mjs --target android --release` refuse avant tout coût
#      sans clé, sans google-services.json, ou contre une autre passerelle que
#      la production (`scripts/lib/android-release.mjs`), puis construit le
#      bundle `.aab` et un `.apk` signés au même numéro de build.
#   2. Les deux partent en artefact (30 jours) : l'`.aab` pour la Play Console,
#      l'`.apk` pour une installation directe.
#   3. Si le compte de service Play est fourni, l'`.aab` part sur la piste
#      choisie. La TOUTE PREMIÈRE version se téléverse à la main dans la Play
#      Console (l'API refuse une application qui n'a encore aucun bundle).
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) — voir
# `apps/web/android/RELEASE.md` :
#   MEESHY_ANDROID_KEYSTORE_BASE64   la clé d'upload (.p12/.jks) en base64
#   MEESHY_ANDROID_STORE_PASSWORD    son mot de passe
#   MEESHY_ANDROID_KEY_ALIAS         l'alias de la clé
#   MEESHY_ANDROID_KEY_PASSWORD      le mot de passe de la clé
#   MEESHY_ANDROID_GOOGLE_SERVICES_JSON_BASE64   google-services.json (Firebase) en base64
#   MEESHY_PLAY_SERVICE_ACCOUNT_JSON (facultatif) le JSON du compte de service Play
#
# Le numéro de build est le compte de commits de la ref construite (D-45) :
# lancer depuis `main` pour qu'il ne fasse que croître.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Piste du Play Store (si le compte de service est fourni)'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'État de la version sur la piste (draft tant que la fiche n’est pas publiée)'
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '22'

jobs:
  release:
    name: Coque Android signée
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.MEESHY_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: 'Checkout (historique complet, le numéro de build est le compte de commits)'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install && break || { echo "Attempt $i failed, retrying in 10s..."; sleep 10; }
          done

      - name: Build packages/shared
        run: |
          cd packages/shared
          bun run build

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Poser la clé et google-services.json depuis les secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MEESHY_ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.MEESHY_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meeshy-upload.keystore"
            echo "MEESHY_ANDROID_STORE_FILE=$RUNNER_TEMP/meeshy-upload.keystore" >> "$GITHUB_ENV"
          fi
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > apps/web/android/app/google-services.json
          fi

      - name: Construire la release (build-shells.mjs --target android --release)
        env:
          VITE_API_BASE: https://gate.meeshy.me
          VITE_DATA_SOURCE: gateway
          MEESHY_ANDROID_STORE_TYPE: ${{ vars.MEESHY_ANDROID_STORE_TYPE || 'pkcs12' }}
          MEESHY_ANDROID_STORE_PASSWORD: ${{ secrets.MEESHY_ANDROID_STORE_PASSWORD }}
          MEESHY_ANDROID_KEY_ALIAS: ${{ secrets.MEESHY_ANDROID_KEY_ALIAS }}
          MEESHY_ANDROID_KEY_PASSWORD: ${{ secrets.MEESHY_ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/web
          node scripts/build-shells.mjs --target android --release

      # Avec la signature d'application Play, assetlinks.json doit porter AUSSI
      # l'empreinte de la clé de Google (Play Console → Intégrité de l'app).
      - name: "Empreinte SHA-256 de la clé d'upload (pour assetlinks.json, #8085)"
        env:
          MEESHY_ANDROID_STORE_PASSWORD: ${{ secrets.MEESHY_ANDROID_STORE_PASSWORD }}
          MEESHY_ANDROID_KEY_ALIAS: ${{ secrets.MEESHY_ANDROID_KEY_ALIAS }}
        run: |
          "$JAVA_HOME/bin/keytool" -list -v -keystore "$MEESHY_ANDROID_STORE_FILE" \
            -storepass "$MEESHY_ANDROID_STORE_PASSWORD" -alias "$MEESHY_ANDROID_KEY_ALIAS" \
            | grep 'SHA256' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Publier l'aab et l'apk signés
        uses: actions/upload-artifact@v7
        with:
          name: meeshy-android-release-${{ github.run_number }}
          path: |
            apps/web/android/app/build/outputs/bundle/release/app-release.aab
            apps/web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Envoyer au Play Store
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.MEESHY_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.meeshy.app
          releaseFiles: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Nettoyer la clé et google-services.json
        if: always()
        run: rm -f "$RUNNER_TEMP/meeshy-upload.keystore" apps/web/android/app/google-services.json
