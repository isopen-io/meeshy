        with:
          bun-version: ${{ env.BUN_VERSION }}

      # pnpm is always needed for turborepo (version from package.json packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js (with pnpm cache)
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Node.js (without cache for bun)
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Generate Prisma client before building
      - name: Generate Prisma client
        env:
          DATABASE_URL: "mongodb://localhost:27017/test"
        run: |
          cd packages/shared
          npx prisma generate --generator client

      # Build shared package (like in Dockerfiles)
      - name: Build shared package (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd packages/shared
          bun run build

      - name: Build shared package (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd packages/shared
          pnpm run build

      # Build gateway (like in Dockerfiles)
      - name: Build gateway (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd services/gateway
          bun run build

      - name: Build gateway (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd services/gateway
          pnpm run build

      # Build agent (like in Dockerfiles)
      - name: Build agent (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd services/agent
          bun run build

      - name: Build agent (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd services/agent
          pnpm run build

      # LE LEGACY `apps/web` N'EST PLUS CONSTRUIT ICI (directive porteur
      # 2026-09-16), et il a quitté le dépôt le 2026-09-24 (#7668) avec ses
      # trois témoins — `Test web` et les cliquets de dette ESLint et de
      # types. Sa dernière forme reste restaurable depuis le tag
      # `legacy-web-final` : `git checkout legacy-web-final -- apps/web`.

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [changes, quality, institutionnel-v3, shell-android, test, test-python, test-audio-pipeline, test-tts-stt, test-voice-api, test-voice-e2e, prisma, security, build]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package Manager:** ${{ env.PACKAGE_MANAGER }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Changes (translator: ${{ needs.changes.outputs.translator }}) | ${{ needs.changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Peaux web (institutionnel + Lentille + fil) | ${{ needs.institutionnel-v3.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coque Android (shell_android: ${{ needs.changes.outputs.shell_android }}) | ${{ needs.shell-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Node.js) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Python) | ${{ needs.test-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Audio Pipeline | ${{ needs.test-audio-pipeline.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TTS/STT Integration | ${{ needs.test-tts-stt.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Voice API Tests | ${{ needs.test-voice-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Voice E2E Benchmark | ${{ needs.test-voice-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prisma | ${{ needs.prisma.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
