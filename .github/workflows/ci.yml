# =============================================================================
# MEESHY - CI Pipeline
# =============================================================================
# Continuous Integration: Lint, Type-check, Test with Coverage, Build
# Optimized for monorepo with Turborepo
# Supports: bun (default) or pnpm
# =============================================================================

name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:
    inputs:
      package_manager:
        description: 'Package manager to use'
        required: false
        type: choice
        default: 'bun'
        options:
          - bun
          - pnpm
      torch_backend:
        description: 'PyTorch backend (cpu for CI, gpu for production)'
        required: false
        type: choice
        default: 'cpu'
        options:
          - cpu
          - gpu
          - gpu-cu121

env:
  # '22.19' et non '22' : undici@8 exige >= 22.19.0 (worker_threads.markAsUncloneable,
  # arrive en 22.12), et le serveur assemble par les generateurs de manifeste le charge.
  # La ligne MINEURE, pas une version exacte — figer le patch ferait rater les correctifs
  # de securite des 22.19.x sans rien garantir de plus : c'est le plancher qui compte ici.
  NODE_VERSION: '22.19'
  BUN_VERSION: '1.3.14'
  PNPM_VERSION: '9'
  # Python 3.10 required: pkuseg (chatterbox-tts dependency) fails to compile on 3.11+
  PYTHON_VERSION: '3.10'
  UV_VERSION: '0.5.x'
  # #4861 — `secrets.TURBO_TOKEN` n'est PAS configuré sur ce dépôt (mesuré :
  # dump `env:` d'un run récent montre `TURBO_TOKEN: ` vide, jamais `***`
  # comme le rendrait un secret réellement posé). Le cache distant Turborepo
  # est donc désactivé dans turbo.json (`remoteCache.enabled: false`) plutôt
  # que déclaré actif sans jamais être joignable — et `signature: true`, qui
  # l'accompagnait, exigeait `TURBO_REMOTE_CACHE_SIGNATURE_KEY`, absent lui
  # aussi. Si `TURBO_TOKEN` est posé un jour, réactiver le cache distant ET
  # poser la clé de signature dans le MÊME lot — l'un sans l'autre reproduit
  # ce défaut.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Default to bun, can be overridden by workflow_dispatch
  PACKAGE_MANAGER: ${{ github.event.inputs.package_manager || 'bun' }}

# `cancel-in-progress` — VRAI sur une branche de PR, FAUX sur les deux branches
# d'intégration. C'est la piste (a) de #4395, appliquée telle qu'elle y est
# écrite.
#
# CE QUE LE RÉGLAGE UNIFORME COÛTAIT, mesuré le 2026-09-01 à 22:30 UTC : ONZE
# runs consécutifs de `dev` annulés, aucune `conclusion` sur la branche depuis
# 20:51 UTC — près de deux heures pendant lesquelles personne ne pouvait dire
# si `dev` était vert. Trois de ces onze commits réparaient précisément la CI.
#
# ET UN RUN ANNULÉ N'EST PAS GRATUIT : les huit derniers ont tourné de 2,8 à
# 8,0 minutes avant d'être tués (moyenne 5,6, soit environ un tiers d'un run
# complet), chacun en éventail sur dix-huit jobs. Le réglage ne fait donc pas
# l'économie des minutes, il les dépense sans jamais rendre de verdict.
#
# L'ASYMÉTRIE QUI AGGRAVE LE TOUT : un run qui aboutit VERT met au moins 16,3
# minutes (médiane 19,6) ; un run qui aboutit ROUGE conclut en ~3 minutes, en
# s'arrêtant au premier job qui tombe. 65 % des intervalles entre poussées sont
# sous 16,3 min, mais seulement 27 % sous 2,6 — la famine mange donc les VERTS
# environ deux fois plus souvent que les ROUGES, et la branche paraît plus rouge
# qu'elle n'est. C'est l'inverse de ce dont la règle `to-integrate` a besoin,
# puisqu'elle ne peut se satisfaire que d'un `success`.
#
# POURQUOI FAUX PLUTÔT QUE `group: ci-${{ github.sha }}` (la piste (b)) : la
# file de concurrence ne garde qu'UN run en attente — le dernier arrivé écrase
# celui qui patientait — donc le run EN COURS va au bout et `dev` obtient
# toujours un verdict, sans multiplier les runs par le nombre de commits. C'est
# le comportement sur lequel `pilotage-pages.yml` repose déjà en production
# depuis le 2026-08-30, et son en-tête le décrit dans ces termes ; cinq autres
# workflows du dépôt (`release`, `ios-release`, `ios-fastlane-release`,
# `ios-beta-trigger`, `pilotage-milestone`) portent le même réglage.
#
# VÉRIFIÉ SUR `dev`, une heure après la bascule. Ce bloc portait d'abord une
# réserve — la sémantique de la file n'avait pas pu être confirmée sur
# `docs.github.com`, bloqué par le proxy de sortie — et la mesure l'a levée :
#
#   • DEUX runs sont allés au bout, 28,9 et 32,8 minutes, pendant que SEPT
#     poussées arrivaient. Sous l'ancien réglage aucun n'aurait dépassé six
#     minutes ;
#   • la file NE s'accumule PAS : `run_started_at == created_at` sur les dix
#     derniers runs, sans exception. Les annulations surviennent à des âges
#     courts et IRRÉGULIERS (0,23 · 0,60 · 1,17 · 3,00 · 7,97 min), signature
#     d'un run qui ATTENDAIT et qu'un arrivant plus récent a évincé — un seul
#     run en attente à la fois.
#
# Le symptôme d'une file qui s'accumulerait reste celui-ci, pour qui aurait à
# le rechercher un jour : `run_started_at` - `created_at` qui GRANDIT d'un run
# à l'autre. Il est absent. Ne pas lire une file d'attente comme une panne.
#
# Et le premier verdict retrouvé a immédiatement montré ce que la famine
# coûtait : un seul test tombait sur 22 383 — une collision de numéro de leçon
# que la branche portait depuis des heures, et que onze runs avaient traversée
# sans jamais conclure.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  # ===========================================================================
  # CHANGES: ce que la poussée touche (#7711)
  # Les quatre jobs du traducteur ne tournent que si un fichier qu'ils lisent
  # a changé ; tout le reste tourne toujours. La règle et ses cas vivent dans
  # `scripts/ci-affected.mjs` (en cas de doute, tout tourne).
  # ===========================================================================
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      translator: ${{ steps.affected.outputs.translator }}
      shell_android: ${{ steps.affected.outputs.shell_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Self-test
        run: node scripts/ci-affected.mjs --self-test

      - name: Detect affected domains
        id: affected
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-affected.mjs >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # QUALITY: Lint & Type-check (Fast feedback)
  # ===========================================================================
  quality:
    name: Quality (${{ github.event.inputs.package_manager || 'bun' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # pnpm is always needed for turborepo (version from package.json packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js (with pnpm cache)
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Node.js (without cache for bun)
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Build shared package first (required for type-check)
      - name: Build shared package (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd packages/shared
          bun run build

      - name: Build shared package (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd packages/shared
          pnpm run build

      # #3658 — la feuille de langues que le translator (Python) reconnaît
      # est GÉNÉRÉE depuis `packages/shared/utils/language-codes.ts` ; rien
      # ne garantissait jusqu'ici que `generated_languages.py` n'avait pas
      # dérivé de sa source (langue ajoutée d'un côté, pas régénérée de
      # l'autre). Jumeau exact de `check:tokens` (palette dérivée de Swift).
      - name: Translator language codes parity guard
        run: |
          cd packages/shared
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} translator-languages:check

      # #5442 : cette étape passe par le cache Turborepo (`bun run lint` sans
      # filtre), donc son verdict dépend de la température du cache — un run à
      # cache chaud rejoue d'anciens logs sans jamais relinter. Elle reste
      # informative (`continue-on-error`). Le cliquet ESLint qui en tenait lieu
      # pour le legacy `apps/web` est parti avec lui (#7668) : il mesurait une
      # dette qui n'existe plus.
      - name: Lint
        run: ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} lint
        continue-on-error: true

      # PAS D'ÉTAPE DE LINT DÉDIÉE À `@meeshy/web` (2026-09-07).
      #
      # Elle existait pour l'ancienne refonte v3, annulée puis retirée du dépôt
      # (#5994). Le nom `@meeshy/web` désigne l'application Vite + Preact
      # (ex `web-v2`, renommée le 2026-09-24, #7668), qui n'a pas encore de
      # configuration ESLint :
      # rebrancher l'étape telle quelle rendrait une case VERTE qui ne linte
      # rien — un signal pire que l'absence de signal, parce qu'on le croit.
      #
      # Ce qui tient la place en attendant : le type-check bloquant ci-dessous
      # et les gates de l'application (jetons dérivés, poids). Son ESLint est
      # un suivi, pas un oubli.

      # Type-check BLOQUANT, une seule étape, aucun `continue-on-error`.
      #
      # Il y en a eu deux (cycle 105 bis) : celle-ci, et un ratchet de dette
      # pour le legacy `apps/web` (1241 erreurs, `check-type-debt.sh`). Une
      # amnistie qui couvrait quatre packages achetait le silence sur le zéro
      # des trois autres — et une violation du contrat d'émission Socket.IO de
      # la passerelle produit `TS2345`/`TS2322`, les deux codes que `ts-jest`
      # ignore : ce job est le seul qui puisse rougir dessus.
      #
      # Le legacy a quitté le dépôt le 2026-09-24 avec son ratchet (#7668).
      # `@meeshy/web` désigne depuis l'application Vite + Preact + Capacitor
      # (ex `@meeshy/web-v2`), née à zéro erreur : elle est ICI, dans l'étape
      # bloquante, et nulle part ailleurs. Un gate qui ne tourne pas n'est pas
      # un gate.
      - name: Type-check (contract packages — blocking)
        run: ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} type-check --filter=@meeshy/shared --filter=@meeshy/gateway --filter=@meeshy/agent --filter=@meeshy/web

      # LES GATES PROPRES À LA V4 — ils ne rentrent dans aucun filtre turbo
      # parce qu'ils ne sont pas des tâches de package : ce sont des mesures.
      #
      #   check:tokens      la palette dérivée n'a pas dérivé de MeeshyColors.swift
      #   measure-weight    la première peinture tient sous le plafond de budgets.json
      #   check-utilities   aucune classe utilitaire n'est morte dans la feuille
      #
      # Le second est la raison d'être de cette application (une zone rurale,
      # un réseau payé au mégaoctet) : le laisser hors CI reviendrait à écrire
      # un budget que personne ne vérifie. Le build est mesuré à ~200 ms, le
      # coût d'étape est négligeable.
      - name: Gates web (jetons dérivés + poids de la première peinture)
        run: |
          # `@meeshy/shared` sert son `dist/` : le type-check et le build de la
          # v3.1 s'y résolvent depuis #5493. Étape EXPLICITE plutôt que filtre
          # turbo, pour rester alignée sur les trois autres travaux navigateur
          # qui la portent déjà.
          cd packages/shared
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build
          cd ../../apps/web
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} check:tokens
          # #5606 — les actifs DÉRIVÉS de l'icône iOS (icônes PWA, splashs des
          # deux coques) sont commités : sans ce contrôle, une icône iOS
          # retouchée laisserait `public/` et les coques périmés EN SILENCE.
          # Le témoin `scripts/brand-assets.test.ts` couvre les copies octet
          # pour octet, pas les images RECALCULÉES — c'est cette ligne-ci qui
          # les garde. (Le composite `bun run gate` n'est PAS lancé en CI :
          # cette étape énumère ses maillons un par un, donc un maillon ajouté
          # au composite seul ne s'exécuterait nulle part.)
          python3 scripts/generate-icons.py --check
          node scripts/check-curve.mjs
          node scripts/check-river-metrics.mjs
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build
          node scripts/check-utilities.mjs
          node scripts/measure-weight.mjs
          # #6862 — le seul gate qui fasse DÉCIDER le service worker construit.
          # Workbox stringifie le `urlPattern` du seau `api` : un prédicat
          # importé s'y perd, et la règle « aucune réponse /api/v1/admin/** sur
          # le disque » était annoncée par `vite.config.ts` sans être appliquée
          # par `dist/sw.js`. Lit `dist/sw.js`, donc après le build ci-dessus.
          node scripts/check-sw-api-cache.mjs
          # #7305 — le service worker porte enfin `push`/`notificationclick`,
          # et sa table de destinations est un JUMEAU (un script classique
          # chargé par `importScripts` ne peut importer aucun module TS). Ce
          # gate compare le jumeau à `target.ts` ET aux motifs de
          # `route-table.tsx`, puis le fait DÉCIDER. Il lit aussi `dist/`,
          # donc il vient après le build ci-dessus. Le fichier qu'il remplace,
          # `firebase-messaging-sw.js`, portait la bonne règle en commentaire
          # et avait quand même dérivé sur trois routes sur trois.
          node scripts/check-push-target-parity.mjs
          # #5910 — maillon du composite `bun run gate` qui ne s'exécutait
          # NULLE PART. Il lit `dist/index.html`, donc il vient après le build
          # ci-dessus ; il n'ouvre aucun navigateur, donc il a sa place ici et
          # non dans le travail Playwright.
          node scripts/check-scheme-bootstrap.mjs
          node scripts/check-interface-language-bootstrap.mjs
          node scripts/check-docker-context.mjs
          node scripts/check-git-tracking.mjs

      # #3679 — cliquet sur l'usage explicite de `any`, mesuré par motif
      # plutôt que par AST : aucun des trois paquets ne demande
      # `@typescript-eslint/no-explicit-any` à un ESLint, et une seule
      # définition de « ce qui compte comme `any` » vaut mieux que trois
      # (cf. l'en-tête du script). `packages/shared` et `apps/web` sont tenus
      # à zéro — le web depuis le retrait du legacy et de ses 451 `any`
      # (#7668) ; `gateway` porte une baseline qui ne peut que descendre.
      - name: any debt ratchet (gateway + shared + web)
        run: bash scripts/check-any-debt.sh --self-test && bash scripts/check-any-debt.sh

      # #5372, suite de #4889 — une entrée de catalogue d'endpoints CLIENT
      # sans appelant se compte comme un lecteur : un décideur qui cherche qui
      # consomme un champ voit la déclaration `case foo(...)` /
      # `foo: '/chemin'` et GARDE, alors que rien ne l'appelle jamais. Les
      # deux catalogues (`packages/MeeshySDK/.../Networking/Endpoints/*.swift`,
      # `packages/shared/api/endpoints.ts`) sont GÉNÉRÉS depuis
      # `services/gateway/route-manifest.json` — un marqueur posé à la main
      # sur une entrée y serait écrasé (ou rejeté par le cliquet de
      # régénération TS) à la prochaine régénération. Ces deux cliquets à deux
      # sens gardent donc le compte de dette à CÔTÉ des catalogues plutôt que
      # dedans, sur le modèle du ratchet de types ci-dessus.
      - name: Swift catalog dead-entries ratchet
        run: node scripts/check-swift-catalog-dead-entries.mjs --self-test && node scripts/check-swift-catalog-dead-entries.mjs

      - name: TS catalog dead-entries ratchet
        run: node scripts/check-ts-catalog-dead-entries.mjs --self-test && node scripts/check-ts-catalog-dead-entries.mjs

      # #3678 — la règle d'accent (CLAUDE.md § « Conversation Accent Color »)
      # veut qu'un composant lié au contexte d'une conversation utilise
      # `accentColor`/`colorPalette`, jamais une couleur en dur. Le golden
      # partagé qui PROUVE le calcul existe déjà (accent.vectors.json, joué
      # par les 3 clients) ; ce cliquet ferme l'autre moitié du critère de
      # fin de #3678 en empêchant le CONTOURNEMENT (`Color(hex:)` hors
      # `Theme/`) de grossir en silence.
      - name: Accent color hardcoding ratchet
        run: node scripts/check-accent-color-hardcoding.mjs --self-test && node scripts/check-accent-color-hardcoding.mjs

      - name: Law literals guard
        run: bash scripts/check-law-literals.sh --self-test && bash scripts/check-law-literals.sh

      # L'invariant porte sur le `bun.lock` de la RACINE et sur tous les
      # manifestes que la racine déclare comme workspaces : sa surface est le
      # dépôt, donc il est appelé ici, à côté des autres gates de racine, et
      # non depuis les tests d'une app. Il rougit dans les DEUX sens — un
      # manifeste que le lock ignore, un workspace loqué qu'aucun arbre de
      # fichiers ne porte — pour qu'un `bun.lock` ne puisse plus être commité
      # sans l'arbre qu'il décrit.
      - name: Lockfile alignment guard
        run: node scripts/check-lockfile-alignment.mjs --self-test && node scripts/check-lockfile-alignment.mjs

      # #6351 — filet de sécurité pour la CI ordinaire : un commit qui porte à
      # la fois un marqueur (beta) et un marqueur de saut CI fait supprimer
      # TOUS les workflows du push par GitHub, ios-beta-trigger.yml compris.
      # Cette étape ne verra donc jamais ce cas précis (un push affecté par le
      # piège ne fait justement tourner aucune CI) ; elle attrape le même
      # défaut sur un commit de PR normal, avant qu'il n'atteigne `main`. Le
      # témoin qui couvre le cas que GitHub supprime est périodique, sur
      # schedule — .github/workflows/beta-marker-audit.yml.
      - name: Beta/skip commit-message conflict guard
        run: node scripts/check-beta-skip-conflict.mjs --self-test && node scripts/check-beta-skip-conflict.mjs

      # Même raison de placement que le garde ci-dessus : l'invariant porte sur
      # le `Makefile` de la RACINE, donc il est appelé ici et non depuis les
      # tests d'une app. Sa première écriture vivait dans les tests de l'ancienne
      # refonte v3 (retirée depuis, #5994) — elle remontait de trois crans pour
      # atteindre sa surface et ne tournait dans AUCUN job — la matrice `test:` ne portait
      # alors que shared/web/gateway/agent : un contrôle inerte, qui laissait
      # rouvrir au commit suivant la régression qu'il prétendait fermer.
      # (`web-v2` A depuis rejoint la matrice ; cette phrase décrit le passé, et
      # la lire au présent fait conclure à tort qu'une suite de la v3 ne tourne
      # nulle part.)
      # Il déroule les cibles avec `make -n` : un `*_DIR` mort se lit dans le
      # texte, mais un `cd` vers un répertoire absent ne se voit qu'après
      # expansion des variables.
      - name: Makefile workspace directories guard
        run: node scripts/check-makefile-workspaces.mjs --self-test && node scripts/check-makefile-workspaces.mjs

      # Le relevé des branches vivantes (#5242) est un outil de CONSULTATION, pas
      # un invariant : son rouge dit « une autre session écrit ce fichier en ce
      # moment », qui est l'état NORMAL d'un dépôt à vingt sessions. Le brancher
      # sur la CI la rendrait rouge en permanence et apprendrait à l'ignorer.
      # Seul son `--self-test` a sa place ici — il porte sur l'instrument (les
      # huit mutations qu'il doit voir, les trois qu'il ne doit PAS rapporter),
      # jamais sur l'état du dépôt. Sans cette ligne, un relevé devenu aveugle
      # rendrait « aucune contention » sans que rien ne rougisse : exactement la
      # forme d'autorisation que son en-tête dit combattre.
      - name: Live-branch contention survey self-test
        run: node scripts/releve-branches-vivantes.mjs --self-test

      # Même raison de placement que les gardes ci-dessus : l'invariant porte sur
      # `ci.yml`, sur `turbo.json` et sur les manifestes des workspaces — la
      # surface est le DÉPÔT. Il ferme #4761.
      #
      # Le dépôt DÉCLARE la dépendance de build à deux endroits corrects
      # (`turbo.json` → `build.dependsOn: ["^build"]`, et le `workspace:*` du
      # manifeste), et ce fichier ne consulte ce graphe NULLE PART pour BÂTIR :
      # mesuré, aucune invocation directe de l'orchestrateur ici, 25 étapes qui
      # entrent dans un workspace par `cd` et y lancent un script de paquet — donc
      # HORS du graphe — et 11 copies écrites à la main de « construis le paquet
      # partagé ». Le jour où `01c49fcfee` a fait importer `@meeshy/shared` par
      # l'ancienne refonte v3, ses trois jobs sont devenus rouges — et LE JOB QUI
      # CASSE N'EST PAS CELUI QUI A AJOUTÉ L'IMPORT, puisque la personne qui écrit
      # l'`import` ne touche aucun fichier de CI.
      #
      # Le garde ne change rien à l'exécution : il RELIE, par job et par scénario
      # de gestionnaire de paquets, les dépendances PRODUCTRICES d'un workspace
      # aux étapes qui les construisent plus haut. « Productrice » n'est pas une
      # liste recopiée : c'est « a un script `build` dont la sortie, déclarée par
      # `turbo.json`, est ce que le consommateur importe » — ce qui laisse
      # `@meeshy/design-tokens` tranquille, paquet d'actifs commité sans étape
      # de build.
      - name: CI build-order guard
        run: node scripts/check-ci-build-order.mjs --self-test && node scripts/check-ci-build-order.mjs

      # Même placement, même raison : la surface est le DÉPÔT — ici le fichier
      # de workflow lui-même. Le garde confronte les jobs DÉCLARÉS de `ci.yml`
      # aux deux listes écrites à la main dont vit son résumé (le `needs:` de
      # l'agrégateur, et les lignes de son tableau). Il ferme #4860 : le gate des
      # chaînes de l'ancienne refonte v3 — écrit exprès — ne figurait dans aucune
      # des deux, et
      # `test-python`, rallumé au sprint 0.3, y était annoncé « disabled » par
      # un mot écrit à la main pendant qu'il consommait un runner à chaque
      # poussée. L'agrégateur est reconnu par ce qu'il FAIT (`if: always()` +
      # écriture dans `$GITHUB_STEP_SUMMARY`), jamais par son nom : le renommer
      # ne doit pas éteindre le garde en silence.
      - name: CI summary coverage guard
        run: node scripts/check-ci-summary-coverage.mjs --self-test && node scripts/check-ci-summary-coverage.mjs

      # Pas de mode « balayage du dépôt » ici : `resolve-docker-detect-base.mjs`
      # est une fonction de décision PURE (docker.yml § job `detect`, #6551),
      # invoquée à l'exécution avec le SHA du dernier run réussi et
      # `github.event.before` en entrée — rien à confronter au repos qu'elle
      # pourrait scanner. Son `--self-test` EST le témoin : sept scénarios,
      # dont celui qui a ouvert #6551 (un push annulé par le suivant ne doit
      # plus faire perdre le diff des commits qu'il portait).
      - name: Docker detect-base resolver guard
        run: node scripts/resolve-docker-detect-base.mjs --self-test

      # Même placement, même raison : la surface est le DÉPÔT — les workflows qui
      # publient `isopen/meeshy-<image>:latest` sur `main`. Il ferme #6442 :
      # `docker.yml` construisait `linux/amd64`, `release.yml`
      # `linux/amd64,linux/arm64` sous émulation QEMU. L'architecture de `latest`
      # dépendait donc du workflow arrivé le dernier, et l'étage arm64 émulé de la
      # passerelle rougissait `main` sans défaut de code
      # (`qemu: uncaught target signal 4`). Le garde exige un même `env.PLATFORMS`
      # chez tout publieur de `latest`, reconnu par ce qu'il FAIT, et une étape de
      # construction qui le lit.
      - name: Image platforms guard
        run: node scripts/check-release-platforms.mjs --self-test && node scripts/check-release-platforms.mjs

      # Même raison de placement que les trois gardes ci-dessus : l'invariant
      # porte sur les quatre `docker-compose*.yml` de `infrastructure/docker/compose/`
      # et sur les deux modèles d'environnement — la surface est le DÉPÔT.
      # Il ferme #4537 : une variable d'hôte absente n'arrête pas Docker Compose,
      # elle est substituée par la chaîne VIDE avec un simple avertissement.
      # La passerelle reçoit alors une liste d'origines DÉCLARÉE mais vide et
      # refuse tout (#4480) — sans qu'aucune erreur ne soit levée au démarrage.
      # La garde exige la forme à refus sur toute variable dont l'absence fait
      # MENTIR le service, et rougit sur toute substitution nue non classée.
      - name: Compose host variables guard
        run: node scripts/check-compose-required-vars.mjs --self-test && node scripts/check-compose-required-vars.mjs

      # #4547 — `scripts/dev.sh --https` invoquait un fichier
      # (`docker-compose.local-https.yml`) qui n'a jamais existé sous
      # `infrastructure/docker/compose/` : le drapeau échouait systématiquement,
      # silencieusement, derrière un message Docker opaque. `--https` est
      # désormais un alias documenté de `docker-compose.local.yml`. La garde
      # vérifie que toute référence `$COMPOSE_DIR/docker-compose*.yml` du script
      # résout réellement, pour qu'une régression future ne redevienne pas
      # silencieuse jusqu'à ce qu'un développeur lance la commande.
      - name: dev.sh compose targets guard
        run: node scripts/check-dev-sh-compose-targets.mjs --self-test && node scripts/check-dev-sh-compose-targets.mjs

      # #4553 — `services/gateway/prebuilds` était un lien symbolique SUIVI par
      # git dont la cible était un chemin absolu posé sur la machine d'une
      # personne (`/Users/<login>/…`). Mesuré : `node-gyp-build` résout en
      # réalité le binaire natif depuis `node_modules/@signalapp/libsignal-client/prebuilds/`,
      # que le paquet livre lui-même — le lien n'a jamais été consulté, et son
      # commentaire prescrivait un geste qu'aucun déploiement ne tient. La
      # garde couvre TOUT lien suivi du dépôt, pas seulement ce cas : une cible
      # absolue, ou une cible relative qui ne résout pas depuis la racine.
      - name: Tracked symlinks guard
        run: node scripts/check-tracked-symlinks.mjs --self-test && node scripts/check-tracked-symlinks.mjs

      # #6545 — le run iOS déclenché sur `promote/main-39224d5fc9` est tombé
      # avant toute compilation : `xcodebuild -resolvePackageDependencies`
      # échouait quatre fois avec la MÊME erreur (« already exists in file
      # system », une entrée du cache d'artefacts SwiftPM DU RUNNER), et la
      # boucle de reprise — qui n'attendait et rejouait que pour une panne
      # réseau — ne pouvait pas en sortir. La logique a quitté `ios.yml` pour
      # `scripts/ci/resolve-spm-packages.sh`, rejouable ici (faux
      # `xcodebuild`/`sleep` sur PATH) sans macOS : collision purgée sans
      # dormir, panne réseau toujours retentée avec attente, échec réel
      # toujours définitif après 4 essais.
      - name: iOS SPM resolve retry guard
        run: node scripts/check-ios-spm-resolve-retry.mjs --self-test && node scripts/check-ios-spm-resolve-retry.mjs

      # #4544 — le validateur de déploiement ne tient plus de liste : il DÉRIVE
      # ses variables exigées de la garde ci-dessus. Un témoin qui comparerait
      # les deux listes ne prouverait rien, deux copies coïncidant toujours le
      # jour où on les écrit ; celui-ci injecte dans une copie de la table un
      # nom TIRÉ AU HASARD à l'exécution et vérifie que le shell l'exige, sans
      # qu'une ligne du shell ait été touchée. Un nom qui n'existe qu'à
      # l'instant du test ne peut pas être écrit en dur : s'il devient
      # exigible, il a été dérivé.
      - name: Deployment validator derivation witness
        run: bash scripts/deployment/deploy-validate-config.sh --self-test

      # #6556 — une purge qui demande `y/N` au bout d'un `ssh` lit une entrée
      # vide, comprend « N » et ne retire rien : l'hôte de staging se remplit
      # jusqu'au `no space left on device`, le déploiement s'arrête et staging
      # sert une version périmée que rien n'annonce. Ce garde exige le drapeau
      # non interactif sur CHAQUE purge du dépôt, une purge AVANT chaque `pull`
      # distant, et — seconde moitié de la directive porteur du 2026-09-15 —
      # que tout job porteur d'une clé SSH de déploiement reste épinglé à
      # `refs/heads/dev` : la production ne se déploie jamais toute seule.
      - name: Docker prune & deploy-only-on-dev guard
        run: node scripts/check-docker-prune-noninteractive.mjs --self-test && node scripts/check-docker-prune-noninteractive.mjs

      # Casse de compilation Swift détectable sans compilateur. Ici (ubuntu,
      # quelques secondes) plutôt que sur le runner macOS : `xcodebuild` coûte
      # ~15 min et meurt à la première erreur, alors que ce garde les liste
      # toutes avant même que le job iOS ne démarre.
      - name: ViewBuilder statement-chaining guard
        run: bash scripts/check-swift-viewbuilder.sh --self-test && bash scripts/check-swift-viewbuilder.sh

  # ===========================================================================
  # CACHE INSTITUTIONNEL: les cinq pages restent ELLES-MÊMES à la deuxième visite
  # ===========================================================================
  # Un job À PART de « Gates web » (job `quality`), et pour une raison de
  # coût : celui-ci lève un navigateur, donc télécharge Chromium. `quality` est
  # la dépendance de presque tout le workflow — l'y ajouter retarderait chaque
  # autre job d'une minute pour une preuve qui n'intéresse que cinq documents.
  #
  # CE QU'IL ATTRAPE, et que rien d'autre ne pouvait voir. #5554 a livré les
  # cinq pages institutionnelles en HTML statique — une requête, zéro script —
  # et l'a mesuré sur une visite FROIDE. À la deuxième, la `NavigationRoute` du
  # service worker servait la coquille de l'application à leur place : « À
  # propos de Meeshy », un h1, 0 script en visite 1 ; « Meeshy », aucun h1,
  # 2 scripts en visite 2 — et la coquille n'a pas de route `/about`, donc page
  # blanche. Ni un test de construction (les fichiers étaient sur le disque), ni
  # la mesure de première peinture (elle n'installe le service worker qu'à la
  # fin) ne pouvaient le voir. Il faut un navigateur RÉEL et une DEUXIÈME
  # visite : c'est exactement ce que ce job fait.
  institutionnel-v3:
    name: Peaux web (institutionnel, Lentille, états et virtualisation du fil)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Le préchauffage des cinq documents fait partie de CE build depuis
      # qu'il est un greffon de `vite.config.ts` : le témoin mesure donc
      # exactement ce qu'un déploiement servirait.
      - name: Build packages/shared (la v3.1 en importe depuis #5493)
        run: |
          cd packages/shared
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Build apps/web
        run: |
          cd apps/web
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # CHAQUE GATE RAPPORTE SON VERDICT, PAS SEULEMENT LE PREMIER (#6137).
      # GitHub arrête un travail à la première étape rouge : les dix gates
      # ci-dessous étant indépendants (chacun lève son propre serveur statique
      # et son propre Chromium), un rouge en cachait NEUF. Mesuré : `dev` est
      # resté rouge onze heures sur le gate des états du fil pendant que la
      # coque, capacitor, la virtualisation et le mode de lecture ne tournaient
      # plus du tout — et le rouge du mode de lecture (#6130), visible la veille,
      # avait DISPARU des rapports sans être corrigé, simplement plus mesuré.
      #
      # `!cancelled()` et non `always()` : une annulation ne doit pas faire
      # tourner les gates restants. Les étapes de PRÉPARATION au-dessus gardent
      # leur arrêt — un gate qui tourne sans `dist` rendrait un rouge de
      # plomberie qui ne mesure rien, soit le défaut inverse.
      - name: Gate cache institutionnel
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-institutional.mjs

      # LE CRITÈRE BINAIRE DE LA LENTILLE, dans le MÊME travail : il lève le
      # même navigateur sur le même `dist`, et un second travail paierait une
      # installation de Chromium pour rien.
      - name: Gate flux de la Lentille (mise en page invariable au défilement)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-lens.mjs

      # #6975 — L'INVENTAIRE : aucune surface ne monte `Avatar` sans `src`, sauf
      # celles dont le registre dit OÙ la chaîne s'arrête. Le gate de pixels
      # prouve que la loi peint ; celui-ci prouve qu'aucun écran n'est oublié —
      # y compris ceux qu'aucun navigateur de gate ne visite. Sans navigateur,
      # donc joué même si Chromium manque.
      - name: Gate inventaire des avatars (aucun `Avatar` muet)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-avatar-src.mjs

      # #6975 — UNE PHOTO DE PROFIL EST PEINTE, pas seulement passée. Tous les
      # autres gates d'avatar mesurent la GÉOMÉTRIE (check-curve) ou la pastille
      # de PRÉSENCE (avatar.test.tsx) : aucun ne demandait « une photo est-elle
      # là ? », et dix-sept surfaces montaient `Avatar` sans `src` sans faire
      # rougir un seul verdict. `naturalWidth` après `decode()`, sur les trois
      # RANGS de la loi partagée, plus un contre-témoin sans photo.
      - name: Gate photo de profil peinte (trois rangs, pixels)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-avatar-pixels.mjs

      # #6277 / #6133 — aucun disque flottant ne recouvre, au repos, un texte de
      # carte du Flux, un libellé du plateau ni un contrôle du chrome
      # (elementFromPoint, deux schémas, 390×844 et 320×568) ; l'en-tête du Flux
      # s'escamote ; les cotes du plateau sont celles d'iOS (88 / 36).
      - name: Gate couloir des disques flottants (Flux et liste)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-floating-clearance.mjs

      # #6456 — le disque du Flux bascule Flux ↔ conversations sans saut (nom,
      # adresse et marque suivent la destination), son appui long (souris,
      # doigt, Maj+F10) ouvre les Réels sans navigation ni clic au relâché, un
      # glisser tenu n'ouvre rien et suit le pointeur sans retard, la place
      # survit au rechargement, un réel de carte ramène au même défilement.
      - name: Gate disque du Flux (bascule, appui long, glisser)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-feed-disc.mjs

      # #6288 — la cloche : la pastille du bouton flottant porte le compte servi
      # et disparaît à zéro ; une catégorie filtre ; ouvrir une ligne la marque
      # lue et mène à sa cible ; « Tout lire » a un effet ; aucun texte ni
      # contrôle n'est volé par un disque (elementFromPoint, deux schémas,
      # 390×844 et 320×568).
      - name: Gate cloche des notifications (pastille, catégories, marquage, cible)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-notifications.mjs

      # #6289 — le profil : il se lit (contact masqué, trois rangs du Prisme,
      # statistiques), se modifie en optimiste, garde le couple de focus de ses
      # champs, change une langue par la feuille et la retire, recompresse une
      # photo avant de l'envoyer, désactive l'écriture hors ligne ; aucun
      # contrôle ni texte n'est volé par un disque (deux schémas, deux gabarits).
      - name: Gate profil (lecture, édition optimiste, langues, recompression, hors-ligne)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-profile.mjs

      # #5563 — les réglages : le thème bascule à chaud et persiste, la langue
      # d'interface se pose sans rechargement, les bascules que la passerelle
      # obéit sont optimistes et désactivées hors ligne, chaque entrée non portée
      # mène au legacy, la déconnexion efface la session ; aucun contrôle ni
      # texte n'est volé par un disque (deux schémas, deux gabarits).
      - name: Gate réglages (thème, langue d'interface, bascules, legacy, déconnexion)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-settings.mjs

      # Le critère de fin de #5561 est une mesure de GÉOMÉTRIE : l'action
      # primaire de `/chat/:lien` doit tenir dans le premier écran dans TOUS ses
      # états, refus compris, à 360 et 390 px. Un témoin unitaire dit qu'un
      # bouton est rendu ; il ne dit pas à quelle ordonnée il tombe.
      - name: Gate jonction par lien (action primaire dans le premier écran, 360 et 390)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-join-first-screen.mjs

      # #6364 — ses communautés : la grille remplace l'écran d'attente, la
      # recherche se peint depuis le cache, une carte ouvre son détail et une
      # conversation son fil, la création refuse un identifiant pris sous son
      # champ puis devient le détail ; les textes blancs des cartes tiennent AA
      # au pire pixel ; aucun contrôle ni texte n'est volé par un disque (deux
      # schémas, deux gabarits).
      - name: Gate communautés (liste, recherche, détail, création, hors-ligne)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-communities.mjs

      # #6362 — le journal d'appels : il remplace l'écran d'attente, les trois
      # directions se distinguent par un glyphe et un libellé (jamais la couleur
      # seule), aucune ligne ne porte « Rappeler », « Manqués » se peint depuis
      # le cache, une ligne ouvre son fil ; chaque texte tient AA et aucun n'est
      # volé par un disque (deux schémas, deux gabarits).
      - name: Gate journal d'appels (directions, filtre, fil, hors-ligne)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-calls.mjs

      # #6383 / #6454 / #3586 — rejoindre, rappeler, composer : le pavé trouve
      # par nom et par numéro, la fiche /call/:id se lit sans numéro, un appel
      # vivant se rejoint par lien profond, bannière et pastille « Rejoindre ».
      - name: Gate appels rejoints (pavé, fiche, reprise)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-calls-join.mjs

      # #8046 — continuer à discuter pendant l'appel : un appel vivant (faux
      # micro et fausse caméra de Chromium) se choisit ses périphériques, se
      # réduit en pastille puis en bulle, survit à la navigation, laisse écrire
      # et envoyer dans une autre conversation, se déplace au doigt et au
      # clavier, revient en un geste ; l'image dans l'image s'ouvre.
      - name: Gate appel en cours (bulle, image dans l'image, périphériques)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-calls-during.mjs

      # #6363 / #6321 — découvrir des personnes : trois onglets (Découvrir,
      # Demandes, Bloqués), chaque relation par son geste, accepter/refuser
      # retirent la ligne et font baisser le compte de l'onglet ET du barreau au
      # geste, aucun point de présence peint ; chaque texte tient AA et aucun
      # n'est volé par un disque (deux schémas, deux gabarits).
      - name: Gate découverte de personnes (relations, demandes, bloqués, compte)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-discover.mjs

      # #6361 — Mes liens : le hub ne montre que la famille servie, la liste
      # porte les agrégats de la passerelle, « copier » met l'adresse PUBLIQUE
      # dans le presse-papiers, « Désactiver » se lit au geste, la création
      # remplace l'écran par le lien créé ; chaque texte tient AA et aucun
      # n'est volé par un disque (deux schémas, deux gabarits).
      - name: Gate Mes liens (hub, liens de partage, détail, création)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-links.mjs

      # #6457 — les Réels : le bouton de l'en-tête du Flux, un réel touché ouvre
      # le lecteur SUR lui depuis le cache (sans squelette, sans disque), un seul
      # réel joue, un balayage tactile accroche le suivant puis le précédent, le
      # clavier aussi, « J'aime » se voit au retour dans le Flux, le texte blanc
      # tient AA au pixel, le retour ne laisse aucun lecteur ; hors ligne chaud
      # et froid, lien profond, mouvement réduit (deux schémas, deux gabarits).
      - name: Gate Réels (lecteur plein écran, balayage, lecture unique, retour)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-reels.mjs

      # #6807 — LES MÉDIAS DU FIL ET DES STORIES SE JOUENT. Mesure l'EFFET, pas
      # la présence d'une balise : le temps doit AVANCER quand on demande la
      # lecture. Porte ses deux contre-épreuves — l'affiche d'un RÉEL ne monte
      # aucun élément média (#6457), une story IMAGE reste une image.
      - name: Gate médias du fil (une vidéo, un son et une story vidéo SE JOUENT)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-feed-media.mjs

      # #7449 — LE FIL SE LIT DANS UNE COLONNE, ET ON Y PUBLIE. Le SEUL gate du
      # dépôt qui mesure un gabarit LARGE (1440 × 900) : tous les autres
      # tournent à 390 × 844 et 320 × 568, et c'est exactement pour cela que le
      # fil a pu s'étaler sur 1416 px sans qu'aucun ne rougisse. Il garde aussi
      # l'autre moitié — que la borne ne MORD PAS sur un téléphone — puis
      # traverse la porte de création : ses deux formats, le refus NOMMÉ d'un
      # réel non qualifiant, la bascule qui garde la saisie, la publication.
      - name: Gate colonne du fil (centrage large, porte de création, publication)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-feed-column.mjs

      # #7135 — LES GESTES D'UNE RANGÉE DE COMMENTAIRE ONT UN EFFET. Les
      # témoins `bun test` tournent sous happy-dom et prouvent que les rappels
      # partent ; seul un moteur réel peut dire que le cœur se REMPLIT avant la
      # réponse, que la cible fait 44 px, que le refus défait l'optimiste à la
      # valeur EXACTE et que « Réessayer » repart. Surface partagée par
      # `/post/$post` et le panneau du lecteur de stories.
      - name: Gate commentaires (aimer, modifier, supprimer — optimiste et refus)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-post-comments.mjs

      # #7022 — UN MÉDIA ABSENT DÉGRADE PROPREMENT. 8 fichiers sur 2912 sont
      # réellement absents du volume de production (le cadrage du lot en
      # annonçait 582 : faux, cf. l'issue). Une référence morte doit rendre un
      # état DESSINÉ, ANNONCÉ, lisible et SANS bouton — il n'y a rien à
      # retenter — sans emporter la story autour d'elle.
      - name: Gate médias absents (état dessiné, annoncé, non destructeur)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-medias-absents.mjs

      # #6898 — UNE PUBLICATION V:3 SE LIT DANS LE FIL AVEC TOUS SES OBJETS.
      # Texte seul, image, cadrage plafonné à 1,4, une seule scène cinématique
      # joue à la fois (`prefers-reduced-motion` en tient une hors du jeu), et
      # chaque tuile d'un agencement montre la scène de SA slide.
      - name: Gate scènes du fil (texte, cadrage 1,4, une seule lecture, tuiles)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-feed-scenes.mjs

      # #6899 — LE LECTEUR DE STORY REND SES SCÈNES V3 PAR LE MOTEUR PARTAGÉ.
      # Placeholder ThumbHash peint AVANT « prêt » (moteur retenu, mesure de
      # pixels), carte 9:16 centrée dans le plateau aux deux tailles, texte au
      # Prisme (rang 2), son de fond dont le bouton dit la vérité et a un effet,
      # image seule sans moteur, épingle de timeline autoritaire, v1 intact.
      - name: Gate scènes du lecteur de story (placeholder, plateau, son, image seule)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-story-scene.mjs

      # #7015 — LE SON DE FOND EMPRUNTÉ À LA BIBLIOTHÈQUE JOUE. Mesuré en
      # production : `GET /api/v1/static/<uuid>.m4a` rend 401, pas 404 — la
      # route est authentifiée et une balise `<audio src>` ne porte aucun
      # en-tête. Ce gate mesure l'EFFET (readyState, duration), l'absence de
      # jeton dans l'URL, et qu'un refus dégrade sans promesse rejetée.
      - name: Gate son de fond de story (route authentifiée, URL d'objet, refus)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-story-sound.mjs

      # #6900 — LE STUDIO DE STORY PEINT CE QU'IL PUBLIERA. Publier inerte sur
      # un brouillon vide, un fond + un son posés font PEINDRE le moteur
      # partagé (mesure de pixels, pas la présence d'une balise), la carte
      # 9:16 est centrée dans son plateau aux deux gabarits, cinq cibles
      # ≥ 44 px, le texte tapé survit à un rechargement (brouillon).
      - name: Gate studio de story (moteur peint, carte 9:16, cibles, brouillon)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-story-studio.mjs

      # #6943/#6944 — LE PLATEAU : poser DEUX objets texte, en déplacer un au
      # POINTEUR puis le tourner et l'agrandir au CLAVIER, choisir sa langue et
      # son style (et vérifier qu'ils sont PEINTS, pas seulement annoncés),
      # placer un son SUR la scène, écrire une LÉGENDE de média — puis RELIRE
      # le corps de POST /api/v1/posts et y retrouver chaque valeur, un objet
      # non sélectionné restant intact. Bâtit sa propre variante `gateway`
      # (`dist-gateway/`) : le `dist/` de fixtures court-circuite la
      # publication, donc il n'y aurait AUCUN document à relire.
      - name: Gate plateau de story (deux textes, gestes, langue, style, légende, document publié)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-story-plateau.mjs

      # #6150 — les DEUX portes de ma cellule du rail de stories : le (+) au
      # début de ligne au-dessus de l'avatar, la pastille d'humeur en dessous à
      # la fin, deux cibles de 44 px qui ne se recouvrent PAS (le piège de deux
      # pastilles sur un même avatar), 💭 sans humeur et l'emoji animé avec,
      # chaque porte ouverte par un VRAI clic — clair, sombre et RTL miroité.
      - name: Gate rail « soi » (deux portes, cibles disjointes, 💭 / emoji, RTL)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-story-self-rail.mjs

      - name: Gate états du fil (vide, coupure, échec d'envoi rejouable)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-thread-states.mjs

      # #5910 — CINQ MAILLONS DU COMPOSITE QUI NE S'EXÉCUTAIENT NULLE PART.
      # Tous ouvrent un chromium sur le `dist` déjà construit : ils ont leur
      # place dans CE travail, qui a payé l'installation du navigateur, et pas
      # dans `quality`. Placés AVANT le pas de virtualisation ci-dessous, qui
      # doit rester le dernier pour la raison qu'il donne lui-même.
      #
      # `check-shell-dist` et `check-gateway-build` reconstruisent chacun leur
      # propre sortie (`dist-capacitor`, `dist-gateway`) : ils ne touchent pas
      # au `dist` que les pas précédents ont mesuré.
      - name: Gate actions de rangée (un contrôle existe s'il a un EFFET)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-list-actions.mjs

      - name: Gate mode de lecture (l'EFFET, pas le rendu du contrôle)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-reading-mode.mjs

      # #5774 — LE CHROME DU FIL : escamotage au geste, pilule de jour
      # collante, bouton « revenir en bas ». Mesure des `opacity`,
      # `pointer-events`, positions et `scrollTop` RÉELS, dans les deux
      # schémas — rien de tout cela n'est visible d'un test unitaire.
      - name: Gate chrome du fil (escamotage, pilule de jour, retour en bas)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-thread-chrome.mjs

      # #6101 — AU REPOS, LA PILULE DE JOUR NE RECOUVRE AUCUN TEXTE. Boîtes
      # des nœuds texte sous la capsule et opacité calculée, deux schémas,
      # deux gabarits, trois modes rendus — une géométrie, jamais un booléen.
      - name: Gate pilule de jour au repos (#6101)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-day-pill-rest.mjs

      # #6206 — UNE SECONDE LANGUE D'INTERFACE S'AFFICHE RÉELLEMENT : <html lang>
      # résolu (stockage → navigateur → fr), écran d'attente et menus flottants
      # dans la langue, UN SEUL catalogue téléchargé, aucune erreur de page,
      # atteignabilité à 320×568 en allemand et en arabe.
      - name: Gate langue d'interface (#6206)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-interface-language.mjs

      # #6213 — LE FIL DÉFILE D'UN BORD À L'AUTRE DE L'ÉCRAN. Miroir de
      # check-thread-chrome.mjs : rien de ceci n'est visible d'un test
      # unitaire, seule la mesure de rectangles réels le prouve.
      - name: Gate arêtes de défilement du fil (#6213)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-thread-scroll-edges.mjs

      - name: Gate couple de focus des champs (l'anneau et son contre-anneau)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-field-focus.mjs

      # #6643 — chaque page et état d'accès (connexion et second facteur,
      # accueil, inscription, mot de passe oublié, nouveau mot de passe, lien
      # par e-mail, vérification d'e-mail) tient dans la colonne centrée de la
      # connexion à 1440×900 et 834×1194, et garde la colonne de la tablette à
      # 390×844 (plus petit ancêtre commun du contenu perceptible).
      - name: Gate colonne des pages d'accès (centrée, jamais plus large que la connexion)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-access-column.mjs

      - name: Gate dist de la coque Capacitor (variante B)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-shell-dist.mjs

      # #7844 — le maillon `check-android-manifest` du composite n'était
      # exécuté par AUCUN job : `gate-ci-parity.test.ts` le signalait vert par
      # omission. Pur node, il ne lit que le manifeste versionné de la coque.
      - name: Gate manifeste de la coque Android (permissions requises)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-android-manifest.mjs

      # #5774 revue — capacitor.config.ts se charge en CJS (require.extensions)
      # par la CLI, jamais en ESM : `bun test` ne peut pas voir un `import.meta`
      # qui casse ce chargeur-là. Ce gate rejoue le VRAI chargeur (`bunx cap ls`).
      - name: Gate capacitor.config.ts (chargeur CJS réel de la CLI)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-capacitor-config.mjs

      - name: Gate build passerelle (VITE_DATA_SOURCE=gateway parle vraiment)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-gateway-build.mjs

      # #6936 — LE PARCOURS DE MISE À JOUR, de bout en bout : deux versions
      # servies successivement sur la MÊME origine, la bannière qui s'annonce au
      # retour au premier plan, le clic qui purge les caches de l'ancienne,
      # active le worker en attente et recharge UNE fois — le lecteur restant
      # connecté. Il construit sa propre sortie (`dist-app-update-a`, puis la
      # version B qui en dérive) et ne touche pas au `dist` mesuré plus haut.
      - name: Gate mise à jour de l'application (bannière, purge, session gardée)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-app-update.mjs

      # #7032 — le TEXTE ENRICHI : une mention validée est un lien qui, CLIQUÉ,
      # peint vraiment le profil ; un pseudo non validé et un hashtag de
      # CONVERSATION restent du texte (aucune jointure message ↔ hashtag
      # n'existe) ; les quatre emphases rendent <strong>/<em>/<u>/<s> pendant
      # que `snake_case` traverse intact ; l'enrichissement porte sur le texte
      # TRADUIT, mesuré sous un prisme à DEUX échelons (`fr`,`en`) avec son
      # contre-témoin à un seul ; aucun href hostile, aucun <script>.
      - name: Gate texte enrichi (liens, mentions, quatre emphases, texte traduit)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-rich-text.mjs

      # #6458 — le barreau « Administration » du menu flottant, sur un dist
      # gateway (l'administration n'a pas de fixtures) : sept barreaux dans
      # l'écran aux deux poses (deux schémas, 390×844 et 320×568), parcours
      # clavier et navigation vers /admin sur UNE lecture de la matrice ; six
      # barreaux sans le droit, sur 403 et en vol ; aucune lecture sans session.
      - name: Gate barreau Administration du menu flottant (#6458)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-admin-rung.mjs

      # #6862 / #6733 — la lecture souveraine et la section Agent, sur un dist
      # gateway : la tuile « Agent » selon `canManageAgent`, `/adm` ≡ `/admin`,
      # les deux sections repliables à la souris ET au clavier, la ligne qui
      # ouvre la modale, le motif écrit exigé AVANT toute requête `/messages`,
      # le texte servi dans le Prisme du MEMBRE (jamais celui de l'administrateur),
      # et aucune clé de contenu laissée dans `localStorage` après la lecture.
      # Le gate construit son propre `dist-admin-souverain`, comme son voisin.
      - name: Gate lecture souveraine et section Agent (#6862, #6733)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-admin-souverain.mjs

      # #6151 — un seul site résout `apiConfig.source` en dépendances d'appel
      # (`src/lib/api/deps.ts`). Un huitième site qui reconstruirait
      # `{ source: apiConfig.source, … }` divergerait en silence sans ce gate.
      - name: Gate adaptateur unique de apiConfig.source (#6151)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-api-source.mjs

      # EN DERNIER, et pas par hasard : ce témoin RECONSTRUIT `dist` en variante
      # de banc (500 messages) pour mesurer la virtualisation, puis le
      # reconstruit normalement. Le placer avant les deux autres leur ferait
      # mesurer un `dist` qui n'est pas celui qu'on livre.
      - name: Gate virtualisation du fil (500 messages)
        if: ${{ !cancelled() }}
        run: |
          cd apps/web
          node scripts/check-thread-virtualization.mjs

  # ===========================================================================
  # COQUE ANDROID : l'APK de `apps/web` est construit et audité (#6217)
  # ===========================================================================
  # `build-shells.mjs` porte depuis D-45 l'audit de l'ARTEFACT (versionName =
  # `package.json`, versionCode = le numéro de build posé), mais il ne
  # tournait qu'à la main, sur une machine outillée : une modification de
  # `build.gradle`, de la config Capacitor ou d'un greffon natif n'était vue
  # qu'au premier `build:shells` local, c'est-à-dire sur le téléphone.
  #
  # Ce job lance le MÊME pilote que la recette, cible Android seule, avec le
  # numéro de run comme numéro de build (`MEESHY_SHELL_BUILD_NUMBER` est la
  # source explicite que `resolveShellBuildNumber` prévoit : un checkout
  # superficiel ne fabrique donc jamais un « build 1 »). Il ne tourne que si
  # la poussée touche ce que le pilote LIT (`shell_android`,
  # `scripts/ci-affected.mjs`). iOS reste local (runner macOS, #5657).
  shell-android:
    name: Coque Android (apps/web)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shell_android == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Build packages/shared
        run: |
          cd packages/shared
          bun run build

      # Capacitor 8 et AGP 8.13 exigent un JDK 21 ; la plateforme (compileSdk
      # 36, `android/variables.gradle`) est résolue par AGP lui-même, les
      # licences étant acceptées par setup-android.
      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Construire et auditer l'APK (build-shells.mjs --target android)
        env:
          MEESHY_SHELL_BUILD_NUMBER: ${{ github.run_number }}
          VITE_API_BASE: https://gate.staging.meeshy.me
          VITE_DATA_SOURCE: gateway
        run: |
          cd apps/web
          node scripts/build-shells.mjs --target android

      # #8049 — les décisions PURES de l'appel natif (routage de la poussée,
      # sorties audio, type du service au premier plan, refus sans socket) se
      # testent sur la JVM : `app/src/test/java/me/meeshy/app/`.
      - name: Tests JVM de la coque (testDebugUnitTest)
        run: |
          cd apps/web/android
          ./gradlew testDebugUnitTest

      # L'APK de recette, installable tel quel (`adb install -r`) : la
      # régression se voit sur le runner, et le build vert se pose sur le
      # téléphone sans machine outillée.
      - name: Publier l'APK de recette
        uses: actions/upload-artifact@v7
        with:
          name: meeshy-web-shell-android-${{ github.run_number }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # TEST: Unit Tests with Coverage (Parallel by package)
  # Minimum coverage threshold: 90%
  # ===========================================================================
  # #6884 — `timeout-minutes` était UNIQUE (20) pour toute la matrice, alors
  # que les paquets n'ont pas le même poids : `Test gateway` tenait avec
  # moins de 2 min de marge sur 20 (18 min 05 s / 18 min 33 s mesurés sur
  # `dev`), et toute variance (ex. #6477, montée de `vitest`) le fait
  # franchir le seuil. Un dépassement de `timeout-minutes` DE JOB tue le job
  # entier et TOUTES ses étapes en cours — GitHub rend alors `cancelled`,
  # indiscernable d'une annulation par concurrence (`cancel-in-progress`
  # ci-dessus). `timeout-minutes` posé sur une ÉTAPE, en revanche, échoue
  # cette étape avec `failure` et un message explicite (« has timed out
  # after Nm ») SANS attendre le budget de job — c'est déjà le patron des
  # jobs `test-python`/`test-audio-pipeline` de ce fichier. `testTimeoutMinutes`
  # ci-dessous porte donc le budget RÉEL (celui qu'on veut voir nommé), et
  # `timeoutMinutes` (job) reste un plafond de secours nettement au-dessus —
  # relevé pour `gateway` seul (30 au lieu de 20), les autres paquets gardant
  # le budget historique.
  test:
    name: Test ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: ${{ matrix.package.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: shared
            path: packages/shared
            filter: '@meeshy/shared'
            timeoutMinutes: 20
            testTimeoutMinutes: 15
          - name: gateway
            path: services/gateway
            filter: '@meeshy/gateway'
            timeoutMinutes: 30
            testTimeoutMinutes: 25
          - name: agent
            path: services/agent
            filter: '@meeshy/agent'
            timeoutMinutes: 20
            testTimeoutMinutes: 15
          - name: web
            path: apps/web
            filter: '@meeshy/web'
            timeoutMinutes: 20
            testTimeoutMinutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # pnpm is always needed for turborepo (version from package.json packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js (with pnpm cache)
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Node.js (without cache for bun)
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Generate Prisma client before building
      - name: Generate Prisma client
        env:
          DATABASE_URL: "mongodb://localhost:27017/test"
        run: |
          cd packages/shared
          npx prisma generate --generator client

      # Build shared package first (required for gateway tests)
      - name: Build shared package (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd packages/shared
          bun run build

      - name: Build shared package (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd packages/shared
          pnpm run build

      - name: Run tests with coverage (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        timeout-minutes: ${{ matrix.package.testTimeoutMinutes }}
        run: |
          # Le web lance sa suite depuis son répertoire (`bun test`, happy-dom).
          if [ "${{ matrix.package.name }}" = "web" ]; then
            cd ${{ matrix.package.path }}
            echo "Running web tests with bun test..."
            bun run test:coverage
          else
            bun run test:coverage --filter=${{ matrix.package.filter }}
          fi

      - name: Run tests with coverage (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        timeout-minutes: ${{ matrix.package.testTimeoutMinutes }}
        run: pnpm run test:coverage --filter=${{ matrix.package.filter }}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          file: ./${{ matrix.package.path }}/coverage/lcov.info
          flags: ${{ matrix.package.name }}
          name: ${{ matrix.package.name }}-coverage

  # ===========================================================================
  # TEST: Python Tests with Coverage
  #
  # RALLUME au sprint 0.3 (un `if: true`, remplacé depuis par le job
  # `changes`, #7711), et ce bloc a porté
  # « DISABLED: Downloads ML models that fill up GitHub runner disk » pendant
  # tout ce temps — trois lignes au-dessus du `if` qui le contredisait. Le
  # commentaire disait une raison technique précise et plausible, ce qui le
  # rendait crédible ; c'est ce qui a laissé le résumé annoncer « disabled »
  # pour un job qui consomme un runner à chaque poussée (#4860).
  #
  # Ce qui a rendu le rallumage possible : la découpe par marqueur CPU-only et
  # un seuil de référence, qui évitent le téléchargement des modèles lourds.
  # Les suites spécifiques (audio-pipeline, tts-stt, voice-api) gardent leurs
  # jobs dédiés.
  # ===========================================================================
  test-python:
    name: Test Python (translator)
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.translator == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node.js and package manager setup for Prisma CLI
      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Install Node.js dependencies (required for Prisma CLI)
      - name: Install Node.js dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install Node.js dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "services/translator/uv.lock"
          # Cache du toolchain CPython lui-même : l'étape « Setup Python via
          # uv » ne touche plus GitHub Releases sur cache chaud — c'est ce
          # téléchargement (python-build-standalone) qui flake par « http2
          # error: refused stream » (2 occurrences le 2026-08-12).
          cache-python: true

      - name: Setup Python via uv (with retry)
        run: |
          # Le téléchargement de CPython (python-build-standalone, hébergé sur
          # GitHub Releases) échoue par intermittence sur des erreurs de
          # transport — « http2 error: refused stream » observé le 2026-08-12.
          # Même motif que « Install dependencies (bun with retry) », mais on
          # sort en échec après la 3e tentative : une boucle qui se termine
          # sans `exit 1` rendrait la panne invisible et ferait tomber les
          # étapes suivantes sur une erreur sans rapport.
          # Backoff exponentiel : les incidents GitHub Releases observés
          # durent plus que les 30 s couvertes par 3 × 10 s — 5 tentatives
          # sur ~2,5 min (10/20/40/80 s) traversent un blip complet. Le
          # cache-python ci-dessus rend de toute façon cette étape no-op
          # réseau sur cache chaud.
          delay=10
          for i in 1 2 3 4 5; do
            uv python install ${{ env.PYTHON_VERSION }} && exit 0
            echo "Tentative $i échouée, nouvelle tentative dans $delay s..."
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "::error::uv python install a échoué après 5 tentatives."
          exit 1

      - name: Install system dependencies (ffmpeg + dev libs for PyAV)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev

      - name: Install Python dependencies (CPU backend for CI)
        run: |
          cd services/translator
          # Create virtual environment first
