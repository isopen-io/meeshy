# =============================================================================
# MEESHY - CI Pipeline
# =============================================================================
# Continuous Integration: Lint, Type-check, Test with Coverage, Build
# Optimized for monorepo with Turborepo
# Supports: bun (default) or pnpm
# =============================================================================

name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:
    inputs:
      package_manager:
        description: 'Package manager to use'
        required: false
        type: choice
        default: 'bun'
        options:
          - bun
          - pnpm
      torch_backend:
        description: 'PyTorch backend (cpu for CI, gpu for production)'
        required: false
        type: choice
        default: 'cpu'
        options:
          - cpu
          - gpu
          - gpu-cu121

env:
  # '22.19' et non '22' : undici@8 exige >= 22.19.0 (worker_threads.markAsUncloneable,
  # arrive en 22.12), et le serveur assemble par les generateurs de manifeste le charge.
  # La ligne MINEURE, pas une version exacte — figer le patch ferait rater les correctifs
  # de securite des 22.19.x sans rien garantir de plus : c'est le plancher qui compte ici.
  NODE_VERSION: '22.19'
  BUN_VERSION: '1.3.14'
  PNPM_VERSION: '9'
  # Python 3.10 required: pkuseg (chatterbox-tts dependency) fails to compile on 3.11+
  PYTHON_VERSION: '3.10'
  UV_VERSION: '0.5.x'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Default to bun, can be overridden by workflow_dispatch
  PACKAGE_MANAGER: ${{ github.event.inputs.package_manager || 'bun' }}

# `cancel-in-progress` — VRAI sur une branche de PR, FAUX sur les deux branches
# d'intégration. C'est la piste (a) de #4395, appliquée telle qu'elle y est
# écrite.
#
# CE QUE LE RÉGLAGE UNIFORME COÛTAIT, mesuré le 2026-09-01 à 22:30 UTC : ONZE
# runs consécutifs de `dev` annulés, aucune `conclusion` sur la branche depuis
# 20:51 UTC — près de deux heures pendant lesquelles personne ne pouvait dire
# si `dev` était vert. Trois de ces onze commits réparaient précisément la CI.
#
# ET UN RUN ANNULÉ N'EST PAS GRATUIT : les huit derniers ont tourné de 2,8 à
# 8,0 minutes avant d'être tués (moyenne 5,6, soit environ un tiers d'un run
# complet), chacun en éventail sur dix-huit jobs. Le réglage ne fait donc pas
# l'économie des minutes, il les dépense sans jamais rendre de verdict.
#
# L'ASYMÉTRIE QUI AGGRAVE LE TOUT : un run qui aboutit VERT met au moins 16,3
# minutes (médiane 19,6) ; un run qui aboutit ROUGE conclut en ~3 minutes, en
# s'arrêtant au premier job qui tombe. 65 % des intervalles entre poussées sont
# sous 16,3 min, mais seulement 27 % sous 2,6 — la famine mange donc les VERTS
# environ deux fois plus souvent que les ROUGES, et la branche paraît plus rouge
# qu'elle n'est. C'est l'inverse de ce dont la règle `to-integrate` a besoin,
# puisqu'elle ne peut se satisfaire que d'un `success`.
#
# POURQUOI FAUX PLUTÔT QUE `group: ci-${{ github.sha }}` (la piste (b)) : la
# file de concurrence ne garde qu'UN run en attente — le dernier arrivé écrase
# celui qui patientait — donc le run EN COURS va au bout et `dev` obtient
# toujours un verdict, sans multiplier les runs par le nombre de commits. C'est
# le comportement sur lequel `pilotage-pages.yml` repose déjà en production
# depuis le 2026-08-30, et son en-tête le décrit dans ces termes ; cinq autres
# workflows du dépôt (`release`, `ios-release`, `ios-fastlane-release`,
# `ios-beta-trigger`, `pilotage-milestone`) portent le même réglage.
#
# VÉRIFIÉ SUR `dev`, une heure après la bascule. Ce bloc portait d'abord une
# réserve — la sémantique de la file n'avait pas pu être confirmée sur
# `docs.github.com`, bloqué par le proxy de sortie — et la mesure l'a levée :
#
#   • DEUX runs sont allés au bout, 28,9 et 32,8 minutes, pendant que SEPT
#     poussées arrivaient. Sous l'ancien réglage aucun n'aurait dépassé six
#     minutes ;
#   • la file NE s'accumule PAS : `run_started_at == created_at` sur les dix
#     derniers runs, sans exception. Les annulations surviennent à des âges
#     courts et IRRÉGULIERS (0,23 · 0,60 · 1,17 · 3,00 · 7,97 min), signature
#     d'un run qui ATTENDAIT et qu'un arrivant plus récent a évincé — un seul
#     run en attente à la fois.
#
# Le symptôme d'une file qui s'accumulerait reste celui-ci, pour qui aurait à
# le rechercher un jour : `run_started_at` - `created_at` qui GRANDIT d'un run
# à l'autre. Il est absent. Ne pas lire une file d'attente comme une panne.
#
# Et le premier verdict retrouvé a immédiatement montré ce que la famine
# coûtait : un seul test tombait sur 22 383 — une collision de numéro de leçon
# que la branche portait depuis des heures, et que onze runs avaient traversée
# sans jamais conclure.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  # ===========================================================================
  # QUALITY: Lint & Type-check (Fast feedback)
  # ===========================================================================
  quality:
    name: Quality (${{ github.event.inputs.package_manager || 'bun' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # pnpm is always needed for turborepo (version from package.json packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js (with pnpm cache)
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Node.js (without cache for bun)
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Build shared package first (required for type-check)
      - name: Build shared package (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd packages/shared
          bun run build

      - name: Build shared package (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd packages/shared
          pnpm run build

      - name: Lint
        run: ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} lint
        continue-on-error: true

      # Même partage que le type-check ci-dessous : l'amnistie de l'étape
      # précédente est achetée par la dette du legacy. La v3 n'en a aucune, et
      # une étape amnistiée est le SEUL signal qu'elle aurait — autant dire
      # aucun. Elle rougit donc pour elle seule, sans toucher au reste.
      - name: Lint (apps/web-v3 — blocking)
        run: ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} lint --filter=@meeshy/web-v3

      # Type-check, en DEUX étapes plutôt qu'une amnistie.
      #
      # L'étape unique qui précédait portait `continue-on-error: true`, et ce
      # drapeau n'était pas un avis sur le typage : c'était la seule façon pour
      # elle d'être verte, `apps/web` portant une dette de types que les trois
      # autres packages TypeScript n'ont pas. Une amnistie, quatre packages —
      # les 1241 erreurs du quatrième achetaient le silence sur le zéro des
      # trois premiers.
      #
      # Le prix n'était pas théorique : les cycles 99–104 ont bâti pour la
      # passerelle un contrat d'émission Socket.IO dont une violation produit
      # `TS2345` ou `TS2322` — les deux codes que le `ts-jest` de la passerelle
      # a dans son `diagnostics.ignoreCodes`. Ni le job de test ni celui-ci ne
      # pouvaient donc rougir sur une charge fausse. Mesuré en retirant un champ
      # requis d'une émission de `preferences-broadcast.ts`.
      # `@meeshy/web-v3` entre ICI et nulle part ailleurs. Le ratchet ci-dessous
      # est gagé sur `WEB_BASELINE`, la dette de types d'`apps/web` LEGACY : y
      # faire entrer la v3 lui offrirait un budget d'erreurs qu'elle n'a pas à
      # avoir. La v3 naît à zéro erreur, et cette étape est la seule qui puisse
      # le garantir — elle ne porte pas `continue-on-error`.
      - name: Type-check (contract packages — blocking)
        run: ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} type-check --filter=@meeshy/shared --filter=@meeshy/gateway --filter=@meeshy/agent --filter=@meeshy/web-v3

      - name: Type-check (apps/web — debt ratchet)
        run: bash scripts/check-type-debt.sh --self-test && bash scripts/check-type-debt.sh

      - name: Law literals guard
        run: bash scripts/check-law-literals.sh --self-test && bash scripts/check-law-literals.sh

      # L'invariant porte sur le `bun.lock` de la RACINE et sur tous les
      # manifestes que la racine déclare comme workspaces : sa surface est le
      # dépôt, donc il est appelé ici, à côté des autres gates de racine, et
      # non depuis les tests d'une app. Il rougit dans les DEUX sens — un
      # manifeste que le lock ignore, un workspace loqué qu'aucun arbre de
      # fichiers ne porte — pour qu'un `bun.lock` ne puisse plus être commité
      # sans l'arbre qu'il décrit.
      - name: Lockfile alignment guard
        run: node scripts/check-lockfile-alignment.mjs --self-test && node scripts/check-lockfile-alignment.mjs

      # Même raison de placement que le garde ci-dessus : l'invariant porte sur
      # le `Makefile` de la RACINE, donc il est appelé ici et non depuis les
      # tests d'une app. Sa première écriture vivait dans
      # `apps/web-v3/__tests__/` — elle remontait de trois crans pour atteindre
      # sa surface et ne tournait dans AUCUN job — la matrice `test:` ne portait
      # alors que shared/web/gateway/agent : un contrôle inerte, qui laissait
      # rouvrir au commit suivant la régression qu'il prétendait fermer.
      # (`web-v3` A depuis rejoint la matrice ; cette phrase décrit le passé, et
      # la lire au présent fait conclure à tort qu'une suite de la v3 ne tourne
      # nulle part.)
      # Il déroule les cibles avec `make -n` : un `*_DIR` mort se lit dans le
      # texte, mais un `cd` vers un répertoire absent ne se voit qu'après
      # expansion des variables.
      - name: Makefile workspace directories guard
        run: node scripts/check-makefile-workspaces.mjs --self-test && node scripts/check-makefile-workspaces.mjs

      # Même raison de placement : l'invariant porte sur `ci.yml`, `docker.yml`
      # et `docker-compose.prod.yml` — trois fichiers de la RACINE. Il DÉROULE
      # les deux étapes de détection de `docker.yml` avec bash plutôt que de les
      # relire : « un push qui ne touche que apps/web-v3 construit-il la v3 sans
      # réveiller le legacy ? » ne se lit pas dans le texte d'un `[[ == *"…"* ]]`.
      - name: web-v3 pipeline guard
        run: node scripts/check-v3-pipeline.mjs --self-test && node scripts/check-v3-pipeline.mjs

      # Même raison de placement que les gardes ci-dessus : l'invariant porte sur
      # `ci.yml`, sur `turbo.json` et sur les manifestes des workspaces — la
      # surface est le DÉPÔT. Il ferme #4761.
      #
      # Le dépôt DÉCLARE la dépendance de build à deux endroits corrects
      # (`turbo.json` → `build.dependsOn: ["^build"]`, et le `workspace:*` du
      # manifeste), et ce fichier ne consulte ce graphe NULLE PART pour BÂTIR :
      # mesuré, aucune invocation directe de l'orchestrateur ici, 25 étapes qui
      # entrent dans un workspace par `cd` et y lancent un script de paquet — donc
      # HORS du graphe — et 11 copies écrites à la main de « construis le paquet
      # partagé ». Le jour où `01c49fcfee` a fait importer `@meeshy/shared` par
      # `apps/web-v3`, les trois jobs de la v3 sont devenus rouges — et LE JOB QUI
      # CASSE N'EST PAS CELUI QUI A AJOUTÉ L'IMPORT, puisque la personne qui écrit
      # l'`import` ne touche aucun fichier de CI.
      #
      # Le garde ne change rien à l'exécution : il RELIE, par job et par scénario
      # de gestionnaire de paquets, les dépendances PRODUCTRICES d'un workspace
      # aux étapes qui les construisent plus haut. « Productrice » n'est pas une
      # liste recopiée : c'est « a un script `build` dont la sortie, déclarée par
      # `turbo.json`, est ce que le consommateur importe » — ce qui laisse
      # `@meeshy/design-tokens` et `@meeshy/icons` tranquilles, deux paquets
      # d'actifs commités sans étape de build.
      - name: CI build-order guard
        run: node scripts/check-ci-build-order.mjs --self-test && node scripts/check-ci-build-order.mjs

      # Même placement, même raison : la surface est le DÉPÔT — ici le fichier
      # de workflow lui-même. Le garde confronte les jobs DÉCLARÉS de `ci.yml`
      # aux deux listes écrites à la main dont vit son résumé (le `needs:` de
      # l'agrégateur, et les lignes de son tableau). Il ferme #4860 : `chaines-v3`
      # — un gate écrit exprès — ne figurait dans aucune des deux, et
      # `test-python`, rallumé au sprint 0.3, y était annoncé « disabled » par
      # un mot écrit à la main pendant qu'il consommait un runner à chaque
      # poussée. L'agrégateur est reconnu par ce qu'il FAIT (`if: always()` +
      # écriture dans `$GITHUB_STEP_SUMMARY`), jamais par son nom : le renommer
      # ne doit pas éteindre le garde en silence.
      - name: CI summary coverage guard
        run: node scripts/check-ci-summary-coverage.mjs --self-test && node scripts/check-ci-summary-coverage.mjs

      # Même raison de placement que les trois gardes ci-dessus : l'invariant
      # porte sur les quatre `docker-compose*.yml` de `infrastructure/docker/compose/`
      # et sur les deux modèles d'environnement — la surface est le DÉPÔT.
      # Il ferme #4537 : une variable d'hôte absente n'arrête pas Docker Compose,
      # elle est substituée par la chaîne VIDE avec un simple avertissement.
      # La passerelle reçoit alors une liste d'origines DÉCLARÉE mais vide et
      # refuse tout (#4480) — sans qu'aucune erreur ne soit levée au démarrage.
      # La garde exige la forme à refus sur toute variable dont l'absence fait
      # MENTIR le service, et rougit sur toute substitution nue non classée.
      - name: Compose host variables guard
        run: node scripts/check-compose-required-vars.mjs --self-test && node scripts/check-compose-required-vars.mjs

      # #4544 — le validateur de déploiement ne tient plus de liste : il DÉRIVE
      # ses variables exigées de la garde ci-dessus. Un témoin qui comparerait
      # les deux listes ne prouverait rien, deux copies coïncidant toujours le
      # jour où on les écrit ; celui-ci injecte dans une copie de la table un
      # nom TIRÉ AU HASARD à l'exécution et vérifie que le shell l'exige, sans
      # qu'une ligne du shell ait été touchée. Un nom qui n'existe qu'à
      # l'instant du test ne peut pas être écrit en dur : s'il devient
      # exigible, il a été dérivé.
      - name: Deployment validator derivation witness
        run: bash scripts/deployment/deploy-validate-config.sh --self-test

      # Le rapport unique de la machine de vérification (§ 9 de la conception)
      # agrège cinq mesures dont quatre ont un prérequis (un build, un serveur,
      # un navigateur pour le gate axe — dont l'INVOCATION vit dans le job
      # `a11y-v3` ci-dessous, un agrégateur ne remplaçant pas un porteur).
      # Ce qui est BLOQUANT en CI est donc son agrégation, pas son verdict : une
      # mesure non exécutée doit sortir en « rapport incomplet » (rc=2), jamais
      # en vert. C'est exactement ce que les mutations du --self-test sondent.
      # Le rapport complet se lance à la main, avec la v3 servie :
      #   node scripts/v3-rapport.mjs --base http://127.0.0.1:3300
      - name: web-v3 verification report aggregation
        run: node scripts/v3-rapport.mjs --self-test

      # Casse de compilation Swift détectable sans compilateur. Ici (ubuntu,
      # quelques secondes) plutôt que sur le runner macOS : `xcodebuild` coûte
      # ~15 min et meurt à la première erreur, alors que ce garde les liste
      # toutes avant même que le job iOS ne démarre.
      - name: ViewBuilder statement-chaining guard
        run: bash scripts/check-swift-viewbuilder.sh --self-test && bash scripts/check-swift-viewbuilder.sh

  # ===========================================================================
  # A11Y: le gate axe du § 8.5 de la conception v3 — SON PORTEUR
  # ===========================================================================
  # « 0 erreur axe serious/critical sur toute route (public) ». L'instrument
  # vivait déjà (`apps/web-v3/e2e/visual/v3-a11y.spec.ts`, son verdict dans
  # `lib/a11y.ts`, gagé par `__tests__/a11y-gate.test.ts`) — et RIEN ne le
  # lançait : la chaîne `test:a11y` n'apparaissait que deux fois dans le dépôt,
  # sa définition et le témoin qui vérifiait sa définition. Un instrument
  # déclaré n'est pas un instrument lancé, et le gage de la DÉCLARATION rendait
  # exactement le vert qu'il prétendait interdire.
  #
  # Un job À PART plutôt qu'une étape de `quality` : il lui faut un `next build`
  # et un Chromium, que les onze gardes textuels de `quality` n'ont pas à payer.
  # Il ne porte PAS `continue-on-error` — la v3 naît sans dette, même règle que
  # son lint et son type-check.
  a11y-v3:
    name: A11y web-v3 (axe serious/critical)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Ce que le balayage prend pour entrée est ce que `next build` a ÉMIS
      # (`.next/app-build-manifest.json`), jamais ce que le disque porte : sans
      # cette étape le manifeste est absent et la garde de non-vacuité de
      # `exigeUnManifesteLu` fait échouer le gate, au lieu de le laisser sortir
      # vert sur zéro route.
      # `bun` EN DUR ici était un trou : `Setup bun` ci-dessus porte
      # `if: env.PACKAGE_MANAGER == 'bun'`, donc sous
      # `workflow_dispatch(package_manager: pnpm)` le binaire n'est pas installé
      # et l'étape qui construit la DÉPENDANCE échoue — pendant que l'étape
      # suivante, elle, s'adapte au gestionnaire. Trouvé par
      # `scripts/check-ci-build-order.mjs` [#4761], qui rend chaque étape une
      # fois par scénario déclaré au lieu de la lire à plat.
      - name: Build packages/shared (la v3 en importe depuis 01c49fcfee)
        run: |
          cd packages/shared
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Build apps/web-v3 (le manifeste que le balayage lit)
        run: |
          cd apps/web-v3
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` lève lui-même `next start` (webServer) : la
      # preuve d'un build se prend sur le serveur de production, jamais sur
      # `next dev`.
      #
      # LE PROJET ENTIER, JAMAIS TROIS SUITES NOMMÉES — et c'est la CINQUIÈME
      # fois que cette leçon se paie ici (2026-09-04, #5093). Cette étape
      # lançait `test:a11y`, `test:cibles` et `test:fil-a11y`, c'est-à-dire
      # TROIS des ONZE suites du projet `pages`. Les huit autres —
      # `v3-nouvelle-conversation`, `v3-nouveau-lien` et les six `*-a11y` de
      # commentaires, contacts, feed, liens, recherche et réglages — n'étaient
      # lancées par AUCUN job : `test:chaines` les ignore par construction
      # (`testIgnore`), et aucune étape ne les nommait. Elles portent les
      # critères de fin de huit issues qu'aucun gate ne pouvait donc prouver.
      #
      # `check-v3-pipeline.mjs` était censé l'attraper et ne le voyait pas : sa
      # lecture de `SUITES_DE_PAGE` ne sait pas lire un `...SPREAD`, et la liste
      # a cessé d'être un littéral le jour où elle s'est mise à RELEVER ses
      # suites sur le disque. La garde est corrigée dans le même lot ; le
      # correctif de fond, lui, est ici : **une étape lance un PROJET, pas une
      # énumération** — c'est la seule forme qui fasse entrer d'office la suite
      # écrite demain.
      - name: Gate pages — axe, cibles tactiles, surimpressions (projet ENTIER)
        run: |
          cd apps/web-v3
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} test:pages

      # PAS de `continue-on-error` ici : `check-v3-pipeline.mjs` interdit qu'une
      # étape nommant la v3 en porte un, et le job est de toute façon déjà rouge
      # quand celle-ci tourne.
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-v3-a11y-traces
          path: apps/web-v3/test-results/
          retention-days: 7

  # ===========================================================================
  # LIFECYCLE: le gate de cycle de vie du § 8.5 de la conception v3 — SON PORTEUR
  # ===========================================================================
  # « 0 requête pendant que l'onglet est hidden ; 1 seule requête de battement
  # pour N onglets sur 10 min ». Même leçon que le gate axe ci-dessus, payée une
  # fois : un instrument déclaré n'est pas un instrument lancé. L'instrument vit
  # dans `apps/web-v3/e2e/visual/v3-lifecycle.spec.ts`, son verdict dans
  # `lib/lifecycle.ts`, gagé sans navigateur par `__tests__/lifecycle-gate.test.ts`
  # — et ce job est l'une de ses deux invocations, l'autre étant la sixième mesure
  # de `scripts/v3-rapport.mjs`.
  #
  # Un job À PART de `a11y-v3` : le gate axe balaie ce que `next build` a émis et
  # rougit sur une page sans budget ; celui-ci mesure un cycle de vie sur un
  # scénario fabriqué. Deux verdicts distincts, deux lignes de résultat distinctes
  # dans le récapitulatif — les fondre rendrait « web-v3 rouge » sans dire lequel
  # des deux gates est tombé.
  lifecycle-v3:
    name: Cycle de vie web-v3 (0 requête onglet caché)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Le scénario fabriqué est servi par l'interception de Playwright, jamais
      # par le serveur — mais `playwright.config.ts` lève quand même `next start`
      # (la preuve d'un build se prend sur le serveur de production, leçon 339),
      # qui exige ce build.
      # Même trou que dans `a11y-v3` : `bun` en dur alors que `Setup bun` est
      # réservé au scénario `bun` (#4761).
      - name: Build packages/shared (la v3 en importe depuis 01c49fcfee)
        run: |
          cd packages/shared
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Build apps/web-v3 (le serveur que playwright.config.ts lève)
        run: |
          cd apps/web-v3
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Gate cycle de vie — 0 requête mutante pendant que l'onglet est caché
        run: |
          cd apps/web-v3
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} test:lifecycle

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-v3-lifecycle-traces
          path: apps/web-v3/test-results/
          retention-days: 7

  # ===========================================================================
  # CHAÎNES: les suites de CHAÎNE de la v3 — LEUR PORTEUR
  # ===========================================================================
  # Troisième fois que cette leçon se paie ici. Les deux jobs ci-dessus la
  # portent déjà dans leurs commentaires — « un instrument déclaré n'est pas un
  # instrument lancé » — et pourtant `v3-network-vitals.spec.ts` et
  # `v3-lien-expire.spec.ts` n'étaient lancés par AUCUN job : `test:chaines`
  # n'apparaissait que dans sa propre définition. Les deux portent les critères
  # de fin de #4495 (une seule requête avant la 302, zéro `<script>` hors
  # ThemeScript) et #4496 (quatre raisons distinctes, aucun composant client
  # monté) — donc deux issues qu'aucun gate ne pouvait prouver.
  #
  # Ce job invoque le PROJET, jamais les fichiers. `playwright.config.ts` donne
  # à `chaines` un `testIgnore` et non un `testMatch` : le projet prend tout ce
  # qui n'est pas une suite de PAGE, si bien qu'une suite neuve y entre d'office
  # et se trouve lancée sans que personne ait à penser à elle. Nommer les deux
  # fichiers ici rouvrirait le trou au premier fichier suivant.
  #
  # Séparé des deux autres parce que la contrainte est d'EXÉCUTION, pas de
  # worker : les suites de page importent `routes-emises.mjs` statiquement et
  # installent le chargeur de Playwright pour tout `.mjs`, ce que le chargement
  # dynamique des suites de chaîne ne supporte pas (#4510).
  chaines-v3:
    name: Chaînes web-v3 (lien partagé, vitals réseau)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Même trou que dans `a11y-v3` : `bun` en dur alors que `Setup bun` est
      # réservé au scénario `bun` (#4761).
      - name: Build packages/shared (la v3 en importe depuis 01c49fcfee)
        run: |
          cd packages/shared
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Build apps/web-v3 (le serveur que les suites mesurent)
        run: |
          cd apps/web-v3
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Gate chaînes — lien partagé, causes de clôture, vitals réseau
        run: |
          cd apps/web-v3
          ${{ env.PACKAGE_MANAGER == 'bun' && 'bun run' || 'pnpm run' }} test:chaines

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-v3-chaines-traces
          path: apps/web-v3/test-results/
          retention-days: 7

  # ===========================================================================
  # TEST: Unit Tests with Coverage (Parallel by package)
  # Minimum coverage threshold: 90%
  # ===========================================================================
  test:
    name: Test ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: shared
            path: packages/shared
            filter: '@meeshy/shared'
          - name: web
            path: apps/web
            filter: '@meeshy/web'
          - name: gateway
            path: services/gateway
            filter: '@meeshy/gateway'
          - name: agent
            path: services/agent
            filter: '@meeshy/agent'
          - name: web-v3
            path: apps/web-v3
            filter: '@meeshy/web-v3'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # pnpm is always needed for turborepo (version from package.json packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js (with pnpm cache)
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Node.js (without cache for bun)
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      # Generate Prisma client before building
      - name: Generate Prisma client
        env:
          DATABASE_URL: "mongodb://localhost:27017/test"
        run: |
          cd packages/shared
          npx prisma generate --generator client

      # Build shared package first (required for gateway tests)
      - name: Build shared package (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          cd packages/shared
          bun run build

      - name: Build shared package (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: |
          cd packages/shared
          pnpm run build

      - name: Run tests with coverage (bun)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          # Web tests must use Jest (configured with Next.js)
          if [ "${{ matrix.package.name }}" = "web" ] || [ "${{ matrix.package.name }}" = "web-v3" ]; then
            cd ${{ matrix.package.path }}
            echo "Running web tests with Jest via bun..."
            bun run test:coverage
          else
            bun run test:coverage --filter=${{ matrix.package.filter }}
          fi

      - name: Run tests with coverage (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm run test:coverage --filter=${{ matrix.package.filter }}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          file: ./${{ matrix.package.path }}/coverage/lcov.info
          flags: ${{ matrix.package.name }}
          name: ${{ matrix.package.name }}-coverage

  # ===========================================================================
  # TEST: Python Tests with Coverage
  #
  # RALLUME au sprint 0.3 (`if: true` ci-dessous), et ce bloc a porté
  # « DISABLED: Downloads ML models that fill up GitHub runner disk » pendant
  # tout ce temps — trois lignes au-dessus du `if` qui le contredisait. Le
  # commentaire disait une raison technique précise et plausible, ce qui le
  # rendait crédible ; c'est ce qui a laissé le résumé annoncer « disabled »
  # pour un job qui consomme un runner à chaque poussée (#4860).
  #
  # Ce qui a rendu le rallumage possible : la découpe par marqueur CPU-only et
  # un seuil de référence, qui évitent le téléchargement des modèles lourds.
  # Les suites spécifiques (audio-pipeline, tts-stt, voice-api) gardent leurs
  # jobs dédiés.
  # ===========================================================================
  test-python:
    name: Test Python (translator)
    if: true  # Sprint 0.3: re-enabled with CPU-only marker split + baseline threshold
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node.js and package manager setup for Prisma CLI
      - name: Setup bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        if: env.PACKAGE_MANAGER == 'bun'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Install Node.js dependencies (required for Prisma CLI)
      - name: Install Node.js dependencies (bun with retry)
        if: env.PACKAGE_MANAGER == 'bun'
        run: |
          for i in 1 2 3; do
            bun install && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Install Node.js dependencies (pnpm)
        if: env.PACKAGE_MANAGER == 'pnpm'
        run: pnpm install --no-frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "services/translator/uv.lock"
          # Cache du toolchain CPython lui-même : l'étape « Setup Python via
          # uv » ne touche plus GitHub Releases sur cache chaud — c'est ce
          # téléchargement (python-build-standalone) qui flake par « http2
          # error: refused stream » (2 occurrences le 2026-08-12).
          cache-python: true

      - name: Setup Python via uv (with retry)
        run: |
          # Le téléchargement de CPython (python-build-standalone, hébergé sur
          # GitHub Releases) échoue par intermittence sur des erreurs de
          # transport — « http2 error: refused stream » observé le 2026-08-12.
          # Même motif que « Install dependencies (bun with retry) », mais on
          # sort en échec après la 3e tentative : une boucle qui se termine
          # sans `exit 1` rendrait la panne invisible et ferait tomber les
          # étapes suivantes sur une erreur sans rapport.
          # Backoff exponentiel : les incidents GitHub Releases observés
          # durent plus que les 30 s couvertes par 3 × 10 s — 5 tentatives
          # sur ~2,5 min (10/20/40/80 s) traversent un blip complet. Le
          # cache-python ci-dessus rend de toute façon cette étape no-op
          # réseau sur cache chaud.
          delay=10
          for i in 1 2 3 4 5; do
            uv python install ${{ env.PYTHON_VERSION }} && exit 0
            echo "Tentative $i échouée, nouvelle tentative dans $delay s..."
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "::error::uv python install a échoué après 5 tentatives."
          exit 1

      - name: Install system dependencies (ffmpeg + dev libs for PyAV)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev libavfilter-dev

      - name: Install Python dependencies (CPU backend for CI)
        run: |
          cd services/translator
          # Create virtual environment first
          uv venv --python ${{ env.PYTHON_VERSION }}
          # Install build deps then sync, with retry (pytorch mirror returns transient 503s;
          # build deps required for pkuseg build with no-build-isolation)
          for i in 1 2 3; do
            uv pip install numpy setuptools wheel cython \
              && uv sync --python ${{ env.PYTHON_VERSION }} --extra cpu --extra dev \
              && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done

      - name: Run tests with coverage (80% minimum)
        env:
          DATABASE_URL: "mongodb://localhost:27017/test"
          CI: "true"
        timeout-minutes: 30
        run: |
          cd services/translator
          uv run --python ${{ env.PYTHON_VERSION }} pytest -v --tb=short \
            -m "not slow and not gpu and not e2e and not integration" \
            --cov=src --cov-report=xml --cov-report=term --cov-fail-under=37

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          file: services/translator/coverage.xml
          flags: translator
          name: translator-coverage

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: translator-test-results
          path: |
            services/translator/coverage.xml
            services/translator/coverage.lcov
          retention-days: 7

