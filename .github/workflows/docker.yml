# =============================================================================
# MEESHY - Docker Build & Push Pipeline
# =============================================================================
# Multi-architecture builds: AMD64 by default (linux/amd64)
# ARM64 builds available via manual trigger for web/gateway (may fail with Prisma)
# Translator service: AMD64 ONLY (sentencepiece fails with QEMU emulation)
# Registry: Docker Hub (isopen/meeshy-*)
# Package managers: bun (default) or pnpm
# GPU support: translator service supports cpu and gpu (CUDA 12.4) variants
#
# IMPORTANT: GitHub Actions ARM64 runners (ubuntu-24.04-arm64) are not available
# on free tier. ARM64 builds use QEMU emulation which has known issues with
# native binaries compilation (Prisma SIGILL, sentencepiece linking errors).
# For production ARM64 images, use self-hosted ARM64 runners or build locally.
# =============================================================================

name: Docker

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
    paths:
      - 'apps/web/**'
      - 'apps/web-old-version3/**'
      - 'apps/web-v3/**'
      - 'packages/design-tokens/**'
      - 'packages/icons/**'
      - 'services/gateway/**'
      - 'services/translator/**'
      - 'services/agent/**'
      - 'packages/shared/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker.yml'

  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated or preset)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - web-v3
          - web-v31
          - gateway
          - translator
          - agent
          - web,gateway
          - web,translator
          - web-v3,gateway
          - gateway,translator
      custom_services:
        description: 'Custom services (overrides above if set, e.g., "web,gateway")'
        required: false
        type: string
      push_to_registry:
        description: 'Push images to registry'
        required: false
        type: boolean
        default: true
      platforms:
        description: 'Target platforms (ARM64 requires native runner, QEMU crashes with SWC)'
        required: false
        type: choice
        default: 'linux/amd64'
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
          - linux/arm64
      package_manager:
        description: 'Package manager for builds'
        required: false
        type: choice
        default: 'bun'
        options:
          - bun
          - pnpm
      torch_backend:
        description: 'Torch backend for translator (cpu, gpu, all)'
        required: false
        type: choice
        default: 'cpu'
        options:
          - cpu
          - gpu
          - all
      no_cache:
        description: 'Build without cache (force rebuild)'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: isopen
  PLATFORMS: linux/amd64
  # '22.19' et non '22' : undici@8 exige >= 22.19.0 (worker_threads.markAsUncloneable,
  # arrive en 22.12), et le serveur assemble par les generateurs de manifeste le charge.
  # La ligne MINEURE, pas une version exacte — figer le patch ferait rater les correctifs
  # de securite des 22.19.x sans rien garantir de plus : c'est le plancher qui compte ici.
  NODE_VERSION: '22.19'
  BUN_VERSION: '1.3.14'
  PNPM_VERSION: '9'
  PACKAGE_MANAGER: ${{ github.event.inputs.package_manager || 'bun' }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # DETECT: Which services need building
  # ===========================================================================
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.result }}
      has_changes: ${{ steps.services.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICES="${{ github.event.inputs.custom_services }}"
            if [[ -z "$SERVICES" ]]; then
              SERVICES="${{ github.event.inputs.services }}"
            fi

            if [[ "$SERVICES" == "all" ]]; then
              echo "web=true" >> $GITHUB_OUTPUT
              echo "web_v3=true" >> $GITHUB_OUTPUT
              echo "web_v31=true" >> $GITHUB_OUTPUT
              echo "gateway=true" >> $GITHUB_OUTPUT
              echo "translator=true" >> $GITHUB_OUTPUT
              echo "agent=true" >> $GITHUB_OUTPUT
            else
              # Sélection par JETON, pas par sous-chaîne. `*"web"*` répondait vrai
              # pour « web-v3 » : demander la v3 construisait AUSSI le legacy, et
              # rien dans le texte ne le disait. Les virgules encadrantes rendent
              # « web » et « web-v3 » disjoints.
              SELECTED=",${SERVICES// /},"
              echo "web=$([[ "$SELECTED" == *",web,"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "web_v3=$([[ "$SELECTED" == *",web-v3,"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              # Les virgules encadrantes sont ce qui rend « web-v3 » et « web-v31 »
              # disjoints : en sous-chaîne, demander la v3 aurait construit les deux.
              echo "web_v31=$([[ "$SELECTED" == *",web-v31,"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "gateway=$([[ "$SELECTED" == *",gateway,"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "translator=$([[ "$SELECTED" == *",translator,"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "agent=$([[ "$SELECTED" == *",agent,"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "web=true" >> $GITHUB_OUTPUT
            echo "web_v3=true" >> $GITHUB_OUTPUT
            echo "gateway=true" >> $GITHUB_OUTPUT
            echo "translator=true" >> $GITHUB_OUTPUT
            echo "agent=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
            echo "web=$([[ "$CHANGED" == *"apps/web/"* ]] || [[ "$CHANGED" == *"packages/shared/"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "web_v3=$([[ "$CHANGED" == *"apps/web-old-version3/"* ]] || [[ "$CHANGED" == *"packages/shared/"* ]] || [[ "$CHANGED" == *"packages/design-tokens/"* ]] || [[ "$CHANGED" == *"packages/icons/"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "web_v31=$([[ "$CHANGED" == *"apps/web-v3/"* ]] || [[ "$CHANGED" == *"packages/design-tokens/"* ]] || [[ "$CHANGED" == *"packages/shared/"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "gateway=$([[ "$CHANGED" == *"services/gateway/"* ]] || [[ "$CHANGED" == *"packages/shared/"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "translator=$([[ "$CHANGED" == *"services/translator/"* ]] || [[ "$CHANGED" == *"packages/shared/"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "agent=$([[ "$CHANGED" == *"services/agent/"* ]] || [[ "$CHANGED" == *"packages/shared/"* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          fi

      - name: Build services list
        id: services
        run: |
          SERVICES='{"include":['
          FIRST=true
          HAS_CHANGES=false

          TORCH_INPUT="${{ github.event.inputs.torch_backend }}"
          if [[ -z "$TORCH_INPUT" ]]; then
            TORCH_INPUT="cpu"
          fi

          if [[ "${{ steps.changes.outputs.web }}" == "true" ]]; then
            HAS_CHANGES=true
            VERSION=$(cat apps/web/VERSION 2>/dev/null || echo "1.0.0")
            [[ "$FIRST" == "false" ]] && SERVICES+=','
            SERVICES+='{"service":"web","context":".","dockerfile":"./apps/web/Dockerfile","image":"meeshy-web","version":"'$VERSION'"}'
            FIRST=false
          fi

          if [[ "${{ steps.changes.outputs.web_v3 }}" == "true" ]]; then
            HAS_CHANGES=true
            VERSION=$(node -p "require('./apps/web-old-version3/package.json').version" 2>/dev/null || echo "0.0.0")
            [[ "$FIRST" == "false" ]] && SERVICES+=','
            SERVICES+='{"service":"web-v3","context":".","dockerfile":"./apps/web-old-version3/Dockerfile","image":"meeshy-web-v3","version":"'$VERSION'"}'
            FIRST=false
          fi

          # LA v3.1 — image DISTINCTE de `meeshy-web-v3`, qui appartient encore à
          # l'ancienne refonte. Reprendre ce nom maintenant changerait en
          # silence ce qu'un `meeshy-web-v3:latest` déjà déployé désigne. La
          # v3.1 le reprendra quand `apps/web-old-version3` sera supprimée
          # (#5496) — pas avant.
          if [[ "${{ steps.changes.outputs.web_v31 }}" == "true" ]]; then
            HAS_CHANGES=true
            VERSION=$(node -p "require('./apps/web-v3/package.json').version" 2>/dev/null || echo "0.0.0")
            [[ "$FIRST" == "false" ]] && SERVICES+=','
            SERVICES+='{"service":"web-v31","context":".","dockerfile":"./apps/web-v3/Dockerfile","image":"meeshy-web-v31","version":"'$VERSION'"}'
            FIRST=false
          fi

          if [[ "${{ steps.changes.outputs.gateway }}" == "true" ]]; then
            HAS_CHANGES=true
            VERSION=$(cat services/gateway/VERSION 2>/dev/null || echo "1.0.0")
            [[ "$FIRST" == "false" ]] && SERVICES+=','
            SERVICES+='{"service":"gateway","context":".","dockerfile":"./services/gateway/Dockerfile","image":"meeshy-gateway","version":"'$VERSION'"}'
            FIRST=false
          fi

          if [[ "${{ steps.changes.outputs.agent }}" == "true" ]]; then
            HAS_CHANGES=true
            VERSION=$(cat services/agent/package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[", ]//g')
            [[ -z "$VERSION" ]] && VERSION="1.0.0"
            [[ "$FIRST" == "false" ]] && SERVICES+=','
            SERVICES+='{"service":"agent","context":".","dockerfile":"./services/agent/Dockerfile","image":"meeshy-agent","version":"'$VERSION'"}'
            FIRST=false
          fi

          if [[ "${{ steps.changes.outputs.translator }}" == "true" ]]; then
            HAS_CHANGES=true
            VERSION=$(cat services/translator/VERSION 2>/dev/null || echo "1.0.0")

            if [[ "$TORCH_INPUT" == "cpu" ]] || [[ "$TORCH_INPUT" == "all" ]]; then
              [[ "$FIRST" == "false" ]] && SERVICES+=','
              SERVICES+='{"service":"translator","context":".","dockerfile":"./services/translator/Dockerfile","image":"meeshy-translator","version":"'$VERSION'","torch_backend":"cpu"}'
              FIRST=false
            fi

            if [[ "$TORCH_INPUT" == "gpu" ]] || [[ "$TORCH_INPUT" == "all" ]]; then
              [[ "$FIRST" == "false" ]] && SERVICES+=','
              SERVICES+='{"service":"translator-gpu","context":".","dockerfile":"./services/translator/Dockerfile","image":"meeshy-translator","version":"'$VERSION'","torch_backend":"gpu"}'
              FIRST=false
            fi
          fi

          SERVICES+=']}'
          echo "result=$SERVICES" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

  # ===========================================================================
  # BUILD: Multi-architecture Docker builds (AMD64 by default)
  # ARM64 builds via QEMU available on manual trigger (may fail with Prisma)
  # ===========================================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.services) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (translator)
        if: matrix.service == 'translator' || matrix.service == 'translator-gpu'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for ARM64 emulation if needed)
        if: contains(github.event.inputs.platforms || env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d.%H%M%S")
          echo "value=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Build timestamp: $TIMESTAMP"
          # Forme ISO-8601 pour BUILD_DATE (label OCI image.created + /health).
          # L'ancienne valeur, `github.event.repository.updated_at`, datait la
          # dernière modification du DÉPÔT — pas le build : deux images
          # construites à des heures différentes portaient la même date.
          ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "iso=$ISO" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.version }}${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.version }}-${{ steps.timestamp.outputs.value }}${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=${{ matrix.torch_backend || 'cpu' }},enable=${{ matrix.service == 'translator' || matrix.service == 'translator-gpu' }}
            type=ref,event=branch,suffix=${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }}
            type=sha,prefix=sha-,format=short,suffix=${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }}

      - name: Determine build platforms
        id: platforms
        run: |
          # Translator service: AMD64 only due to QEMU limitations with sentencepiece compilation
          # Other services: use workflow input or default platforms
          if [[ "${{ matrix.service }}" == "translator" ]] || [[ "${{ matrix.service }}" == "translator-gpu" ]]; then
            echo "value=linux/amd64" >> $GITHUB_OUTPUT
            echo "⚠️ Translator: Building AMD64 only (ARM64 requires native runner due to QEMU limitations with sentencepiece)"
          else
            echo "value=${{ github.event.inputs.platforms || env.PLATFORMS }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.platforms.outputs.value }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_to_registry != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: ${{ github.event.inputs.no_cache != 'true' && format('type=gha,scope={0}', matrix.service) || '' }}
          # ignore-error=true : l'export du cache GHA est best-effort. Le
          # backend de cache GitHub peut évincer/404 un blob en cours
          # d'upload ("error writing layer blob: not_found"), ce qui faisait
          # échouer le job ENTIER alors que l'image était déjà buildée et
          # poussée au registry avec succès (incident meeshy-web 2026-06-12).
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true
          provenance: true
          sbom: true
          build-args: |
            BUILD_DATE=${{ steps.timestamp.outputs.iso }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ matrix.version }}
            PACKAGE_MANAGER=${{ env.PACKAGE_MANAGER }}
            BUN_VERSION=${{ env.BUN_VERSION }}
            TORCH_BACKEND=${{ matrix.torch_backend || 'cpu' }}

      - name: Build summary
        run: |
          echo "### ${{ matrix.service }} Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ matrix.version }}${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | \`${{ steps.platforms.outputs.value }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags created:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # SECURITY: Scan images
  # ===========================================================================
  # ===========================================================================
  # DEPLOY STAGING: pousser les images fraîches SUR staging.meeshy.me
  # ===========================================================================
  # **Une image poussée au registre n'est pas une image déployée** (#5609).
  #
  # Jusqu'ici la chaîne s'arrêtait au `docker push` : le tag `staging` bougeait
  # sur Docker Hub, et RIEN sur l'hôte ne le tirait — aucun watchtower, aucun
  # cron, aucune étape de workflow (vérifié le 2026-09-07). `staging.meeshy.me`
  # ne changeait qu'au prochain `docker compose pull` lancé à la main en SSH.
  #
  # > Un `latest` qui bouge au registre pendant que le conteneur garde son
  # > digest est le pire des deux mondes : on croit avoir déployé, et on mesure
  # > l'ancien.
  #
  # Ce job ne recrée QUE les services dont l'image vient d'être construite —
  # jamais `up -d` nu, qui toucherait les huit autres services de staging.
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: github.ref == 'refs/heads/dev' && needs.detect.outputs.has_changes == 'true' && needs.build.result == 'success'
    steps:
      - name: Résoudre les services de staging à recréer
        id: cibles
        env:
          SERVICES_JSON: ${{ needs.detect.outputs.services }}
        run: |
          # La correspondance image → service de compose est ÉNUMÉRÉE, jamais
          # devinée par un motif : un service inconnu doit se voir, pas être
          # sauté en silence. C'est ce silence qui a laissé `meeshy-web-v31`
          # construite et servie nulle part pendant des jours.
          #
          # `web` et `web-v3` n'ont PAS de ligne, et c'est une décision :
          # staging ne sert plus le legacy ni l'ancienne refonte depuis #5609.
          CIBLES=""
          INCONNUS=""
          for SVC in $(echo "$SERVICES_JSON" | jq -r '.include[].service'); do
            case "$SVC" in
              web-v31)    CIBLES="$CIBLES frontend-staging" ;;
              gateway)    CIBLES="$CIBLES gateway-staging" ;;
              translator) CIBLES="$CIBLES translator-staging" ;;
              agent)      CIBLES="$CIBLES agent-staging" ;;
              web|web-v3) echo "::notice::$SVC n'est plus déployé sur staging (#5609)" ;;
              *)          INCONNUS="$INCONNUS $SVC" ;;
            esac
          done
          if [ -n "$INCONNUS" ]; then
            echo "::warning::services sans correspondance de déploiement :$INCONNUS — les ajouter au case ci-dessus, ou dire pourquoi ils n'y sont pas"
          fi
          echo "cibles=$(echo $CIBLES | xargs)" >> $GITHUB_OUTPUT

      - name: Déployer
        if: steps.cibles.outputs.cibles != ''
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          CIBLES: ${{ steps.cibles.outputs.cibles }}
        run: |
          set -euo pipefail
          # SANS SECRET, ON LE DIT — et on ne rougit pas. Un job qui échoue à
          # chaque poussée pour une clé jamais provisionnée serait ignoré au
          # bout de trois jours, et c'est ainsi qu'un gate meurt. Un avertissement
          # VISIBLE dans le résumé dit ce qu'il manque sans user le signal.
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "::warning::déploiement de staging NON armé — il manque les secrets STAGING_SSH_KEY / STAGING_SSH_HOST"
            {
              echo "## ⚠️ Staging non déployé"
              echo ""
              echo "Images construites et poussées, mais **rien ne les a tirées sur l'hôte**."
              echo "Services concernés : \`$CIBLES\`"
              echo ""
              echo "Pour armer ce job, provisionner les secrets du dépôt :"
              echo "\`STAGING_SSH_HOST\`, \`STAGING_SSH_USER\`, \`STAGING_SSH_KEY\`"
              echo "(et, recommandé, \`STAGING_SSH_KNOWN_HOSTS\`)."
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # L'empreinte de l'hôte EST une vérification : sans elle, `accept-new`
          # fait confiance au premier venu. On accepte le repli, on ne le tait pas.
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            SSH_OPTS="-o StrictHostKeyChecking=yes"
          else
            echo "::warning::STAGING_SSH_KNOWN_HOSTS absent — repli sur accept-new (confiance au premier contact)"
            SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          fi

          # `--no-deps` : on recrée les services NOMMÉS et rien d'autre. Un
          # `up -d` nu recréerait tout service dont le digest a bougé — y compris
          # la base et Redis au premier changement d'image de base.
          ssh $SSH_OPTS -i ~/.ssh/id_deploy -o ConnectTimeout=20 \
            "${SSH_USER:-root}@$SSH_HOST" \
            "cd /opt/meeshy/staging && docker compose pull $CIBLES && docker compose up -d --no-deps $CIBLES"

          {
            echo "## Staging déployé"
            echo ""
            echo "Services recréés : \`$CIBLES\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Vérifier que les conteneurs sont sains
        if: steps.cibles.outputs.cibles != '' && secrets.STAGING_SSH_KEY != '' && secrets.STAGING_SSH_HOST != ''
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          CIBLES: ${{ steps.cibles.outputs.cibles }}
        run: |
          set -euo pipefail
          # **Déployer n'est pas la preuve d'avoir déployé.** Un `up -d` rend 0
          # dès que Docker a accepté la commande ; c'est l'état APRÈS qui dit si
          # l'image tourne. Sans cette étape, un conteneur qui redémarre en
          # boucle passerait pour un déploiement réussi — c'est exactement la
          # forme du défaut `certs-dumper` (#5612), vert dans `docker ps` et
          # mort 4 820 fois.
          sleep 30
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy \
            "${SSH_USER:-root}@$SSH_HOST" \
            "cd /opt/meeshy/staging && docker compose ps $CIBLES" | tee /tmp/etat
          if grep -qiE "restarting|exited" /tmp/etat; then
            echo "::error::un service de staging ne tient pas debout après déploiement"
            exit 1
          fi

  security-scan:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: needs.build.result == 'success' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.services) }}

    permissions:
      security-events: write

    steps:
      # LE TAG D'UNE BRANCHE S'ASSAINIT, parce qu'un nom de branche n'est pas un
      # tag Docker. `docker/metadata-action` le fait à la CONSTRUCTION (un `/`
      # devient `-`) ; cette étape-ci prenait `github.ref_name` BRUT, et
      # cherchait donc un tag qui n'avait jamais été poussé.
      #
      # Le symptôme ne disait pas ça : Trivy rendait « could not parse
      # reference: isopen/meeshy-web-v31:claude/v3-… » — une erreur de SYNTAXE
      # sur le nom, pas une image introuvable. Et il ne se voyait ni sur `main`
      # ni sur `dev`, dont les tags sont écrits en dur juste au-dessus : il
      # fallait un déclenchement manuel depuis une branche à `/` dans son nom,
      # c'est-à-dire toutes les branches `claude/*`.
      - name: Determine scan tag
        id: scan-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "tag=staging${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }}" >> $GITHUB_OUTPUT
          else
            # Même transformation que `docker/metadata-action` : tout ce qui
            # n'est pas alphanumérique, point, tiret ou souligné devient un
            # tiret.
            SLUG=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9._-' '-')
            echo "tag=${SLUG}${{ matrix.torch_backend == 'gpu' && '-gpu' || '' }}" >> $GITHUB_OUTPUT
          fi

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}:${{ steps.scan-tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4.37.9
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package Manager:** ${{ env.PACKAGE_MANAGER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Strategy:** Unified build (AMD64 by default, ARM64 via QEMU on manual trigger)" >> $GITHUB_STEP_SUMMARY
          echo "**Default Platforms:** ${{ env.PLATFORMS }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** ARM64 builds use QEMU emulation and may fail with native binaries like Prisma." >> $GITHUB_STEP_SUMMARY
