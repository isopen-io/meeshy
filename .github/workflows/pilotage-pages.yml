# =============================================================================
# Pilotage — page « Avancement Meeshy » publiée sur GitHub Pages
# Régénérée toutes les 6 h, à chaque mouvement d'issue ou de milestone, et à la demande.
# Le GITHUB_TOKEN lit le projet d'organisation tant qu'il est PUBLIC (vérifié le 2026-08-26,
# run 32991204250). S'il devenait privé : poser un secret PILOTAGE_TOKEN (PAT lisant les
# projets), sinon la page se génère en mode dégradé (issues + milestones ; ni « En cours »
# ni noms d'horizon).
# =============================================================================
name: Pilotage — avancement (Pages)

on:
  schedule:
    - cron: '17 */6 * * *'
  issues:
    types: [opened, closed, reopened, milestoned, demilestoned, deleted]
  milestone:
    types: [created, closed, opened, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'scripts/pilotage/**'
      - '.github/workflows/pilotage-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

# `cancel-in-progress: FALSE` — et c'est l'inverse de l'intuition.
#
# Ce workflow se déclenche sur `issues` et `milestone` : fermer trois issues à
# la suite lance trois runs en quelques secondes. Avec `cancel-in-progress:
# true`, les deux premiers étaient TUÉS — y compris pendant leur job
# `deploy`. Or une publication GitHub Pages interrompue en vol laisse
# l'environnement `github-pages` verrouillé, et le run suivant échoue à s'y
# déployer sans qu'aucune étape ne rougisse : le job `deploy` sort en échec
# avec ZÉRO étape enregistrée. Mesuré le 2026-08-30 sur vingt runs : 14
# annulés, 4 en échec, aucun succès de déploiement pendant une salve de
# fermetures d'issues.
#
# C'est la recommandation de GitHub pour tout workflow de déploiement, et la
# raison qu'elle donne est exactement celle-ci : on veut bien n'avoir qu'UN
# déploiement à la fois, on ne veut pas TUER celui qui est en cours. Les runs
# de la salve font la queue et le dernier écrase les précédents — ce qui est
# le comportement voulu, la page étant entièrement régénérée à chaque fois.
#
# Le coût assumé : une salve de N fermetures produit N publications au lieu
# d'une. C'est le prix d'un déploiement qui aboutit, et il est faible — le job
# de build dure moins d'une minute.
concurrency:
  group: pilotage-pages
  cancel-in-progress: false

jobs:
  build:
    name: Tests, extraction, génération
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tests du calcul (node --test)
        run: node --test scripts/pilotage/compute.test.mjs

      - name: Tests du générateur (unittest)
        working-directory: scripts/pilotage
        run: python3 -m unittest -q test_pilotage

      - name: Extraction depuis GitHub
        env:
          GH_TOKEN: ${{ secrets.PILOTAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/pilotage/fetch.py site/data.json

      - name: Génération de la page
        run: python3 scripts/pilotage/build.py --data site/data.json --out site/index.html

      - name: Artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Déploiement Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
